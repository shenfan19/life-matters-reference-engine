<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plugin demo C</title>
<style>
  :root { --bg: #ffffff; --text: #1f1f1f; --mute: #8c8c8c; --primary: #007A33; --border: #d9d9d9; }
  :root[data-theme="dark"] { --bg: #141414; --text: #f0f0f0; --mute: #8c8c8c; --primary: #52c41a; --border: #303030; }
  html, body { margin: 0; width: 100%; height: 100%; }
  body { background: var(--bg); color: var(--text); font: 14px -apple-system, "Segoe UI", sans-serif; padding: 20px; box-sizing: border-box; }
  h2 { margin: 0 0 12px; color: var(--primary); }
  .mute { color: var(--mute); }
  table { border-collapse: collapse; margin-top: 12px; }
  th, td { text-align: left; padding: 4px 16px 4px 0; border-bottom: 1px solid var(--border); }
  code, td.name { font-family: monospace; }
</style>
</head>
<body>
<h2>Plugin demo C</h2>
<div id="out" class="mute">Waiting for the GUI to say which model is selected.</div>
<script>
  const out = document.getElementById('out');
  function apply(theme) { document.documentElement.dataset.theme = theme === 'dark' ? 'dark' : 'light'; }
  apply(new URLSearchParams(location.search).get('theme'));

  function text(el, s) { el.textContent = s; return el; }

  // Shown when no model is selected: a small physiology model that loads on its own.
  const SAMPLE = { title: 'banister_fitness_fatigue_2026', path: 'references/medical/physiology/banister_fitness_fatigue_2026' };

  async function show(selected) {
    const model = selected || SAMPLE;
    out.className = 'mute'; out.textContent = 'Loading ' + model.title + ' ...';
    let data;
    try {
      const res = await fetch('/api/plugins/demo_c_fields/fields', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ inputs: { path: model.path } })
      });
      data = await res.json();
    } catch (e) { out.textContent = 'Request failed: ' + e.message; return; }
    if (!data.success) { out.textContent = 'Could not read the model: ' + (data.error || data.detail || 'unknown error'); return; }

    out.className = ''; out.replaceChildren();
    if (!selected) {
      const note = document.createElement('p');
      note.className = 'mute';
      note.textContent = 'No model is selected in the tree, so a physiology sample is shown.';
      out.appendChild(note);
    }
    const summary = document.createElement('p');
    summary.textContent = data.name + ': ' + data.variable_count + ' variables ('
      + Object.entries(data.by_type).map(([k, v]) => v + ' ' + k).join(', ') + '), '
      + data.equation_count + ' equations.';
    out.appendChild(summary);

    const table = document.createElement('table');
    const head = table.insertRow();
    ['Variable', 'Type', 'Unit'].forEach(h => head.appendChild(text(document.createElement('th'), h)));
    data.variables.forEach(v => {
      const row = table.insertRow();
      const name = row.insertCell(); name.className = 'name'; name.textContent = v.name;
      row.insertCell().textContent = v.type;
      row.insertCell().textContent = v.unit || '';
    });
    out.appendChild(table);
  }

  window.addEventListener('message', (e) => {
    if (!e.data || e.data.type !== 'lm-init') return;
    apply(e.data.theme);
    show(e.data.model);
  });
  parent.postMessage({ type: 'lm-ready' }, '*');
</script>
</body>
</html>
