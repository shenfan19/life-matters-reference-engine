<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plugin demo B</title>
<style>
  :root { --bg: #ffffff; --text: #1f1f1f; --mute: #8c8c8c; --primary: #007A33; }
  :root[data-theme="dark"] { --bg: #141414; --text: #f0f0f0; --mute: #8c8c8c; --primary: #52c41a; }
  html, body { margin: 0; width: 100%; height: 100%; }
  body { background: var(--bg); color: var(--text); font: 14px -apple-system, "Segoe UI", sans-serif; padding: 20px; box-sizing: border-box; }
  h2 { margin: 0 0 12px; color: var(--primary); }
  img { display: block; max-width: 100%; height: auto; border: 1px solid var(--mute); border-radius: 6px; }
  p { color: var(--mute); }
</style>
</head>
<body>
<h2>Plugin demo B</h2>
<img src="sample.svg" alt="A sample figure shipped inside the plugin folder" width="480">
<p>The image is a file in this plugin's <code>dist</code> folder, served by the backend.</p>
<script>
  const params = new URLSearchParams(location.search);
  function apply(theme) { document.documentElement.dataset.theme = theme === 'dark' ? 'dark' : 'light'; }
  apply(params.get('theme'));
  window.addEventListener('message', (e) => {
    if (e.data && e.data.type === 'lm-init') apply(e.data.theme);
  });
  parent.postMessage({ type: 'lm-ready' }, '*');
</script>
</body>
</html>
