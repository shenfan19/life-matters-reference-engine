<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Body Map</title>
<style>
  :root { --bg: #ffffff; --panel: #f7f8fa; --text: #1f2933; --mute: #7b8794; --primary: #007A33; --border: #dde1e6;
          --stage: #eef1f4; --grid: rgba(60, 80, 100, 0.07); --line: #5b6b7b; --line-dim: rgba(91, 107, 123, 0.38); --fill: rgba(91, 107, 123, 0.09);
          --plate: rgba(255, 255, 255, 0.92); --ink: #1f2933; --ink-dim: rgba(31, 41, 51, 0.42); --scan: #4a78a8; --scanlines: rgba(0, 0, 0, 0.012); }
  :root[data-theme="dark"] { --bg: #141414; --panel: #1b1b1b; --text: #f0f0f0; --mute: #8c8c8c; --primary: #52c41a; --border: #303030;
          --stage: #0d1116; --grid: rgba(150, 170, 190, 0.06); --line: #93a6b8; --line-dim: rgba(147, 166, 184, 0.36); --fill: rgba(147, 166, 184, 0.09);
          --plate: rgba(13, 17, 22, 0.92); --ink: #e6edf3; --ink-dim: rgba(230, 237, 243, 0.42); --scan: #a9c6e4; --scanlines: rgba(0, 0, 0, 0.22); }
  html, body { margin: 0; width: 100%; height: 100%; }
  body { background: var(--bg); color: var(--text); font: 14px -apple-system, "Segoe UI", sans-serif; box-sizing: border-box; display: flex; }

  /* The stage is a quiet instrument screen: one flat base color, a faint grid, thin lines. Color appears only where a model sits. */
  #stage { flex: 1 1 auto; min-width: 0; position: relative; display: flex; align-items: center; justify-content: center; padding: 14px; box-sizing: border-box; overflow: hidden;
           background:
             linear-gradient(var(--grid) 1px, transparent 1px) 0 0 / 28px 28px,
             linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0 / 28px 28px,
             var(--stage); }
  #stage::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, var(--scanlines) 0 1px, transparent 1px 3px); }
  #stage svg { position: relative; z-index: 1; height: 100%; max-height: 800px; width: auto; max-width: 100%; }
  .corner { position: absolute; width: 18px; height: 18px; border: 0 solid var(--line); opacity: 0.7; z-index: 2; }
  .corner.tl { top: 10px; left: 10px; border-width: 1.5px 0 0 1.5px; } .corner.tr { top: 10px; right: 10px; border-width: 1.5px 1.5px 0 0; }
  .corner.bl { bottom: 10px; left: 10px; border-width: 0 0 1.5px 1.5px; } .corner.br { bottom: 10px; right: 10px; border-width: 0 1.5px 1.5px 0; }
  #hud { position: absolute; top: 18px; left: 40px; z-index: 2; font: 11px/1.6 "Cascadia Mono", Consolas, monospace; letter-spacing: .12em; color: var(--ink-dim); text-transform: uppercase; }
  #hud b { color: var(--ink); font-weight: 600; }

  #side { flex: 0 0 320px; border-left: 1px solid var(--border); background: var(--panel); padding: 16px; box-sizing: border-box; overflow-y: auto; }
  h2 { margin: 0 0 4px; font-size: 16px; color: var(--primary); }
  .mute { color: var(--mute); }
  .small { font-size: 12px; }
  #msg { margin: 6px 0 12px; }
  .model { border: 1px solid var(--border); border-left-width: 4px; border-radius: 6px; padding: 8px 10px; margin-bottom: 8px; cursor: pointer; background: var(--bg); }
  .model.on { outline: 1px solid var(--text); outline-offset: -1px; }
  .model.dim { opacity: 0.4; }
  .model .name { font-weight: 600; word-break: break-all; }
  .model .sites { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px; }
  .tag { font-size: 12px; border: 1px solid var(--border); border-radius: 10px; padding: 0 8px; }
  .tag.input { border-style: dashed; }
  .tag.hit { border-color: var(--text); }
  #detail { margin-top: 14px; border-top: 1px solid var(--border); padding-top: 12px; }
  #detail h3 { margin: 0 0 6px; font-size: 14px; }
  #detail ul { margin: 4px 0 0; padding-left: 18px; }

  /* the figure */
  .body { fill: var(--fill); stroke: var(--line); stroke-width: 1.3; stroke-linejoin: round; }
  .detail { fill: none; stroke: var(--line-dim); stroke-width: 1; stroke-dasharray: 2 3; }
  .pedestal { fill: none; stroke: var(--line-dim); }
  .slot { cursor: pointer; }
  .slot .shape { fill: none; stroke: var(--line-dim); stroke-width: 1; vector-effect: non-scaling-stroke; }
  .slot.has .shape { fill-opacity: 0.34; stroke-width: 1.5; }
  .slot:hover .shape { stroke: var(--ink); }
  .slot.dim, .node.dim, .lab-g.dim, .conn.dim, .stub.dim, .lead.dim { opacity: 0.2; }
  .sel-ring { fill: none; stroke: var(--ink); stroke-width: 1.2; stroke-dasharray: 3 3; }
  .lead { fill: none; stroke-width: 1; }
  .stub { fill: none; stroke: var(--line-dim); stroke-width: 1; stroke-dasharray: 2 3; }
  .stub.lit { stroke-dasharray: none; }
  .conn { fill: none; stroke-width: 1.2; stroke-dasharray: 5 3; }
  .tag-box { fill: var(--plate); stroke-width: 1; }
  .lab { font: 11px "Cascadia Mono", Consolas, "Microsoft YaHei", monospace; fill: var(--ink); letter-spacing: .04em; }
  .lab.empty { fill: var(--ink-dim); }
  .lab-g { cursor: pointer; }
  .node { cursor: pointer; }
  .node circle.base { fill: var(--plate); stroke: var(--line-dim); stroke-width: 1; }
  .node.lit circle.base { stroke-width: 1.6; }
  .node:hover circle.base { stroke: var(--ink); }
  .glyph { fill: none; stroke: var(--ink-dim); stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; }
  .node.lit .glyph { stroke: var(--ink); }
  .nlab { font: 9.5px "Cascadia Mono", Consolas, "Microsoft YaHei", monospace; fill: var(--ink-dim); text-anchor: middle; letter-spacing: .04em; }
  .node.lit .nlab { fill: var(--ink); }
  #halo { fill: none; stroke: var(--line); stroke-width: 0; stroke-linejoin: round; }
  #halo.on { stroke-width: 6; stroke-opacity: 0.35; }
  #skinline { fill: none; stroke-width: 0; stroke-dasharray: 3 2; }
  #skinline.on { stroke-width: 2.2; }
  #scan { animation: scan 6s linear infinite; }
  @keyframes scan { from { transform: translateY(-40px); } to { transform: translateY(600px); } }
  @media (prefers-reduced-motion: reduce) { #scan { animation: none; opacity: 0; } }
  :root[data-theme="dark"] .glow { filter: url(#glow); }
</style>
</head>
<body>
<div id="stage">
  <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
  <div id="hud"><span id="hud1">BODY SCAN</span><br><b id="hud2">0</b> <span id="hud3">models</span></div>
  <svg id="doll" viewBox="-96 -26 432 626" xmlns="http://www.w3.org/2000/svg" role="img">
    <defs>
      <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <linearGradient id="scanfill" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color: var(--scan); stop-opacity: 0"/><stop offset="0.88" style="stop-color: var(--scan); stop-opacity: 0.3"/><stop offset="1" style="stop-color: var(--scan); stop-opacity: 0.8"/>
      </linearGradient>
      <path id="half" d="M120 21 C106 21 93 32 93 50 C93 61 97 70 104 75 L108 80 L108 93 C98 97 82 99 68 105 C57 109 51 118 49 132 C46 160 43 180 41 196 C38 220 35 242 33 262 C31 272 28 284 31 298 C33 306 41 306 43 297 C45 286 46 272 47 262 C50 240 54 215 57 196 C60 176 62 156 66 140 C68 175 76 205 78 232 C79 255 72 275 76 302 C78 330 82 380 86 430 C86 452 82 472 84 500 C85 520 86 535 88 548 C84 553 76 556 76 563 L108 563 C110 548 111 535 112 520 C113 495 114 470 114 445 C115 400 116 350 118 312 C119 306 120 303 120 300"/>
      <clipPath id="bodyclip"><use href="#half"/><use href="#half" transform="translate(240 0) scale(-1 1)"/></clipPath>
    </defs>
    <g id="halo"><use href="#half"/><use href="#half" transform="translate(240 0) scale(-1 1)"/></g>
    <ellipse class="pedestal" cx="120" cy="568" rx="104" ry="13" stroke-dasharray="2 5"/>
    <ellipse class="pedestal" cx="120" cy="568" rx="72" ry="9" style="stroke: var(--line)"/>
    <g class="body"><use href="#half"/><use href="#half" transform="translate(240 0) scale(-1 1)"/></g>
    <g class="detail">
      <path d="M70 112 Q95 105 118 114 M82 262 Q100 244 118 262"/><path d="M70 112 Q95 105 118 114 M82 262 Q100 244 118 262" transform="translate(240 0) scale(-1 1)"/><path d="M120 100 L120 300"/>
    </g>
    <g clip-path="url(#bodyclip)"><rect id="scan" x="20" y="0" width="200" height="40" fill="url(#scanfill)"/></g>
    <g id="skinline"><use href="#half"/><use href="#half" transform="translate(240 0) scale(-1 1)"/></g>
    <g id="stubs"></g>
    <g id="conns"></g>
    <g id="slots"></g>
    <g id="inputs"></g>
    <g id="labels"></g>
  </svg>
</div>
<div id="side">
  <h2 id="title">Body Map</h2>
  <div id="msg" class="mute small"></div>
  <div id="list"></div>
  <div id="detail" style="display:none"></div>
</div>
<script>
(function () {
  const PLUGIN_ID = 'body_map';
  const q = new URLSearchParams(location.search);
  const $ = id => document.getElementById(id);
  const NS = 'http://www.w3.org/2000/svg';

  const TEXT = {
    en: {
      title: 'Body Map',
      none: 'Tick one or more models in the tree. Each one is placed on the organs it acts on and on the everyday inputs it responds to.',
      loading: 'Placing models ...',
      fail: 'Could not place the models: ',
      truncated: 'Only the first models are placed.',
      unplaced: 'No organ or input found. Its tags, path and name contain none of the words in sites.yaml.',
      unplacedShort: 'Not placed',
      via: n => 'through ' + n + ' imported component' + (n === 1 ? '' : 's'),
      slotModels: 'Models on this organ',
      inputModels: 'Models driven by this input',
      organsH: 'Organs', inputsH: 'Inputs',
      words: 'Matched words',
      components: 'Components',
      hintSel: 'Click a model, an organ or an input to follow it. Dashed lines join the inputs of a model to its organs.',
      imports: n => n + ' imported'
    },
    zh: {
      title: '人体定位',
      none: '在模型树里勾选一个或多个模型，每个模型会被放到它作用的器官，以及它所响应的日常输入上。',
      loading: '正在定位 ...',
      fail: '定位失败：',
      truncated: '只定位了前面的模型。',
      unplaced: '没有找到器官或输入。它的标签、路径和名字里没有 sites.yaml 中的任何词。',
      unplacedShort: '未定位',
      via: n => '经由 ' + n + ' 个导入组件',
      slotModels: '这个器官上的模型',
      inputModels: '受这个输入驱动的模型',
      organsH: '器官', inputsH: '输入',
      words: '命中的词',
      components: '组件',
      hintSel: '点模型、器官或输入来追踪。虚线把模型的输入连到它的器官。',
      imports: n => '导入 ' + n + ' 个'
    }
  };
  const pick = lang => TEXT[String(lang || 'en').startsWith('zh') ? 'zh' : 'en'];
  let T = pick(q.get('lang'));
  const isZh = () => T === TEXT.zh;

  // Organ catalog. `shape` is static markup, `lab` is where the tag sits: [x, y, side].
  // The first shape of an organ is where its leader line ends. Add an organ here and a keyword list for the same id under organs: in sites.yaml.
  const SLOTS = {
    brain:    { en: 'Brain',          zh: '脑',       shape: '<ellipse cx="120" cy="42" rx="19" ry="14"/>', lab: [120, -10, 'c'] },
    thyroid:  { en: 'Endocrine',      zh: '内分泌',   shape: '<path d="M108 88 q12 -6 24 0 l-4 10 q-8 3 -16 0z"/>', lab: [256, 70, 'r'] },
    lung:     { en: 'Lung',           zh: '肺',       shape: '<ellipse cx="143" cy="140" rx="17" ry="28"/><ellipse cx="97" cy="140" rx="17" ry="28"/>', lab: [256, 146, 'r'] },
    heart:    { en: 'Heart',          zh: '心脏',     shape: '<path d="M121 168 c-18 -12 -14 -26 -4 -26 c4 0 4 3 4 3 c0 0 0 -3 4 -3 c10 0 14 14 -4 26z"/>', lab: [-16, 150, 'l'] },
    immune:   { en: 'Immune',         zh: '免疫',     shape: '<circle cx="163" cy="127" r="6"/><circle cx="77" cy="127" r="6"/><circle cx="120" cy="104" r="4"/>', lab: [256, 108, 'r'] },
    liver:    { en: 'Liver',          zh: '肝脏',     shape: '<path d="M78 188 q22 -14 44 -2 l-2 16 q-24 8 -40 -2z"/>', lab: [-16, 192, 'l'] },
    stomach:  { en: 'Stomach / gut',  zh: '胃肠',     shape: '<ellipse cx="144" cy="192" rx="13" ry="11"/><rect x="92" y="236" width="56" height="38" rx="14"/>', lab: [256, 200, 'r'] },
    pancreas: { en: 'Pancreas',       zh: '胰腺',     shape: '<ellipse cx="122" cy="214" rx="20" ry="5.5"/>', lab: [256, 232, 'r'] },
    kidney:   { en: 'Kidney',         zh: '肾脏',     shape: '<ellipse cx="92" cy="226" rx="6" ry="10"/><ellipse cx="148" cy="226" rx="6" ry="10"/>', lab: [-16, 232, 'l'] },
    pelvis:   { en: 'Pelvis',         zh: '盆腔',     shape: '<ellipse cx="120" cy="292" rx="22" ry="11"/>', lab: [256, 300, 'r'] },
    muscle:   { en: 'Muscle',         zh: '肌肉',     shape: '<ellipse cx="100" cy="364" rx="14" ry="42"/><ellipse cx="140" cy="364" rx="14" ry="42"/><ellipse cx="54" cy="170" rx="8" ry="24" transform="rotate(8 54 170)"/><ellipse cx="186" cy="170" rx="8" ry="24" transform="rotate(-8 186 170)"/>', lab: [-16, 364, 'l'] },
    bone:     { en: 'Bone / joint',   zh: '骨骼',     shape: '<circle cx="142" cy="446" r="11"/><circle cx="98" cy="446" r="11"/><circle cx="143" cy="520" r="8"/><circle cx="97" cy="520" r="8"/>', lab: [256, 450, 'r'] },
    blood:    { en: 'Blood',          zh: '血液',     shape: '<path d="M198 244 c-7 9 -5 17 0 17 c5 0 7 -8 0 -17z"/><path d="M42 244 c-7 9 -5 17 0 17 c5 0 7 -8 0 -17z"/>', lab: [256, 262, 'r'] },
    skin:     { en: 'Skin',           zh: '皮肤',     shape: '', lab: [256, 30, 'r'] },
    whole:    { en: 'Whole body',     zh: '全身',     shape: '', lab: [-16, 540, 'l'] }
  };

  // Everyday inputs that reach the body. `at` is the node, `to` the point on the body its stub touches, `glyph` a path around 0,0 on a 16 by 16 grid.
  // Add an input here and a keyword list for the same id under inputs: in sites.yaml.
  const INPUTS = {
    stress:     { en: 'Work stress',    zh: '工作压力', at: [56, 24],   to: [104, 38],  glyph: 'M2 -8 L-4 1 H0 L-2 8 L5 -2 H1 Z' },
    air:        { en: 'Air',            zh: '空气',     at: [56, 64],   to: [104, 60],  glyph: 'M-7 -4 H2 a2 2 0 1 0 -2 -2 M-7 0 H6 a2.4 2.4 0 1 1 -2.4 2.4 M-7 4 H0' },
    social:     { en: 'Study / social', zh: '学业社交', at: [34, 104],  to: [70, 110],  glyph: 'M-4 -4 m-2.4 0 a2.4 2.4 0 1 0 4.8 0 a2.4 2.4 0 1 0 -4.8 0 M-8 6 q4 -7 8 0 M4 -4 m-2.4 0 a2.4 2.4 0 1 0 4.8 0 a2.4 2.4 0 1 0 -4.8 0 M0 6 q4 -7 8 0' },
    sleep:      { en: 'Sleep',          zh: '睡眠',     at: [184, 24],  to: [136, 38],  glyph: 'M3 -7 A7 7 0 1 0 7 3 A6 6 0 0 1 3 -7 Z' },
    food:       { en: 'Food / water',   zh: '饮食',     at: [184, 64],  to: [128, 66],  glyph: 'M-7 -1 H7 A7 7 0 0 1 -7 -1 Z M-2 -4 q-1.5 -2 0 -4 M2 -4 q-1.5 -2 0 -4' },
    substances: { en: 'Smoke / alcohol', zh: '烟酒',    at: [206, 104], to: [134, 88],  glyph: 'M-7 2 H7 V6 H-7 Z M2 2 V6 M-3 -1 q2 -3 0 -7' },
    commute:    { en: 'Commute',        zh: '通勤',     at: [44, 478],  to: [85, 478],  glyph: 'M-7 -5 L-1 0 L-7 5 M0 -5 L6 0 L0 5' },
    exercise:   { en: 'Exercise',       zh: '运动',     at: [196, 478], to: [155, 478], glyph: 'M-7 0 H7 M-5 -4 V4 M5 -4 V4 M-8 -2 V2 M8 -2 V2' }
  };

  // One flat set of muted tones, readable on the light and the dark screen. Color is the only thing that tells models apart.
  const COLORS = ['#3b82c4', '#d98a2b', '#3f9e7a', '#b4619a', '#7a8896', '#c9534f', '#7b6fd0', '#9aa332'];

  let models = [];          // placed models: {path, name, error?, sites, inputs, color}
  let sel = null;           // {kind: 'model' | 'organ' | 'input', id}
  let token = 0;

  function applyTheme(theme) { document.documentElement.dataset.theme = theme === 'dark' ? 'dark' : 'light'; }
  applyTheme(q.get('theme'));

  function el(tag, attrs, text) {
    const e = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(k => e.setAttribute(k, attrs[k]));
    if (text != null) e.textContent = text;
    return e;
  }
  function svgEl(tag, attrs) {
    const e = document.createElementNS(NS, tag);
    if (attrs) Object.keys(attrs).forEach(k => e.setAttribute(k, attrs[k]));
    return e;
  }
  const organName = id => SLOTS[id][isZh() ? 'zh' : 'en'];
  const inputName = id => INPUTS[id][isZh() ? 'zh' : 'en'];
  const titleOf = m => m.name || m.path.split('/').pop();
  const organsOf = m => (m.sites || []).map(s => s.slot).filter(id => SLOTS[id]);
  const inputsOf = m => (m.inputs || []).map(s => s.slot).filter(id => INPUTS[id]);
  const onOrgan = id => models.filter(m => organsOf(m).includes(id));
  const onInput = id => models.filter(m => inputsOf(m).includes(id));
  const isSel = (kind, id) => !!sel && sel.kind === kind && sel.id === id;

  // What the current selection keeps in focus: the models, organs and inputs that stay bright, and the lines to draw.
  function focus() {
    if (!sel) return null;
    let ms;
    if (sel.kind === 'model') ms = models.filter(m => m.path === sel.id);
    else if (sel.kind === 'organ') ms = onOrgan(sel.id);
    else ms = onInput(sel.id);
    const organs = new Set(), inputs = new Set(), lines = [];
    ms.forEach(m => {
      const os = organsOf(m).filter(o => sel.kind !== 'organ' || o === sel.id);
      const is = inputsOf(m).filter(i => sel.kind !== 'input' || i === sel.id);
      os.forEach(o => organs.add(o)); is.forEach(i => inputs.add(i));
      is.forEach(i => os.forEach(o => lines.push({ i, o, color: m.color })));
    });
    if (sel.kind === 'organ') organs.add(sel.id);
    if (sel.kind === 'input') inputs.add(sel.id);
    return { models: new Set(ms.map(m => m.path)), organs, inputs, lines };
  }

  // ---- the figure

  function buildFigure() {
    $('slots').replaceChildren(); $('inputs').replaceChildren(); $('stubs').replaceChildren();
    Object.keys(SLOTS).forEach(id => {
      const g = svgEl('g', { class: 'slot' }); g.dataset.slot = id;
      if (SLOTS[id].shape) {
        const holder = svgEl('g');
        holder.innerHTML = SLOTS[id].shape;           // static markup from the catalog above, never user text
        Array.from(holder.children).forEach(c => { c.setAttribute('class', 'shape'); g.appendChild(c); });
      }
      g.addEventListener('click', () => choose('organ', id));
      $('slots').appendChild(g);
    });
    Object.keys(INPUTS).forEach(id => {
      const d = INPUTS[id];
      const stub = svgEl('line', { class: 'stub', x1: d.at[0], y1: d.at[1], x2: d.to[0], y2: d.to[1] }); stub.dataset.stub = id;
      $('stubs').appendChild(stub);
      const g = svgEl('g', { class: 'node', transform: 'translate(' + d.at[0] + ' ' + d.at[1] + ')' }); g.dataset.input = id;
      g.appendChild(svgEl('circle', { class: 'base', r: 13 }));
      g.appendChild(svgEl('path', { class: 'glyph', d: d.glyph }));
      g.appendChild(svgEl('text', { class: 'nlab', y: 26 }));
      g.addEventListener('click', () => choose('input', id));
      $('inputs').appendChild(g);
    });
  }

  function anchorOf(g) {
    const first = g.querySelector('.shape');
    if (!first) return null;
    const b = first.getBBox();
    return { x: b.x + b.width / 2, y: b.y + b.height / 2, r: Math.max(b.width, b.height) / 2 };
  }

  // One organ tag: a plate with a bar in the first model's color, the organ name and a square for each model.
  function drawTag(parent, id, on, dim) {
    const [lx, ly, side] = SLOTS[id].lab;
    const g = svgEl('g', { class: 'lab-g' + (dim ? ' dim' : '') });
    g.addEventListener('click', () => choose('organ', id));
    const text = svgEl('text', { class: 'lab' + (on.length ? '' : ' empty'), 'dominant-baseline': 'central', y: ly });
    text.textContent = organName(id).toUpperCase();
    g.appendChild(text);
    parent.appendChild(g);
    const tw = text.getComputedTextLength();
    const chips = Math.min(on.length, 6);
    const w = tw + 16 + (chips ? chips * 9 + 4 : 0), h = 18;
    const x0 = side === 'l' ? lx - w : side === 'c' ? lx - w / 2 : lx;
    text.setAttribute('x', x0 + 10);
    if (on.length) {
      const col = on[0].color;
      g.insertBefore(svgEl('rect', { class: 'tag-box', x: x0, y: ly - h / 2, width: w, height: h, stroke: col, 'stroke-opacity': 0.8 }), text);
      g.insertBefore(svgEl('rect', { x: x0, y: ly - h / 2, width: 3, height: h, fill: col }), text);
      on.slice(0, chips).forEach((m, i) => g.appendChild(svgEl('rect', { x: x0 + 10 + tw + 6 + i * 9, y: ly - 3.5, width: 7, height: 7, fill: m.color })));
    }
    return { x0, w };
  }

  function paint() {
    const f = focus();
    const live = new Set(models.flatMap(organsOf));
    const labG = $('labels'); labG.replaceChildren();
    const anchors = {};

    Object.keys(SLOTS).forEach(id => {
      const on = onOrgan(id);
      const g = $('slots').querySelector('[data-slot="' + id + '"]');
      const dim = !!f && !f.organs.has(id);
      g.classList.toggle('has', on.length > 0);
      g.classList.toggle('dim', dim);
      g.classList.toggle('glow', on.length > 0);
      g.querySelectorAll('.ring, .sel-ring').forEach(r => r.remove());
      const shapes = Array.from(g.querySelectorAll('.shape'));
      shapes.forEach(sh => { sh.style.fill = on.length ? on[0].color : ''; sh.style.stroke = on.length ? on[0].color : ''; });

      // Every further model on the same organ adds an outline ring around it in its own color.
      on.slice(1, 5).forEach((m, i) => {
        shapes.forEach(sh => {
          const b = sh.getBBox(), cx = b.x + b.width / 2, cy = b.y + b.height / 2, k = 1.16 + i * 0.16;
          const w = svgEl('g', { class: 'ring', transform: 'translate(' + cx + ' ' + cy + ') scale(' + k + ') translate(' + -cx + ' ' + -cy + ')' });
          const c = sh.cloneNode(false);
          c.setAttribute('class', ''); c.removeAttribute('style');
          c.setAttribute('fill', 'none'); c.setAttribute('stroke', m.color); c.setAttribute('stroke-width', 1.2);
          c.setAttribute('vector-effect', 'non-scaling-stroke');
          w.appendChild(c);
          g.insertBefore(w, g.firstChild);
        });
      });

      const a = anchorOf(g);
      if (a) anchors[id] = a;
      if (a && isSel('organ', id)) g.appendChild(svgEl('circle', { class: 'sel-ring', cx: a.x, cy: a.y, r: a.r + 10 }));

      const tag = drawTag(labG, id, on, dim);
      if (a && on.length) {
        const ly = SLOTS[id].lab[1], side = SLOTS[id].lab[2];
        const edge = side === 'l' ? tag.x0 + tag.w : tag.x0;
        const elbow = edge + (side === 'l' ? 16 : -16);
        const cls = 'lead' + (dim ? ' dim' : '');
        // a tag above the figure is reached by a straight line, the others by a bent one
        const d = side === 'c' ? 'M' + a.x + ' ' + a.y + ' L' + SLOTS[id].lab[0] + ' ' + (ly + 9)
                               : 'M' + a.x + ' ' + a.y + ' L' + elbow + ' ' + ly + ' L' + edge + ' ' + ly;
        labG.insertBefore(svgEl('circle', { cx: a.x, cy: a.y, r: 2, fill: on[0].color, class: cls }), labG.firstChild);
        labG.insertBefore(svgEl('path', { class: cls, d, stroke: on[0].color, 'stroke-opacity': 0.85 }), labG.firstChild);
      }
    });

    Object.keys(INPUTS).forEach(id => {
      const on = onInput(id);
      const g = $('inputs').querySelector('[data-input="' + id + '"]');
      const dim = !!f && !f.inputs.has(id);
      g.classList.toggle('lit', on.length > 0);
      g.classList.toggle('dim', dim);
      g.querySelector('.base').style.stroke = on.length ? on[0].color : '';
      g.querySelector('.nlab').textContent = inputName(id) + (on.length ? '  ' + on.length : '');
      const stub = $('stubs').querySelector('[data-stub="' + id + '"]');
      stub.classList.toggle('lit', on.length > 0);
      stub.classList.toggle('dim', dim);
      stub.style.stroke = on.length ? on[0].color : '';
    });

    // The lines from inputs to organs, drawn only for the thing the user is following.
    const conns = $('conns'); conns.replaceChildren();
    if (f) f.lines.forEach(l => {
      const a = anchors[l.o], n = INPUTS[l.i].at;
      if (!a) return;
      const mx = (n[0] + a.x) / 2, my = (n[1] + a.y) / 2;
      conns.appendChild(svgEl('path', { class: 'conn', d: 'M' + n[0] + ' ' + n[1] + ' Q' + mx + ' ' + (my - 18) + ' ' + a.x + ' ' + a.y, stroke: l.color, 'stroke-opacity': 0.85 }));
    });

    $('halo').classList.toggle('on', live.has('whole') && (!f || f.organs.has('whole')));
    $('skinline').classList.toggle('on', live.has('skin') && (!f || f.organs.has('skin')));
    $('skinline').style.stroke = onOrgan('skin').length ? onOrgan('skin')[0].color : '';
    $('halo').style.stroke = onOrgan('whole').length ? onOrgan('whole')[0].color : '';
    $('hud2').textContent = models.length;
    $('hud3').textContent = isZh() ? '个模型' : (models.length === 1 ? 'model' : 'models');
  }

  // ---- the side panel

  function choose(kind, id) { sel = isSel(kind, id) ? null : { kind, id }; renderList(); paint(); renderDetail(); }

  function renderList() {
    const f = focus();
    const list = $('list'); list.replaceChildren();
    models.forEach(m => {
      const card = el('div', { class: 'model' + (isSel('model', m.path) ? ' on' : '') + (f && !f.models.has(m.path) ? ' dim' : '') });
      card.style.borderLeftColor = m.color;
      card.appendChild(el('div', { class: 'name' }, titleOf(m)));
      const sites = el('div', { class: 'sites' });
      if (m.error) sites.appendChild(el('span', { class: 'small mute' }, m.error));
      else if (!organsOf(m).length && !inputsOf(m).length) sites.appendChild(el('span', { class: 'tag' }, T.unplacedShort));
      else {
        inputsOf(m).forEach(i => sites.appendChild(el('span', { class: 'tag input' + (isSel('input', i) ? ' hit' : '') }, inputName(i))));
        organsOf(m).forEach(o => sites.appendChild(el('span', { class: 'tag' + (isSel('organ', o) ? ' hit' : '') }, organName(o))));
      }
      card.appendChild(sites);
      card.addEventListener('click', () => choose('model', m.path));
      list.appendChild(card);
    });
  }

  function siteList(sites, name) {
    const ul = el('ul');
    sites.forEach(s => {
      const li = el('li');
      li.appendChild(el('b', null, name(s.slot)));
      const bits = [];
      if (s.why.length) bits.push(T.words + ': ' + s.why.join(', '));
      if (s.via.length) bits.push(T.via(s.via.length));
      li.appendChild(el('span', { class: 'small mute' }, bits.length ? '  ' + bits.join('  ·  ') : ''));
      if (s.via.length) li.appendChild(el('div', { class: 'small mute' }, T.components + ': ' + s.via.join(', ')));
      ul.appendChild(li);
    });
    return ul;
  }

  function renderDetail() {
    const d = $('detail'); d.replaceChildren();
    if (!sel) { d.style.display = 'none'; return; }
    d.style.display = '';
    if (sel.kind === 'model') {
      const m = models.find(x => x.path === sel.id);
      d.appendChild(el('h3', null, titleOf(m)));
      d.appendChild(el('div', { class: 'small mute' }, m.path + (m.imports ? '  ·  ' + T.imports(m.imports) : '')));
      const inputs = (m.inputs || []).filter(s => INPUTS[s.slot]), organs = (m.sites || []).filter(s => SLOTS[s.slot]);
      if (!inputs.length && !organs.length) d.appendChild(el('p', { class: 'small' }, T.unplaced));
      if (inputs.length) { d.appendChild(el('div', { class: 'small mute' }, T.inputsH)); d.appendChild(siteList(inputs, inputName)); }
      if (organs.length) { d.appendChild(el('div', { class: 'small mute' }, T.organsH)); d.appendChild(siteList(organs, organName)); }
    } else {
      const organ = sel.kind === 'organ';
      d.appendChild(el('h3', null, organ ? organName(sel.id) : inputName(sel.id)));
      d.appendChild(el('div', { class: 'small mute' }, organ ? T.slotModels : T.inputModels));
      const ul = el('ul');
      (organ ? onOrgan(sel.id) : onInput(sel.id)).forEach(m => {
        const s = (organ ? m.sites : m.inputs).find(x => x.slot === sel.id);
        const li = el('li', null, titleOf(m));
        li.appendChild(el('span', { class: 'small mute' }, s.why.length ? '  ' + s.why.join(', ') : ''));
        ul.appendChild(li);
      });
      d.appendChild(ul);
    }
  }

  function message(text) { $('msg').textContent = text; }

  function setTexts() {
    $('title').textContent = T.title; $('hud1').textContent = isZh() ? '人体扫描' : 'BODY SCAN';
    if (!models.length) message(T.none);
  }

  // ---- data

  async function refresh(list) {
    const my = ++token;
    if (!list.length) { models = []; sel = null; renderList(); paint(); renderDetail(); message(T.none); return; }
    message(T.loading);
    let res;
    try {
      const r = await fetch('/api/plugins/' + PLUGIN_ID + '/locate', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ inputs: { paths: list.map(m => m.path) } })
      });
      res = await r.json();
    } catch (e) { if (my === token) message(T.fail + e.message); return; }
    if (my !== token) return;
    if (!res.success) { message(T.fail + (res.error || res.detail || 'unknown error')); return; }
    models = res.models.map((m, i) => Object.assign({}, m, { color: COLORS[i % COLORS.length], sites: m.sites || [], inputs: m.inputs || [] }));
    if (sel && sel.kind === 'model' && !models.some(m => m.path === sel.id)) sel = null;
    renderList(); paint(); renderDetail();
    message(res.truncated ? T.truncated : T.hintSel);
  }

  let lastKey = '', debounce = 0;
  window.addEventListener('message', e => {
    if (!e.data || e.data.type !== 'lm-init') return;
    applyTheme(e.data.theme); T = pick(e.data.lang); setTexts(); renderList(); paint(); renderDetail();
    // The tree ticks win; with none ticked the single selected model is shown, so the page is never empty by accident.
    let list = Array.isArray(e.data.models) ? e.data.models : [];
    if (!list.length && e.data.model) list = [e.data.model];
    const key = list.map(m => m.path).join('|');
    if (key !== lastKey) { lastKey = key; clearTimeout(debounce); debounce = setTimeout(() => refresh(list), 150); }
  });

  buildFigure(); setTexts(); paint();
  parent.postMessage({ type: 'lm-ready' }, '*');
})();
</script>
</body>
</html>
