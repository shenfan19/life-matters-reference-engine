<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Body Map</title>
<style>
  :root { --bg: #ffffff; --panel: #fafafa; --text: #1f1f1f; --mute: #8c8c8c; --primary: #007A33; --border: #d9d9d9;
          --body: #eef1f4; --body-line: #c3cad2; --slot: #b8c0c9; }
  :root[data-theme="dark"] { --bg: #141414; --panel: #1b1b1b; --text: #f0f0f0; --mute: #8c8c8c; --primary: #52c41a; --border: #303030;
          --body: #232930; --body-line: #3a444e; --slot: #4a5562; }
  html, body { margin: 0; width: 100%; height: 100%; }
  body { background: var(--bg); color: var(--text); font: 14px -apple-system, "Segoe UI", sans-serif; box-sizing: border-box; display: flex; }
  /* The stage is a scanner screen with its own palette in both themes, only the side panel follows the theme. */
  #stage { flex: 1 1 auto; min-width: 0; position: relative; display: flex; align-items: center; justify-content: center; padding: 14px; box-sizing: border-box; overflow: hidden;
           --cy: #3fe0f0;
           background:
             radial-gradient(ellipse at 50% 42%, rgba(63, 224, 240, 0.16), transparent 62%),
             linear-gradient(rgba(63, 224, 240, 0.055) 1px, transparent 1px) 0 0 / 28px 28px,
             linear-gradient(90deg, rgba(63, 224, 240, 0.055) 1px, transparent 1px) 0 0 / 28px 28px,
             #050d13; }
  #stage::after { content: ""; position: absolute; inset: 0; pointer-events: none;
           background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.22) 0 1px, transparent 1px 3px); }
  #stage svg { position: relative; z-index: 1; height: 100%; max-height: 780px; width: auto; max-width: 100%; }
  .corner { position: absolute; width: 22px; height: 22px; border: 0 solid var(--cy); opacity: 0.8; z-index: 2; }
  .corner.tl { top: 10px; left: 10px; border-width: 2px 0 0 2px; } .corner.tr { top: 10px; right: 10px; border-width: 2px 2px 0 0; }
  .corner.bl { bottom: 10px; left: 10px; border-width: 0 0 2px 2px; } .corner.br { bottom: 10px; right: 10px; border-width: 0 2px 2px 0; }
  #hud { position: absolute; top: 18px; left: 44px; z-index: 2; font: 11px/1.5 "Cascadia Mono", Consolas, monospace; letter-spacing: .12em; color: var(--cy); text-transform: uppercase; text-shadow: 0 0 6px rgba(63, 224, 240, .7); }
  #hud b { color: #ffe600; text-shadow: 0 0 6px rgba(255, 230, 0, .6); font-weight: 600; }
  #side { flex: 0 0 320px; border-left: 1px solid var(--border); background: var(--panel); padding: 16px; box-sizing: border-box; overflow-y: auto; }
  h2 { margin: 0 0 4px; font-size: 16px; color: var(--primary); }
  .mute { color: var(--mute); }
  .small { font-size: 12px; }
  #msg { margin: 6px 0 12px; }
  .model { border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; margin-bottom: 8px; cursor: pointer; background: var(--bg); }
  .model.on { border-color: var(--primary); }
  .model.dim { opacity: 0.4; }
  .model .top { display: flex; align-items: center; gap: 8px; }
  .chip { width: 12px; height: 12px; border-radius: 3px; flex: none; }
  .model .name { font-weight: 600; word-break: break-all; }
  .model .sites { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px; }
  .tag { font-size: 12px; border: 1px solid var(--border); border-radius: 10px; padding: 0 8px; }
  .tag.hit { border-color: var(--primary); color: var(--primary); }
  #detail { margin-top: 14px; border-top: 1px solid var(--border); padding-top: 12px; }
  #detail h3 { margin: 0 0 6px; font-size: 14px; }
  #detail ul { margin: 4px 0 0; padding-left: 18px; }
  .model { border-left-width: 4px; }
  .slot { cursor: pointer; }
  .slot .shape { fill: rgba(63, 224, 240, 0.04); stroke: rgba(63, 224, 240, 0.32); stroke-width: 1; vector-effect: non-scaling-stroke; transition: fill .15s, stroke .15s; }
  .slot.has .shape { fill-opacity: 0.3; stroke-width: 1.6; filter: url(#glow); }
  .slot:hover .shape { stroke: #fff; }
  .slot.dim { opacity: 0.22; }
  .ring { fill: none; stroke-width: 1.2; vector-effect: non-scaling-stroke; filter: url(#glow); }
  .sel-ring { fill: none; stroke: #fff; stroke-width: 1.2; stroke-dasharray: 3 3; }
  .lead { fill: none; stroke-width: 1; }
  .tag-box { fill: rgba(5, 13, 19, 0.88); stroke-width: 1; }
  .lab { font: 11px "Cascadia Mono", Consolas, "Microsoft YaHei", monospace; fill: #d6f7fb; letter-spacing: .04em; }
  .lab.empty { fill: rgba(63, 224, 240, 0.38); }
  .lab-g { cursor: pointer; }
  .lab-g.dim, .lead.dim { opacity: 0.2; }
  #halo { fill: none; stroke: #ffe600; stroke-width: 0; stroke-linejoin: round; filter: url(#glow); }
  #halo.on { stroke-width: 7; stroke-opacity: 0.5; }
  #skinline { fill: none; stroke: #ff2a6d; stroke-width: 0; stroke-dasharray: 3 2; filter: url(#glow); }
  #skinline.on { stroke-width: 2.4; }
  #scan { animation: scan 5.5s linear infinite; }
  @keyframes scan { from { transform: translateY(-40px); } to { transform: translateY(600px); } }
  @media (prefers-reduced-motion: reduce) { #scan { animation: none; opacity: 0; } }
</style>
</head>
<body>
<div id="stage">
  <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
  <div id="hud"><span id="hud1">BODY SCAN</span><br><b id="hud2">0</b> <span id="hud3">models</span></div>
  <svg id="doll" viewBox="-96 0 432 600" xmlns="http://www.w3.org/2000/svg" role="img">
    <defs>
      <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <linearGradient id="bodyfill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3fe0f0" stop-opacity="0.20"/><stop offset="1" stop-color="#3fe0f0" stop-opacity="0.03"/></linearGradient>
      <linearGradient id="scanfill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3fe0f0" stop-opacity="0"/><stop offset="0.85" stop-color="#3fe0f0" stop-opacity="0.35"/><stop offset="1" stop-color="#bff8ff" stop-opacity="0.9"/></linearGradient>
      <path id="half" d="M120 21 C106 21 93 32 93 50 C93 61 97 70 104 75 L108 80 L108 93 C98 97 82 99 68 105 C57 109 51 118 49 132 C46 160 43 180 41 196 C38 220 35 242 33 262 C31 272 28 284 31 298 C33 306 41 306 43 297 C45 286 46 272 47 262 C50 240 54 215 57 196 C60 176 62 156 66 140 C68 175 76 205 78 232 C79 255 72 275 76 302 C78 330 82 380 86 430 C86 452 82 472 84 500 C85 520 86 535 88 548 C84 553 76 556 76 563 L108 563 C110 548 111 535 112 520 C113 495 114 470 114 445 C115 400 116 350 118 312 C119 306 120 303 120 300"/>
      <clipPath id="bodyclip"><use href="#half"/><use href="#half" transform="translate(240 0) scale(-1 1)"/></clipPath>
    </defs>
    <g id="halo"><use href="#half"/><use href="#half" transform="translate(240 0) scale(-1 1)"/></g>
    <ellipse cx="120" cy="568" rx="104" ry="13" fill="none" stroke="#3fe0f0" stroke-opacity="0.45" stroke-dasharray="2 5"/>
    <ellipse cx="120" cy="568" rx="72" ry="9" fill="none" stroke="#3fe0f0" stroke-opacity="0.8" filter="url(#glow)"/>
    <ellipse cx="120" cy="568" rx="40" ry="5" fill="#3fe0f0" fill-opacity="0.18"/>
    <g id="silhouette" fill="url(#bodyfill)" stroke="#3fe0f0" stroke-opacity="0.75" stroke-width="1.4" stroke-linejoin="round" filter="url(#glow)">
      <use href="#half"/><use href="#half" transform="translate(240 0) scale(-1 1)"/>
    </g>
    <g fill="none" stroke="#3fe0f0" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="2 3">
      <path d="M70 112 Q95 105 118 114 M82 262 Q100 244 118 262"/><path d="M70 112 Q95 105 118 114 M82 262 Q100 244 118 262" transform="translate(240 0) scale(-1 1)"/><path d="M120 100 L120 300"/>
    </g>
    <g clip-path="url(#bodyclip)"><rect id="scan" x="20" y="0" width="200" height="40" fill="url(#scanfill)"/></g>
    <g id="skinline"><use href="#half"/><use href="#half" transform="translate(240 0) scale(-1 1)"/></g>
    <g id="slots"></g>
    <g id="labels"></g>
  </svg>
</div>
<div id="side">
  <h2 id="title">Body Map</h2>
  <div id="msg" class="mute small"></div>
  <div id="list"></div>
  <div id="detail" style="display:none"></div>
</div>
<script>
(function () {
  const PLUGIN_ID = 'body_map';
  const q = new URLSearchParams(location.search);
  const $ = id => document.getElementById(id);
  const NS = 'http://www.w3.org/2000/svg';

  const TEXT = {
    en: {
      title: 'Body Map',
      none: 'Tick one or more models in the tree. Each one is placed on the organs it acts on.',
      loading: 'Placing models ...',
      fail: 'Could not place the models: ',
      truncated: 'Only the first models are placed.',
      unplaced: 'No organ found. Its tags, path and name contain none of the words in sites.yaml.',
      placedOn: n => 'On ' + n + ' organ' + (n === 1 ? '' : 's'),
      unplacedShort: 'Not placed',
      via: n => 'through ' + n + ' imported component' + (n === 1 ? '' : 's'),
      slotModels: 'Models on this organ',
      words: 'Matched words',
      components: 'Components',
      hintSel: 'Click a model to see only its organs, click an organ to see its models.',
      imports: n => n + ' imported'
    },
    zh: {
      title: '人体定位',
      none: '在模型树里勾选一个或多个模型，每个模型会被放到它作用的器官上。',
      loading: '正在定位 ...',
      fail: '定位失败：',
      truncated: '只定位了前面的模型。',
      unplaced: '没有找到器官。它的标签、路径和名字里没有 sites.yaml 中的任何词。',
      placedOn: n => '落在 ' + n + ' 个器官',
      unplacedShort: '未定位',
      via: n => '经由 ' + n + ' 个导入组件',
      slotModels: '这个器官上的模型',
      words: '命中的词',
      components: '组件',
      hintSel: '点模型只看它的器官，点器官看上面有哪些模型。',
      imports: n => '导入 ' + n + ' 个'
    }
  };
  const pick = lang => TEXT[String(lang || 'en').startsWith('zh') ? 'zh' : 'en'];
  let T = pick(q.get('lang'));
  const isZh = () => T === TEXT.zh;

  // Organ catalog. `shape` is static markup, `lab` is where the tag sits: [x, y, side].
  // The first shape of an organ is where its leader line ends. Add an organ here and a keyword list for the same id in sites.yaml.
  const SLOTS = {
    brain:    { en: 'Brain',          zh: '脑',       shape: '<ellipse cx="120" cy="42" rx="19" ry="14"/>', lab: [-16, 36, 'l'] },
    thyroid:  { en: 'Endocrine',      zh: '内分泌',   shape: '<path d="M108 88 q12 -6 24 0 l-4 10 q-8 3 -16 0z"/>', lab: [256, 70, 'r'] },
    lung:     { en: 'Lung',           zh: '肺',       shape: '<ellipse cx="143" cy="140" rx="17" ry="28"/><ellipse cx="97" cy="140" rx="17" ry="28"/>', lab: [256, 146, 'r'] },
    heart:    { en: 'Heart',          zh: '心脏',     shape: '<path d="M121 168 c-18 -12 -14 -26 -4 -26 c4 0 4 3 4 3 c0 0 0 -3 4 -3 c10 0 14 14 -4 26z"/>', lab: [-16, 150, 'l'] },
    immune:   { en: 'Immune',         zh: '免疫',     shape: '<circle cx="163" cy="127" r="6"/><circle cx="77" cy="127" r="6"/><circle cx="120" cy="104" r="4"/>', lab: [256, 108, 'r'] },
    liver:    { en: 'Liver',          zh: '肝脏',     shape: '<path d="M78 188 q22 -14 44 -2 l-2 16 q-24 8 -40 -2z"/>', lab: [-16, 192, 'l'] },
    stomach:  { en: 'Stomach / gut',  zh: '胃肠',     shape: '<ellipse cx="144" cy="192" rx="13" ry="11"/><rect x="92" y="236" width="56" height="38" rx="14"/>', lab: [256, 200, 'r'] },
    pancreas: { en: 'Pancreas',       zh: '胰腺',     shape: '<ellipse cx="122" cy="214" rx="20" ry="5.5"/>', lab: [256, 232, 'r'] },
    kidney:   { en: 'Kidney',         zh: '肾脏',     shape: '<ellipse cx="92" cy="226" rx="6" ry="10"/><ellipse cx="148" cy="226" rx="6" ry="10"/>', lab: [-16, 232, 'l'] },
    pelvis:   { en: 'Pelvis',         zh: '盆腔',     shape: '<ellipse cx="120" cy="292" rx="22" ry="11"/>', lab: [256, 300, 'r'] },
    muscle:   { en: 'Muscle',         zh: '肌肉',     shape: '<ellipse cx="100" cy="364" rx="14" ry="42"/><ellipse cx="140" cy="364" rx="14" ry="42"/><ellipse cx="54" cy="170" rx="8" ry="24" transform="rotate(8 54 170)"/><ellipse cx="186" cy="170" rx="8" ry="24" transform="rotate(-8 186 170)"/>', lab: [-16, 364, 'l'] },
    bone:     { en: 'Bone / joint',   zh: '骨骼',     shape: '<circle cx="142" cy="446" r="11"/><circle cx="98" cy="446" r="11"/><circle cx="143" cy="520" r="8"/><circle cx="97" cy="520" r="8"/>', lab: [256, 450, 'r'] },
    blood:    { en: 'Blood',          zh: '血液',     shape: '<path d="M198 244 c-7 9 -5 17 0 17 c5 0 7 -8 0 -17z"/><path d="M42 244 c-7 9 -5 17 0 17 c5 0 7 -8 0 -17z"/>', lab: [256, 262, 'r'] },
    skin:     { en: 'Skin',           zh: '皮肤',     shape: '', lab: [256, 30, 'r'] },
    whole:    { en: 'Whole body',     zh: '全身',     shape: '', lab: [-16, 540, 'l'] }
  };

  // Neon colors for the models, bright enough for the dark screen.
  const COLORS = ['#3fe0f0', '#ffe600', '#ff2a6d', '#7dff4f', '#ff9a1f', '#b388ff', '#ff6bd6', '#ffffff'];

  let models = [];          // placed models: {path, name, error?, sites:[{slot,why,via}], color}
  let selModel = null;      // a model path, or null
  let selSlot = null;       // a slot id, or null
  let token = 0;

  function applyTheme(theme) { document.documentElement.dataset.theme = theme === 'dark' ? 'dark' : 'light'; }
  applyTheme(q.get('theme'));

  function el(tag, attrs, text) {
    const e = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(k => e.setAttribute(k, attrs[k]));
    if (text != null) e.textContent = text;
    return e;
  }
  function svgEl(tag, attrs) {
    const e = document.createElementNS(NS, tag);
    if (attrs) Object.keys(attrs).forEach(k => e.setAttribute(k, attrs[k]));
    return e;
  }
  const label = id => SLOTS[id][isZh() ? 'zh' : 'en'];
  const titleOf = m => m.name || m.path.split('/').pop();

  function slotsOf(path) { return models.filter(m => m.path === path).flatMap(m => (m.sites || []).map(s => s.slot)); }
  function modelsOn(slot) { return models.filter(m => (m.sites || []).some(s => s.slot === slot)); }

  // ---- the doll

  function buildDoll() {
    const slotsG = $('slots');
    slotsG.replaceChildren(); $('labels').replaceChildren();
    Object.keys(SLOTS).forEach(id => {
      const def = SLOTS[id];
      const g = svgEl('g', { class: 'slot' }); g.dataset.slot = id;
      if (def.shape) {
        const holder = svgEl('g');
        holder.innerHTML = def.shape;                 // static markup from the catalog above, never user text
        Array.from(holder.children).forEach(c => { c.setAttribute('class', 'shape'); g.appendChild(c); });
      }
      g.addEventListener('click', () => pickSlot(id));
      slotsG.appendChild(g);
    });
  }

  function anchorOf(g) {
    const first = g.querySelector('.shape');
    if (!first) return null;
    const b = first.getBBox();
    return { x: b.x + b.width / 2, y: b.y + b.height / 2, r: Math.max(b.width, b.height) / 2 };
  }

  // One HUD tag: a dark plate with a colored bar, the organ name and a small square for each model.
  function drawTag(parent, id, on, dim) {
    const [lx, ly, side] = SLOTS[id].lab;
    const g = svgEl('g', { class: 'lab-g' + (dim ? ' dim' : '') });
    g.addEventListener('click', () => pickSlot(id));
    const text = svgEl('text', { class: 'lab' + (on.length ? '' : ' empty'), 'dominant-baseline': 'central', y: ly });
    text.textContent = label(id).toUpperCase();
    g.appendChild(text);
    parent.appendChild(g);
    const tw = text.getComputedTextLength();
    const chips = Math.min(on.length, 6);
    const w = tw + 16 + (chips ? chips * 9 + 4 : 0), h = 18;
    const x0 = side === 'l' ? lx - w : lx;
    text.setAttribute('x', x0 + 10);
    if (on.length) {
      const col = on[0].color;
      g.insertBefore(svgEl('rect', { class: 'tag-box', x: x0, y: ly - h / 2, width: w, height: h, stroke: col, 'stroke-opacity': 0.7 }), text);
      g.insertBefore(svgEl('rect', { x: x0, y: ly - h / 2, width: 3, height: h, fill: col, filter: 'url(#glow)' }), text);
      on.slice(0, chips).forEach((m, i) => g.appendChild(svgEl('rect', { x: x0 + 10 + tw + 6 + i * 9, y: ly - 3.5, width: 7, height: 7, fill: m.color })));
    }
    return { x0, w };
  }

  function paint() {
    const live = new Set(models.flatMap(m => (m.sites || []).map(s => s.slot)));
    const focus = selModel ? new Set(slotsOf(selModel)) : null;
    const labG = $('labels'); labG.replaceChildren();
    Object.keys(SLOTS).forEach(id => {
      const on = modelsOn(id);
      const g = $('slots').querySelector('[data-slot="' + id + '"]');
      const dim = !!focus && !focus.has(id);
      g.classList.toggle('has', on.length > 0);
      g.classList.toggle('dim', dim);
      g.querySelectorAll('.ring, .sel-ring').forEach(r => r.remove());
      const shapes = Array.from(g.querySelectorAll('.shape'));
      shapes.forEach(sh => { sh.style.fill = on.length ? on[0].color : ''; sh.style.stroke = on.length ? on[0].color : ''; });

      // Every further model on the same organ adds an outline ring around it in its own color.
      on.slice(1, 5).forEach((m, i) => {
        shapes.forEach(sh => {
          const b = sh.getBBox(), cx = b.x + b.width / 2, cy = b.y + b.height / 2, k = 1.16 + i * 0.16;
          const w = svgEl('g', { class: 'ring', transform: 'translate(' + cx + ' ' + cy + ') scale(' + k + ') translate(' + -cx + ' ' + -cy + ')' });
          const c = sh.cloneNode(false);
          c.setAttribute('class', ''); c.removeAttribute('style');
          c.setAttribute('fill', 'none'); c.setAttribute('stroke', m.color); c.setAttribute('stroke-width', 1.2);
          c.setAttribute('vector-effect', 'non-scaling-stroke');
          w.appendChild(c);
          g.insertBefore(w, g.firstChild);
        });
      });

      const a = anchorOf(g);
      if (a && selSlot === id) g.appendChild(svgEl('circle', { class: 'sel-ring', cx: a.x, cy: a.y, r: a.r + 10 }));

      const tag = drawTag(labG, id, on, dim);
      if (a && on.length) {
        const ly = SLOTS[id].lab[1], side = SLOTS[id].lab[2];
        const edge = side === 'l' ? tag.x0 + tag.w : tag.x0;
        const elbow = edge + (side === 'l' ? 16 : -16);
        const cls = 'lead' + (dim ? ' dim' : '');
        labG.insertBefore(svgEl('circle', { cx: a.x, cy: a.y, r: 2, fill: on[0].color, class: cls }), labG.firstChild);
        labG.insertBefore(svgEl('path', { class: cls, d: 'M' + a.x + ' ' + a.y + ' L' + elbow + ' ' + ly + ' L' + edge + ' ' + ly, stroke: on[0].color, 'stroke-opacity': 0.8 }), labG.firstChild);
      }
    });
    $('halo').classList.toggle('on', live.has('whole') && (!focus || focus.has('whole')));
    $('skinline').classList.toggle('on', live.has('skin') && (!focus || focus.has('skin')));
    $('hud2').textContent = models.length;
    $('hud3').textContent = isZh() ? '个模型' : (models.length === 1 ? 'model' : 'models');
  }

  // ---- the side panel

  function pickModel(path) { selModel = selModel === path ? null : path; selSlot = null; renderList(); paint(); renderDetail(); }
  function pickSlot(id) { selSlot = selSlot === id ? null : id; selModel = null; renderList(); paint(); renderDetail(); }

  function renderList() {
    const list = $('list'); list.replaceChildren();
    models.forEach(m => {
      const card = el('div', { class: 'model' + (selModel === m.path ? ' on' : '') });
      card.style.borderLeftColor = m.color;
      const dim = (selModel && selModel !== m.path) || (selSlot && !(m.sites || []).some(s => s.slot === selSlot));
      if (dim) card.classList.add('dim');
      const top = el('div', { class: 'top' });
      const chip = el('span', { class: 'chip' }); chip.style.background = m.color;
      top.appendChild(chip); top.appendChild(el('span', { class: 'name' }, titleOf(m)));
      card.appendChild(top);
      const sites = el('div', { class: 'sites' });
      if (m.error) sites.appendChild(el('span', { class: 'small mute' }, m.error));
      else if (!m.sites.length) sites.appendChild(el('span', { class: 'tag' }, T.unplacedShort));
      else m.sites.forEach(s => sites.appendChild(el('span', { class: 'tag' + (selSlot === s.slot ? ' hit' : '') }, label(s.slot))));
      card.appendChild(sites);
      card.addEventListener('click', () => pickModel(m.path));
      list.appendChild(card);
    });
  }

  function renderDetail() {
    const d = $('detail'); d.replaceChildren();
    if (selModel) {
      const m = models.find(x => x.path === selModel);
      d.style.display = '';
      d.appendChild(el('h3', null, titleOf(m)));
      d.appendChild(el('div', { class: 'small mute' }, m.path + (m.imports ? '  ·  ' + T.imports(m.imports) : '')));
      if (!m.sites.length) d.appendChild(el('p', { class: 'small' }, T.unplaced));
      const ul = el('ul');
      m.sites.forEach(s => {
        const li = el('li');
        li.appendChild(el('b', null, label(s.slot)));
        const bits = [];
        if (s.why.length) bits.push(T.words + ': ' + s.why.join(', '));
        if (s.via.length) bits.push(T.via(s.via.length));
        li.appendChild(el('span', { class: 'small mute' }, bits.length ? '  ' + bits.join('  ·  ') : ''));
        if (s.via.length) li.appendChild(el('div', { class: 'small mute' }, T.components + ': ' + s.via.join(', ')));
        ul.appendChild(li);
      });
      d.appendChild(ul);
    } else if (selSlot) {
      d.style.display = '';
      d.appendChild(el('h3', null, label(selSlot)));
      d.appendChild(el('div', { class: 'small mute' }, T.slotModels));
      const ul = el('ul');
      modelsOn(selSlot).forEach(m => {
        const s = m.sites.find(x => x.slot === selSlot);
        const li = el('li', null, titleOf(m));
        li.appendChild(el('span', { class: 'small mute' }, s.why.length ? '  ' + s.why.join(', ') : ''));
        ul.appendChild(li);
      });
      d.appendChild(ul);
    } else {
      d.style.display = 'none';
    }
  }

  function message(text) { $('msg').textContent = text; }

  function setTexts() {
    $('title').textContent = T.title; $('hud1').textContent = isZh() ? '人体扫描' : 'BODY SCAN';
    if (!models.length) message(T.none);
  }

  // ---- data

  async function refresh(list) {
    const my = ++token;
    if (!list.length) { models = []; selModel = selSlot = null; renderList(); paint(); renderDetail(); message(T.none); return; }
    message(T.loading);
    let res;
    try {
      const r = await fetch('/api/plugins/' + PLUGIN_ID + '/locate', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ inputs: { paths: list.map(m => m.path) } })
      });
      res = await r.json();
    } catch (e) { if (my === token) message(T.fail + e.message); return; }
    if (my !== token) return;
    if (!res.success) { message(T.fail + (res.error || res.detail || 'unknown error')); return; }
    models = res.models.map((m, i) => Object.assign({}, m, { color: COLORS[i % COLORS.length], sites: m.sites || [] }));
    if (selModel && !models.some(m => m.path === selModel)) selModel = null;
    renderList(); paint(); renderDetail();
    message(res.truncated ? T.truncated : T.hintSel);
  }

  let lastKey = '', debounce = 0;
  window.addEventListener('message', e => {
    if (!e.data || e.data.type !== 'lm-init') return;
    applyTheme(e.data.theme); T = pick(e.data.lang); setTexts(); renderList(); paint(); renderDetail();
    // The tree ticks win; with none ticked the single selected model is shown, so the page is never empty by accident.
    let list = Array.isArray(e.data.models) ? e.data.models : [];
    if (!list.length && e.data.model) list = [e.data.model];
    const key = list.map(m => m.path).join('|');
    if (key !== lastKey) { lastKey = key; clearTimeout(debounce); debounce = setTimeout(() => refresh(list), 150); }
  });

  buildDoll(); setTexts(); paint();
  parent.postMessage({ type: 'lm-ready' }, '*');
})();
</script>
</body>
</html>
