# Which organ slot, and which everyday input, a model belongs to. A model is placed on a slot when one of the slot's keywords
# is a word of the model's tags, its path or its name. Words are the pieces left after splitting on
# anything that is not a letter or digit, so `glucose_insulin_2026` gives `glucose`, `insulin`, `2026`.
# A keyword ending in `*` matches every word that starts with it. The first matching slot is not
# special: a model lights up every slot it matches.
# Add a keyword here to move a model, or a slot to the page's catalog in dist/index.html to add an organ.

