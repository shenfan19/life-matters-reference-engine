# Birth cards. A card is the starting situation of a life: a set of inputs for the body model, the limits that
# the player's spending cannot push past, a handful of livelihood points, and the chance of living through childhood.
#
# Every number here is a hand-set value of an order of magnitude. `survive_to_adult` is the one lookup of the
# plugin: the body model starts at age 18, so childhood is a single chance and not a simulation.
#
# baseline: inputs of the body model that this card sets. The ones left out keep the model default.
# limit:    the best value the player can reach for an input by spending, in the direction of better health.
#           An input left out here has no limit other than the lever's own target.
# income:   livelihood points per phase for light, steady and heavy work.
# tags:     the events a card can meet are chosen by these words.
# weight:   the chance of the card in a random draw, relative to the other cards of the same world.

cards:
  medieval_europe_peasant:
    world: history
    weight: 1.0
    pack_only: false
    tags: [agrarian, premodern, war_prone]
    survive_to_adult: 0.62
    work_profile: manual
    income: [4, 5, 7]
    title: {en: Peasant in medieval Europe, zh: 中世纪欧洲农民}
    story:
      en: A village of a few dozen households. The well is shared with the animals, winter means bread and little else, and the nearest healer is a day away.
      zh: 几十户人家的村子。水井和牲畜共用，冬天只有面包，最近的医者要走一天。
    baseline:
      dietary_restraint: 0.0
      medical_era: 0.0
      aerobic_min: 60
      resistance_min: 15
      diet_quality: 0.35
      fiber_g: 35
      sodium_g: 5
      water_l: 2.0
      water_safety: 0.4
      crowding: 0.4
      vector_exposure: 0.05
      vitamin_c_mg: 30
      energy_intake: 2500
      alcohol_g: 20
      stress_load: 0.4
      injury_exposure: 0.1
    limit:
      medical_era: 0.25
      water_safety: 0.65
      crowding: 0.2
      vector_exposure: 0.03
      vitamin_c_mg: 60
      diet_quality: 0.55
      sleep_hours: 8.0
      aerobic_min: 60
      resistance_min: 15
    calibration: {level: set_value, note: environment taken from the historical weekly scenario of the model library}

