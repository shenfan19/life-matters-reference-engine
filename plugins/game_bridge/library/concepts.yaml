# The vocabulary of the game bridge.
#
# A concept is a game-neutral quantity that a model can provide and a game can read or write. A readout runs from 0 to 1 and
# a larger value is worse or more burden, a game that prefers "satisfied" flips it. A handle is something that is put into the
# body or the person: a game writes it, or another model provides it. A context is given by the scenario and does not change with the step.
#
# combine       how several models that each give a readout a variable are joined: replace allows one provider, max takes the largest
# rate_combine  how the rates that several models give a readout are joined: sum_rate adds them, product multiplies them
# Add a concept only when a model provides it or a game consumes it. The vocabulary stays small on purpose.
vocabulary_version: 1

concepts:
  # ---- readouts: body
  hydration_deficit:
    domain: body
    role: readout
    description: Shortage of body water. 0 is well hydrated, 1 is the extreme.
  energy_deficit:
    domain: body
    role: readout
    description: Shortage of food energy. 0 is satisfied, 1 is starving.
  fatigue:
    domain: body
    role: readout
    combine: max
    description: Tiredness from effort and lack of rest.
  glycemic_level:
    domain: body
    role: readout
    description: Blood glucose, scaled from a low-normal to a clearly high value.
  blood_pressure_level:
    domain: body
    role: readout
    description: Blood pressure, scaled from normal to a clearly high value.
  mobility_loss:
    domain: body
    role: readout
    description: Loss of the ability to move, from joints, muscles or nerves.
  infection_burden:
    domain: body
    role: readout
    combine: max
    description: How much infection the body carries and how ill it makes the person.
  injury_burden:
    domain: body
    role: readout
    combine: max
    description: Lasting damage from injury.
  frailty:
    domain: body
    role: readout
    description: Overall loss of reserve. Models mostly give it a rate, not a variable.

  # ---- readouts: mind
  mood_valence:
    domain: mind
    role: readout
    description: How bad the mood is. 0 is good, 1 is the worst. Models mostly give it a rate.
  psychological_strain:
    domain: mind
    role: readout
    combine: max
    description: Stress, homesickness and the weight of circumstances.
  loneliness:
    domain: mind
    role: readout
    description: Lack of company felt by the person.

  # ---- handles: put into the person
  food_intake:
    domain: body
    role: handle
    description: Food eaten at a meal, in grams.
  carb_intake:
    domain: body
    role: handle
    description: Carbohydrate reaching the gut, in grams per step as the consuming model expects.
  fluid_intake:
    domain: body
    role: handle
    description: Fluid drunk.
  activity_load:
    domain: body
    role: handle
    description: Physical effort.
  medication_dose:
    domain: body
    role: handle
    description: Dose of the medicine a model is built around.
  social_contact:
    domain: mind
    role: handle
    description: Time spent with others.

  # ---- context: given by the scenario
  pathogen_exposure:
    domain: body
    role: context
    description: Intensity of exposure to a pathogen, worked out by the game for a place and a time.
  social_recognition:
    domain: society
    role: context
    description: How far the society of a time and place recognises the person, for example by sex. The game picks the parameter set.
