type: model
category: dynamics

metadata:
  name: "newton_study"
  version: "1.0.0"
  author: "Life Matters"
  description: "牛顿奇迹年生理-认知模型（1665-1667）。整合心智疲劳、研究强度、洞见积累与健康的动态关系。基于认知负荷理论与历史记录：牛顿长时间高强度工作、忽视饮食睡眠、因烛光实验损伤视力。"
  tags: [cognition, fatigue, study, historical, newton]
  source: >
    Westfall RS (1980) Never at Rest: A Biography of Isaac Newton.
    Stukeley W (1752) Memoirs of Sir Isaac Newton's Life.
    认知负荷理论 (Sweller 1988); 睡眠剥夺与认知 (Harrison & Horne 2000).

variables:
  # ── 从食物模型引入 ─────────────────────────────────────────────────────────
  nutrition:
    type: state
    value: 60.0
    unit: "分"
    bounds: [0, 100]
    io_role: input
    description: "营养状态（来自饮食模型）"

  hydration:
    type: state
    value: 65.0
    unit: "分"
    bounds: [0, 100]
    io_role: input
    description: "水分状态"

  # ── 研究行为输入 ────────────────────────────────────────────────────────────
  study_intensity:
    type: input
    value: 0.0
    unit: "强度"
    bounds: [0.0, 3.0]
    description: >
      研究强度等级：
      0 = 休息/农务
      1 = 轻度阅读/思考（苹果树下漫步）
      2 = 集中推导（微积分、引力）
      3 = 深度实验（棱镜、连续多小时不间断）

  candle_study:
    type: input
    value: 0.0
    unit: "小时"
    bounds: [0.0, 6.0]
    description: "烛光下工作时间（眼部疲劳主要来源，牛顿常至深夜）"

  outdoor_time:
    type: input
    value: 0.0
    unit: "小时"
    bounds: [0.0, 8.0]
    description: "户外活动时间（苹果园、田间，降低鼠疫风险，恢复精神）"

  sleep_quality:
    type: input
    value: 0.7
    unit: "系数"
    bounds: [0.0, 1.0]
    description: "睡眠质量系数（0=严重失眠, 1=良好恢复）"

  # ── 核心状态变量 ────────────────────────────────────────────────────────────
  health:
    type: state
    value: 85.0
    unit: "分"
    bounds: [0, 100]
    io_role: output
    description: "身体健康（鼠疫威胁、营养不良、过劳的综合体现）"

  fatigue:
    type: state
    value: 20.0
    unit: "分"
    bounds: [0, 100]
    io_role: output
    description: "心智疲劳（高→效率下降，健康受损；睡眠和户外恢复）"

  eye_strain:
    type: state
    value: 0.0
    unit: "分"
    bounds: [0, 100]
    io_role: output
    description: "眼部疲劳（烛光工作+棱镜实验累积；恢复慢，高度时影响健康）"

  insight:
    type: state
    value: 0.0
    unit: "分"
    bounds: [0, 100]
    io_role: output
    description: "科学洞见积累（目标100分=完成奇迹年核心发现）"

  plague_risk:
    type: state
    value: 15.0
    unit: "分"
    bounds: [0, 100]
    description: "鼠疫感染风险（户外接触、贸易路线；伍尔斯索普比剑桥低）"

# ── 核心动力学公式 ────────────────────────────────────────────────────────────
formulas:
  # 1. 研究产生洞见（核心公式）
  # 效率受疲劳和营养双重调制：
  #   fatigue > 70 → 效率减半；nutrition < 30 → 效率降低
  insight_gain:
    description: "研究产生洞见：强度×效率系数×步长"
    condition: study_intensity > 0
    priority: 10
    dynamics:
      insight: >
        min(100, insight
          + study_intensity
          * max(0.2, (1 - fatigue / 120))
          * max(0.4, nutrition / 80)
          * 0.08
          * step_size)
      fatigue: "min(100, fatigue + study_intensity * 0.05 * step_size)"

  # 2. 眼部疲劳（烛光工作）
  eye_strain_accumulate:
    description: "烛光下工作加重眼部疲劳（牛顿曾用针刺眼眶研究光）"
    condition: candle_study > 0
    priority: 8
    dynamics:
      eye_strain: "min(100, eye_strain + candle_study * 8)"

  # 3. 眼部疲劳影响洞见和健康（高度疲劳时）
  eye_strain_penalty:
    description: "眼部疲劳超过60分时影响工作效率和健康"
    condition: eye_strain >= 60
    priority: 7
    dynamics:
      health:   "max(0, health - (eye_strain - 60) * 0.002 * step_size)"
      insight:  "max(0, insight - (eye_strain - 60) * 0.0005 * step_size)"

  # 4. 户外活动恢复
  outdoor_recovery:
    description: "户外活动（苹果园）恢复疲劳，降低鼠疫风险（新鲜空气）"
    condition: outdoor_time > 0
    priority: 9
    dynamics:
      fatigue:     "max(0, fatigue - outdoor_time * 5)"
      eye_strain:  "max(0, eye_strain - outdoor_time * 3)"
      plague_risk: "max(5, plague_risk - outdoor_time * 1)"

  # 5. 睡眠恢复（每日结算）
  sleep_recovery:
    description: "夜间睡眠恢复（伍尔斯索普乡间较安静，睡眠通常比剑桥好）"
    condition: sleep_quality > 0
    priority: 6
    dynamics:
      fatigue:    "max(0, fatigue - sleep_quality * 30)"
      eye_strain: "max(0, eye_strain - sleep_quality * 10)"
      health:     "min(100, health + sleep_quality * 2)"

  # 6. 营养不良削弱健康
  malnutrition_penalty:
    description: "长期营养不足（<30分）加速健康损耗"
    condition: nutrition < 30
    priority: 5
    dynamics:
      health: "max(0, health - (30 - nutrition) * 0.003 * step_size)"

  # 7. 脱水影响
  dehydration_penalty:
    description: "脱水（<25分）影响认知和健康"
    condition: hydration < 25
    priority: 5
    dynamics:
      health:  "max(0, health - 0.005 * step_size)"
      fatigue: "min(100, fatigue + 0.003 * step_size)"

  # 8. 鼠疫威胁（基础健康损耗）
  plague_pressure:
    description: "1665年大瘟疫背景性健康威胁（伍尔斯索普相对安全但不为零）"
    condition: true
    priority: 4
    dynamics:
      health:      "max(0, health - plague_risk * 0.0002 * step_size)"
      plague_risk: "max(5, plague_risk - 0.001 * step_size)"

  # 9. 过度疲劳崩溃
  exhaustion_collapse:
    description: "严重过劳（fatigue>85）导致健康快速下降"
    condition: fatigue >= 85
    priority: 11
    dynamics:
      health: "max(0, health - 0.008 * step_size)"

  # 10. 健康影响学习效率（循环）
  health_cognitive_link:
    description: "健康状态影响认知能力（病重时无法有效思考）"
    condition: health < 40
    priority: 3
    dynamics:
      insight: "max(0, insight - (40 - health) * 0.0003 * step_size)"

simulation:
  step_size: 1
  time_unit: minute
  total_time: 1440
  output_variables: [fatigue, eye_strain, insight, health]
