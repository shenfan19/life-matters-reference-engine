type: model
category: intervention

metadata:
  name: "banana"
  version: "1.0.0"
  author: "Antigravity"
  description: "标准香蕉营养模型。每100g含：碳水化合物 23g, 蛋白质 1.1g, 脂肪 0.3g, 水分 75g。"
  tags: [food, diet, fruit]

variables:
  # ========== 输入变量 ==========
  banana_intake:
    type: input
    value: 0
    unit: "g"
    bounds: [0, 1000]
    io_role: input
    optimizable: true
    description: "摄入香蕉的重量"

  # ========== 输出指标 (供 nutrition_intake 使用) ==========
  food_carbohydrate:
    type: state
    value: 0
    unit: "g"
    io_role: output
    description: "产生的碳水化合物摄入量"

  food_protein:
    type: state
    value: 0
    unit: "g"
    io_role: output
    description: "产生的蛋白质摄入量"

  food_fat:
    type: state
    value: 0
    unit: "g"
    io_role: output
    description: "产生的脂肪摄入量"

  water_intake:
    type: state
    value: 0
    unit: "ml"
    io_role: output
    description: "产生的水分摄入量"

formulas:
  calculate_nutrition_impact:
    condition: banana_intake > 0
    priority: 1
    dynamics:
      food_carbohydrate: "banana_intake * 0.23"
      food_protein: "banana_intake * 0.011"
      food_fat: "banana_intake * 0.003"
      water_intake: "banana_intake * 0.75"
      banana_intake: 0 # 摄入后清零，作为单次事件处理
