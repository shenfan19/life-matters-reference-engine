metadata:
  name: obesity
  version: 1.0.0
  author: AI Assisted Generator
  description: 肥胖增加糖尿病风险的动态模型，基于医学论文中的多阶段模型和时间依赖效应。
  conflicts: []
  tags: [obesity, diabetes, risk_model]

variables:
  obesity_index:
    description: 肥胖指数 (0=正常, 1=轻度肥胖, 2=中度, 3=重度)
    value: 0.0
    unit: 指数级别
    type: state
    bounds: [0.0, 3.0]

  exposure_duration:
    description: 暴露持续时间（分钟），用于时间依赖计算
    value: 0.0
    unit: 分钟
    type: state
    bounds: [0.0, 100000.0]

formulas:
  obesity_increase:
    description: 高血糖和胰岛素促进脂肪储存
    condition: blood_glucose > 120 or plasma_insulin > 20
    priority: 3
    dynamics:
      obesity_index: min(1.0, obesity_index + 0.0003 * dt)

  risk_accumulation:
    description: 肥胖指数导致糖尿病风险累积增加，受时间影响
    condition: obesity_index > 0
    priority: 100
    dynamics:
      diabetes_risk: min(1.0, diabetes_risk + (0.0002 * obesity_index * exposure_duration / 1000) * dt)
      exposure_duration: exposure_duration + dt

  risk_decay:
    description: 正常体重时风险缓慢衰减（模拟减肥效果）
    condition: obesity_index == 0 and diabetes_risk > 0
    priority: 90
    dynamics:
      diabetes_risk: max(0.01, diabetes_risk - 0.0001 * dt)