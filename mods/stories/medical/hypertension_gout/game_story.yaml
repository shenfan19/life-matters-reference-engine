meta:
  name: hypertension_gout
  description: 高血压合并痛风联合动力学模型（场景A5）。 核心学术案例：ESC降压指南与ACR痛风指南是两套独立存在、互相矛盾的临床指南。 噻嗪类利尿剂（一线降压药）会显著升高尿酸；
    减肥可同时改善两者，但减肥过快（酮体竞争排泄）反而升高尿酸； 部分低嘌呤食物（乳制品）可降尿酸但可能升血压。 没有医生能用"经验"给出精确的数值权衡答案。
    抗质疑强度：⭐⭐⭐⭐（两套指南互相矛盾是事实，不可否认）
  author: ""
  difficulty: easy
  period_start: "2021"
  period_end: ""
  country: World
  tags: [Medicine, Cardiovascular]
  card_back_fate: ""
  card_back_player: ""
  music: []
  science_note: '高血压合并痛风联合动力学模型（场景A5）。 核心学术案例：ESC降压指南与ACR痛风指南是两套独立存在、互相矛盾的临床指南。 噻嗪类利尿剂（一线降压药）会显著升高尿酸；
    减肥可同时改善两者，但减肥过快（酮体竞争排泄）反而升高尿酸； 部分低嘌呤食物（乳制品）可降尿酸但可能升血压。 没有医生能用"经验"给出精确的数值权衡答案。
    抗质疑强度：⭐⭐⭐⭐（两套指南互相矛盾是事实，不可否认）

    来源：Williams B et al；FitzGerald JD et al；Law MR, Wald NJ, Morris JK (2003) Use
    of blood pressure lowering drugs in the prevention of cardiovascular disease

