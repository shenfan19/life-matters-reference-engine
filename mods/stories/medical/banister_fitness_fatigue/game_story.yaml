meta:
  name: banister_fitness_fatigue
  description: Banister双分量适应-疲劳模型（场景B3）：量化运动训练对运动表现的动态影响。 适应分量（Fitness）与疲劳分量（Fatigue）均由训练负荷驱动，但以不同时间常数衰减。
    表现 = 基线 + k₁·适应 - k₂·疲劳。 核心冲突：高训练负荷快速积累适应，但同时积累的疲劳会掩盖表现提升甚至造成过度训练。 最优训练分配（强度×频率×恢复）不是直觉可得的。
    推荐作为Paper 1的验证案例（
  author: ""
  difficulty: easy
  period_start: "2003"
  period_end: ""
  country: World
  tags: [Science, Sports]
  card_back_fate: ""
  card_back_player: ""
  music: []
  science_note: 'Banister双分量适应-疲劳模型（场景B3）：量化运动训练对运动表现的动态影响。 适应分量（Fitness）与疲劳分量（Fatigue）均由训练负荷驱动，但以不同时间常数衰减。
    表现 = 基线 + k₁·适应 - k₂·疲劳。 核心冲突：高训练负荷快速积累适应，但同时积累的疲劳会掩盖表现提升甚至造成过度训练。 最优训练分配（强度×频率×恢复）不是直觉可得的。
    推荐作为Paper 1的验证案例（有经典模型对照，抗质疑强度⭐⭐⭐⭐⭐）。

    来源：Banister EW, Calvert TW, Savage MV, Bach TM (1975) A systems model of training
    for athletic performance；Morton RH, Fitz-Clarke JR, Banister EW (1990) Modeling
    human performance in running；Busso T (2003) Variable dose-response relationship
    between exercise training and performance

    [Converter: fitness_dynamics→Type3; fatigue_dynamics→(disabled); performance_calc→(disabled)]'
  version: '0.1'
  created_on: 2026-03-23
initial_state:
  fitness_component: 0.0
  performance: 50.0
variable_display:
  fitness_component:
    label: 适应
    color: '#52c41a'
    max: 100
  performance:
    label: 表现
    color: '#1677ff'
    max: 100
health_mapping:
  source_variable: fitness_component
  scale:
  - 0
  - 100
  - 0
  - 100
  display: 适应
turns:
  total: 12
  time_per_turn: 1 month
  env_cards_per_turn: 2
  player_hand_size: 3
  action_points: 3
win_condition:
  type: custom
  description: 适应性达标
lose_condition:
  type: custom
  description: 表现崩溃
endings:
- grade: A
  condition: fitness_component >= 80
  title: 目标达成
  description: 适应性达标
- grade: D
  condition: performance <= 10
  title: 失败
  description: 表现崩溃
env_deck:
- path: cards/env_fitness_dynamics.yaml
  weight: 200
player_deck:
- path: cards/player_increase_training_load.yaml
- path: cards/player_decrease_training_load.yaml
generic_cards:
  inject:
  - rest
  - interrupt
