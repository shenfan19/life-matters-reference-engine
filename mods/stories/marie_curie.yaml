type: story
name: 玛丽·居里：科学之光
category: Historical
description: 追随玛丽·居里的足迹，从华沙到巴黎，探索放射性的奥秘，领略一代科学巨匠的非凡人生。
difficulty: Hard
levels:
  - id: 1
    title: 1898: 镭的发现
    description: 在简陋的棚屋实验室中提炼矿石，面对极高的辐射风险，开启放射性研究的新纪元。
    difficulty: Easy
    period: Sorbonne
  - id: 2
    title: 1903: 诺贝尔荣誉
    description: 在学术界的歧视与家庭压力中寻找平衡，坚持真理，最终获得世界最高的科学荣誉。
    difficulty: Medium
    period: Paris
  - id: 3
    title: 1914: 战地X光机
    description: 在一战战场建立流动医疗队，将科学转化为救人技术，用智慧温暖冰冷的战场。
    difficulty: Hard
    period: Mobile Labs
