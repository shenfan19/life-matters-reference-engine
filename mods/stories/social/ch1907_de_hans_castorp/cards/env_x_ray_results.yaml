id: env_x_ray_results
type: env
category: medical
display:
  name: "X光检查结果"
  description: "贝伦斯医生把X光片举起来，指着他的肺部说：这里有一个浸润点，不严重，但需要继续观察。汉斯看着那张片子，看见了他自己的肺，感觉这场疗养又延长了。"
  flavor: "X光是一种奇怪的技术：它让你看见了你的内部，却没有让你感觉更好。"
  icon: "🔆"
effects:
  - target: health
    delta: -10
  - target: world_disconnect
    delta: 8
channel: medical
tags: [x_ray, tuberculosis, diagnosis]
source:
  variable: health
  formula: "x_ray_bad_result: health-10（病情继续）; world_disconnect+8（继续留在魔山）"
  pattern_detected: ENV_NEGATIVE
  sim_notes: "X光结果不佳：health-10，world_disconnect+8"
