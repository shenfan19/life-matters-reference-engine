meta:
  name: "汉斯·卡斯托普：魔山上的时间"
  description: "他去瑞士疗养院探望表兄，原计划三周。他留了七年。疗养院有奇特的时间感——疾病让每一天都变得无限长，也让整个青春转瞬即逝。窗外，欧洲正在滑向1914年。"
  difficulty: medium
  period_start: "1907-08"
  period_end: "1914-08"
  tags: [Tuberculosis, Sanatorium, Time, Europe, Literature]
  country: CH
  author: ""
  version: "0.1"
  created_on: 2026-04-16
  source_scenario: "scenarios/social/ch1907_de_hans_castorp.yaml"

card_back_fate:   ""
card_back_player: ""

music: []

initial_state:
  health:           45
  intellectual_depth: 20
  world_disconnect: 20
  time_sense:       30

variable_display:
  health:
    label: "肺结核状态"
    color: "#52c41a"
    max: 100
    higher_is_better: true
  intellectual_depth:
    label: "思想深度"
    color: "#1677ff"
    max: 100
    higher_is_better: true
  world_disconnect:
    label: "与世界的疏离"
    color: "#722ed1"
    max: 100
    higher_is_better: false
  time_sense:
    label: "时间感扭曲"
    color: "#faad14"
    max: 100
    higher_is_better: false

health_mapping:
  source_variable: health
  scale: [0, 100, 0, 100]
  display: "肺结核状态"

turns:
  total: 14
  time_per_turn: "6个月"
  env_cards_per_turn: 2
  player_hand_size: 5
  action_points: 2
  draw_per_turn: 2

win_condition:
  type: reach_target
  target_variable: health
  target_value: 75
  description: "真正从肺结核中康复，带着积累的思想回到山下的世界"

lose_condition:
  type: variable_threshold
  variable: world_disconnect
  threshold: 90
  description: "他再也无法适应山下的世界。他永远留在了魔山上，直到战争的炮声把他惊醒——太晚了。"

endings:
  - grade: S
    condition: "health >= 75 and intellectual_depth >= 60"
    title: "下山"
    description: "他下山了。他带着七年的思考，和一副比来时更强健的肺。他回到了那个将要爆炸的世界。"
  - grade: A
    condition: "health >= 65 and world_disconnect < 60"
    title: "炮声"
    description: "1914年8月，炮声把他从疗养院的椅子上惊起。他下了山，走进了泥泞的战壕。"
  - grade: B
    condition: "intellectual_depth >= 60"
    title: "魔山的哲学"
    description: "他没有康复，但他想明白了很多事。疾病是一种教育，代价有点高。"
  - grade: D
    condition: "world_disconnect >= 90 or health <= 0"
    title: "永远的疗养"
    description: "他从来没有离开过魔山。战争结束后，有人在某个山间疗养院找到了他的名字，在一块木牌上。"

env_deck:
  - path: cards/env_settembrini_lectures.yaml
    weight: 160
  - path: cards/env_naphta_debates.yaml
    weight: 150
  - path: cards/env_x_ray_results.yaml
    weight: 180
  - path: cards/env_patient_dies.yaml
    weight: 170
  - path: cards/env_war_news_arrives.yaml
    weight: 120
  - path: cards/env_snow_walk.yaml
    weight: 90

player_deck:
  - path: cards/player_follow_treatment.yaml
    copies: 4
  - path: cards/player_join_debate.yaml
    copies: 3
  - path: cards/player_write_to_family.yaml
    copies: 3
  - path: cards/player_walk_outside.yaml
    copies: 3
  - path: cards/player_rest_in_sun.yaml
    copies: 3

generic_cards:
  inject: [rest, interrupt]
