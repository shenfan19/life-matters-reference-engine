meta:
  name: "玛丽·居里：科学之光"
  description: "1898年巴黎，居里夫人在简陋的棚屋里提炼放射性物质。辐射正在侵蚀她的身体，学术界的偏见阻碍着她的研究。用智慧和意志，完成放射性研究的历史性突破。"
  difficulty: hard
  tags: [Science, Women, 19th Century]
  period_start: "1898"
  period_end: "1906"
  country: France
  author: ""
  version: "0.1"
  languages: [zh-CN, en]
  created_on: 2026-03-23
  source_scenario: ""
  card_back_fate:   assets/card_back_fate.jpg
  card_back_player: assets/card_back_player.jpg
  music:
    - assets/sonatas_k-005_(c)sankey.mid
    - assets/sonatas_k-006_(c)sankey.mid

initial_state:
  health: 100
  money: 40
  radiation: 0
  research_progress: 0

health_mapping:
  source_variable: health
  scale: [0, 100, 0, 100]
  display: "生命值"

turns:
  total: 15
  time_per_turn: "1 month"
  env_cards_per_turn: 2
  player_hand_size: 4   # H=4: 受限科学家，性别歧视压缩选项空间
  action_points: 2      # p=2: 研究节奏稳定但受制约
  draw_per_turn: 2      # a=2: b=H-a=2，有基本战略纵深

win_condition:
  type: reach_target
  target_variable: research_progress
  target_value: 100
  description: "研究进度达到 100，完成放射性研究突破"

lose_condition:
  type: health_zero
  description: "生命值归零，倒在了科学的道路上"

endings:
  - grade: S
    condition: "health >= 60 and research_progress >= 100"
    title: "科学的胜利"
    description: "以健康之躯完成了历史性发现，两度诺贝尔奖实至名归。"
  - grade: A
    condition: "health > 0 and research_progress >= 100"
    title: "带伤的突破"
    description: "付出了沉重的健康代价，但放射性的秘密终于揭开。"
  - grade: D
    condition: "health <= 0"
    title: "未竟的使命"
    description: "科学的烛火还未燃尽，身体却先倒下了。"

env_deck:
  - path: cards/env_radiation_damage.yaml
    weight: 300
  - path: cards/env_discrimination.yaml
    weight: 150
  - path: cards/env_funding_cut.yaml
    weight: 120
  - path: cards/env_lab_accident.yaml
    weight: 80
  - path: cards/env_acute_radiation.yaml
    weight: 60

player_deck:
  - path: cards/player_research.yaml
    copies: 3
  - path: cards/player_teaching.yaml
    copies: 3
  - path: cards/player_rest.yaml
    copies: 3
  - path: cards/player_fundraise.yaml
    copies: 3
  - path: cards/player_publish.yaml
    copies: 3
  - path: cards/player_lecture.yaml
    copies: 3

generic_cards:
  inject: [rest, interrupt]
