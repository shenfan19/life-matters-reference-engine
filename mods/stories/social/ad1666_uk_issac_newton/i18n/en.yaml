meta:
  name: "Isaac Newton: Under the Apple Tree"
  description: "1665. The plague has shuttered Cambridge. The young Newton retreats to Woolsthorpe Manor. In two years of isolation he invents calculus, discovers gravity, and unravels light. One man, alone, reshapes humanity's understanding of the universe."
  science_note: >
    Based on cognitive load theory (Sweller 1988) and historical biography (Westfall 1980).
    Insight gain formula: insight_gain = study_intensity × (1 − fatigue/120) × (nutrition/80).
    Fatigue and nutrition together modulate research efficiency — mirroring Newton's documented
    habit of forgetting meals while deep in thought. Neglecting food reduces cognitive output,
    creating a counter-intuitive negative feedback. Optimise the Pareto frontier of research
    intensity vs. rest and diet under plague constraints and a tight budget.

variable_display:
  health:
    label: "Health"
  nutrition:
    label: "Nutrition"
  fatigue:
    label: "Mental Fatigue"
  money:
    label: "Money"
  insight:
    label: "Scientific Insight"

win_conditions:
  - message: "【Annus Mirabilis】In peak health you complete the miracle years, laying every theoretical foundation for the Principia. Posterity will call these two years the most individually productive period in the history of human intellect."
  - message: "【Exhausted Genius】Utterly spent, yet those ideas are now written into human history. Newton spent the next twenty years before publishing — perhaps because he was too tired."
  - message: "【Half-Finished Revolution】Some core discoveries are in place, but more time is needed. Leibniz would independently find calculus — history does not wait."

lose_conditions:
  - message: "【Unfinished Principia】The apple fell, but no one recorded what it meant. The manuscripts slept in the attic; the world waited another hundred years."

cards:
  player_contemplation:
    name: "Contemplation Under the Apple Tree"
    flavor: "\"Why should the apple fall downward rather than upward or sideways?\" That question changed physics."
  player_calculus:
    name: "Develop the Method of Fluxions"
    flavor: "Leibniz would later find the same thing independently — but Newton arrived first."
  player_prism:
    name: "Prism Optics Experiment"
    flavor: "\"White is not pure — it is the superposition of all colours.\" 1666."
  player_write:
    name: "Write the Manuscripts"
    flavor: "The Principia was written in Latin, deliberately obscure, \"lest mathematical smatterers dispute me.\""
  player_correspondence:
    name: "Correspondence"
    flavor: "Barrow would later voluntarily vacate the Lucasian Chair for the student who surpassed him."
  player_rest:
    name: "Rest at the Manor"
    flavor: "Sometimes the best thinking happens when you stop thinking."
  player_eat_bread:
    name: "Eat Rye Bread"
    flavor: "In 1665 rural England, rye bread was the staple of rich and poor alike."
  player_eat_pottage:
    name: "Eat Pottage"
    flavor: "The kitchen at Woolsthorpe Manor made this every day. Newton's mother Hannah prepared it for him."
  player_drink_ale:
    name: "Drink Small Beer"
    flavor: "In 1665, drinking water was extremely risky. 'Small beer' was the everyday drink of children and adults alike."
  player_eat_meat:
    name: "Eat Salt Pork"
    flavor: "Salt-cured pork was the main way to store meat in 17th-century rural England — one pig could feed a family for half a year."
  env_trinity_stipend:
    name: "Trinity College Stipend"
    description: "Even though Cambridge closed due to plague, Trinity College continued to pay scholars their monthly stipend. Newton received about £13 per year."
    science: "Historical note: Newton became a Scholar of Trinity in 1664 (salary ~£13/yr). Cambridge closed June 1665; stipend payments continued to 1667. £13/yr ≈ 22s/month ≈ money +2/turn (0–30 scale). Source: Westfall (1980) Never at Rest, Ch. 3."
  env_plague:
    name: "The Great Plague"
    description: "The 1665 plague sweeps England; Cambridge is forced to close. News arrives from the south — the death toll keeps rising."
    science: "Those two years of loneliness became the richest of his life."
  env_poverty:
    name: "Straitened Circumstances"
    description: "Income from his mother's farm is limited; books and equipment are luxuries. Food is barely adequate."
    science: "He wrote the equations that changed the world in the margins of a blank ledger-book."
  env_isolation:
    name: "Deep Isolation"
    description: "Cut off from Cambridge, no one to share new ideas with; thought sometimes hits dead ends, and fatigue has no social outlet."
    science: "Solitude is a double-edged sword — both gift and curse."
  env_eyestrain:
    name: "Eye Strain"
    description: "Hours staring at prism experiments and candlelit manuscripts leave his eyes in constant pain, making long work sessions impossible."
    science: "He once inserted a needle behind his eyeball to study light — scientific passion sometimes exceeded reason."
  env_academic_rivalry:
    name: "Academic Dispute"
    description: "News of the debate with Hooke over optical theory reaches the countryside, shaking his confidence and draining his focus."
    science: "Hooke said light is a wave; Newton said light is particles. The truth was yet to be decided."
  env_forgot_to_eat:
    name: "Forgot to Eat"
    description: "Lost in derivations, Newton has missed another meal — the third time this month. The tray his servant brought has gone cold."
    science: "Records show Newton often stood at the dinner table working through a problem, only to find it was midnight when he came back to himself."
