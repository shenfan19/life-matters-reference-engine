id: env_community_needs
type: env
category: opportunity
display:
  name: "社区的需要"
  description: "一个穷困的家庭，一个需要帮助的工人，一个生病的孩子——这座城市里有无数这样的角落。他每次路过，都会停下来。这是他能做的事，也是他选择一直做的事。"
  flavor: "他积累的财富，不是他自己的，是他分发出去的。"
  icon: "🤲"
effects:
  - target: community_trust
    delta: 15
  - target: redemption_progress
    delta: 8
channel: opportunity
tags: [community, charity, trust]
source:
  variable: community_trust
  formula: "community_need: community_trust+15（社区信任建立）; redemption_progress+8（善行积累）"
  pattern_detected: ENV_POSITIVE
  sim_notes: "社区需要：community_trust+15，redemption_progress+8"
