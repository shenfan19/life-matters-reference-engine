meta:
  name: "卖火柴的小女孩：新年前夜"
  description: "新年夜，她赤脚站在雪地里。没有人买她的火柴。她不敢回家。寒冷越来越深。每划一根火柴，就有一个幻觉——烤鹅，圣诞树，奶奶。在最后一根火柴的光里，她看见奶奶带她飞走了。"
  difficulty: medium
  period_start: "1845-12-31"
  period_end: "1846-01-01"
  tags: [Poverty, Child, Cold, Literature, Europe]
  country: DK
  author: ""
  version: "0.1"
  created_on: 2026-04-16
  source_scenario: "scenarios/social/eu1800_dk_little_match_girl.yaml"

card_back_fate:   ""
card_back_player: ""

music: []

initial_state:
  body_temperature: 80   # 游戏内缩放：80=35.5°C，0=20°C，100=37°C
  coins_earned:     0
  matches_remaining: 80
  hope:             40

variable_display:
  body_temperature:
    label: "体温"
    color: "#52c41a"
    max: 100
    higher_is_better: true
  coins_earned:
    label: "卖出收入"
    color: "#faad14"
    max: 100
    higher_is_better: true
  matches_remaining:
    label: "剩余火柴"
    color: "#1677ff"
    max: 100
    higher_is_better: true
  hope:
    label: "希望感"
    color: "#722ed1"
    max: 100
    higher_is_better: true

health_mapping:
  source_variable: body_temperature
  scale: [0, 100, 0, 100]
  display: "体温"

turns:
  total: 10
  time_per_turn: "1小时"
  env_cards_per_turn: 2
  player_hand_size: 4
  action_points: 2
  draw_per_turn: 2

win_condition:
  type: reach_target
  target_variable: coins_earned
  target_value: 60
  description: "在冻僵之前卖出足够多的火柴，能够回家"

lose_condition:
  type: health_zero
  description: "体温降到了再也无法回升的程度。天亮时有人发现了她，她嘴角带着微笑。"

endings:
  - grade: S
    condition: "coins_earned >= 60 and body_temperature >= 60"
    title: "回家了"
    description: "她跑回去。父亲打了她。但她活着，这个新年。"
  - grade: A
    condition: "coins_earned >= 60"
    title: "刚刚够"
    description: "她卖出了足够的火柴。她的手指已经冻僵，但她回去了。"
  - grade: B
    condition: "hope >= 70 and body_temperature >= 40"
    title: "在幻觉中取暖"
    description: "她没有卖出多少，但她在奶奶的幻觉里取了暖。天还没亮，也许还有时间。"
  - grade: D
    condition: "body_temperature <= 0"
    title: "新年前夜"
    description: "人们说她死的时候一定很幸福——因为她在微笑。没有人问她是否愿意。"

env_deck:
  - path: cards/env_wind_intensifies.yaml
    weight: 200
  - path: cards/env_passerby_ignores.yaml
    weight: 190
  - path: cards/env_matches_wet.yaml
    weight: 150
  - path: cards/env_celebration_inside.yaml
    weight: 170
  - path: cards/env_kind_stranger.yaml
    weight: 90
  - path: cards/env_snowfall.yaml
    weight: 160

player_deck:
  - path: cards/player_call_out_matches.yaml
    copies: 4
  - path: cards/player_light_match_warmth.yaml
    copies: 4
  - path: cards/player_find_shelter.yaml
    copies: 3
  - path: cards/player_approach_door.yaml
    copies: 3

generic_cards:
  inject: [rest, interrupt]
