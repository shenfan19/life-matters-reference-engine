meta:
  id: banister_fitness_fatigue
  name: banister_fitness_fatigue
  description: Banister双分量适应-疲劳模型（场景B3）：量化运动训练对运动表现的动态影响。 适应分量（Fitness）与疲劳分量（Fatigue）均由训练负荷驱动，但以不同时间常数衰减。
    表现 = 基线 + k₁·适应 - k₂·疲劳。 核心冲突：高训练负荷快速积累适应，但同时积累的疲劳会掩盖表现提升甚至造成过度训练。 最优训练分配（强度×频率×恢复）不是直觉可得的。
    推荐作为Paper 1的验证案例（
  science_note: 'Banister双分量适应-疲劳模型（场景B3）：量化运动训练对运动表现的动态影响。 适应分量（Fitness）与疲劳分量（Fatigue）均由训练负荷驱动，但以不同时间常数衰减。
    表现 = 基线 + k₁·适应 - k₂·疲劳。 核心冲突：高训练负荷快速积累适应，但同时积累的疲劳会掩盖表现提升甚至造成过度训练。 最优训练分配（强度×频率×恢复）不是直觉可得的。
    推荐作为Paper 1的验证案例（有经典模型对照，抗质疑强度⭐⭐⭐⭐⭐）。

    来源：Banister EW, Calvert TW, Savage MV, Bach TM (1975) A systems model of training
    for athletic performance；Morton RH, Fitz-Clarke JR, Banister EW (1990) Modeling
    human performance in running；Busso T (2003) Variable dose-response relationship
    between exercise training and performance

    [Converter: fitness_dynamics→Type3; fatigue_dynamics→(disabled); performance_calc→(disabled)]'
  tags:
    - sports_science
    - physiological
    - banister
  difficulty: easy

variables:
  fitness_component:
    label: 适应
    value: 0.0
    max: 100
    color: '#52c41a'
    description: 训练适应分量（正向效应），τ₁=45天指数衰减。代表有氧能力、肌肉适应等长期生理适应。
  performance:
    label: 表现
    value: 50.0
    max: 100
    color: '#1677ff'
    description: 运动表现指数。基线100分，训练后在适应积累与疲劳消退之间取得平衡时达到峰值。
game:
  ap_per_turn: 3
  max_turns: 12
  hand_size: 3
lose_conditions:
- condition: performance <= 10
  message: 表现崩溃
win_conditions:
- condition: fitness_component >= 80
  message: 适应性达标
player_cards:
- id: increase_training_load
  name: 增加Training Loa
  type: tactical
  cost: 2
  emoji: 📈
  flavor: 增加TRIMP摄入：每日训练负荷（TRIMP，Training Impulse）。 典型值：休息日=0；轻松慢跑=30-40；中等有氧=60
  science: 优化变量 training_load（+30 TRIMP/回合）
  effects:
  - variable: fitness_component
    delta: 8
  - variable: performance
    delta: 3
- id: decrease_training_load
  name: 减少Training Loa
  type: tactical
  cost: 1
  emoji: 📉
  flavor: 减少TRIMP摄入：每日训练负荷（TRIMP，Training Impulse）。 典型值：休息日=0；轻松慢跑=30-40；中等有氧=60
  science: 优化变量 training_load（-30 TRIMP/回合）
  effects:
  - variable: fitness_component
    delta: -8
  - variable: performance
    delta: -3
environment_cards:
- id: fitness_dynamics
  name: 适应积累
  emoji: 💪
  description: '[Type3] 适应分量一阶动力学：dFitness/dt = -Fitness/τ₁ + training_load（Banister
    1975, Eq.2）'
  science: '[Type3] 累积状态驱动伤害（计数器机制）'
  effects:
  - variable: fitness_component
    delta: -4
  always_active: true
