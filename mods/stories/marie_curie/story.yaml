type: story
name: "玛丽·居里：科学之光"
category: Historical
description: 追随玛丽·居里的足迹，从华沙到巴黎，探索放射性的奥秘，领略一代科学巨匠的非凡人生。
difficulty: Hard
levels:
  - id: 1
    title: 1898: 镭的发现
    description: 在简陋的棚屋实验室中提炼矿石，面对极高的辐射风险，开启放射性研究的新纪元。
    difficulty: Easy
    period: Sorbonne
  - id: 2
    title: 1903: 诺贝尔荣誉
    description: 在学术界的歧视与家庭压力中寻找平衡，坚持真理，最终获得世界最高的科学荣誉。
    difficulty: Medium
    period: Paris
  - id: 3
    title: 1914: 战地X光机
    description: 在一战战场建立流动医疗队，将科学转化为救人技术，用智慧温暖冰冷的战场。
    difficulty: Hard
    period: Mobile Labs
goal_value: 100
initial_state:
  health: 100
  money: 50
  radiation: 0
  research_progress: 0
variable_labels:
  health: "❤️ 生命值"
  money: "💰 经费"
  radiation: "☢️ 辐射量"
  research_progress: "🔬 研究进度"
params:
  chronic_damage_rate: 0.1
  critical_radiation: 50
win_condition:
  research_progress: ">= 100"
loss_condition:
  health: "<= 0"
dynamics:
  - id: chronic_damage
    description: "受到的辐射持续损害生命值"
    formula: "health -= radiation * params.chronic_damage_rate"
    trigger: "turn_end"
  - id: radiation_sickness
    description: "高强度辐射引发急性疾病"
    condition: "radiation >= params.critical_radiation"
    effect: "health -= 20"
    trigger: "turn_end"
cards:
  - cards/research.yaml
  - cards/teaching.yaml
  - cards/rest.yaml
initial_deck:
  Cards:
    - id: research.yaml
      count: 10
    - id: teaching.yaml
      count: 10
    - id: rest.yaml
      count: 5
hand_size: 5
draw_per_turn: 1
ap_per_turn: 3
