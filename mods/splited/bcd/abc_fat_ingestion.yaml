metadata:
  name: abc_fat_ingestion
  version: 1.0.0
  author: ''
  description: Split module for formula fat_ingestion
variables:
  food_fat:
    description: 食物脂肪含量
    value: 0
    type: input
    unit: 克
    bounds:
      - 0
      - 50
  stomach_fat:
    description: Placeholder for stomach_fat
    value: 0.0
    type: state
    unit: unknown
    bounds:
      - 0
      - 100
formulas:
  fat_ingestion:
    description: 脂肪摄入到胃
    condition: food_fat > 0
    priority: 1
    dynamics:
      food_fat: '0'
      stomach_fat: stomach_fat + food_fat
