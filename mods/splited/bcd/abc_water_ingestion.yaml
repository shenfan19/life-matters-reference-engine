metadata:
  name: abc_water_ingestion
  version: 1.0.0
  author: ''
  description: Split module for formula water_ingestion
variables:
  water_intake:
    description: 水分摄入量
    value: 0
    type: input
    unit: 毫升
    bounds:
      - 0
      - 1000
  body_water:
    description: Placeholder for body_water
    value: 0.0
    type: state
    unit: unknown
    bounds:
      - 0
      - 100
formulas:
  water_ingestion:
    description: 水分摄入
    condition: water_intake > 0
    priority: 1
    dynamics:
      body_water: body_water + water_intake
      water_intake: '0'
