metadata:
  name: obesity_diabetes_model_remaining
  version: 1.0.0
  author: AI Assisted Generator
  description: Remaining shared modules of obesity_diabetes_model

variables:
  diabetes_risk:
    description: 糖尿病风险指数，0-1之间，1表示高风险
    value: 0.01
    type: state
    unit: 风险指数
    bounds:
    - 0.0
    - 1.0
  obesity_index:
    description: 肥胖指数 (0=正常, 1=轻度肥胖, 2=中度, 3=重度)
    value: 0.0
    type: input
    unit: 指数级别
    bounds:
    - 0.0
    - 3.0
  exposure_duration:
    description: 暴露持续时间（分钟），用于时间依赖计算
    value: 0.0
    type: state
    unit: 分钟
    bounds:
    - 0.0
    - 100000.0

formulas:
  risk_accumulation:
    description: 肥胖指数导致糖尿病风险累积增加，受时间影响
    condition: obesity_index > 0
    priority: 100
    dynamics:
      diabetes_risk: min(1.0, diabetes_risk + (0.0002 * obesity_index * exposure_duration
        / 1000) * dt)
      exposure_duration: exposure_duration + dt
  risk_decay:
    description: 正常体重时风险缓慢衰减（模拟减肥效果）
    condition: obesity_index == 0 and diabetes_risk > 0
    priority: 90
    dynamics:
      diabetes_risk: max(0.01, diabetes_risk - 0.0001 * dt)
  health_score:
    description: 综合健康评分，受糖尿病风险影响
    condition: true
    priority: 0
    dynamics:
      obesity_index: max(0, 100 - (diabetes_risk * 100))
  critical_condition_high_risk:
    description: 高糖尿病风险警报
    condition: diabetes_risk > 0.5
    priority: 0
    dynamics:
      obesity_index: max(0, 100 - (diabetes_risk * 100))
