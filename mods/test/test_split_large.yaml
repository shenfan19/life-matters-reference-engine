metadata:
  name: test_split_large
  version: 1.0.0
  author: Test User
  description: 一个用于测试split功能的大型模型
  date: 2024-10-27
  language: en
  tags:
    - test
    - split
    - large

variables:
  # === 心血管系统变量 ===
  heart_rate:
    type: INPUT
    unit: bpm
    default: 70
    description: 心率
  
  blood_pressure:
    type: INPUT
    unit: mmHg
    default: 120
    description: 血压
  
  cardiac_output:
    type: STATE
    unit: L/min
    default: 5.0
    description: 心输出量
  
  # === 呼吸系统变量 ===
  breathing_rate:
    type: INPUT
    unit: breaths/min
    default: 15
    description: 呼吸频率
  
  tidal_volume:
    type: INPUT
    unit: mL
    default: 500
    description: 潮气量
  
  minute_ventilation:
    type: STATE
    unit: L/min
    default: 7.5
    description: 分钟通气量
  
  # === 代谢系统变量 ===
  temperature:
    type: INPUT
    unit: celsius
    default: 37.0
    description: 体温
  
  base_metabolic_rate:
    type: PARAMETERS
    unit: kcal/day
    default: 1500
    description: 基础代谢率
  
  energy_level:
    type: STATE
    unit: kcal
    default: 2000
    description: 能量水平
  
  # === 神经系统变量 ===
  stress_hormone:
    type: STATE
    unit: ng/mL
    default: 10.0
    description: 应激激素水平
  
  cognitive_load:
    type: INPUT
    unit: dimensionless
    default: 0.5
    description: 认知负荷
  
  # === 内分泌系统变量 ===
  insulin_level:
    type: STATE
    unit: mU/L
    default: 10.0
    description: 胰岛素水平
  
  glucose_level:
    type: STATE
    unit: mg/dL
    default: 90.0
    description: 血糖水平

formulas:
  # 心血管系统公式
  cardiac_output:
    formula: heart_rate * 0.07
    description: 心输出量计算
  
  # 呼吸系统公式
  minute_ventilation:
    formula: (breathing_rate * tidal_volume) / 1000
    description: 分钟通气量计算
  
  # 代谢系统公式
  energy_level:
    formula: energy_level + (base_metabolic_rate / 24) - (heart_rate * 0.1)
    description: 能量水平变化
  
  # 神经系统公式
  stress_hormone:
    formula: stress_hormone + (cognitive_load * 2.0) - (stress_hormone * 0.1)
    description: 应激激素动态
  
  # 内分泌系统公式
  insulin_level:
    formula: insulin_level + ((glucose_level - 90.0) * 0.1) - (insulin_level * 0.05)
    description: 胰岛素调节
  
  glucose_level:
    formula: glucose_level - (insulin_level * 0.5) + (energy_level * 0.001)
    description: 血糖水平变化

simulation:
  dt: 0.1
  t_end: 10.0
  method: euler
  output_variables:
    - cardiac_output
    - minute_ventilation
    - energy_level
    - stress_hormone
    - insulin_level
    - glucose_level

optimization:
  enabled: false
