metadata:
  name: test_valid
  version: 1.0.0
  author: Test User
  description: 一个能够通过验证的测试模型
  date: 2024-10-27
  language: en
  tags:
    - test
    - valid

variables:
  # 输入变量
  temperature:
    type: INPUT
    unit: celsius
    default: 37.0
    description: 体温
  
  heart_rate:
    type: INPUT
    unit: bpm
    default: 70
    description: 心率
  
  # 参数
  base_metabolic_rate:
    type: PARAMETERS
    unit: kcal/day
    default: 1500
    description: 基础代谢率
  
  # 状态变量
  energy_level:
    type: STATE
    unit: kcal
    default: 2000
    description: 能量水平
  
  stress_level:
    type: STATE
    unit: dimensionless
    default: 0.5
    description: 压力水平

formulas:
  # 能量变化
  energy_level:
    formula: energy_level + (base_metabolic_rate / 24) - (heart_rate * 0.1)
    description: 能量水平随时间变化
  
  # 压力变化
  stress_level:
    formula: stress_level + ((temperature - 37.0) * 0.01)
    description: 压力水平受体温影响

simulation:
  dt: 0.1
  t_end: 10.0
  method: euler
  output_variables:
    - energy_level
    - stress_level

optimization:
  enabled: false
