id: es1600_es_don_quixote
name: "堂吉诃德：理想主义者的征途"
description: |
  一个西班牙乡绅读了太多骑士小说，决定自己也成为骑士。
  他改名堂吉诃德·拉曼恰，骑上一匹瘦马，带着一个胖农民，出发了。
  他把风车当成巨人，把客栈当成城堡，把羊群当成军队。
  每次战斗，他都输。每次输了，他都找到了理由。
  这个模拟的问题是：坚守理想，代价是什么？
type: scenario
tags: [idealism, delusion, physical-decline, social-ridicule, literature]
source: Don Quixote (Cervantes, 1605)

simulation:
  step: 1
  total: 36   # 约3年（三次出行）
  step_unit: month

inputs:
  - id: quest_intensity
    label: "骑士行动强度"
    description: "出发挑战、攻击风车、解救公主等冒险行动的频率"
    min: 0
    max: 3
    default: 2.0
    unit: intensity

  - id: delusion_maintenance
    label: "维持信念"
    description: "在现实打击后仍坚持骑士世界观的执着程度"
    min: 0
    max: 1
    default: 0.8
    unit: ratio

  - id: sancho_listening
    label: "听从桑丘的现实建议"
    description: "接受随从桑丘的实际建议（减少无谓伤害）"
    min: 0
    max: 1
    default: 0.2
    unit: intensity

variables:
  - id: physical_health
    label: "身体状态"
    description: "年迈身体承受冒险伤害的状态"
    min: 0
    max: 100
    initial: 65
    io_role: output
    unit: hp

  - id: ideal_strength
    label: "理想主义强度"
    description: "对骑士世界的信念完整度"
    min: 0
    max: 100
    initial: 95
    io_role: output
    unit: score

  - id: social_ridicule
    label: "社会嘲弄程度"
    description: "被周围人当成疯子的程度"
    min: 0
    max: 100
    initial: 20
    io_role: output
    unit: score

  - id: actual_good_done
    label: "真实善行"
    description: "在错误的方式中偶然做成的真实好事"
    min: 0
    max: 100
    initial: 0
    io_role: output
    unit: score

formulas:
  - id: health_from_quests
    description: "冒险直接带来伤害，年迈身体无法承受"
    expr: |
      quest_damage = quest_intensity * 2.5
      sancho_protection = sancho_listening * 1.0
      physical_health = max(0, physical_health - quest_damage + sancho_protection)

  - id: ideal_dynamics
    description: "信念在现实打击下缓慢瓦解；刻意维持可延缓"
    expr: |
      reality_erosion = quest_intensity * 0.5 * (social_ridicule / 100)
      maintenance_gain = delusion_maintenance * 1.0
      ideal_strength = max(0, min(100, ideal_strength - reality_erosion + maintenance_gain))

  - id: ridicule_growth
    description: "冒险越多，被嘲笑的故事越多"
    expr: |
      social_ridicule = min(100, social_ridicule + quest_intensity * 1.5)

  - id: accidental_good
    description: "在执行骑士任务时偶然帮助到真实的人"
    expr: |
      actual_good_done = min(100, actual_good_done + quest_intensity * 0.8 * (1 - delusion_maintenance * 0.5))

optimizer:
  target: ideal_strength
  direction: maximize
  secondary: actual_good_done
  note: "历史结局：白月骑士（朋友假扮）击败他，要求他一年内放弃骑士生涯→他一年后在清醒中死去"
