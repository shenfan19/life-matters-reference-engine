id: cn1750_cn_lin_daiyu
name: "林黛玉：葬花词·未竟"
description: |
  林黛玉，寄居贾府的孤女，才情横溢，肺痨缠身。
  她与贾宝玉的情感从未被家族允许，她的病从未被当成真正的病对待。
  她必须在：维护内心尊严、表达真实情感、同时保住微弱的身体之间不断权衡。
  封建礼教不允许她病，也不允许她爱，也不允许她死得像个人。
type: scenario
tags: [tuberculosis, feudal-system, gender, isolation, emotion-illness, literature]
source: 红楼梦 (曹雪芹, ~1754–1791)

simulation:
  step: 1        # 单位：月
  total: 36      # 约3年（入住贾府到去世）
  step_unit: month

inputs:
  - id: emotional_expression
    label: "情感真实表达"
    description: "向宝玉或紫鹃等人表达真实情感（缓解压抑，但消耗礼教容忍度）"
    min: 0
    max: 1
    default: 0.4
    unit: intensity

  - id: poetic_sublimation
    label: "诗词升华"
    description: "通过写诗·葬花等方式转化情感（心理缓冲，消耗体力）"
    min: 0
    max: 1
    default: 0.6
    unit: intensity

  - id: medical_compliance
    label: "配合调养"
    description: "按照医嘱服药休息（有一定效果但费用需贾府拨给）"
    min: 0
    max: 1
    default: 0.5
    unit: intensity

variables:
  - id: health
    label: "身体状态"
    description: "肺痨进展与体力的综合指标"
    min: 0
    max: 100
    initial: 60
    io_role: output
    unit: hp

  - id: emotional_burden
    label: "情感压抑重量"
    description: "无法表达的情感积压（直接加速心因性疾病）"
    min: 0
    max: 100
    initial: 50
    io_role: output
    unit: score

  - id: tb_progression
    label: "肺痨进展"
    description: "结核病不可逆的进展"
    min: 0
    max: 100
    initial: 25
    io_role: output
    unit: score

  - id: social_standing
    label: "在贾府的地位"
    description: "被贾府接受和善待的程度（影响医疗资源获取）"
    min: 0
    max: 100
    initial: 55
    io_role: output
    unit: score

  - id: creative_output
    label: "诗词创作力"
    description: "精神升华的状态——有时是最后的生命表达"
    min: 0
    max: 100
    initial: 70
    io_role: output
    unit: score

formulas:
  - id: health_dynamics
    description: "健康受肺痨·情感负担·医疗配合的综合影响"
    expr: |
      tb_cost = (tb_progression / 100) * 2.0
      emotion_cost = (emotional_burden / 100) * 1.5  # 心因性加速
      treatment_gain = medical_compliance * 1.5 * (social_standing / 100)
      health = max(0, health - tb_cost - emotion_cost + treatment_gain)

  - id: tb_progression_rate
    description: "肺痨随情感压抑和营养不良加速"
    expr: |
      base_progression = 1.2
      emotion_driver = (emotional_burden / 100) * 1.0
      care_suppression = medical_compliance * 0.5
      tb_progression = min(100, tb_progression + base_progression + emotion_driver - care_suppression)

  - id: emotion_dynamics
    description: "情感负担随压抑积累，表达和诗词升华可减少"
    expr: |
      baseline_pressure = 2.0  # 礼教环境持续施压
      expression_relief = emotional_expression * 3.0
      sublimation_relief = poetic_sublimation * 2.0
      emotional_burden = max(0, min(100, emotional_burden + baseline_pressure - expression_relief - sublimation_relief))

  - id: social_standing_change
    description: "过于坦率表达情感会降低礼教地位；诗才可适度提升"
    expr: |
      expression_cost = emotional_expression * 1.5
      poetic_gain = poetic_sublimation * 1.0
      social_standing = max(0, min(100, social_standing - expression_cost + poetic_gain))

  - id: creative_output_dynamics
    description: "诗词创作力随情感压抑而高峰，随健康下降而衰减"
    expr: |
      pressure_inspiration = (emotional_burden / 100) * 2.0
      health_cost = (1 - health / 100) * 1.5
      creative_output = max(0, min(100, creative_output + pressure_inspiration - health_cost))

optimizer:
  target: health
  direction: maximize
  secondary: creative_output
  note: "历史结局：宝玉成婚同时刻她焚稿断痴情；health→0；creative_output在生命末期达到高峰（《葬花词》）"
