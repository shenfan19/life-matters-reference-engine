meta:
  id: ckd_protein_muscle
  name: ckd_protein_muscle
  description: 慢性肾病（CKD）蛋白质摄入 vs 肌肉保持动态模型（场景A4）。 核心学术案例：低蛋白饮食减缓GFR下降（保护肾功能），但同时导致肌肉萎缩，
    而肌少症反过来加速肾功能恶化——形成恶性循环。 KDIGO 2020年指南原文明确写道："低蛋白饮食与肌少症风险之间的权衡目前证据不足， 无法给出统一建议"（Kidney
    Int Suppl 2021, Section 3.1.3）。 这是指南委员会自承的
  science_note: '慢性肾病（CKD）蛋白质摄入 vs 肌肉保持动态模型（场景A4）。 核心学术案例：低蛋白饮食减缓GFR下降（保护肾功能），但同时导致肌肉萎缩，
    而肌少症反过来加速肾功能恶化——形成恶性循环。 KDIGO 2020年指南原文明确写道："低蛋白饮食与肌少症风险之间的权衡目前证据不足， 无法给出统一建议"（Kidney
    Int Suppl 2021, Section 3.1.3）。 这是指南委员会自承的学术空白，不可用"临床经验"一句话反驳。 最优蛋白质摄入时序（分期策略）是真实的未解问题。
    抗质疑强度：⭐⭐⭐⭐⭐

    来源：KDIGO (2021) KDIGO 2020 CKD Clinical Practice Guideline；Klahr S et al；Kalantar-Zadeh
    K et al

    [Converter: gfr_decline→Type4; bun_calc→Type6; muscle_dynamics→Type6]'
  tags:
  - nephrology
  - ckd
  - protein
  - muscle
  - sarcopenia
  - optimization
  - physiological
  - A4
  difficulty: medium
variables:
  muscle_mass:
    label: 肌肉量
    value: 41.8
    max: 100
    color: '#52c41a'
    description: 骨骼肌质量（瘦体重），正常成年男性约28-32kg。 CKD患者因蛋白质限制、代谢性酸中毒、炎症等原因加速肌肉分解（蛋白-能量消耗综合征）。
      基线设为28kg（轻度肌少症起点，符合CKD 3期患者典型
  gfr:
    label: GFR
    value: 37.0
    max: 100
    color: '#1677ff'
    description: 肾小球滤过率（GFR），单位mL/min/1.73m²。 CKD分期：1期≥90；2期60-89；3期30-59；4期15-29；5期<15。
      模型基线设为CKD 3b期（45 mL/min），代表中
  bun:
    label: BUN
    value: 17.2
    max: 100
    color: '#faad14'
    description: 血尿素氮（BUN），氮质废物积累指标，正常值7-20 mg/dL。 在CKD中BUN随蛋白摄入增加且随GFR下降而升高，反映尿毒症毒素负担。
      采用稳态近似：BUN ≈ 24.1 × protein_i
  muscle_synthesis_rate:
    label: Muscle Synth
    value: 66.7
    max: 100
    color: '#722ed1'
    description: 净肌肉合成速率（正=合成，负=分解）。 由protein_intake与维持阈值（0.8 g/kg/day）之差决定，CKD晚期额外加速分解。
      来源：Kalantar-Zadeh (2017) 肌少症
game:
  ap_per_turn: 3
  max_turns: 20
  hand_size: 3
lose_conditions:
- condition: muscle_mass <= 15
  message: 肌肉量过低，无法继续——治疗失败。
- condition: gfr <= 15
  message: GFR过低，无法继续——治疗失败。
- condition: bun >= 88
  message: BUN过高，出现严重并发症。
win_conditions:
- condition: muscle_mass >= 75
  message: 肌肉量达到目标水平，优化成功。
- condition: gfr >= 75
  message: GFR达到目标水平，优化成功。
- condition: bun <= 25
  message: BUN控制达标，临床目标实现。
player_cards:
- id: increase_protein_intake
  name: 增加Protein Inta
  type: medical
  cost: 2
  emoji: 📈
  flavor: 增加g/kg/day摄入：每日蛋白质摄入量（g/kg/day）。 KDIGO 2020建议（非透析CKD 3-5期）：0.6-0.8 g/kg/d
  science: 优化变量 protein_intake（+0.34 g/kg/day/回合）
  effects:
  - variable: muscle_mass
    delta: 10
  - variable: gfr
    delta: -8
  - variable: bun
    delta: -6
- id: decrease_protein_intake
  name: 减少Protein Inta
  type: medical
  cost: 1
  emoji: 📉
  flavor: 减少g/kg/day摄入：每日蛋白质摄入量（g/kg/day）。 KDIGO 2020建议（非透析CKD 3-5期）：0.6-0.8 g/kg/d
  science: 优化变量 protein_intake（-0.34 g/kg/day/回合）
  effects:
  - variable: muscle_mass
    delta: -10
  - variable: gfr
    delta: 8
  - variable: bun
    delta: 6
environment_cards:
- id: gfr_decline
  name: GFR下降
  emoji: 🔻
  description: '[Type4] GFR日下降动力学。 protein_modifier范围：0.6g/kg/d→0.65（35%减缓），1.2g/kg/d→1.0（无减缓），线性插值。
    来源：MDRD Study (Klahr 1994)。'
  science: '[Type4] 阈值条件触发'
  effects:
  - variable: gfr
    delta: -4
  condition: gfr > 2.0
- id: bun_calc
  name: BUN积累
  emoji: ☣️
  description: '[Type6] BUN稳态近似（尿素清除率动力学）。 系数24.1由标准参考点校准：70kg, 0.8g/kg/d, GFR=90
    → BUN=15 mg/dL。 来源：Daugirdas et al. (2015)。'
  science: '[Type6] ODE离散化（每回合）'
  effects:
  - variable: bun
    delta: -4
  always_active: true
- id: muscle_dynamics
  name: 肌肉变化
  emoji: 🦾
  description: '[Type6] 骨骼肌净合成动力学。 net_rate = (protein_intake - 0.8) × 0.05 - CKD晚期额外分解因子。
    晚期CKD（GFR<30）因代谢性酸中毒额外增加分解：+0.003 kg/day。 来源：Carrero '
  science: '[Type6] ODE离散化（每回合）'
  effects:
  - variable: muscle_mass
    delta: -4
  - variable: muscle_synthesis_rate
    delta: -4
  always_active: true
