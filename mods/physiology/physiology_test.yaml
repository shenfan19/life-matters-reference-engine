metadata:
  name: physiology_test
  version: 1.0.0
  author: Minghui Wu
  description: 精简生理模型，包含血糖、饥饿度、体液和胃功能，模拟早中晚餐摄入
  conflicts: []
  tags:
  - physiology
  - test
imports:
- nutrition_intake
variables:
  blood_glucose:
    description: 血糖浓度，正常范围70-140 mg/dL
    value: 90
    unit: mg/dL
    type: state
    bounds:
    - 30
    - 600
  hunger_level:
    description: 饥饿度，0-1之间，1表示极度饥饿
    value: 0.3
    unit: 指数
    type: state
    bounds:
    - 0.0
    - 1.0
  body_water:
    description: 体液总量
    value: 40000
    unit: 毫升
    type: state
    bounds:
    - 30000
    - 45000
  gastric_function:
    description: 胃功能效率，影响消化
    value: 0.9
    unit: 系数
    type: state
    bounds:
    - 0.0
    - 1.0
  gastric_carbohydrate:
    description: Placeholder for gastric_carbohydrate
    value: 0.0
    type: state
    unit: unknown
    bounds:
    - 0
    - 100
  gastric_fat:
    description: Placeholder for gastric_fat
    value: 0.0
    type: state
    unit: unknown
    bounds:
    - 0
    - 100
  gastric_protein:
    description: Placeholder for gastric_protein
    value: 0.0
    type: state
    unit: unknown
    bounds:
    - 0
    - 100
  time:
    description: Placeholder for time
    value: 0.0
    type: state
    unit: unknown
    bounds:
    - 0
    - 100

formulas:
  meal_intake:
    description: 模拟早中晚餐摄入，触发营养和水分摄入
    condition: time == 420 or time == 720 or time == 1080
    dynamics:
      food_carbohydrate: if(time == 420, 50, if(time == 720, 60, 40))
      food_protein: if(time == 420, 20, if(time == 720, 30, 25))
      food_fat: if(time == 420, 10, if(time == 720, 15, 12))
      water_intake: if(time == 420, 500, if(time == 720, 600, 400))
      hunger_level: max(0, hunger_level - 0.4)
      blood_glucose: blood_glucose + food_carbohydrate * 0.5 * gastric_function
      body_water: body_water + water_intake
    priority: 1
  glucose_metabolism:
    description: 血糖代谢，模拟自然下降
    condition: true
    dynamics:
      blood_glucose: max(30, blood_glucose - 0.2 * gastric_function * step_size)
    priority: 3
  hunger_accumulation:
    description: 饥饿度随时间累积
    condition: true
    dynamics:
      hunger_level: min(1.0, hunger_level + 0.001 * step_size)
    priority: 2
  water_metabolism:
    description: 体液代谢消耗
    condition: true
    dynamics:
      body_water: max(30000, body_water - 0.5 * step_size)
    priority: 3
  gastric_function_recovery:
    description: 休息状态下胃功能恢复
    condition: blood_glucose < 120 and hunger_level < 0.5
    dynamics:
      gastric_function: min(1.0, gastric_function + 0.0001 * step_size)
    priority: 2
simulator:
  step_size: 1
  total_time: 1440
  output_format: csv
  output_variables:
  - blood_glucose
  - hunger_level
  - body_water
  - gastric_function
optimizer:
  method: grid
  duration: 60.0
  targets_of_optimization:
  - blood_glucose
  variables_to_optimize:
  - gastric_function