metadata:
  description: 基础代谢率、能量消耗和运动影响
  name: metabolism
  tags:
    - metabolism
    - energy
  version: 2.1.0
  author: Minghui Wu
  conflicts: []

imports:
  - nutrition_intake
  - glucose_regulation

variables:
  basal_metabolic_rate:
    bounds:
      - 800
      - 3000
    description: 基础代谢率
    type: state
    unit: kcal/day
    value: 1800
  energy_expenditure:
    bounds: [0.5, 3.0]
    description: 能量消耗率
    type: state
    unit: 倍数
    value: 1.2

formulas:
  circadian_hormone_variation:
    condition: 'True'
    description: 昼夜节律对代谢的影响
    dynamics:
      basal_metabolic_rate: 1800 + 200 * sin(time * 3.14159 / 720)
      insulin_sensitivity: 0.8 + 0.1 * cos(time * 3.14159 / 720)
    priority: 1
  exercise_effect:
    condition: exercise_intensity > 0
    description: 运动增加葡萄糖利用和胰岛素敏感性
    dynamics:
      energy_expenditure: min(3.0, energy_expenditure + exercise_intensity * 0.1 * dt)
      glucose_utilization: glucose_utilization + exercise_intensity * 0.2 * dt
      insulin_sensitivity: min(1.0, insulin_sensitivity + exercise_intensity * 0.005 * dt)
    priority: 3
  metabolic_efficiency:
    condition: 'True'
    description: 代谢效率指标
    formula: (digestive_efficiency + insulin_sensitivity) / 2 * 100
    priority: 1

simulator:
  dt: 3600  # 默认时间步长（秒），例如每小时更新一次
  steps: 100  # 仿真步数
  output_format: yaml  # 输出格式
  monitor_conditions:  # 监控条件列表
    - blood_glucose < 70  # 示例：低血糖警报

optimizer:
  targets_to_optimize:
    - energy_expenditure
  parameters_to_optimize:  # 要优化的参数列表
    - insulin_sensitivity
  method: grid  # 优化方法，例如网格搜索
  duration: 60.0  # 优化持续时间（分钟）
