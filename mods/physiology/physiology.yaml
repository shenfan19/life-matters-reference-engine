metadata:
  name: physiology
  version: 2.1.0
  author: Minghui Wu
  description: 肝、胰腺、胃、小肠等器官功能系数及恢复机制
  conflicts: []
  tags:
  - organs
  - function
imports:
- insulin_system
- glucose_regulation
variables:
  liver_function:
    description: 肝功能系数
    value: 1.0
    unit: 系数
    type: state
    bounds:
    - 0.1
    - 1.0
  pancreatic_function:
    description: 胰腺功能系数
    value: 1.0
    unit: 系数
    type: state
    bounds:
    - 0.1
    - 1.0
  gastric_function:
    description: 胃功能效率
    value: 0.9
    unit: 系数
    type: state
    bounds:
    - 0.0
    - 1.0
  intestinal_function:
    description: 小肠功能效率
    value: 0.85
    unit: 系数
    type: state
    bounds:
    - 0.0
    - 1.0
  kidney_function:
    description: 肾功能系数
    value: 0.8
    unit: 系数
    type: state
    bounds:
    - 0.0
    - 1.0
formulas:
  organ_function_recovery:
    description: 休息状态下器官功能逐渐恢复
    condition: blood_glucose < 120 and plasma_insulin < 20 and physical_activity == 0
    dynamics:
      gastric_function: min(1.0, gastric_function + 0.0001)
      pancreatic_function: min(1.0, pancreatic_function + 0.00005)
      liver_function: min(1.0, liver_function + 0.0001)
      intestinal_function: min(1.0, intestinal_function + 0.0001)
      kidney_function: min(1.0, kidney_function + 0.0001)
    priority: 2
simulator:
  step_size: 1
  total_time: 1440
  output_format: csv
  output_variables:
  - liver_function
  - pancreatic_function
  - gastric_function
  - intestinal_function
  - kidney_function
optimizer:
  method: grid
  duration: 60.0
  targets_to_optimize:
  - energy_expenditure
  variables_to_optimize:
  - insulin_sensitivity