metadata:
  author: Minghui Wu
  conflicts: []
  description: 胃肠道状态、营养吸收、激素酶和消化过程，包括高级消化变量
  name: gastrointestinal
  tags:
  - digestion
  - gastrointestinal
  version: 2.1.0

imports:
  - nutrition_intake

variables:
  amino_acids:
    bounds:
      - 0.0
      - 5.0
    description: 氨基酸血浆浓度
    type: state
    unit: mmol/L
    value: 0.0
  bile_acids:
    bounds:
      - 0.0
      - 50.0
    description: 胆汁酸水平
    type: state
    unit: mmol/L
    value: 0.0
  bile_function:
    bounds:
      - 0.0
      - 1.0
    description: 胆汁分泌功能，范围0-1，1为完全正常
    type: parameter
    unit: 效率系数
    value: 0.8
  cholecystokinin_level:
    bounds:
      - 0.0
      - 100.0
    description: 胆囊收缩素水平
    type: state
    unit: pg/mL
    value: 0.0
  digestive_efficiency:
    bounds:
      - 0.0
      - 1.0
    description: 整体消化效率
    type: state
    unit: 效率系数
    value: 0.8
  fatty_acids:
    bounds:
      - 0.0
      - 2.0
    description: 脂肪酸血浆浓度
    type: state
    unit: mmol/L
    value: 0.0
  gastric_carbohydrate:
    bounds:
      - 0
      - 250
    description: 胃内碳水化合物含量
    type: state
    unit: 克
    value: 0
  gastric_fat:
    bounds:
      - 0
      - 100
    description: 胃内脂肪含量
    type: state
    unit: 克
    value: 0
  gastric_ph:
    bounds:
      - 1.0
      - 7.0
    description: 胃内pH值
    type: state
    unit: pH单位
    value: 1.5
  gastric_protein:
    bounds:
      - 0
      - 150
    description: 胃内蛋白质含量
    type: state
    unit: 克
    value: 0
  gastric_ulcer_risk:
    bounds:
      - 0.0
      - 1.0
    description: 胃溃疡风险
    type: state
    unit: 风险指数
    value: 0.0
  gastric_volume:
    bounds:
      - 50
      - 1500
    description: 胃容积
    type: state
    unit: 毫升
    value: 50
  gastrin_level:
    bounds:
      - 0.0
      - 200.0
    description: 胃泌素水平
    type: state
    unit: pg/mL
    value: 0.0
  glucose:
    bounds:
      - 0.0
      - 20.0
    description: 葡萄糖血浆浓度
    type: state
    unit: mmol/L
    value: 5.0
  hunger_level:
    bounds:
      - 0
      - 1.0
    description: 饥饿感水平，0-饱食，1-极度饥饿
    type: state
    unit: 指数
    value: 0.5
  intestinal_carbohydrate:
    bounds:
      - 0
      - 150
    description: 小肠内碳水化合物含量
    type: state
    unit: 克
    value: 0
  intestinal_fat:
    bounds:
      - 0
      - 80
    description: 小肠内脂肪含量
    type: state
    unit: 克
    value: 0
  intestinal_protein:
    bounds:
      - 0
      - 100
    description: 小肠内蛋白质含量
    type: state
    unit: 克
    value: 0
  malnutrition_risk:
    bounds:
      - 0.0
      - 1.0
    description: 营养不良风险
    type: state
    unit: 风险指数
    value: 0.0
  pepsin_level:
    bounds:
      - 0.0
      - 100.0
    description: 胃蛋白酶水平
    type: state
    unit: 单位
    value: 0.0
  secretin_level:
    bounds:
      - 0.0
      - 100.0
    description: 分泌素水平
    type: state
    unit: pg/mL
    value: 0.0
  stomach_carbohydrate:
    bounds:
      - 0.0
      - 500.0
    description: 胃内碳水化合物含量
    type: state
    unit: 克
    value: 0.0
  stomach_fat:
    bounds:
      - 0.0
      - 100.0
    description: 胃内脂肪含量
    type: state
    unit: 克
    value: 0.0
  stomach_protein:
    bounds:
      - 0.0
      - 200.0
    description: 胃内蛋白质含量
    type: state
    unit: 克
    value: 0.0

formulas:
  bile_emulsification:
    condition: bile_function > 0 and gastric_fat > 0
    description: 胆汁乳化脂肪
    dynamics:
      fatty_acids: fatty_acids + gastric_fat * bile_function * 0.05 * dt
      gastric_fat: max(0, gastric_fat - gastric_fat * bile_function * 0.05 * dt)
    priority: 3
  bile_response:
    condition: bile_function >= 0.6 and gastric_fat > 5
    description: 模拟胆汁对脂肪摄入的分泌响应
    dynamics:
      bile_function: min(1.0, bile_function + 0.15 * dt)
    priority: 2
  cholecystokinin_secretion:
    condition: gastric_fat > 0 or gastric_protein > 0
    description: 脂肪和蛋白质刺激 CCK 分泌
    dynamics:
      cholecystokinin_level: min(100, cholecystokinin_level + (gastric_fat * 0.8 +
        gastric_protein * 0.4) * dt)
    priority: 2
  comfort_level:
    description: 舒适度水平
    dynamics:
      comfort_level: max(0, 100 - hunger_level * 50 - abs(glucose - 90))
  critical_condition_extreme_hunger:
    condition: hunger_level > 0.9
    description: 极度饥饿状态
  critical_condition_low_glucose:
    condition: glucose < 60
    description: 低血糖风险
  digestion_efficiency:
    description: 消化效率综合指标
    dynamics:
      digestion_efficiency: (gastric_function + intestinal_function + bile_function)
        / 3
  digestion_efficiency_calc:
    condition: true
    description: 计算整体消化效率
    dynamics:
      digestive_efficiency: (gastric_function + intestinal_function + bile_function)
        / 3
    priority: 5
  gastric_digestion:
    condition: gastric_function > 0 and (gastric_protein > 0 or gastric_carbohydrate
      > 0 or gastric_fat > 0)
    description: 胃内消化过程
    dynamics:
      amino_acids: amino_acids + gastric_protein * gastric_function * 0.05 * dt
      fatty_acids: fatty_acids + gastric_fat * gastric_function * 0.02 * dt
      gastric_carbohydrate: max(0, gastric_carbohydrate - gastric_carbohydrate * gastric_function
        * 0.03 * dt)
      gastric_fat: max(0, gastric_fat - gastric_fat * gastric_function * 0.02 * dt)
      gastric_protein: max(0, gastric_protein - gastric_protein * gastric_function
        * 0.05 * dt)
      glucose: glucose + gastric_carbohydrate * gastric_function * 0.03 * dt
    priority: 3
  gastric_ph_regulation:
    condition: gastric_protein > 0 or gastric_carbohydrate > 0
    description: 食物缓冲胃酸 pH 值
    dynamics:
      gastric_ph: min(7.0, gastric_ph + 0.1 * dt)
    priority: 2
  gastric_ph_response:
    condition: gastric_function >= 0.7 and gastric_protein > 10
    description: 模拟正常胃酸分泌对蛋白质的反应
    dynamics:
      gastric_function: min(1.0, gastric_function + 0.1 * dt)
    priority: 2
  gastric_ulcer_risk_update:
    condition: gastric_ph < 1.5 and gastric_function < 0.6
    description: 更新胃溃疡风险
    dynamics:
      gastric_ulcer_risk: min(1.0, gastric_ulcer_risk + 0.01 * dt)
    priority: 6
  gastrin_secretion:
    condition: gastric_protein > 0 or gastric_carbohydrate > 0
    description: 食物刺激胃泌素分泌
    dynamics:
      gastrin_level: min(200, gastrin_level + (gastric_protein + gastric_carbohydrate)
        * 0.5 * dt)
    priority: 2
  hunger_sensation:
    condition: true
    description: 基于营养吸收计算饥饿感
    dynamics:
      hunger_level: max(0, min(1.0, hunger_level + 0.01 * dt - (amino_acids + glucose
        + fatty_acids) * 0.005 * dt))
    priority: 5
  impaired_digestion_adaptation:
    condition: gastric_function < 0.5 and gastric_protein > 30
    description: 模拟消化功能受损时的适应性变化
    dynamics:
      gastric_function: max(0.1, gastric_function * 0.98)
    priority: 1
  intestinal_absorption:
    condition: intestinal_function > 0 and (amino_acids > 0 or glucose > 0 or fatty_acids
      > 0)
    description: 小肠吸收过程
    dynamics:
      amino_acids: max(0, amino_acids - amino_acids * intestinal_function * 0.1 *
        dt)
      blood_glucose: blood_glucose + glucose * intestinal_function * 0.15 * dt
      fatty_acids: max(0, fatty_acids - fatty_acids * intestinal_function * 0.08 *
        dt)
      glucose: max(0, glucose - glucose * intestinal_function * 0.15 * dt)
    priority: 4
  intestinal_adaptation:
    condition: intestinal_function < 0.7
    description: 模拟肠道功能的适应性调节
    dynamics:
      intestinal_function: max(0.3, intestinal_function - 0.02 * dt)
    priority: 1
  malnutrition_risk_update:
    condition: amino_acids < 1.0 and glucose < 3.0 and fatty_acids < 0.5
    description: 更新营养不良风险
    dynamics:
      malnutrition_risk: min(1.0, malnutrition_risk + 0.005 * dt)
    priority: 6
  nutritional_status:
    description: 营养状态评分
    dynamics:
      nutritional_status: min(100, (amino_acids * 20 + glucose) / 2)
  pepsin_activation:
    condition: gastric_ph < 3.0 and gastric_protein > 0
    description: 胃酸激活胃蛋白酶
    dynamics:
      pepsin_level: min(100, pepsin_level + (3.0 - gastric_ph) * 5 * dt)
    priority: 2
  secretin_secretion:
    condition: gastric_ph < 4.5 and (gastric_carbohydrate > 0 or gastric_fat > 0)
    description: 酸性食糜刺激分泌素分泌
    dynamics:
      secretin_level: min(100, secretin_level + (4.5 - gastric_ph) * 10 * dt)
    priority: 2
