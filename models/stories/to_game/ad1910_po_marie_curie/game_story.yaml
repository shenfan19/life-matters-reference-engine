meta:
  name: ad1910_po_marie_curie
  description: 居里夫人放射性研究仿真/优化场景（1898-1906，巴黎）。 sim模式：按月尺度运行，追踪辐射积累、研究进展、健康状态和经费的动态平衡。
    opt模式：在性别歧视压制和辐射威胁的约束下，搜索最优的研究节律—— 怎样分配实验时间、授课与休息，在完成放射性发现的同时维持健康？
  difficulty: hard
  tags:
  - historical
  - curie
  - radiation
  - research
  - 19th-century
  - france
  - women-in-science
  author: Universal Dynamics Converter
  version: '0.1'
  source_scenario: ad1910_po_marie_curie
  base_language: en
  languages:
  - en
initial_state:
  health: 100.0
  radiation: 0.0
  research_progress: 0.0
  money: 40.0
health_mapping:
  source_variable: health
  scale:
  - 0
  - 100
  - 0
  - 100
  display: 生命值
turns:
  total: 20
  time_per_turn: 1 month
  env_cards_per_turn: 2
  player_hand_size: 5
  action_points: 3
win_condition:
  type: custom
  description: Health(分)达到目标水平，优化成功。
lose_condition:
  type: custom
  description: Health(分)过低，无法继续。
endings:
- grade: A
  condition: health >= 80
  title: 目标达成
  description: Health(分)达到目标水平，优化成功。
- grade: A
  condition: radiation <= 20
  title: 目标达成
  description: Radiation(分)控制达标，临床目标实现。
- grade: A
  condition: research_progress >= 80
  title: 目标达成
  description: Research Pro达到目标水平，优化成功。
- grade: A
  condition: money >= 80
  title: 目标达成
  description: Money(分)达到目标水平，优化成功。
- grade: D
  condition: health <= 30
  title: 失败
  description: Health(分)过低，无法继续。
- grade: D
  condition: radiation >= 88
  title: 失败
  description: Radiation(分)过高，出现严重并发症。
- grade: D
  condition: research_progress <= 10
  title: 失败
  description: Research Pro过低，无法继续。
- grade: D
  condition: money <= 5
  title: 失败
  description: Money(分)过低，无法继续。
