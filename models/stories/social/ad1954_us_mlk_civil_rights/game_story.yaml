meta:
  name: "马丁·路德·金：我有一个梦想"
  description: "1955年，蒙哥马利公共汽车抵制运动点燃了美国民权运动的火炬。身为浸信会牧师的马丁·路德·金以非暴力抵抗为武器，在FBI监控、暴力威胁与政治压力中，带领美国黑人为平等权利而战。"
  difficulty: hard
  period_start: "1955"
  period_end: "1965"
  tags: [Politics, Society, 20th Century, History]
  country: US
  author: ""
  version: "0.1"
  created_on: 2026-04-06
  source_scenario: ""

card_back_fate:   card_backs/fate.jpg
card_back_player: card_backs/player.png

music:
  - music/theme.mp3
  - music/ambient.mp3

initial_state:
  health: 100
  influence: 0
  support: 50

health_mapping:
  source_variable: health
  scale: [0, 100, 0, 100]
  display: "生命值"

turns:
  total: 15
  time_per_turn: "6 months"
  env_cards_per_turn: 2
  player_hand_size: 6   # H=6: 组织领袖，SCLC网络+道义权威
  action_points: 3      # p=3: 演讲/游行/谈判多线并行
  draw_per_turn: 3      # a=3: b=H-a=3，有一定战略纵深

win_condition:
  type: reach_target
  target_variable: influence
  target_value: 100
  description: "民权运动影响力达到 100，推动《民权法案》和《选举权法案》通过"

lose_condition:
  type: health_zero
  description: "在迫害与重压下身心俱损，未能坚持到胜利的那一天"

endings:
  - grade: S
    condition: "health >= 70 and influence >= 100"
    title: "我有一个梦想"
    description: "以健康的身体与坚定的意志走到了胜利，《民权法案》成为历史的里程碑。自由终于降临，但这只是漫长旅途的开始。"
  - grade: A
    condition: "health > 0 and influence >= 100"
    title: "带伤的胜利"
    description: "身心俱疲，但民权运动的火炬终于点燃了整个国家的良知。历史将铭记这段代价沉重的抗争。"
  - grade: B
    condition: "health > 30 and influence >= 80"
    title: "未竟的改变"
    description: "运动推进了大半，法案的通过指日可待。种子已经种下，历史的果实将由后人收获。"
  - grade: D
    condition: "health <= 0"
    title: "沉默的先行者"
    description: "在枪声与骚扰中提前倒下，梦想的种子散落在南方的土地上，等待着另一位播种者。"

env_deck:
  - path: cards/env_fbi_harassment.yaml
    weight: 200
  - path: cards/env_political_opposition.yaml
    weight: 180
  - path: cards/env_violent_crackdown.yaml
    weight: 150
  - path: cards/env_church_solidarity.yaml
    weight: 130
  - path: cards/env_media_coverage.yaml
    weight: 120
  - path: cards/env_bombing_threat.yaml
    weight: 80

player_deck:
  - path: cards/player_speech.yaml
    copies: 5
  - path: cards/player_march.yaml
    copies: 5
  - path: cards/player_negotiate.yaml
    copies: 5
  - path: cards/player_community.yaml
    copies: 5
  - path: cards/player_rest.yaml
    copies: 5
  - path: cards/player_letter.yaml
    copies: 5

generic_cards:
  inject: [rest, interrupt]
