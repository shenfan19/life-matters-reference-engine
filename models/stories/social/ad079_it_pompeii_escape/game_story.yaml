meta:
  name: "Pompeii — August 24, 79 AD"
  description: |
    It is just past noon on August 24, 79 AD. Vesuvius has opened.

    The column of ash and rock is already 20 kilometers high. Pumice is falling like hail.
    You are an ordinary citizen of Pompeii — not a general, not a senator, not Pliny.
    No one has told you this eruption will last 19 hours. No one told the 2,000 people
    who will still be here tomorrow morning.

    Every hour you wait, the ash gets deeper. Every hour you delay,
    the window to the roads narrows.

    But there are people who cannot run. Do you stay?
  difficulty: hard
  period_start: "79"
  period_end: "79"
  country: Roman Empire (Pompeii, Campania)
  science_note: |
    Vesuvius erupted on August 24, 79 AD. Archaeological and volcanological evidence
    reconstructs the timeline with precision:
    - Phase 1 (1pm–midnight): pumice fall, ash accumulation ~15cm/hour in Pompeii
    - Phase 2 (midnight–8am): 6 pyroclastic density currents (PDC), final surges lethal
    - ~2,000 victims found at Pompeii (est. 11,000–20,000 population escaped)
    - Roof collapse threshold: ~35cm ash for typical Roman structures (Luongo et al. 2003)
    - PDC arrival at Pompeii: ~6:30am, lethal temperature >300°C (Mastrolorenzo et al. 2010)
    Pliny the Younger (Misenum, ~30km) survived. Pliny the Elder died near Stabiae
    attempting rescue by sea.
    Sources: Sigurdsson H et al. (1985) National Geographic Research 1(3):332-387;
    Mastrolorenzo G et al. (2010) PLoS ONE 5(6):e11127.
  version: "0.1"
  created_on: 2026-04-25
  tags: [History, Disaster, Ancient, Survival]
  era: "Ancient"
  themes:
    - Survival
    - Disaster
    - Moral Choice

initial_state:
  health: 100
  escape_progress: 0       # 0–100，归一化自 escape_distance（0–12km）；80=安全阈值
  ash_depth: 0             # 0–100，从 Sim ash_depth 直接映射；60以上移动极困难
  pyroclastic_risk: 0      # 0–100，从 Sim pyroclastic_intensity 映射；60以上城区致命
  rescue_score: 0          # Game-native：帮助他人逃脱的得分，无 Sim 对应物

variable_display:
  health:
    label: "Stamina"
    color: '#52c41a'
    max: 100
    origin: sim
  escape_progress:
    label: "Distance"
    color: '#1677ff'
    max: 100
    origin: sim
  ash_depth:
    label: "Ash Depth"
    color: '#8c8c8c'
    max: 100
    origin: sim
  pyroclastic_risk:
    label: "Surge Risk"
    color: '#ff4d4f'
    max: 100
    origin: sim
  rescue_score:
    label: "Rescued"
    color: '#722ed1'
    max: 100
    origin: native

health_mapping:
  source_variable: health
  scale: [0, 100, 0, 100]
  display: "Stamina"

turns:
  total: 18
  time_per_turn: 1 hour
  env_cards_per_turn: 2
  player_hand_size: 4
  action_points: 2
  draw_per_turn: 2

win_condition:
  type: custom
  description: You reached the road south. Behind you, Vesuvius has swallowed the city.

lose_condition:
  type: custom
  description: Pompeii has claimed you. You are one of the two thousand.

endings:
- grade: S
  condition: escape_progress >= 80 and health > 40 and rescue_score >= 40
  title: "Pliny the Elder's Path"
  description: "You reached safety, and you did not go alone. The people you helped will live to tell the story you helped write. Pliny the Elder chose the same — and died. You survived."
- grade: A
  condition: escape_progress >= 80 and health > 20
  title: "Out of Pompeii"
  description: "Ash-covered, lungs burning, you passed the last milestone before the pyroclastic surge arrived. Most of your neighbors did not."
- grade: B
  condition: escape_progress >= 80 and health <= 20
  title: "Barely"
  description: "You collapsed at the edge of a road outside the city. A farmer found you at dawn. You do not remember how you got there."
- grade: C
  condition: escape_progress < 80 and rescue_score >= 50
  title: "The Ones Who Stayed"
  description: "You died in Pompeii. Your body was found near a group of people who would not have made it without you. The ash preserved you all together."
- grade: D
  condition: escape_progress < 80 and ash_depth >= 70
  title: "Buried"
  description: "The ash took you before the surge did. Archaeologists found your cast eighteen centuries later, arm raised against something that could not be stopped."
- grade: D
  condition: escape_progress < 80 and pyroclastic_risk >= 60
  title: "The Surge"
  description: "The pyroclastic current arrived before you were clear of the city. Death was instantaneous — Mastrolorenzo et al. (2010) measured 300°C at the periphery."

