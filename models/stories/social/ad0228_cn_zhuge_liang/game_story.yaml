meta:
  name: "诸葛亮：出师未捷"
  description: "228年，蜀汉丞相诸葛亮率师北伐，矢志恢复汉室。军粮匮乏、朝廷掣肘、魏军坚守，而他以羸弱之躯，将一切军务揽于一身——食少事烦，其能久乎？"
  difficulty: hard
  period_start: "228"
  period_end: "234"
  tags: [Politics, History, China, War, Ancient]
  country: CN
  author: ""
  version: "0.1"
  created_on: 2026-04-15
  source_scenario: "scenarios/social/ad0228_cn_zhuge_liang.yaml"

card_back_fate:   ""
card_back_player: ""

music: []

initial_state:
  health:    70
  strategy:  0
  supply:    80
  morale:    70

variable_display:
  health:
    label: "丞相体力"
    color: "#52c41a"
    max: 100
    higher_is_better: true
  strategy:
    label: "北伐进度"
    color: "#1677ff"
    max: 100
    higher_is_better: true
  supply:
    label: "军粮储备"
    color: "#faad14"
    max: 100
    higher_is_better: true
  morale:
    label: "军心士气"
    color: "#722ed1"
    max: 100
    higher_is_better: true

health_mapping:
  source_variable: health
  scale: [0, 100, 0, 100]
  display: "丞相体力"

turns:
  total: 15
  time_per_turn: "约12天"
  env_cards_per_turn: 2
  player_hand_size: 6    # H=6: 丞相统揽全局，但体力有限
  action_points: 3       # p=3: 军事/政务/休养三线并行
  draw_per_turn: 3       # a=3: b=H-a=3，有基本战略储备

win_condition:
  type: reach_target
  target_variable: strategy
  target_value: 80
  description: "北伐战略进度达到80，完成一次成功的战役规划，威震魏境"

lose_condition:
  type: health_zero
  description: "丞相积劳成疾，五丈原秋风中，出师未捷身先死"

endings:
  - grade: S
    condition: "health >= 50 and strategy >= 80"
    title: "中原可期"
    description: "以健全之躯完成北伐布局，蜀汉江山或有一线生机。历史从未给诸葛亮这样的结局，但模型告诉我们：本可以不同。"
  - grade: A
    condition: "health > 0 and strategy >= 80"
    title: "带伤的胜利"
    description: "以残躯完成战略目标。他知道代价，他仍选择前行。丞相之志，天地可鉴。"
  - grade: B
    condition: "health > 30 and strategy >= 60"
    title: "未竟之业"
    description: "战略推进过半，但时间和体力都不够了。种子已种下，后继者能否收获？"
  - grade: D
    condition: "health <= 0"
    title: "出师未捷身先死"
    description: "五丈原秋风起，丞相星落。长使英雄泪满襟。历史就是这样结束的。"

env_deck:
  - path: cards/env_supply_cutoff.yaml
    weight: 220
  - path: cards/env_court_interference.yaml
    weight: 180
  - path: cards/env_wei_ambush.yaml
    weight: 160
  - path: cards/env_camp_disease.yaml
    weight: 130
  - path: cards/env_autumn_rain.yaml
    weight: 100
  - path: cards/env_soldier_loyalty.yaml
    weight: 70

player_deck:
  - path: cards/player_military_planning.yaml
    copies: 4
  - path: cards/player_inspect_troops.yaml
    copies: 3
  - path: cards/player_dispatch_supply.yaml
    copies: 3
  - path: cards/player_rest.yaml
    copies: 4
  - path: cards/player_memorial.yaml
    copies: 2
  - path: cards/player_delegate.yaml
    copies: 2

generic_cards:
  inject: [rest, interrupt]
