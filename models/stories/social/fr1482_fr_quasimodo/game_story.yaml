meta:
  name: "卡西莫多：钟楼之上"
  description: "他把她从绞架上夺下来，藏进圣母院。圣母院是他的整个世界。他的身体是痛的，他的心是清醒的。外面的人想要她死。他必须让他们无法得手。"
  difficulty: medium
  period_start: "1482-01"
  period_end: "1482-02"
  tags: [Disability, Love, Protection, France, Literature]
  country: FR
  author: ""
  version: "0.1"
  created_on: 2026-04-16
  source_scenario: "scenarios/social/fr1482_fr_quasimodo.yaml"

card_back_fate:   ""
card_back_player: ""

music: []

initial_state:
  sanctuary_integrity: 80
  esmeralda_hope:      35
  quasimodo_health:    70
  external_pressure:   30

variable_display:
  sanctuary_integrity:
    label: "庇护所安全"
    color: "#1677ff"
    max: 100
    higher_is_better: true
  esmeralda_hope:
    label: "艾丝美拉达的希望"
    color: "#faad14"
    max: 100
    higher_is_better: true
  quasimodo_health:
    label: "卡西莫多的体力"
    color: "#52c41a"
    max: 100
    higher_is_better: true
  external_pressure:
    label: "外部威胁"
    color: "#f5222d"
    max: 100
    higher_is_better: false

health_mapping:
  source_variable: quasimodo_health
  scale: [0, 100, 0, 100]
  display: "卡西莫多的体力"

turns:
  total: 10
  time_per_turn: "3天"
  env_cards_per_turn: 2
  player_hand_size: 4
  action_points: 2
  draw_per_turn: 2

win_condition:
  type: reach_target
  target_variable: esmeralda_hope
  target_value: 70
  description: "让艾丝美拉达在最黑暗的时刻相信有人真正在乎她"

lose_condition:
  type: health_zero
  description: "卡西莫多的身体垮了。圣母院的大门，终于被撞开了。"

endings:
  - grade: S
    condition: "esmeralda_hope >= 70 and sanctuary_integrity >= 60"
    title: "钟楼上的誓言"
    description: "她活了下来，至少在这个故事的分支里。他守住了他能守住的一切。"
  - grade: A
    condition: "esmeralda_hope >= 70"
    title: "她知道了"
    description: "她知道他爱她。不是那种浪漫的爱，而是更深的东西。"
  - grade: B
    condition: "quasimodo_health >= 40 and external_pressure < 70"
    title: "还能守住一会儿"
    description: "他还没有倒下。也许奇迹会发生。历史记载没有奇迹，但也许在这个版本里。"
  - grade: D
    condition: "quasimodo_health <= 0 or sanctuary_integrity <= 10"
    title: "弗罗洛的背叛"
    description: "弗罗洛出卖了她。圣母院的庇护失效了。卡西莫多把弗罗洛从塔顶推了下去，然后去找她的坟墓。"

env_deck:
  - path: cards/env_mob_attacks.yaml
    weight: 200
  - path: cards/env_frollo_manipulates.yaml
    weight: 180
  - path: cards/env_food_runs_low.yaml
    weight: 160
  - path: cards/env_esmeralda_despairs.yaml
    weight: 170
  - path: cards/env_royal_decree.yaml
    weight: 150
  - path: cards/env_gringoire_visits.yaml
    weight: 80

player_deck:
  - path: cards/player_defend_walls.yaml
    copies: 4
  - path: cards/player_care_for_esmeralda.yaml
    copies: 3
  - path: cards/player_pour_hot_lead.yaml
    copies: 2
  - path: cards/player_endure_pain.yaml
    copies: 3
  - path: cards/player_seek_negotiation.yaml
    copies: 2

generic_cards:
  inject: [rest, interrupt]
