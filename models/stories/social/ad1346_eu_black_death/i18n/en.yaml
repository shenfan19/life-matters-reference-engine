meta:
  name: "Black Death — Europe, 1346"
  description: "1346. The plague arrives in Europe along the Silk Road. Within three years, one-third of the continent's population is dead. As the leader of a medieval village, every decision has a cost — quarantine or maintain trade? Pray or evacuate? There are no right answers here, only trade-offs."
  science_note: "Based on a turn-based discrete simplification of the historical epidemiological SIR model (R₀≈2.5). Each turn represents approximately two weeks. Epidemic intensity corresponds to infection rate, preserving the core transmission–death–social-stress dynamics while omitting spatial spread."

variable_display:
  health:
    label: "Survival"
  epidemic:
    label: "Epidemic Intensity"
  food:
    label: "Food Reserves"
  faith:
    label: "Social Cohesion"

lose_conditions:
  - message: "【Failure】The last survivor has fallen. The plague has consumed the entire community. This land falls silent."
  - message: "【Failure】The Black Death is completely out of control. No physician can help. None survive."

