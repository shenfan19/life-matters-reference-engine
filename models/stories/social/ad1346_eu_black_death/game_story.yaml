meta:
  name: 黑死病：1346年的欧洲
  description: 1346年，鼠疫沿丝绸之路抵达欧洲。三年内，三分之一的欧洲人口消亡。作为一个中世纪小镇的领导者，你面临的每一个决策都有代价——隔离还是保持贸易？祈祷还是疏散？这里没有正确答案，只有权衡。
  difficulty: medium
  tags: [History, Epidemic, Medieval]
  period_start: "1346"
  period_end: "1353"
  country: Europe
  card_back_fate: ""
  card_back_player: ""
  music: []
  science_note: 本场景基于历史流行病学SIR模型（R₀≈2.5）的回合制离散化简化。每回合约代表两周时间，疫情烈度对应感染率，保留了传播–死亡–社会应激的核心动力学，舍弃了空间扩散维度。
  version: '0.1'
  created_on: 2026-03-23
  languages: [zh-CN, en]
initial_state:
  health: 100
  epidemic: 8
  food: 80
  faith: 55
variable_display:
  health:
    label: 生存指数
    color: '#52c41a'
    max: 100
  epidemic:
    label: 疫情烈度
    color: '#f5222d'
    max: 100
  food:
    label: 食物储备
    color: '#faad14'
    max: 100
  faith:
    label: 社会凝聚
    color: '#1677ff'
    max: 100
health_mapping:
  source_variable: health
  scale:
  - 0
  - 100
  - 0
  - 100
  display: 生存指数
turns:
  total: 15
  time_per_turn: 1 month
  env_cards_per_turn: 2
  player_hand_size: 2   # H=2: 底层平民，选项极少
  action_points: 1      # p=1: 每回合只能做一件事
  draw_per_turn: 2      # a=2: b=0，a>p → 手牌常年溢出，被迫弃牌
win_condition:
  type: custom
  description: 目标达成。
lose_condition:
  type: custom
  description: 最后一位幸存者倒下了。疫情彻底夺走了你的社区，这片土地从此沉寂。
endings:
- grade: D
  condition: health <= 0
  title: 失败
  description: 最后一位幸存者倒下了。疫情彻底夺走了你的社区，这片土地从此沉寂。
- grade: D
  condition: epidemic >= 100
  title: 失败
  description: 黑死病完全失控，医者束手无策，无一人幸免。
