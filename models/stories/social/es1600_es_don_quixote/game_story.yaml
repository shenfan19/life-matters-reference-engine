meta:
  name: "堂吉诃德：骑士的征途"
  description: "他把风车当成巨人，把旅馆当成城堡，把羊群当成军队。每一次战斗他都输。每一次输了，他都找到了一个理由继续。也许世界需要有人坚信一些不存在的事情。也许代价太高了。"
  difficulty: medium
  period_start: "1605-01"
  period_end: "1608-01"
  tags: [Idealism, Delusion, Spain, Literature, Comedy]
  country: ES
  author: ""
  version: "0.1"
  created_on: 2026-04-16
  source_scenario: "scenarios/social/es1600_es_don_quixote.yaml"

card_back_fate:   ""
card_back_player: ""

music: []

initial_state:
  ideal_strength:   95
  physical_health:  65
  social_ridicule:  20
  actual_good_done: 0

variable_display:
  ideal_strength:
    label: "骑士信念"
    color: "#1677ff"
    max: 100
    higher_is_better: true
  physical_health:
    label: "身体状态"
    color: "#52c41a"
    max: 100
    higher_is_better: true
  social_ridicule:
    label: "被嘲笑程度"
    color: "#faad14"
    max: 100
    higher_is_better: false
  actual_good_done:
    label: "真实善行"
    color: "#722ed1"
    max: 100
    higher_is_better: true

health_mapping:
  source_variable: physical_health
  scale: [0, 100, 0, 100]
  display: "身体状态"

turns:
  total: 12
  time_per_turn: "3个月"
  env_cards_per_turn: 2
  player_hand_size: 5
  action_points: 2
  draw_per_turn: 2

win_condition:
  type: reach_target
  target_variable: actual_good_done
  target_value: 60
  description: "在荒诞的追求中，真正帮助了足够多的人"

lose_condition:
  type: health_zero
  description: "他的身体已经承受不住了。他在回家的路上倒下，清醒地知道自己是谁，悲恸地明白骑士精神只是一场梦。"

endings:
  - grade: S
    condition: "actual_good_done >= 60 and ideal_strength >= 60"
    title: "忧伤骑士"
    description: "他确实做了一些好事。也许是因为错误的理由，但好事是真实的。也许这才是骑士精神的真正形态。"
  - grade: A
    condition: "actual_good_done >= 60"
    title: "比他们想象的更聪明"
    description: "他比任何人看起来都更明白世界是什么样的。他选择不承认这一点，是因为这样活着更有意义。"
  - grade: B
    condition: "ideal_strength >= 70 and physical_health >= 40"
    title: "下一次征途"
    description: "他还没有被打败。风车还在，他的长矛也还在。"
  - grade: D
    condition: "physical_health <= 0"
    title: "清醒的死亡"
    description: "他在临终前清醒了，知道了自己真正的名字，恨自己曾经是那个荒唐的人。桑丘在哭，因为桑丘更喜欢那个荒唐的人。"

env_deck:
  - path: cards/env_windmill_battle.yaml
    weight: 180
  - path: cards/env_beaten_by_merchants.yaml
    weight: 170
  - path: cards/env_sancho_doubts.yaml
    weight: 150
  - path: cards/env_knight_of_moon.yaml
    weight: 160
  - path: cards/env_shepherd_helps.yaml
    weight: 90
  - path: cards/env_innkeeper_laughs.yaml
    weight: 140

player_deck:
  - path: cards/player_charge_windmill.yaml
    copies: 4
  - path: cards/player_noble_speech.yaml
    copies: 3
  - path: cards/player_listen_to_sancho.yaml
    copies: 3
  - path: cards/player_help_traveler.yaml
    copies: 3
  - path: cards/player_rest_and_read.yaml
    copies: 3

generic_cards:
  inject: [rest, interrupt]
