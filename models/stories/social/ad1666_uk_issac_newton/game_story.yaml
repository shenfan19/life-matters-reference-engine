meta:
  name: "艾萨克·牛顿：苹果树下的宇宙"
  description: "1665年，鼠疫席卷英格兰，剑桥大学关闭，年轻的牛顿被迫回到乡间的伍尔斯索普庄园。与世隔绝的两年，他独自推导出了微积分、发现了万有引力、拆解了光的秘密。在困境中，一个人改变了人类对宇宙的认知。"
  difficulty: medium
  tags: [Science, 17th Century]
  period_start: "1665"
  period_end: "1667"
  country: UK
  author: ""
  version: "0.2"
  languages: [zh-CN, en]
  created_on: 2026-03-23
  source_scenario: "scenarios/social/ad1666_uk_issac_newton"
  science_note: >
    本场景基于认知负荷理论（Sweller 1988）与历史传记（Westfall 1980）。
    洞见积累公式：insight_gain = study_intensity × (1 - fatigue/120) × (nutrition/80)，
    即疲劳和营养共同调制研究效率。这与牛顿常因沉浸研究忘记进食的历史记录吻合——
    忽视饮食会降低认知效率，形成反直觉的负反馈。
    优化目标：在鼠疫约束和有限预算下，找到研究强度与休养饮食的帕累托最优分配。
  card_back_fate:   assets/card_back_fate.jpg
  card_back_player: assets/card_back_player.jpg
  music:
    - assets/sonatas_k-005_(c)sankey.mid
    - assets/sonatas_k-006_(c)sankey.mid

initial_state:
  health:    85
  insight:    5
  nutrition: 60
  fatigue:   20
  money:     15

variable_display:
  health:
    label: "生命值"
    color: "#52c41a"
    max: 100
    higher_is_better: true
  nutrition:
    label: "营养状态"
    color: "#faad14"
    max: 100
    higher_is_better: true
  fatigue:
    label: "心智疲劳"
    color: "#f5222d"
    max: 100
    higher_is_better: false
  money:
    label: "金钱"
    color: "#722ed1"
    max: 30
    higher_is_better: true
  insight:
    label: "科学洞见"
    color: "#1677ff"
    max: 100
    higher_is_better: true

health_mapping:
  source_variable: health
  scale: [0, 100, 0, 100]
  display: "生命值"

turns:
  total: 12
  time_per_turn: "1 month"
  env_cards_per_turn: 2
  player_hand_size: 5   # H=5: 剑桥学者，无性别歧视压制，资源略优于居里
  action_points: 2      # p=2: 深度思考型，专注而非多线
  draw_per_turn: 2      # a=2: b=3，较大战略纵深

win_condition:
  type: reach_target
  target_variable: insight
  target_value: 100
  description: "洞见积累到 100，完成奇迹年的核心理论发现"

endings:
  - grade: S
    condition: "health >= 70 and insight >= 100"
    title: "Annus Mirabilis"
    description: "以充沛的状态完成奇迹年，为日后《自然哲学的数学原理》奠定全部理论基础。后人将这两年称为人类历史上个人智识最高产的时期。"
  - grade: A
    condition: "health > 0 and insight >= 100"
    title: "带着疲惫的天才"
    description: "心力交瘁，但那些思想已经写进了人类历史。牛顿后来花了20年才发表——也许因为他太累了。"
  - grade: B
    condition: "health > 40 and insight >= 60"
    title: "半完成的革命"
    description: "部分核心发现已成形，但还需要更多时间。莱布尼茨后来独立发现了微积分——历史没有等人。"
  - grade: D
    condition: "health <= 0"
    title: "未完成的原理"
    description: "苹果落下了，但没人记录它的意义。那些手稿在阁楼里沉睡，世界又等了一百年。"

env_deck:
  - path: cards/env_trinity_stipend.yaml
  - path: cards/env_plague.yaml
    weight: 200
  - path: cards/env_poverty.yaml
    weight: 150
  - path: cards/env_isolation.yaml
    weight: 100
  - path: cards/env_eyestrain.yaml
    weight: 120
  - path: cards/env_academic_rivalry.yaml
    weight: 80
  - path: cards/env_forgot_to_eat.yaml
    weight: 160

player_deck:
  - path: cards/player_contemplation.yaml
    copies: 2
  - path: cards/player_prism.yaml
    copies: 2
  - path: cards/player_calculus.yaml
    copies: 2
  - path: cards/player_write.yaml
    copies: 2
  - path: cards/player_rest.yaml
    copies: 2
  - path: cards/player_correspondence.yaml
    copies: 2
  - path: cards/player_eat_bread.yaml
    copies: 2
  - path: cards/player_eat_pottage.yaml
    copies: 2
  - path: cards/player_drink_ale.yaml
    copies: 2
  - path: cards/player_eat_meat.yaml
    copies: 2

generic_cards:
  inject: [rest, interrupt]
