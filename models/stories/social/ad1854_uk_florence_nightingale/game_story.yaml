meta:
  name: "Florence Nightingale — Scutari, 1854"
  description: |
    November 1854. You are Florence Nightingale, newly arrived at the Barrack Hospital in Scutari.
    The wards smell of death. Rats run beneath the cots. Men are dying — not from their wounds,
    but from cholera, dysentery, typhus — preventable diseases born of filth and neglect.

    The army doctors resent your presence. The supply chain is broken. The War Office is
    indifferent. But you have your notebooks, your lamp, and the silent testimony of 42 men
    dying out of every 100 admitted.

    Every day you stay wears you down. Every reform you push through saves lives you will
    never know. How much of yourself will you give?
  difficulty: hard
  period_start: "1854"
  period_end: "1856"
  country: Turkey (Crimean War)
  science_note: |
    Florence Nightingale's sanitation reforms at Scutari reduced ward mortality from 42.7%
    (February 1855) to 2.2% (January 1856) — a 20-fold reduction in 5 months. Her polar
    area diagrams ("Rose Charts") were among the first uses of statistical visualization
    to drive public health policy.
    Sources: McDonald L (2010) Florence Nightingale: The Crimean War. Wilfrid Laurier
    University Press; Cook ET (1913) The Life of Florence Nightingale. Macmillan;
    Nightingale F (1858) Notes on Matters Affecting the Health, Efficiency and Hospital
    Administration of the British Army. Harrison & Sons.
  card_back_fate: assets/card_back_fate.jpg
  card_back_player: assets/card_back_player.jpg
  version: "0.1"
  created_on: 2026-04-25
  base_language: en
  languages: [en, zh-CN]
  tags: [History, Medicine, War, 19th Century]
  era: "19th century"
  themes:
    - Medicine
    - War
    - Social Reform
  medical:
    - Public Health
    - Nursing
    - Epidemic

initial_state:
  health: 100
  ward_mortality: 85     # 归一化：初始42%死亡率映射为85（危险度量，非百分比）
  fatigue_accumulation: 0
  battle_progress: 0

variable_display:
  health:
    label: Florence
    color: '#52c41a'
    max: 100
    origin: sim
  ward_mortality:
    label: 病房死亡率
    color: '#ff4d4f'
    max: 100
    origin: sim
  fatigue_accumulation:
    label: 疲劳累积
    color: '#fa8c16'
    max: 100
    origin: native
  battle_progress:
    label: 改革进度
    color: '#722ed1'
    max: 100
    origin: native

health_mapping:
  source_variable: health
  scale: [0, 100, 0, 100]
  display: Florence's Health

turns:
  total: 14
  time_per_turn: 1 month
  env_cards_per_turn: 2
  player_hand_size: 4
  action_points: 2
  draw_per_turn: 2

win_condition:
  type: custom
  description: 死亡率下降了。战争办公室注意到了。你的改革将超越这场战争而存在。

lose_condition:
  type: custom
  description: 你倾尽所有，而病房里的人还在一个个死去。

endings:
- grade: S
  condition: health > 40 and ward_mortality < 20 and battle_progress >= 70
  title: 提灯女神
  description: "死亡率从42%降至5%以下。玫瑰图已递交议会。你将用余生继续改革护理制度——但你活着看到了它的开始。"
- grade: A
  condition: health > 0 and ward_mortality < 35 and battle_progress >= 50
  title: 战争悄然被赢下
  description: "病房变干净了，死亡减少了。你带着残破的健康回到英国，目的未竟，但门已打开。"
- grade: B
  condition: health > 0 and ward_mortality < 55
  title: 播下的种子
  description: "你活下来了。改革尚不完整，但方向已定。你的后继者会完成你开始的事。"
- grade: C
  condition: health <= 0 and battle_progress >= 60
  title: 为改革而献身
  description: "克里米亚热带走了你的健康，但你的统计报告已到达正确的人手中。你永远无法完全康复，但你改变的体制将拯救数以千计的生命。"
- grade: D
  condition: health <= 0 and battle_progress < 30
  title: 被病房吞噬
  description: "你将一切给予了这里，但官僚机器太慢，物资太少。死亡率几乎没有变化。弗洛伦斯·南丁格尔这个名字历史不会遗忘——但病房记住了代价。"

