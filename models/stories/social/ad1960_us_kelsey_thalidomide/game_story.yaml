meta:
  name: "凯尔西：守护生命的守门人"
  description: "1960年，弗朗西斯·凯尔西加入FDA，接手了她的第一个案例——沙利度胺（反应停）的上市申请。药企的压力如潮水般涌来，但她坚持要求更多安全证据。在这场与时间、权力和利益的博弈中，科学良知是唯一的武器。"
  difficulty: hard
  period_start: "1960"
  period_end: "1962"
  tags: [Medicine, Women, 20th Century, Public Health]
  country: US
  author: ""
  version: "0.1"
  created_on: 2026-04-06
  source_scenario: ""

card_back_fate:   card_backs/fate.png
card_back_player: card_backs/player.png

music:
  - music/organ_other_works_bwv-584_(c)luquet.mid

initial_state:
  health: 100
  evidence: 0
  credibility: 60

health_mapping:
  source_variable: health
  scale: [0, 100, 0, 100]
  display: "意志力"

turns:
  total: 12
  time_per_turn: "2 months"
  env_cards_per_turn: 2
  player_hand_size: 5   # H=5: 政府官员，有制度支撑
  action_points: 2      # p=2: 官僚体系，决策谨慎而慢
  draw_per_turn: 2      # a=2: b=3，有积累空间

win_condition:
  type: reach_target
  target_variable: evidence
  target_value: 100
  description: "证据积累到 100，科学数据足以支持拒绝沙利度胺的上市申请"

lose_condition:
  type: health_zero
  description: "在持续的压力与骚扰下意志崩溃，被迫批准了那份申请"

endings:
  - grade: S
    condition: "health >= 70 and evidence >= 100"
    title: "科学的胜利"
    description: "以坚定的意志和充分的证据拒绝了沙利度胺。数以千计的婴儿免于出生缺陷。肯尼迪总统亲自为她颁发杰出联邦文职人员奖。"
  - grade: A
    condition: "health > 0 and evidence >= 100"
    title: "带伤的守护"
    description: "身心俱疲，但科学证据终于足够充分。申请被驳回，美国成为少数几个幸免于难的国家。"
  - grade: B
    condition: "health > 30 and evidence >= 70"
    title: "尚未完成的证明"
    description: "证据仍在积累，申请继续被搁置。时间在流逝，欧洲的报告正陆续传来，真相即将大白于天下。"
  - grade: D
    condition: "health <= 0"
    title: "被压垮的守门人"
    description: "在无休止的压力下，她的意志终于动摇。沙利度胺获批上市。几个月后，欧洲畸形儿出生的消息传来，让每个人都无法安眠。"

env_deck:
  - path: cards/env_company_pressure.yaml
    weight: 220
  - path: cards/env_superior_pressure.yaml
    weight: 160
  - path: cards/env_media_scrutiny.yaml
    weight: 120
  - path: cards/env_nerve_damage_report.yaml
    weight: 110
  - path: cards/env_european_withdrawal.yaml
    weight: 70
  - path: cards/env_birth_defect_news.yaml
    weight: 50

player_deck:
  - path: cards/player_review_files.yaml
    copies: 3
  - path: cards/player_demand_data.yaml
    copies: 3
  - path: cards/player_consult_expert.yaml
    copies: 3
  - path: cards/player_document_concerns.yaml
    copies: 3
  - path: cards/player_rest.yaml
    copies: 3
  - path: cards/player_write_report.yaml
    copies: 3

generic_cards:
  inject: [rest, interrupt]
