meta:
  name: "Hippocrates — Athens, 430 BC"
  description: |
    Athens, summer 430 BC. Sparta's army has returned to ravage Attica for the second year.
    The city walls are packed with refugees from the countryside. Then something worse arrives:
    a plague of unknown origin, unlike anything in living memory.

    You are a physician trained in the new tradition of observation and reason. The priests
    say it is divine punishment. The herbalists have their potions. You have only your eyes,
    your records, and the conviction that what can be observed can be understood.

    Every patient you treat risks infecting you. Every day you survive, you learn more.
    Every case you document may save the next generation — if Athens survives this one.
  science_note: |
    The Plague of Athens (430–426 BC) killed an estimated 25% of the city's population,
    including the general Pericles. Thucydides' clinical account (History of the Peloponnesian
    War, II.47–54) remains one of the most precise ancient disease descriptions. The Hippocratic
    Corpus established observation-based medicine; treatments emphasising rest, clean water and
    diet showed markedly better outcomes than contemporary ritual alternatives.
    Sources: Thucydides, History of the Peloponnesian War, Book II §47–54;
    Papagrigorakis MJ et al. (2006) Int J Infect Dis 10(3):206–14;
    Nutton V (2004) Ancient Medicine. Routledge.

variable_display:
  health:
    label: "Your Health"
  patient_survival:
    label: "Patient Survival"
  city_resistance:
    label: "City Resistance"
  danger_accumulation:
    label: "Contagion Risk"
  battle_progress:
    label: "Medical Legacy"

win_conditions:
  - message: "【Father of Medicine】The plague recedes. Your records describe symptoms no one had named before. A generation of physicians will train on what you observed here. Athens survives."
  - message: "【The Rational Physician】Patients treated your way are surviving in far greater numbers than those sent to the priests. The evidence is too clear to ignore. The Hippocratic tradition has begun."
  - message: "【Athens Endures】The plague took what it took. You treated who you could, learned what you could. Athens is diminished but not broken."
  - message: "【Martyred for Knowledge】The contagion has claimed you. But your records have been copied and distributed. What you observed here will not die with you."

lose_conditions:
  - message: "【Consumed by the Plague】Athens has lost too many. Among them, an unknown physician whose notebooks were destroyed when his house was burned for fear of contagion."

cards:
  observe_patient:
    name: "Observe the Patient"
    flavor: "The Hippocratic method: systematic observation precedes theory — let symptoms speak for themselves"
  prescribe_rest:
    name: "Prescribe Rest"
    flavor: "The Hippocratic Corpus repeatedly emphasises rest, diet and non-interference over aggressive intervention"
  clean_water:
    name: "Move to Spring Water"
    flavor: "Hippocratic texts record correlation between water source and disease incidence, two thousand years before germ theory"
  document_case:
    name: "Document the Case"
    flavor: "Thucydides' own symptom description matches what we now recognise as typhoid fever (Papagrigorakis et al., 2006)"
  treat_soldiers:
    name: "Treat the Soldiers"
    flavor: "The Plague of Athens killed so many soldiers that the city seriously considered negotiating peace with Sparta (Thucydides, II)"
  player_rest:
    name: "Rest"
    flavor: "Hippocrates himself lived to approximately 90 — unusual longevity in the ancient world, possibly reflecting his own medical self-care"
  env_contagion_risk:
    name: "Contagion Deepens"
    description: "You move between patients. Your hands carry what your eyes cannot see. Each day the risk compounds."
    science: "Thucydides records that physicians who treated plague patients fell ill in high proportions (Thucydides, II.51)"
  env_plague_spreads_athens:
    name: "The Plague Spreads"
    description: "More sick are brought to the city's makeshift hospitals. The stench is everywhere. No neighbourhood is safe now."
    science: "The Plague of Athens spread through the crowded refugee population sheltering within the city walls"
  env_spartan_pressure:
    name: "Spartan Army Returns"
    description: "The Spartans have again ravaged Attica. More refugees flood the city. The garrison is stretched thin."
    science: "Sparta invaded Attica annually during the Archidamian War (431–421 BC)"
  env_superstition_resistance:
    name: "The Priests Intervene"
    description: "The temple of Apollo is full. The priests say this is divine punishment. Families are pulling patients from your care."
    science: "Competing with temple medicine was a constant challenge for early Hippocratic physicians (Nutton, 2004)"
  env_patient_dies:
    name: "Patient Dies in the Night"
    description: "You found them this morning. There was nothing more you could have done — and yet the doubt stays."
    science: "Untreated Plague of Athens cases had estimated mortality of 25–75% (Thucydides, II)"
  env_unexpected_recovery:
    name: "Unexpected Recovery"
    description: "Against all expectation, they lived. Your notes captured the difference — what you gave them that the others did not."
    science: "Thucydides noticed survivors gained immunity, recording it as an observable but unexplained fact (Thucydides, II.51)"
  env_athens_offensive:
    name: "Athens Goes to War"
    description: "Pericles has ordered a counterattack. The army marches out with hope and returns with casualties. Now you must fight both plague and wounds."
    science: "Pericles maintained military operations during the plague, leading to more soldier infections — Thucydides viewed this as a mistake (II.58)"
  env_spartan_withdrawal:
    name: "Sparta Withdraws"
    description: "The Spartans have pulled back — reportedly fearing plague contagion. The siege pressure temporarily eases."
    science: "Thucydides records the Spartan army withdrew early after learning of the Athenian plague, unwilling to approach the infected city (II.57)"
  env_military_plague_death:
    name: "The Plague Claims a General"
    description: "Another general has fallen ill. The army's command chain is unravelling. Athens' capacity to resist Sparta falls with every name struck from the rolls."
    science: "Pericles died of the plague in 429 BC — a decisive blow to Athens' strategic capacity (Thucydides, II.65)"
  env_immune_survivor:
    name: "Immune Survivors"
    description: "A group of recovered citizens volunteers to care for the newly sick — they cannot fall ill again. Your notes are accumulating a new observation."
    science: "Thucydides noted survivors gained immunity, recording it as an observable but unexplained phenomenon (Thucydides, II.51)"
