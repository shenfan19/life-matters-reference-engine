meta:
  name: "希波克拉底 — 雅典，公元前430年"
  description: |
    公元前430年，夏。斯巴达军队已连续第二年蹂躏阿提卡。城墙之内挤满了从乡村逃难而来的人们。然后更糟糕的事情到来了：一场来源不明的瘟疫，是任何人记忆中从未见过的疾病。

    你是一位受过新式观察与理性传统训练的医者。祭司说这是神罚，草药师有他们的方剂，而你只有你的眼睛、你的记录，以及一个信念——能被观察到的，就能被理解。

    你治疗的每一个病人都可能让你感染。你熬过的每一天，你学到的越多。你记录下的每一个病例，也许能拯救下一代人——如果雅典能撑过这一代。
  difficulty: hard
  period_start: "430 BC"
  period_end: "426 BC"
  country: Greece (Athens)
  science_note: |
    雅典瘟疫（公元前430-426年）造成约25%的城市人口死亡，包括名将伯利克里。修昔底德的临床记述（《伯罗奔尼撒战争史》第二卷第47-54节）至今仍是最精确的古代疾病描述之一。希波克拉底文集确立了以观察为基础的医学；强调休息、清洁水源和饮食调节的治疗方案，相较于同期以仪式为主的替代疗法，显示出明显更好的疗效。
    文献来源：修昔底德《伯罗奔尼撒战争史》第二卷第47-54节；
    Papagrigorakis MJ等（2006）古代牙髓DNA检测指向伤寒为雅典瘟疫的可能病因，《国际感染病学杂志》10(3):206-14；
    Nutton V（2004）《古代医学》，Routledge出版社。
  card_back_fate: assets/card_back_fate.jpg
  card_back_player: assets/card_back_player.jpg
  version: "0.1"
  created_on: 2026-04-25
  languages: [zh-CN, en]
  tags: [History, Medicine, Ancient, Epidemic, War]
  era: "Ancient"
  themes:
    - Medicine
    - War
    - Science
  medical:
    - Epidemic
    - Public Health

initial_state:
  health: 100
  patient_survival: 35     # 归一化初始存活率（历史真实约25-30%），目标提升至70+
  city_resistance: 70      # 雅典对抗斯巴达的能力，受瘟疫影响逐步下降
  danger_accumulation: 0
  battle_progress: 0       # 积累的医学知识与救治成果，代表对瘟疫的掌控

variable_display:
  health:
    label: 医者健康
    color: '#52c41a'
    max: 100
    origin: sim
  patient_survival:
    label: 患者存活率
    color: '#1677ff'
    max: 100
    origin: sim
  city_resistance:
    label: 城邦抗力
    color: '#faad14'
    max: 100
    origin: sim
  danger_accumulation:
    label: 传染风险
    color: '#fa8c16'
    max: 100
    origin: native
  battle_progress:
    label: 医学积累
    color: '#722ed1'
    max: 100
    origin: native

health_mapping:
  source_variable: health
  scale: [0, 100, 0, 100]
  display: 医者健康

turns:
  total: 12
  time_per_turn: 2 months
  env_cards_per_turn: 2
  player_hand_size: 4
  action_points: 2
  draw_per_turn: 2

win_condition:
  type: custom
  description: 瘟疫退去了。你的记录，被人抄写、传播。一代又一代的医者将以你今日的观察为基础。

lose_condition:
  type: custom
  description: 雅典已失去太多。你也在其中。

endings:
- grade: S
  condition: health > 50 and patient_survival > 70 and battle_progress >= 70
  title: 医学之父
  description: "瘟疫消退了。你留下的记录描述了前人从未命名的症状。一代医者将以你在此地的观察为训练基础。雅典存活了。"
- grade: A
  condition: health > 0 and patient_survival > 55 and battle_progress >= 50
  title: 理性的医者
  description: "你的方式救活的病人，比祭司的仪式多出数倍。证据太明显，已无法忽视。希波克拉底传统由此开始。"
- grade: B
  condition: health > 0 and city_resistance > 40
  title: 雅典坚守
  description: "瘟疫夺走了它该夺走的。你治愈了你能治愈的，学到了你能学到的。雅典削弱了，但没有倒下。"
- grade: C
  condition: health <= 0 and battle_progress >= 60
  title: 以身殉道
  description: "传染病找上了你。但你的案例记录已被复制传播。你的观察不会随你而消失。"
- grade: D
  condition: health <= 0 and battle_progress < 30
  title: 被瘟疫吞噬
  description: "雅典失去了太多人。其中有一位籍籍无名的医者，他的笔记在房屋被焚烧以防传染时化为灰烬。"

