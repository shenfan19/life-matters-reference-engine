meta:
  name: "伊万·伊里奇：体面的终点"
  description: "他做了所有正确的事，住了正确的房子，娶了正确的妻子，担任了正确的职位。然后他开始死去。他的家人继续表演正常。他的医生继续表演专业。只有仆人格拉西姆，真实地坐在他身边。"
  difficulty: medium
  period_start: "1880-01"
  period_end: "1880-05"
  tags: [Death, Dignity, Society, Russia, Literature]
  country: RU
  author: ""
  version: "0.1"
  created_on: 2026-04-16
  source_scenario: "scenarios/social/ru1880_ru_ivan_ilyich.yaml"

card_back_fate:   ""
card_back_player: ""

music: []

initial_state:
  inner_peace:      5
  pain_level:       20
  social_isolation: 60
  dignity:          30

variable_display:
  inner_peace:
    label: "内心平静"
    color: "#52c41a"
    max: 100
    higher_is_better: true
  pain_level:
    label: "痛苦程度"
    color: "#f5222d"
    max: 100
    higher_is_better: false
  social_isolation:
    label: "情感孤立"
    color: "#722ed1"
    max: 100
    higher_is_better: false
  dignity:
    label: "内在尊严"
    color: "#1677ff"
    max: 100
    higher_is_better: true

health_mapping:
  source_variable: inner_peace
  scale: [0, 100, 0, 100]
  display: "内心平静"

turns:
  total: 10
  time_per_turn: "2周"
  env_cards_per_turn: 2
  player_hand_size: 4
  action_points: 2
  draw_per_turn: 2

win_condition:
  type: reach_target
  target_variable: inner_peace
  target_value: 75
  description: "在生命终结前找到真正的平静"

lose_condition:
  type: variable_threshold
  variable: pain_level
  threshold: 95
  description: "痛苦淹没了一切，没有留下空间去找到真相。他在恐惧和愤怒中死去。"

endings:
  - grade: S
    condition: "inner_peace >= 85 and dignity >= 70"
    title: "最后三小时"
    description: "在临终的最后三小时，恐惧消失了。他明白了什么是真正重要的。他死得像一个人。"
  - grade: A
    condition: "inner_peace >= 75 and pain_level < 90"
    title: "格拉西姆的陪伴"
    description: "只有那个农民仆人真正地陪着他。在最后，这就够了。"
  - grade: B
    condition: "inner_peace >= 50 and dignity >= 40"
    title: "部分的清醒"
    description: "他触碰到了一些真实，但没有走到底。也许已经是他能做到的最好。"
  - grade: D
    condition: "pain_level >= 95 or inner_peace < 20"
    title: "体面的虚伪"
    description: "他用一生维持了体面，死亡时也没能放下。家人松了口气。没有人哭泣。"

env_deck:
  - path: cards/env_doctor_visit_useless.yaml
    weight: 200
  - path: cards/env_family_indifference.yaml
    weight: 190
  - path: cards/env_pain_intensifies.yaml
    weight: 180
  - path: cards/env_gerasim_comes.yaml
    weight: 100
  - path: cards/env_false_hope.yaml
    weight: 140
  - path: cards/env_isolation_moment.yaml
    weight: 160

player_deck:
  - path: cards/player_authentic_expression.yaml
    copies: 4
  - path: cards/player_maintain_facade.yaml
    copies: 3
  - path: cards/player_pray_accept.yaml
    copies: 3
  - path: cards/player_call_gerasim.yaml
    copies: 3
  - path: cards/player_endure_pain.yaml
    copies: 3

generic_cards:
  inject: [rest, interrupt]
