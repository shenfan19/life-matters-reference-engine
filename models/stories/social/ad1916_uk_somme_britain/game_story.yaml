meta:
  name: 索姆河：1916年英国步兵的抉择
  description: '1916年7月1日，英国陆军在索姆河发起大规模攻势。 仅第一天，英军伤亡57,470人，19,240人战死——史上最惨烈的单日伤亡之一。
    作为一名普通步兵，你每周领取1先令军饷，面对的选择从不只是进攻或防守： 是否参与突击？伤口如何处理？粮食不足时是否和当地人交换？ 留在前线意味着生死相搏，申请调离意味着被视作懦夫。
    这里没有安全选项，只有不同代价的权衡。

    '
  difficulty: hard
  tags: [History, War, Early 20th Century]
  period_start: "1916"
  period_end: "1916"
  country: France
  science_note: "本场景以索姆河战役历史数据为参数来源。 每回合约代表1周时间（7月-10月间的战斗节奏）。 伤亡事件的概率来自实际战斗记录（英军日均伤亡率3-8%/前线单位/天）。\
    \ 物资短缺基于英军后勤日志中的口粮分配记录（战时Archive, WO 95/…, PRO）。 来源：Keegan J (1998) The First\
    \ World War. Hutchinson;\n       Prior R & Wilson T (2005) The Somme. Yale University\
    \ Press;\n       Sheffield G (2001) Forgotten Victory. Headline Book Publishing.\n"
  card_back_fate:   assets/card_back_fate.jpg
  card_back_player: assets/card_back_player.jpg
  music:
    - assets/sonatas_k-005_(c)sankey.mid
    - assets/sonatas_k-006_(c)sankey.mid
  version: '0.1'
  created_on: 2026-03-23
