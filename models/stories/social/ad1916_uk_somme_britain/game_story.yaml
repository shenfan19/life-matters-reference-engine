win_condition:
  type: custom
  description: 你活过了索姆河，带着积蓄和伤疤回到家乡。大多数人没有这样的运气。
lose_condition:
  type: custom
  description: 你在索姆河的泥泞中倒下。数以万计的战友与你同一命运——历史不会记住每一个名字，但这片土地记得。
endings:
- grade: S
  condition: health > 50 and battle_progress >= 60
  title: 幸存的突击兵
  description: 你不仅活了下来，更是亲眼见证了战线向前推进的那一刻。十四周的地狱，换来了一寸又一寸的土地，而你还在。
- grade: A
  condition: health > 30 and battle_progress >= 40
  title: 使命完成
  description: 你活过了索姆河，带着积蓄和伤疤回到家乡。战线推进了，大多数战友没有这样的运气。
- grade: B
  condition: health > 0 and battle_progress < 40
  title: 苟活
  description: 你活下来了，但战线几乎没有推进。每一条活下来的命都有代价——那些牺牲，换来了什么？
- grade: C
  condition: health <= 0 and battle_progress >= 60
  title: 以命换地
  description: 你在索姆河倒下了，但防线在你们的血肉之上向前推进。历史不记名字，但这片土地记得每一寸。
- grade: D
  condition: health <= 0 and battle_progress < 40
  title: 无谓的牺牲
  description: 你在索姆河的泥泞中倒下，战线却几乎纹丝未动。那一天的意义，史学家争论了一个世纪。
- grade: D
  condition: morale <= 0
  title: 军事法庭
  description: 精神彻底崩溃。军事法庭以懦夫罪将你处决——这在1916年的英国陆军并不罕见。
