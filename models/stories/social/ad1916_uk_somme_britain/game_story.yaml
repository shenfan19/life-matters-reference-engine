win_condition:
  type: custom
  description: 你活过了索姆河，带着积蓄和伤疤回到家乡。大多数人没有这样的运气。
lose_condition:
  type: custom
  description: 你在索姆河的泥泞中倒下。数以万计的战友与你同一命运——历史不会记住每一个名字，但这片土地记得。
endings:
- grade: A
  condition: health > 30 and pay_savings >= 50
  title: 目标达成
  description: 你活过了索姆河，带着积蓄和伤疤回到家乡。大多数人没有这样的运气。
- grade: D
  condition: health <= 0
  title: 失败
  description: 你在索姆河的泥泞中倒下。数以万计的战友与你同一命运——历史不会记住每一个名字，但这片土地记得。
- grade: D
  condition: morale <= 0
  title: 失败
  description: 精神彻底崩溃。军事法庭以懦夫罪将你处决——这在1916年的英国陆军并不罕见。
