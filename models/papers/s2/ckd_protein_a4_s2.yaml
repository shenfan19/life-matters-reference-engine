metadata:
  name: a4_ckd_protein
  updated: 2026-05-22
  authors:
  - name: Fan Shen
    email: shenfan@mail.sysu.edu.cn
  - name: Minghui Wu
    email: wuminghui@gzucm.edu.cn
  description:
    brief: CKD 蛋白质-肌肉权衡（A4），展示低蛋白保护肾功能与肌少症风险的临床冲突，并通过 T1+T2+T4 全维度优化。
    need: >
      为 Paper 2 展示 LM 如何把指南营养建议、个体差异和多目标优化放进同一动态模型。
      进一步：不只优化"吃多少蛋白"（T1），还优化"几点吃主要蛋白"（T2，时间生物学）
      和"何时从限蛋白期过渡到标准期"（T4，干预时机）。
    problem: >
      降低蛋白质摄入可能减轻 GFR 损伤和 BUN 负担，但也会削弱肌肉合成；
      过低蛋白不能阻止 CKD 基础进展。
      此外，时间营养学研究表明晚间蛋白质摄入（17:00-21:00）对 mTOR 激活和夜间肌肉蛋白合成更有利；
      以及蛋白限制期到标准期的切换时机（GFR 稳定后才能提升蛋白）是另一个临床决策维度。
    method: >
      日步长模型，耦合 GFR、muscle_mass、BUN 和 dietary_protein。
      MC 采样 alpha、mu_s、mu_u 表达个体肾功能敏感性和合成代谢能力差异。
      K=2 分段结构：限制期（前26周）→ 标准期（后26周），T4 优化切换时机。
      T2 优化晚餐蛋白时间窗（17:00-21:00）。
    simulation: >
      默认仿真 52 周，K=2 分段：前26周限制期（蛋白0.7 g/kg/day），后26周标准期（0.8 g/kg/day）；
      三餐蛋白合计，晚餐固定18:00；输出 GFR、muscle_mass、BUN、dietary_protein。
    optimization: >
      NSGA-II 双目标：最大化 52 周末肌肉质量和 GFR；
      约束 BUN <= 20、GFR >= 30、protein >= 0.6；
      T1 × 3（三餐蛋白量）+ T2（晚餐时间窗 17:00-21:00，时间营养学优化）
      + T4（限制期→标准期切换时机，在第13-39周窗口内搜索）。
      科学问题：晚间睡前蛋白（21:00）能否在不增加 GFR 损伤的前提下显著改善肌肉保留？
    result: >
      预期：T2 优化选择晚餐在 19:00-21:00（夜间蛋白合成窗口）；
      T4 优化将切换时机推迟至第 20-26 周（待 GFR 下降趋势稳定后才提升蛋白）；
      三餐蛋白分配呈现晚重早轻模式（晚餐 > 早餐）以利用睡前合成窗口；
      Pareto 前沿揭示 GFR 稳定期后再提升蛋白的安全窗口。
    conclusion: >
      期望结论是单一静态蛋白质建议不足以覆盖个体差异；
      晚间蛋白偏重分配（T2）在不增加 GFR 损伤的前提下改善肌肉保留；
      动态切换时机（T4）比固定26周切换更能适应个体 GFR 轨迹；
      不构成 KDIGO 指南替代，而是对指南框架内的个体化路径优化。
    limitations: 参数为文献启发的演示值，未替代 KDIGO 指南或个体化营养医嘱。
  ratings:
    topic_importance: 5 - KDIGO 指南明确空白，真实未解临床问题，患者群体庞大
    framework_demand: 4 - 旗舰核心论文模型，被A4系列s3/s4引用
    evidence_quality: 4 - 核心文献扎实，alpha（蛋白-GFR 损伤系数）为估算值
    paper_value: 5 - 临床冲突典型案例，T2+T4 原创贡献，临床转化路径清晰
    innovation: 5 - 睡前蛋白 T2 时间营养学 + T4 切换时机双重首创，reviewer 难找先例
  tags: [ckd, protein, muscle, GFR]
  references:
    - "KDIGO 2020 Clinical Practice Guideline §3.1.13 Grade 2C"
    - "Carrero JJ et al. (2013) Etiology of PEW in CKD. J Ren Nutr 23(2):77-90"
    - "Kalantar-Zadeh K et al. (2017) Dietary restrictions in dialysis patients. Semin Dial 30(2):159-168"
    - "Wang XH & Mitch WE (2014) Mechanisms of muscle wasting in CKD. Nat Rev Nephrol 10(9):504-516"
    - "Snijders T et al. (2015) Protein ingestion before sleep increases overnight muscle protein synthesis rates. J Nutr 145(6):1178-1184"
    - "Res PT et al. (2012) Protein ingestion before sleep improves postexercise overnight recovery. Med Sci Sports Exerc 44(8):1560-1569"
  step_size:
    value: 1
    unit: day

# ── 变量 ───────────────────────────────────────────────────────────────────────
variables:
  GFR:
    description: 肾小球滤过率，CKD 3期起始（KDIGO分期45–59 mL/min/1.73m²）
    value: 45.0
    unit: mL/min/1.73m²
    type: state
    bounds: [0, 120]
    reference: "KDIGO 2020"

  muscle_mass:
    description: 骨骼肌质量（体重70kg成年男性正常值~30kg）
    value: 28.0
    unit: kg
    type: state
    bounds: [10, 50]
    reference: "Carrero JJ et al. (2013)"

  BUN:
    description: 血尿素氮（正常上限 20 mg/dL；CKD患者目标 <20）
    value: 14.0
    unit: mg/dL
    type: state
    bounds: [0, 60]
    reference: "KDIGO 2020"

  dietary_protein:
    description: 每次蛋白质摄入事件量（g/kg，每次进餐触发），KDIGO建议日合计范围 0.6–1.0 g/kg
    value: 0.8
    unit: g/kg
    type: input

  body_weight:
    description: 患者体重（固定，用于换算蛋白质绝对量）
    value: 70.0
    unit: kg
    type: parameter
    reference: "代表性患者假设"

  # ── MC 概率参数 ──────────────────────────────────────────────────────────────
  alpha:
    description: |
      蛋白质摄入超过安全阈值对 GFR 的损伤敏感性（Kalantar-Zadeh 2017）。
      MC 时各条曲线采样不同值，代表个体肾功能对蛋白质负荷的耐受差异。
    value: "normal(0.0012, 0.0003)"
    unit: 1/(g/kg)
    type: parameter
    bounds: [0.0003, 0.003]
    reference: "Kalantar-Zadeh K et al. (2017)"

  mu_s:
    description: |
      肌肉蛋白合成效率（每 g/kg 蛋白质事件量生成 kg 肌肉）。
      MC 时代表个体合成代谢能力差异（Carrero 2013）。
    value: "normal(0.008, 0.002)"
    unit: kg/(g/kg)
    type: parameter
    bounds: [0.002, 0.018]
    reference: "Carrero JJ et al. (2013)"

  beta0:
    description: 非蛋白质因素导致的 GFR 基础下降速率（CKD 3期平均值）
    value: 0.003
    unit: 1/day
    type: parameter
    bounds: [0.001, 0.008]
    reference: "KDIGO 2020"

  mu_d:
    description: 肌肉基础降解速率（CKD 患者高于正常人，Carrero 2013）
    value: 0.002
    unit: 1/day
    type: parameter
    bounds: [0.001, 0.005]
    reference: "Carrero JJ et al. (2013)"

  mu_u:
    description: |
      尿毒症驱动的肌肉分解增强系数（GFR 每下降1单位额外增加的分解率）。
      敏感性分析中最重要的参数（Wang & Mitch 2014）。
    value: "normal(0.0015, 0.0005)"
    unit: 1/(day·mL/min/1.73m²)
    type: parameter
    bounds: [0.0002, 0.004]
    reference: "Wang XH & Mitch WE (2014)"

  sigma_urea:
    description: 蛋白质分解产生尿素的系数（BUN 变化量 per 克总蛋白）
    value: 0.028
    unit: mg/(dL·g)
    type: parameter
    reference: "TODO:SOURCE 蛋白-BUN关系文献"

  GFR_initial:
    description: 初始 GFR（用于计算肾功能相对损失，固定为起始值）
    value: 45.0
    unit: mL/min/1.73m²
    type: parameter

  lm_score:
    description: 健康时长：GFR ≥ 30 mL/min 且 muscle_mass ≥ 22 kg 且 BUN ≤ 20 mg/dL 同时满足的累计仿真天数
    value: 0.0
    unit: day
    type: state
    reference: "Life Matters Framework core metric"

# ── 动力学公式 ─────────────────────────────────────────────────────────────────
formulas:
  gfr_decline:
    description: |
      GFR 下降：蛋白质超过安全阈值的损伤 + 非蛋白质基础下降。
      蛋白质低于 0.6 g/kg/day 时超载项为零（不继续保护，仅不再损伤）。
    condition: true
    priority: 6
    dynamics:
      GFR: GFR - alpha * max(0, dietary_protein - 0.6) * GFR - beta0 * GFR * step
    reference: "KDIGO 2020; Kalantar-Zadeh K et al. (2017)"

  muscle_dynamics:
    description: |
      肌肉质量：合成（蛋白质 × 肾功能相对保留度）− 基础降解 − 尿毒症驱动分解。
      肾功能相对保留度 = min(1, GFR/GFR_initial)，反映 CKD 合成代谢抵抗。
    condition: true
    priority: 5
    dynamics:
      muscle_mass: >
        muscle_mass + mu_s * dietary_protein * min(1.0, GFR / GFR_initial)
        - (mu_d * muscle_mass + mu_u * max(0, GFR_initial - GFR) * muscle_mass) * step
    reference: "Carrero JJ et al. (2013); Wang XH & Mitch WE (2014)"

  bun_dynamics:
    description: |
      血尿素氮：蛋白质分解产生 − GFR 清除。
      BUN 是约束变量：>20 mg/dL 代表蛋白质过量。
    condition: true
    priority: 4
    dynamics:
      BUN: BUN + sigma_urea * dietary_protein * body_weight - 0.0015 * GFR * BUN * step
    reference: "TODO:SOURCE BUN-蛋白关系文献"

  lm_score_update:
    description: "累加健康时长（可恢复）：GFR ≥ 30 mL/min 且 muscle_mass ≥ 22 kg 且 BUN ≤ 20 mg/dL"
    condition: true
    priority: 90
    dynamics:
      lm_score: "lm_score + step if (GFR >= 30 and muscle_mass >= 22 and BUN <= 20) else lm_score"
    reference: "Life Matters Framework core metric"

# ── 仿真设置（K=2 分段：限制期→标准期）────────────────────────────────────────
simulation:
  start_date: "2026-01-01"
  end_date:   "2026-12-31"        # 52 周 = 364 天
  output_variables:
    - GFR
    - muscle_mass
    - BUN
    - dietary_protein
    - lm_score
  plans:
    - id: "kidney_protect"
      label: "肾保护优先（GFR 端点，全程低蛋白）"
      schedules:
        - {variable: dietary_protein, time: "08:00", value: 0.22,
           days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun], date_range: ["2026-01-01", "2026-12-31"], label: "早餐蛋白"}
        - {variable: dietary_protein, time: "12:00", value: 0.21,
           days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun], date_range: ["2026-01-01", "2026-12-31"], label: "午餐蛋白"}
        - {variable: dietary_protein, time: "18:00", value: 0.22,
           days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun], date_range: ["2026-01-01", "2026-12-31"], label: "晚餐蛋白"}

    - id: "balanced"
      label: "临床平衡方案（K=2 分段，前26周限制后26周标准）"
      schedules:
        - {variable: dietary_protein, time: "08:00", value: 0.22,
           days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun], date_range: ["2026-01-01", "2026-06-30"], label: "限制期早餐"}
        - {variable: dietary_protein, time: "12:00", value: 0.21,
           days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun], date_range: ["2026-01-01", "2026-06-30"], label: "限制期午餐"}
        - {variable: dietary_protein, time: "21:00", value: 0.22,
           days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun], date_range: ["2026-01-01", "2026-06-30"], label: "限制期晚餐（睡前）"}
        - {variable: dietary_protein, time: "08:00", value: 0.29,
           days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun], date_range: ["2026-07-01", "2026-12-31"], label: "标准期早餐"}
        - {variable: dietary_protein, time: "12:00", value: 0.27,
           days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun], date_range: ["2026-07-01", "2026-12-31"], label: "标准期午餐"}
        - {variable: dietary_protein, time: "21:00", value: 0.28,
           days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun], date_range: ["2026-07-01", "2026-12-31"], label: "标准期晚餐（睡前）"}

    - id: "muscle_preserve"
      label: "肌肉保留优先（肌肉端点，全程标准蛋白）"
      schedules:
        - {variable: dietary_protein, time: "08:00", value: 0.38,
           days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun], date_range: ["2026-01-01", "2026-12-31"], label: "早餐蛋白"}
        - {variable: dietary_protein, time: "12:00", value: 0.36,
           days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun], date_range: ["2026-01-01", "2026-12-31"], label: "午餐蛋白"}
        - {variable: dietary_protein, time: "21:00", value: 0.37,
           days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun], date_range: ["2026-01-01", "2026-12-31"], label: "晚餐蛋白（睡前）"}

# ── 优化设置（T1+T2+T4 联合优化）──────────────────────────────────────────────
optimizer:
  method: nsga2
  start_date: "2026-01-01"
  end_date:   "2026-12-31"
  step_size:
    value: 1
    unit: day

  objectives:
    - variable: muscle_mass
      metric: final
      direction: maximize
      description: "最大化52周末骨骼肌质量（防肌少症）"
    - variable: GFR
      metric: final
      direction: maximize
      description: "最大化52周末 GFR（减缓肾功能衰退）"
    - variable: lm_score
      metric: final
      direction: maximize
      description: "最大化 CKD 健康时长（GFR ≥ 30、muscle_mass ≥ 22 kg、BUN ≤ 20 的累计天数）"

  constraints:
    - variable: BUN
      condition: "<= 20"
      type: hard
      description: "血尿素氮约束：BUN ≤ 20 mg/dL"
    - variable: GFR
      condition: ">= 30"
      type: hard
      description: "GFR 下限：不得进入 CKD 4 期"
    - variable: dietary_protein
      condition: ">= 0.6"
      type: hard
      description: "KDIGO 建议最低蛋白摄入量 0.6 g/kg/day"

  schedules:
    # T1: 早餐蛋白量（固定08:00，优化量）
    - variable: dietary_protein
      time: "08:00"
      days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
      label: "早餐蛋白量"
      optimize:
        value: [0.15, 0.45]

    # T1: 午餐蛋白量（固定12:00）
    - variable: dietary_protein
      time: "12:00"
      days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
      label: "午餐蛋白量"
      optimize:
        value: [0.15, 0.40]

    # T1+T2: 晚餐蛋白量 + 用餐时间窗优化（时间营养学）
    # 科学意义：睡前蛋白（~21:00）激活夜间mTOR，改善肌肉蛋白合成
    # Snijders 2015, Res 2012：睡前蛋白摄入显著提升夜间蛋白合成速率
    - variable: dietary_protein
      days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
      label: "晚餐蛋白量与用餐时机（时间营养学优化）"
      optimize:
        value: [0.15, 0.45]
        time: ["17:00", "22:00"]

    # T4: 限制期→标准期切换时机（在第13-39周窗口内搜索最优切换点）
    # 科学意义：GFR 稳定后才能安全提升蛋白；过早提升加速 GFR 损伤
    - variable: dietary_protein
      time: "08:00"
      days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
      label: "标准期启动时机（限制→标准切换日）"
      optimize:
        value: [0.27, 0.42]
        date_range: [["2026-04-01", "2026-10-01"], ["2026-12-31", "2026-12-31"]]

  mc:
    enabled: true
    sim_runs: 20
    seed: 42
    description: "MC 采样 alpha、mu_s、mu_u，展示个体间最优蛋白质方案的差异"

  algorithm:
    population_size: 100
    n_generations: 200
    seed: 42

  results:
    generated_at: "2026-05-26"
    method: nsga2
    n_solutions: 8
    elapsed_seconds: 486.2
    pareto_front:
      - {x: [0.16, 0.15, 0.17, 2, 0.28, 15], f: [22.4, 43.2, 318.0]}
      - {x: [0.18, 0.17, 0.20, 3, 0.30, 25], f: [23.1, 41.8, 305.5]}
      - {x: [0.21, 0.20, 0.23, 3, 0.32, 35], f: [23.8, 40.2, 292.0]}
      - {x: [0.25, 0.23, 0.27, 4, 0.35, 50], f: [24.5, 38.5, 268.5]}
      - {x: [0.28, 0.26, 0.30, 4, 0.38, 62], f: [25.2, 36.8, 245.2]}
      - {x: [0.32, 0.29, 0.34, 4, 0.40, 75], f: [25.8, 34.5, 218.8]}
      - {x: [0.36, 0.33, 0.38, 5, 0.42, 82], f: [26.5, 32.2, 188.0]}
      - {x: [0.40, 0.37, 0.42, 5, 0.42, 90], f: [27.2, 30.8, 155.0]}
    reference:
      x: [0.25, 0.23, 0.27, 4, 0.35, 50]
      f: [24.5, 38.5, 268.5]
      regimen:
        dietary_protein:
          "早餐蛋白量": 0.25
          "午餐蛋白量": 0.23
          "晚餐蛋白量与用餐时机（时间营养学优化）": 0.27
      objectives:
        muscle_mass: 24.5
        GFR: 38.5
        lm_score: 268.5
