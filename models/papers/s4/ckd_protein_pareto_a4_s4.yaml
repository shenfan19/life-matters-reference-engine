metadata:
  name: a4_ckd_protein_pareto
  paper: S4
  case_id: A4-S4
  updated: 2026-05-22
  author: Fan Shen
  description:
    brief: CKD 蛋白质-肌肉权衡深化版（A4-P3），扩展 Pareto 前沿搜索并加入 T2 晚餐时机优化。
    need: 为 S4 展示在 S2 A4 基础上扩大种群（pop=150/gen=300）获得更完整 Pareto 前沿，并验证 T2 晚餐时机优化的稳健性。
    problem: >
      Paper 2 A4 使用 pop=100/gen=200，可能遗漏 Pareto 前沿尾端。
      扩大搜索同时验证：时间营养学（T2 晚餐时机）结论在更大搜索空间下是否稳健？
      K×4 前沿覆盖度与 hypervolume 是否优于静态指南点？
    method: >
      继承 Paper 2 A4 全部变量、公式和约束（imports）。
      扩展 NSGA-II：pop=150, gen=300, MC=30次；
      保持 T1+T2+T4 优化维度与 Paper 2 完全一致，用于直接比较。
    simulation: 继承 Paper 2 A4 的 52 周 K=2 分段仿真；Pareto 前沿解数预期从 6 增至 10+。
    optimization: >
      NSGA-II 双目标（同 Paper 2 A4）+ 更大搜索预算；
      T1×3（三餐蛋白量）+ T2（晚餐时间窗 17:00-22:00）+ T4（阶段切换时机）；
      对比焦点：大预算下 T2 选择的最优晚餐时间是否向 21:00 偏移？
    result: 预期 Pareto 前沿更完整（10-15个解），hypervolume 提升约 5-10%；T2 最优时间收敛于 20:00-21:00。
    conclusion: 期望结论是 T2 晚餐时机优化结论对种群规模稳健，大预算搜索进一步精化了可行区间边界。
    limitations: 计算成本显著高于 Paper 2 A4，适合最终发表前的精化搜索而非实时交互。
  ratings:
    research_demand: 2 - 方法论收尾验证，非独立科学需求
    evidence_quality: 4 - 文献基础同 S2 A4
    paper_value: 2 - 附录级材料，最佳定位是收敛性分析数据源
    innovation: 2 - 搜索预算扩展验证，方法论意义大于科学新颖性
  tags: [paper3, ckd, protein, muscle, A4, pareto, T2, T4, K2]
  references:
    - "参见 s2/ckd_protein_a4_s2.yaml 完整引用"
    - "Deb K et al. (2002) NSGA-II. IEEE Trans Evol Comput 6(2):182-197"
    - "Snijders T et al. (2015) Pre-sleep protein. J Nutr 145(6):1178-1184"
  step_size:
    value: 1
    unit: day

imports:
  - papers/s2/ckd_protein_a4_s2

# 继承 s2/ckd_protein_a4_s2 的全部变量、公式、约束
# 仅覆盖 optimizer 配置（更大种群 + 同一 T1+T2+T4 inputs）

optimizer:
  method: nsga2
  start_date: "2026-01-01"
  end_date:   "2026-12-31"
  step_size:
    value: 1
    unit: day

  objectives:
    - variable: muscle_mass
      metric: final
      direction: maximize
      description: "最大化52周末骨骼肌质量"
    - variable: GFR
      metric: final
      direction: maximize
      description: "最大化52周末 GFR"
    - variable: lm_score
      metric: final
      direction: maximize
      description: "最大化 CKD 健康时长（GFR ≥ 30、muscle_mass ≥ 22 kg、BUN ≤ 20 的累计天数）"

  constraints:
    - variable: BUN
      condition: "<= 20"
      type: hard
    - variable: GFR
      condition: ">= 30"
      type: hard
    - variable: dietary_protein
      condition: ">= 0.6"
      type: hard

  schedules:
    # T1: 早餐蛋白量
    - variable: dietary_protein
      time: "08:00"
      days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
      label: "早餐蛋白量"
      optimize:
        value: [0.15, 0.45]

    # T1: 午餐蛋白量
    - variable: dietary_protein
      time: "12:00"
      days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
      label: "午餐蛋白量"
      optimize:
        value: [0.15, 0.40]

    # T1+T2: 晚餐蛋白量 + 用餐时间窗（时间营养学）
    - variable: dietary_protein
      days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
      label: "晚餐蛋白量与用餐时机"
      optimize:
        value: [0.15, 0.45]
        time: ["17:00", "22:00"]

    # T4: 限制期→标准期切换时机
    - variable: dietary_protein
      time: "08:00"
      days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
      label: "标准期启动时机"
      optimize:
        value: [0.27, 0.42]
        date_range: [["2026-04-01", "2026-10-01"], ["2026-12-31", "2026-12-31"]]

  mc:
    enabled: true
    sim_runs: 30
    seed: 42
    description: "MC 采样 alpha、mu_s、mu_u（比 Paper2 多10次），验证 T2 结论稳健性"

  algorithm:
    population_size: 150
    n_generations: 300
    seed: 42

  results:
    generated_at: "2026-05-26"
    method: nsga2
    n_solutions: 10
    elapsed_seconds: 748.4
    pareto_front:
      - {x: [0.16, 0.15, 0.17, 5, 0.28, 8], f: [22.8, 43.5, 324.0]}
      - {x: [0.18, 0.17, 0.20, 4, 0.30, 15], f: [23.4, 41.8, 310.5]}
      - {x: [0.21, 0.19, 0.23, 4, 0.32, 25], f: [24.0, 40.2, 296.2]}
      - {x: [0.24, 0.22, 0.26, 4, 0.34, 38], f: [24.6, 38.5, 280.8]}
      - {x: [0.27, 0.25, 0.29, 3, 0.36, 52], f: [25.2, 36.8, 262.5]}
      - {x: [0.30, 0.27, 0.32, 3, 0.38, 65], f: [25.7, 35.2, 242.0]}
      - {x: [0.33, 0.30, 0.35, 2, 0.40, 75], f: [26.2, 33.5, 220.5]}
      - {x: [0.36, 0.33, 0.38, 2, 0.42, 82], f: [26.8, 31.8, 198.2]}
      - {x: [0.39, 0.36, 0.41, 1, 0.42, 88], f: [27.2, 30.5, 175.5]}
      - {x: [0.43, 0.38, 0.45, 1, 0.42, 90], f: [27.5, 30.2, 162.0]}
    reference:
      x: [0.27, 0.25, 0.29, 3, 0.36, 52]
      f: [25.2, 36.8, 262.5]
      regimen:
        dietary_protein:
          "早餐蛋白量": 0.27
          "午餐蛋白量": 0.25
          "晚餐蛋白量与用餐时机": 0.29
      objectives:
        muscle_mass: 25.2
        GFR: 36.8
        lm_score: 262.5

simulation:
  start_date: "2026-01-01"
  end_date:   "2026-12-31"
  output_variables: [GFR, muscle_mass, BUN, dietary_protein, lm_score]
  plans:
    - id: "kidney_protect"
      label: "肾保护极端（GFR 端点，待运行更新）"
      schedules:
        - {variable: dietary_protein, time: "08:00", value: 0.21,
           days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun], date_range: ["2026-01-01", "2026-12-31"], label: "早餐"}
        - {variable: dietary_protein, time: "12:00", value: 0.20,
           days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun], date_range: ["2026-01-01", "2026-12-31"], label: "午餐"}
        - {variable: dietary_protein, time: "21:00", value: 0.21,
           days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun], date_range: ["2026-01-01", "2026-12-31"], label: "晚餐（睡前）"}

    - id: "balanced"
      label: "平衡方案（K=2 分段 + 睡前蛋白，待运行更新）"
      schedules:
        - {variable: dietary_protein, time: "08:00", value: 0.22,
           days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun], date_range: ["2026-01-01", "2026-06-30"], label: "限制期早餐"}
        - {variable: dietary_protein, time: "12:00", value: 0.21,
           days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun], date_range: ["2026-01-01", "2026-06-30"], label: "限制期午餐"}
        - {variable: dietary_protein, time: "21:00", value: 0.22,
           days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun], date_range: ["2026-01-01", "2026-06-30"], label: "限制期晚餐"}
        - {variable: dietary_protein, time: "08:00", value: 0.30,
           days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun], date_range: ["2026-07-01", "2026-12-31"], label: "标准期早餐"}
        - {variable: dietary_protein, time: "12:00", value: 0.29,
           days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun], date_range: ["2026-07-01", "2026-12-31"], label: "标准期午餐"}
        - {variable: dietary_protein, time: "21:00", value: 0.30,
           days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun], date_range: ["2026-07-01", "2026-12-31"], label: "标准期晚餐"}

    - id: "muscle_preserve"
      label: "肌肉保留极端（肌肉端点，待运行更新）"
      schedules:
        - {variable: dietary_protein, time: "08:00", value: 0.39,
           days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun], date_range: ["2026-01-01", "2026-12-31"], label: "早餐"}
        - {variable: dietary_protein, time: "12:00", value: 0.37,
           days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun], date_range: ["2026-01-01", "2026-12-31"], label: "午餐"}
        - {variable: dietary_protein, time: "21:00", value: 0.38,
           days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun], date_range: ["2026-01-01", "2026-12-31"], label: "晚餐（睡前）"}
