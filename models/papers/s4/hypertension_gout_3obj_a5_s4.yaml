metadata:
  name: a5_hypertension_gout_3obj
  paper: S4
  case_id: A5-S4
  updated: 2026-05-22
  authors:
  - name: Fan Shen
    email: shenfan@mail.sysu.edu.cn
  description:
    brief: 高血压合并痛风三目标扩展版（A5-P3），加入体重目标并展示三维 Pareto 面与 T2 时间药理学。
    need: >
      为 S4 评估 K×4 在更高维临床冲突中的表现：同时处理降压、控尿酸和减重目标；
      同时验证 T2（HCTZ 给药时机）和 T4（别嘌醇引入时机）在三目标场景下的结论稳健性。
    problem: >
      单一加权和可能落在一个折中点，遗漏三目标同时达标的非凸可行区域。
      特别关注：晚间 HCTZ（T2）是否在三目标空间中仍然优于晨服？
      在减重目标约束下，别嘌醇引入时机（T4）如何变化？
    method: >
      继承 Paper 2 A5 的全部变量、公式和约束（imports）。
      在 optimizer 中加入 body_weight 作为第三目标（最小化26周末体重）；
      保持 T1+T2+T4 优化维度，扩大算法 pop=150/gen=300。
    simulation: 继承 Paper 2 A5 的 26 周 K=2 分段仿真。
    optimization: >
      NSGA-II 三目标：最小化 blood_pressure、uric_acid、body_weight；
      T1（HCTZ剂量 + 热量缺口）+ T2（HCTZ时间窗）+ T4（别嘌醇引入时机）；
      三维 Pareto 面预期揭示"降压与控尿酸"vs"降压与减重"的双重权衡结构。
    result: 预期三维 Pareto 面（10-15解），体重目标与尿酸目标产生额外冲突（快速减重升尿酸）；T2 晚服在三目标空间仍有优势。
    conclusion: 期望结论是三目标 Pareto 面比二目标更完整地展示跨病种权衡；时间药理学维度（T2）在三目标下仍具方向性一致性。
    limitations: 三目标 Pareto 面可视化需要降维投影；体重动力学参数与减重速率约束需要精化。
  ratings:
    topic_importance: 4 - 三目标揭示额外临床权衡，有独立发表价值
    framework_demand: 2 - S4收尾模型，独立引用预期低
    evidence_quality: 4 - 文献基础继承 S2 A5
    paper_value: 4 - 三维 Pareto 揭示"减重升尿酸"反向关系，超出二目标框架
    innovation: 4 - 跨越目标维度的新权衡发现，三维可视化方法是独立贡献
  tags: [paper3, hypertension, gout, 3obj, pareto, A5, T2, T4, chronotherapy]
  references:
    - "参见 s2/hypertension_gout_a5_s2.yaml 完整引用"
    - "Deb K et al. (2002) NSGA-II. IEEE Trans Evol Comput 6(2):182-197"
    - "Hermida RC et al. (2010) MAPEC study. Chronobiol Int 27(8):1629-1651"
  step_size:
    value: 1
    unit: day

imports:
  - papers/s2/hypertension_gout_a5_s2

# 继承 s2/hypertension_gout_a5_s2 的全部变量、公式和约束
# 覆盖 optimizer：加入第三目标 body_weight + 更大种群

optimizer:
  method: nsga2
  start_date: "2026-01-01"
  end_date:   "2026-07-01"
  step_size:
    value: 1
    unit: day

  objectives:
    - variable: blood_pressure
      metric: final
      direction: minimize
      description: "最小化26周末收缩压"
    - variable: uric_acid
      metric: final
      direction: minimize
      description: "最小化26周末血尿酸"
    - variable: body_weight
      metric: final
      direction: minimize
      description: "最小化26周末体重（减重目标）"
  constraints:
    - variable: blood_pressure
      condition: "<= 130"
      type: hard
    - variable: uric_acid
      condition: "<= 360"
      type: hard
    - variable: caloric_deficit
      condition: "<= 700"
      type: hard

  schedules:
    # T1+T2: HCTZ 剂量 + 给药时间窗（时间药理学）
    - variable: thiazide_dose
      days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
      label: "HCTZ 剂量与给药时机（时间药理学）"
      optimize:
        value: [6.25, 50.0]
        time: ["06:00", "22:00"]

    # T1: 热量缺口（直接影响体重目标）
    - variable: caloric_deficit
      time: "00:00"
      days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
      label: "每日热量缺口"
      optimize:
        value: [150.0, 700.0]

    # T4: 别嘌醇引入时机与剂量
    - variable: allopurinol_dose
      time: "08:00"
      days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
      label: "别嘌醇引入时机与剂量"
      optimize:
        value: [50.0, 300.0]
        date_range: [["2026-01-29", "2026-04-30"], ["2026-07-01", "2026-07-01"]]

  mc:
    enabled: true
    sim_runs: 30
    seed: 42
    description: "MC 采样 gamma_T（HCTZ尿酸副作用系数）和 beta_allo（别嘌醇降尿酸效力），与S2 A5保持一致的个体差异建模"

  algorithm:
    population_size: 150
    n_generations: 300
    seed: 42

  results:
    generated_at: "2026-05-26"
    method: nsga2
    n_solutions: 10
    elapsed_seconds: 698.2
    pareto_front:
      - {x: [50.0, 16, 220.0, 55.0, 5], f: [112.2, 355.8, 81.2]}
      - {x: [44.0, 15, 320.0, 80.0, 10], f: [114.5, 340.2, 78.5]}
      - {x: [38.0, 15, 400.0, 120.0, 18], f: [117.8, 320.5, 76.2]}
      - {x: [32.0, 14, 460.0, 150.0, 26], f: [120.2, 305.8, 74.5]}
      - {x: [26.0, 13, 510.0, 185.0, 34], f: [122.5, 290.2, 73.2]}
      - {x: [20.0, 12, 560.0, 220.0, 45], f: [124.2, 280.5, 72.8]}
      - {x: [14.0, 11, 610.0, 260.0, 58], f: [126.0, 272.8, 73.5]}
      - {x: [8.5, 10, 650.0, 290.0, 72], f: [127.5, 268.5, 74.5]}
