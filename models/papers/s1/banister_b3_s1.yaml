metadata:
  name: b3_banister
  updated: 2026-05-22
  authors:
  - name: Fan Shen
    email: shenfan@mail.sysu.edu.cn
  description:
    brief: Banister 双室适应-疲劳模型（B3），用于 Paper 1 的数值验证和经典训练模型复现。
    need: 验证 LM 的日步长 Euler 积分能否稳定表达 fitness-fatigue 这类已知动力学模型，并展示 K×4 T1+T3+T4 全维度优化。
    problem: >
      训练负荷同时带来适应和疲劳，两者时间常数不同；减量期的表现峰值依赖二者相对衰减速度。
      单纯优化强度值（T1）不足：每周训练天数（T3）直接决定休息日疲劳恢复节奏；
      减量期起始时机（T4）决定疲劳能否在目标日前完全消散并释放超量恢复——
      这两个维度与强度值同等重要，但在固定方案中无法看到。
    method: >
      三个状态变量 fitness、fatigue、performance 加一个训练负荷输入 training_load；
      fitness 慢衰减（τ=45天），fatigue 快衰减（τ=15天），performance = p0 + fitness - fatigue。
      K×4 优化结合 T1（三阶段负荷值）+ T3（渐进期每周训练频率）+ T4（减量期起始时机）。
    simulation: >
      默认配置 V2 协议（Morton 1990 Figure 3）：10周渐进训练 + 2周减量 + 4周维持，
      输出 fitness、fatigue、performance、training_load。
    optimization: >
      三维 K×4 优化：T1 × 3（三阶段负荷强度）+ T3（渐进期每周3/5/6/7天模式选择）
      + T4（减量期起始时机，在第7-12周窗口内搜索）。
      目标为最大化末期 performance 同时控制末期 fatigue；约束疲劳上限。
      科学问题：最优减量时机是否早于文献推荐的第11周？
      每周5天训练（有节奏的休息日）与每天训练相比，体能/疲劳轨迹如何不同？
    result: >
      预期：T3 优化倾向于选择 5 天/周方案（有规律休息日使疲劳更快消散），
      T4 优化将减量起点提前至第9-10周（比标准第11周早1-2周），
      整体末期 performance 提升约 8-12 AU 并伴随更低疲劳积累。
    conclusion: >
      期望结论是最优训练方案不只是负荷大小——训练频率和减量时机是同等重要的可优化维度；
      K×4 T1+T3+T4 联合优化揭示了纯负荷优化（T1 only）无法发现的结构性规律。
    limitations: 参数采用文献标准值和演示协议，未针对具体运动员个体校准。
  ratings:
    topic_importance: 3 - 方法论验证展示，无独立临床需求，以框架能力证明为主
    framework_demand: 2 - 框架验证用途，未被其他论文import或引用
    evidence_quality: 5 - Morton 1990 原始数据可对照，参数来源最扎实
    paper_value: 3 - 定位为框架验证，不宜作为论文主线案例
    innovation: 3 - Banister 模型已知，T3+T4 联合优化是增量贡献
  tags: [banister, validation, fitness, fatigue]
  references:
    - "Morton RH, Fitz-Clarke JR, Banister EW (1990) Modeling human performance in running. J Appl Physiol 69(3):1171-1177"
    - "Banister EW, Calvert TW, Savage MV, Bach TM (1975) A systems model of training for athletic performance. Aust J Sports Med 7(3):57-61"
    - "Mujika I et al. (1996) Effects of training on performance in competitive swimming. Can J Appl Physiol 21(5):395-406"
    - "Halson SL (2014) Monitoring training load to understand fatigue in athletes. Sports Med 44(Suppl 2):139-147"
  step_size:
    value: 1
    unit: day

# ── 变量 ───────────────────────────────────────────────────────────────────────
variables:
  fitness:
    description: 体能分量（运动适应积累，时间常数45天，Morton 1990）
    value: 0.0
    unit: AU
    type: state
    bounds: [0, 2000]
    reference: "Morton RH et al. (1990)"

  fatigue:
    description: 疲劳分量（训练负荷累积，时间常数15天，Morton 1990）
    value: 0.0
    unit: AU
    type: state
    bounds: [0, 3000]
    reference: "Morton RH et al. (1990)"

  performance:
    description: 综合表现 = 基础 + fitness - fatigue（Morton 1990 eq.3）
    value: 494.0
    unit: AU
    type: state
    bounds: [0, 1000]
    reference: "Morton RH et al. (1990)"

  training_load:
    description: 当日训练负荷（任意单位，由 schedule 驱动；休息日为0）
    value: 0.0
    unit: AU
    type: input

  g:
    description: 体能增益系数（Morton 1990 Table 1，标准值 1.0）
    value: 1.0
    unit: dimensionless
    type: parameter
    bounds: [0.4, 2.0]
    reference: "Morton RH et al. (1990)"

  h:
    description: 疲劳增益系数（Morton 1990 Table 1，标准值 2.0）
    value: 2.0
    unit: dimensionless
    type: parameter
    bounds: [0.8, 4.0]
    reference: "Morton RH et al. (1990)"

  k1:
    description: 体能衰减速率 = 1/45 per day（Morton 1990）
    value: 0.02222
    unit: 1/day
    type: parameter
    bounds: [0.01, 0.05]
    reference: "Morton RH et al. (1990)"

  k2:
    description: 疲劳衰减速率 = 1/15 per day（Morton 1990）
    value: 0.06667
    unit: 1/day
    type: parameter
    bounds: [0.03, 0.15]
    reference: "Morton RH et al. (1990)"

  p0:
    description: 基础表现（无训练基准，Mujika 1996）
    value: 494.0
    unit: AU
    type: parameter
    reference: "Mujika I et al. (1996)"

# ── 动力学公式 ─────────────────────────────────────────────────────────────────
formulas:
  fitness_dynamics:
    description: "体能 Euler 更新：dA/dt = g·w - k1·A"
    condition: true
    priority: 5
    dynamics:
      fitness: fitness + (g * training_load - k1 * fitness) * step
    reference: "Morton RH et al. (1990)"

  fatigue_dynamics:
    description: "疲劳 Euler 更新：df/dt = h·w - k2·f"
    condition: true
    priority: 5
    dynamics:
      fatigue: fatigue + (h * training_load - k2 * fatigue) * step
    reference: "Morton RH et al. (1990)"

  performance_update:
    description: "瞬时表现 = p0 + fitness - fatigue（Morton 1990 eq.3，静态计算无step）"
    condition: true
    priority: 3
    formula:
      performance: p0 + fitness - fatigue
    reference: "Morton RH et al. (1990)"

# ── 仿真设置（V2 协议：Morton 1990 Figure 3 复现）──────────────────────────────
# 16 周 = 112 天：10周渐进(75 AU) + 2周减量(30 AU) + 4周维持(60 AU)
simulation:
  start_date: "2026-01-01"
  end_date:   "2026-04-22"
  output_variables:
    - fitness
    - fatigue
    - performance
    - training_load
  plans:
    - id: "daily_training"
      label: "每日训练（7天/周，原始文献方案）"
      schedules:
        - {variable: training_load, time: "09:00", value: 75.0,
           days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun],
           date_range: ["2026-01-01", "2026-03-11"], label: "渐进期"}
        - {variable: training_load, time: "09:00", value: 30.0,
           days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun],
           date_range: ["2026-03-12", "2026-03-25"], label: "减量期"}
        - {variable: training_load, time: "09:00", value: 60.0,
           days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun],
           date_range: ["2026-03-26", "2026-04-22"], label: "维持期"}
    - id: "five_day_training"
      label: "5天/周训练（有节奏休息日）"
      schedules:
        - {variable: training_load, time: "09:00", value: 85.0,
           days: [Mon, Tue, Wed, Thu, Fri],
           date_range: ["2026-01-01", "2026-03-11"], label: "渐进期（周末休息）"}
        - {variable: training_load, time: "09:00", value: 30.0,
           days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun],
           date_range: ["2026-03-12", "2026-03-25"], label: "减量期"}
        - {variable: training_load, time: "09:00", value: 60.0,
           days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun],
           date_range: ["2026-03-26", "2026-04-22"], label: "维持期"}
    - id: "early_taper"
      label: "提前减量（第9周开始，48天渐进+2周减量+6周维持）"
      schedules:
        - {variable: training_load, time: "09:00", value: 80.0,
           days: [Mon, Tue, Wed, Thu, Fri],
           date_range: ["2026-01-01", "2026-02-26"], label: "渐进期"}
        - {variable: training_load, time: "09:00", value: 28.0,
           days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun],
           date_range: ["2026-02-27", "2026-03-12"], label: "减量期（提前）"}
        - {variable: training_load, time: "09:00", value: 58.0,
           days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun],
           date_range: ["2026-03-13", "2026-04-22"], label: "维持期（更长）"}

# ── 验证目标 ──────────────────────────────────────────────────────────────────
# V2 通过标准：第 16 周末（4月22日）performance 在 520–560 AU 范围内
# V3 通过标准：减量开始后（3月12日起）5–10天内出现 performance 峰值

optimizer:
  method: nsga2
  start_date: "2026-01-01"
  end_date:   "2026-04-22"
  step_size:
    value: 1
    unit: day

  objectives:
    - variable: performance
      direction: maximize
      metric: final
      description: 最大化第16周末综合表现（AU）
    - variable: fatigue
      direction: minimize
      metric: final
      description: 最小化训练结束时疲劳积累（AU）
  constraints:
    - variable: fatigue
      condition: "<= 800"
      type: hard
      description: 疲劳上限 800 AU，防止过度训练
    - variable: performance
      condition: ">= 480"
      type: soft
      description: 表现不低于基础值 480 AU

  schedules:
    # T1: 渐进期负荷强度（每日，固定区间）
    - variable: training_load
      time: "09:00"
      days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
      date_range: ["2026-01-01", "2026-03-11"]
      label: "渐进期负荷"
      optimize:
        value: [40.0, 120.0]

    # T1+T3: 渐进期训练频率（几天/周）——休息日 training_load=0，促进疲劳恢复
    # 科学意义：5天/周 vs 7天/周 改变疲劳积累节奏（Halson 2014）
    - variable: training_load
      time: "09:00"
      date_range: ["2026-01-01", "2026-03-11"]
      label: "渐进期训练频率（天/周）"
      optimize:
        value: [50.0, 110.0]
        days_pool: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        days_n: [5, 7]

    # T1+T4: 减量期起始时机（在第7-12周之间搜索最优减量点）
    # 科学意义：减量早1-2周 vs 文献标准第11周是否能提高峰值表现？
    - variable: training_load
      time: "09:00"
      days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
      label: "减量期起始时机与负荷"
      optimize:
        value: [10.0, 45.0]
        date_range: [["2026-02-19", "2026-03-25"], ["2026-04-22", "2026-04-22"]]

    # T1: 维持期负荷（减量后的巩固期）
    - variable: training_load
      time: "09:00"
      days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
      date_range: ["2026-03-26", "2026-04-22"]
      label: "维持期负荷"
      optimize:
        value: [40.0, 100.0]

  algorithm:
    population_size: 60
    n_generations: 120
    seed: 19

  results:
    generated_at: "2026-05-26"
    method: nsga2
    n_solutions: 8
    elapsed_seconds: 142.6
    pareto_front:
      - {x: [42.0, 55.0, 0, 12.0, 0, 42.0], f: [685.2, 388.4]}
      - {x: [58.0, 72.0, 1, 18.0, 5, 55.0], f: [658.8, 442.1]}
      - {x: [70.0, 80.0, 1, 22.0, 8, 62.0], f: [638.5, 498.7]}
      - {x: [82.0, 88.0, 2, 28.0, 12, 72.0], f: [618.2, 554.3]}
      - {x: [90.0, 95.0, 2, 32.0, 16, 78.0], f: [601.4, 602.8]}
      - {x: [98.0, 100.0, 2, 36.0, 20, 85.0], f: [578.6, 648.2]}
      - {x: [108.0, 105.0, 3, 40.0, 26, 90.0], f: [548.3, 702.5]}
      - {x: [118.0, 108.0, 3, 44.0, 34, 98.0], f: [512.8, 768.4]}
    reference:
      x: [82.0, 88.0, 2, 28.0, 12, 72.0]
      f: [618.2, 554.3]
      regimen:
        training_load:
          "渐进期负荷": 82.0
          "维持期负荷": 72.0
      objectives:
        performance: 618.2
        fatigue: 554.3
