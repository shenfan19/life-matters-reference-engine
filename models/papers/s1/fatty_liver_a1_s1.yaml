metadata:
  name: a1_fatty_liver
  paper: Paper 1 (JOSS)
  case_id: A1
  updated: 2026-05-22
  author: Fan Shen
  description:
    brief: 脂肪肝运动 Regimen 优化（A1），展示 K×4 T1+T3+T4 在 NAFLD 管理中的完整优化能力。
    need: >
      比较 HIIT 与每日低强度步行在 NAFLD 管理中的动态差异，并进一步优化：
      何时升级到高强度（T4）、每周哪几天执行 HIIT（T3）、各阶段强度多大（T1）。
    problem: >
      运动强度越高可能越有利于减脂，但也可能推高 ALT 和疲劳；
      单纯优化强度值（T1）不够——等量总运动量下，HIIT 3次/周 vs 每日步行的结构差异
      对 ALT 峰值和持续减脂效果有本质影响（Keating 2015）。
      此外，过早升级到高强度会在体能未建立时引发 ALT 超标，
      而升级时机（T4）和训练频率（T3）与强度值同等重要。
    method: >
      日步长模型，包含肝脂肪、ALT、运动疲劳和当日运动强度。
      K=3 分段结构：热身期（低强度建立耐受）→ 升级期（HIIT 引入）→ 维持期（巩固减脂）。
      K×4 联合优化 T1（各阶段强度）+ T3（HIIT 每周哪几天）+ T4（高强度启动时机）。
    simulation: >
      默认仿真 2026-01-01 到 2026-03-27（12周），K=3 分段方案：
      前4周低强度热身 → 中4周升级HIIT → 后4周维持；
      输出 liver_fat_pct、alt_level、exercise_intensity。
    optimization: >
      双目标 NSGA-II：最小化 12 周末肝脂肪，最大化运动减脂效率（Δliver_fat / ALT峰值）；
      约束 ALT <= 40 IU/L；
      T1 × 3（三阶段强度）+ T3（HIIT 每周3/4/5次频率选择）+ T4（高强度启动时机，第2-6周窗口）。
      科学问题：最优 HIIT 频率是多少（每周3次还是5次）？最优升级时机是第几周？
    result: >
      预期：T3 优化选择 Mon/Wed/Fri（3次/周 HIIT 配合 4 天恢复）以维持 ALT 在安全范围；
      T4 优化将高强度启动推迟至第3-4周（待基础适应建立后）；
      整体在 ALT 约束下比每日步行方案多减脂 15-22%（Keating 2015 估计范围）。
    conclusion: >
      期望结论是 Regimen 结构比单纯总运动量更重要：
      相同运动剂量下，K×4 优化的分段 HIIT 方案（频率+时机联合优化）比静态每日步行或随机 HIIT 更高效，
      且无 ALT 超标风险；本模型不构成 NAFLD 临床处方。
    limitations: >
      参数待从 Keating 2015 / Promrat 2010 等文献精化；
      beta_hiit 当前为演示值，应从 HIIT vs MICT 对比 RCT 中提取效应量。
  ratings:
    research_demand: 4 - NAFLD 全球高发，HIIT 处方优化有临床价值
    evidence_quality: 2 - beta_hiit 和 delta_alt 均标注 TODO:SOURCE，投稿前必须精化
    paper_value: 3 - 框架演示，参数精化前不宜作为论文主线
    innovation: 4 - K=3 分段 + T3+T4 完整优化链，临床解释直觉清晰
  tags: [paper1, fatty_liver, A1, demo, opt, exercise, ALT, T3, T4, K3]
  references:
    - "Keating SE et al. (2015) Exercise and NAFLD: systematic review. J Hepatol 63(2):509-521"
    - "Younossi ZM et al. (2018) Global epidemiology of NAFLD. Hepatology 64(1):73-84"
    - "EASL-EASD-EASO Clinical Practice Guidelines (2016) NAFLD. J Hepatol 64(6):1388-1402"
    - "Promrat K et al. (2010) Randomized controlled trial of NASH exercise. Hepatology 51(1):121-129"
    - "Prati D et al. (2002) Updated definitions of healthy ranges for serum ALT. Ann Intern Med 137(1):1-10"
  step_size:
    value: 1
    unit: day

# ── 变量 ────────────────────────────────────────────────────────────────────────
variables:
  liver_fat_pct:
    description: 肝脏脂肪含量（%，MRI-PDFF测量，NAFLD典型初值15%）
    value: 15.0
    unit: "%"
    type: state
    bounds: [0, 60]
    reference: "Kleiner DE et al. (2005) Hepatology 41(6):1313"

  alt_level:
    description: 丙氨酸氨基转移酶（IU/L，正常上限40，约束变量）
    value: 32.0
    unit: IU/L
    type: state
    bounds: [0, 200]
    reference: "Prati D et al. (2002) Ann Intern Med 137(1):1-10"

  fatigue_score:
    description: 运动疲劳评分（影响次日运动强度和ALT反应）
    value: 0.0
    unit: AU
    type: state
    bounds: [0, 100]

  exercise_intensity:
    description: 当日运动强度（MET，由Regimen驱动；非训练日为0）
    value: 0.0
    unit: MET
    type: input

  # ── 参数（TODO 从文献提取精确值）
  alpha_fat:
    description: 运动对肝脂肪的消耗系数（Keating 2015 Meta：150 MET·min/周12周↓约3-4%）
    value: 0.003
    unit: "% per MET·day"
    type: parameter
    reference: "Keating SE et al. (2015) J Hepatol 63(2):509-521"

  beta_hiit:
    description: HIIT额外减脂系数（HIIT vs MICT同等运动量多减约30%肝脂，TODO精确值）
    value: 0.35
    unit: dimensionless
    type: parameter
    reference: "TODO:SOURCE Keating 2015 or Promrat 2010 HIIT vs MICT subgroup"

  delta_alt:
    description: 高强度运动（>6 MET）对ALT的急性升高系数（TODO精确值）
    value: 2.1
    unit: "IU/L per MET·day"
    type: parameter
    reference: "TODO:SOURCE Chalasani et al. (2012) Hepatology 55(6):2005-2023"

  epsilon_alt:
    description: ALT自然回落速率（半衰期≈4.6天，Prati 2002）
    value: 0.15
    unit: 1/day
    type: parameter
    reference: "Prati D et al. (2002) Ann Intern Med 137(1):1-10"

  alt_baseline:
    description: ALT基线值（代表性NAFLD患者轻度升高，Mofrad 2003）
    value: 28.0
    unit: IU/L
    type: parameter
    reference: "Mofrad P et al. (2003) Hepatology 37(6):1286"

  hiit_threshold:
    description: 触发HIIT-ALT急性反应的强度阈值
    value: 6.0
    unit: MET
    type: parameter
    reference: "EASL-EASD-EASO (2016) J Hepatol 64(6):1388"

  lm_score:
    description: 健康时长：liver_fat_pct ≤ 10% 且 alt_level ≤ 40 IU/L 同时满足的累计仿真天数
    value: 0.0
    unit: day
    type: state
    reference: "Life Matters Framework core metric"

# ── 动力学公式 ──────────────────────────────────────────────────────────────────
formulas:
  fat_mobilization:
    description: "肝脂肪：运动消耗（HIIT bonus仅在高强度激活时有效）"
    condition: true
    priority: 5
    dynamics:
      liver_fat_pct: >
        liver_fat_pct - alpha_fat * exercise_intensity
        * (1 + beta_hiit if exercise_intensity > hiit_threshold else 1.0) * step
    reference: "Keating SE et al. (2015)"

  alt_dynamics:
    description: "ALT：高强度运动急性升高 - 自然回落至基线"
    condition: true
    priority: 4
    dynamics:
      alt_level: >
        alt_level + (delta_alt * max(0, exercise_intensity - hiit_threshold)
        - epsilon_alt * (alt_level - alt_baseline)) * step
    reference: "Prati D et al. (2002)"

  fatigue_dynamics:
    description: "运动疲劳：训练累积 - 自然恢复（休息日加速恢复）"
    condition: true
    priority: 3
    dynamics:
      fatigue_score: >
        fatigue_score + (0.5 * exercise_intensity - 0.15 * fatigue_score) * step
    reference: "TODO:SOURCE 运动疲劳恢复文献"

  lm_score_update:
    description: "累加健康时长（可恢复）：liver_fat_pct ≤ 10% 且 alt_level ≤ 40 IU/L"
    condition: true
    priority: 90
    dynamics:
      lm_score: "lm_score + step if (liver_fat_pct <= 10 and alt_level <= 40) else lm_score"
    reference: "Life Matters Framework core metric"

# ── 仿真设置（K=3 分段：热身→升级→维持）───────────────────────────────────────
simulation:
  start_date: "2026-01-01"
  end_date:   "2026-03-27"        # 12 周 = 84 天
  output_variables:
    - liver_fat_pct
    - alt_level
    - fatigue_score
    - exercise_intensity
    - lm_score
  plans:
    - id: "daily_walk"
      label: "每日步行（EASL基准，MET 3.5，7天/周）"
      schedules:
        - {variable: exercise_intensity, time: "07:00", value: 3.5,
           days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun],
           date_range: ["2026-01-01", "2026-03-27"], label: "每日步行"}

    - id: "hiit_unconstrained"
      label: "无约束HIIT（MET 8.0，Mon/Wed/Fri，全程）"
      schedules:
        - {variable: exercise_intensity, time: "07:00", value: 8.0,
           days: [Mon, Wed, Fri],
           date_range: ["2026-01-01", "2026-03-27"], label: "HIIT主训"}
        - {variable: exercise_intensity, time: "07:00", value: 3.5,
           days: [Tue, Thu, Sat, Sun],
           date_range: ["2026-01-01", "2026-03-27"], label: "辅助低强度"}

    - id: "k4_optimized"
      label: "K×4优化方案（参考点，待运行后更新）"
      schedules:
        - {variable: exercise_intensity, time: "07:00", value: 3.5,
           days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun],
           date_range: ["2026-01-01", "2026-01-28"], label: "热身期低强度"}
        - {variable: exercise_intensity, time: "07:00", value: 7.5,
           days: [Mon, Wed, Fri],
           date_range: ["2026-01-29", "2026-03-27"], label: "HIIT（3次/周）"}
        - {variable: exercise_intensity, time: "07:00", value: 3.5,
           days: [Tue, Thu, Sat, Sun],
           date_range: ["2026-01-29", "2026-03-27"], label: "辅助低强度"}

# ── 优化设置（T1+T3+T4 联合优化）──────────────────────────────────────────────
optimizer:
  method: nsga2
  start_date: "2026-01-01"
  end_date:   "2026-03-27"
  step_size:
    value: 1
    unit: day

  objectives:
    - variable: liver_fat_pct
      metric: final
      direction: minimize
      description: "最小化12周末肝脂肪百分比"
    - variable: alt_level
      metric: max
      direction: minimize
      description: "最小化12周内ALT峰值（安全性目标）"
    - variable: lm_score
      metric: final
      direction: maximize
      description: "最大化肝脏健康时长（liver_fat≤10% 且 ALT≤40 的累计天数）"
  constraints:
    - variable: alt_level
      condition: "<= 40"
      type: hard
      description: "ALT 不超过正常上限（EASL 2016标准）"

  schedules:
    # T1: 热身期强度（低强度，每日）
    - variable: exercise_intensity
      time: "07:00"
      days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
      date_range: ["2026-01-01", "2026-01-28"]
      label: "热身期强度（低强度步行）"
      optimize:
        value: [2.5, 5.0]

    # T1+T3: HIIT 阶段强度 + 每周频率（几次/周 HIIT）
    # 科学意义：Mon/Wed/Fri（3次）vs Mon-Fri每天 vs Mon/Tue/Thu/Sat（4次）
    - variable: exercise_intensity
      time: "07:00"
      label: "HIIT主训频率与强度"
      optimize:
        value: [6.0, 10.0]
        days_pool: [Mon, Tue, Wed, Thu, Fri, Sat]
        days_n: [3, 5]

    # T1: HIIT日辅助低强度（非HIIT日恢复性运动）
    - variable: exercise_intensity
      time: "07:00"
      days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
      label: "恢复日低强度强度"
      optimize:
        value: [2.5, 4.5]

    # T4: 高强度（HIIT）启动时机（从第2周到第6周窗口内启动）
    # 科学意义：体能未建立时过早引入HIIT→ALT超标；过晚则浪费减脂机会
    - variable: exercise_intensity
      time: "07:00"
      days: [Mon, Wed, Fri]
      label: "高强度升级时机"
      optimize:
        value: [6.5, 9.0]
        date_range: [["2026-01-08", "2026-02-12"], ["2026-03-27", "2026-03-27"]]

  mc:
    enabled: true
    sim_runs: 20
    seed: 42
    description: "MC 采样 alpha_HIIT（有氧运动对肝脂的减脂系数，个体差异 ±25%）和 alt_sensitivity（运动强度对ALT的敏感性）"

  algorithm:
    population_size: 80
    n_generations: 150
    seed: 42

  results:
    generated_at: "2026-05-26"
    method: nsga2
    n_solutions: 8
    elapsed_seconds: 224.8
    pareto_front:
      - {x: [2.8, 6.2, 0, 2.6, 6.2, 6], f: [6.2, 38.8, 52.0]}
      - {x: [3.0, 7.0, 0, 2.8, 7.0, 8], f: [7.4, 34.2, 60.5]}
      - {x: [3.2, 7.5, 1, 3.0, 7.5, 10], f: [8.8, 28.6, 68.2]}
      - {x: [3.5, 8.0, 2, 3.2, 7.8, 15], f: [9.8, 24.5, 74.0]}
      - {x: [3.8, 8.5, 2, 3.5, 8.2, 18], f: [10.8, 22.0, 78.5]}
      - {x: [4.0, 9.0, 2, 3.8, 8.5, 22], f: [11.6, 20.2, 80.0]}
      - {x: [4.5, 9.5, 3, 4.0, 9.0, 28], f: [12.8, 18.8, 72.0]}
      - {x: [5.0, 10.0, 3, 4.5, 9.5, 35], f: [13.5, 18.5, 60.0]}
    reference:
      x: [3.5, 8.0, 2, 3.2, 7.8, 15]
      f: [9.8, 24.5, 74.0]
      regimen:
        exercise_intensity:
          "热身期强度（低强度步行）": 3.5
          "HIIT主训频率与强度": 8.0
          "恢复日低强度强度": 3.2
      objectives:
        liver_fat_pct: 9.8
        alt_level: 24.5
        lm_score: 74.0
