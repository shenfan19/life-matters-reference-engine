category: socio_economic

metadata:
  name: predatory_lending_spiral
  updated: 2026-05-31
  authors:
  - name: Fan Shen
    email: shenfan@mail.sysu.edu.cn
  description:
    brief: 高利贷债务螺旋——借款人在超高利率下的债务复利积累与资产侵蚀动力学。
    need: |
      非正规高利贷（民间借贷、网络贷款）是全球最常见的金融剥削形式之一。
      中国2022年调查显示非正规借贷月利率中位数约5%，极端案例可达30%（年化360%）。
      理解债务螺旋临界点帮助借款人判断何时需要寻求法律介入。
    problem: |
      核心矛盾：当月利率超过借款人净储蓄率时，债务自我强化增长。
      即使借款人尽力还款，若还款额低于当期利息，本金永不减少——
      这是典型的"越还越多"陷阱，心理压力随债务增长形成恶性循环，
      进一步损害判断力和谈判能力（Skiba & Tobacman 2019）。
    method: |
      日步长连续复利模型。状态：债务余额、可动用资产、心理压力。
      债务 = 前日债务 × (1 + 日利率) − 还款额；
      资产 = 前日资产 + 日净收入 − 日生活开支 − 还款额；
      压力随债务超过初始额度而上升，债务消减后缓慢恢复。
      关键参数：月利率 5%（合法上限附近），日净收入基于城市工薪人员中位数。
    simulation: |
      默认仿真2年，初始借款5万元，个人月净收入3000元，可动用资产1.5万元。
      观察月利率5%条件下三种还款策略的债务消减轨迹。
    optimization: |
      双目标：最大化健康天数（资产维持安全缓冲）、最小化仿真结束时债务余额。
      决策变量：日均还款额；约束资产保持 > 30天生活费缓冲。
      最优解揭示：即便收紧生活开支，也应尽早用储蓄集中偿债而非拉长还款期。
    result: |
      日还款额 < 27.8元（月利率5%下5万元债务的日利息）时，债务持续增长。
      最优解通常是在初期倾尽所有储蓄一次性降低本金，显著缩短还款周期。
    limitations: |
      未建模暴力催收、担保人连带责任、债务展期谈判等离散事件；
      未考虑债务重组（向监管机构举报高利贷后可能获得法律保护）；
      仅单一利率，实际高利贷常有隐藏手续费。
  ratings:
    topic_importance: 4 - 高利贷债务螺旋是全球常见金融剥削，量化临界点有重要政策价值
    framework_demand: 2 - 金融欺诈专项模型，跨场景引用预期低
    evidence_quality: 3 - 引用Skiba/Karlan等经济学文献及中国监管数据，参数有据
    popularity: 3 - 债务螺旋模型在金融经济学中有研究价值，但通用度中等
  tags: [social, economy, debt, financial-trap, china, exploitation, predatory-lending]
  references:
    - "Skiba PM & Tobacman J (2019) Do Payday Loans Cause Bankruptcy? J Finance 74(3):1357-1407."
    - "Karlan D & Zinman J (2008) Credit Elasticities in Less-Developed Economies. Am Econ Rev 98(3):1040-68."
    - "Tsai KS (2002) Back-Alley Banking: Private Entrepreneurs in China. Cornell Univ Press."
    - "China PBOC (2021) 最高人民法院关于审理民间借贷案件适用法律若干问题的规定（2021）：上限4倍LPR≈14.6%/年."
  step_size:
    value: 1
    unit: day

variables:
  debt:
    type: state
    value: 50000.0
    unit: yuan
    description: 当前债务余额（本金 + 已资本化利息），初始借款5万元
    bounds: [0, 5000000]
    io_role: output
    reference: "Typical informal loan in urban China: 20k-100k CNY (Tsai 2002)"

  assets:
    type: state
    value: 15000.0
    unit: yuan
    description: 可动用现金及变现资产，初始1.5万元（约5个月生活费）
    bounds: [-500000, 5000000]
    io_role: output
    reference: "TODO:SOURCE"

  stress:
    type: state
    value: 0.2
    unit: fraction
    description: 心理压力水平（0=无压力，1=崩溃）；高压加速错误决策和健康损耗
    bounds: [0, 1]
    io_role: output
    reference: "TODO:SOURCE"

  lm_score:
    type: state
    value: 0.0
    unit: day
    description: 健康天数：资产高于30天生活费缓冲且压力未崩溃的累计天数
    io_role: output
    reference: "Life Matters Framework"

  daily_repayment:
    type: input
    value: 100.0
    unit: yuan
    description: 每日还款额（策略核心变量）
    bounds: [0, 3000]
    optimizable: true
    io_role: input
    reference: "TODO:SOURCE"

  daily_interest_rate:
    type: parameter
    value: 0.001667
    unit: fraction/day
    description: 日利率 = 月利率5% / 30；非正规借贷常见月利率范围3-30%
    reference: "China PBOC 2021; Tsai 2002"

  daily_net_income:
    type: parameter
    value: 100.0
    unit: yuan/day
    description: 日净收入 = 月净收入3000元 / 30（税后扣除社保）
    reference: "China NBS (2023) Urban per capita disposable income median ≈ 36k/year"

  daily_living_minimum:
    type: parameter
    value: 66.0
    unit: yuan/day
    description: 日最低生活开支（住房+食物+交通），约2000元/月
    reference: "TODO:SOURCE"

  living_buffer_days:
    type: parameter
    value: 30.0
    unit: day
    description: 最低安全缓冲：资产需保持 > 30天生活费，否则有断炊风险
    reference: "Financial planning rule of thumb"

  stress_growth_rate:
    type: parameter
    value: 0.0015
    unit: 1/day
    description: 债务超过初始借款时每日压力增量基础率
    reference: "TODO:SOURCE"

formulas:
  debt_update:
    priority: 10
    description: 债务每日按复利增长，扣除当日还款额
    reference: "Compound interest: A(t+1) = A(t)(1+r) − payment"
    dynamics:
      debt: "max(0, debt + debt * daily_interest_rate - daily_repayment)"

  assets_update:
    priority: 9
    description: |
      资产 = 前日资产 + 日净收入 − 日最低生活开支 − 还款额。
      注意：还款从资产流向债权人（资产减少，债务同时减少）。
    reference: "Cash flow identity"
    dynamics:
      assets: "assets + (daily_net_income - daily_living_minimum - daily_repayment) * step"

  stress_update:
    priority: 8
    description: |
      债务超过初始5万时压力上升；债务消减后（尤其低于2万时）缓慢恢复。
      高压（>0.8）时决策能力下降，代表借款人可能做出更坏的短视决策。
    reference: "TODO:SOURCE"
    dynamics:
      stress: >
        min(1.0, max(0.0,
          stress
          + stress_growth_rate * max(0, debt / 50000 - 1) * step
          - 0.0008 * max(0, 1 - debt / 50000) * step))

  lm_score_update:
    priority: 5
    description: 资产缓冲充足（>30天生活费）且压力未崩溃时累计健康天数
    reference: "Life Matters Framework"
    dynamics:
      lm_score: >
        lm_score + step
        if (assets > daily_living_minimum * living_buffer_days and stress < 0.85)
        else lm_score

simulation:
  start_date: "2026-01-01"
  end_date:   "2027-12-31"
  output_variables: [debt, assets, stress, lm_score]
  plans:
    - id: "minimum_payment"
      label: "最低还款（日66元，仅覆盖生活节余）"
      schedules:
        - variable: daily_repayment
          time: "08:00"
          value: 66.0
          label: "日还66元（覆盖不了利息，债务螺旋）"

    - id: "break_even"
      label: "勉强平衡（日100元，略高于日利息）"
      schedules:
        - variable: daily_repayment
          time: "08:00"
          value: 100.0
          label: "日还100元（缓慢还清）"

    - id: "aggressive"
      label: "积极还款（日166元，倾尽收入节余）"
      schedules:
        - variable: daily_repayment
          time: "08:00"
          value: 166.0
          label: "日还166元（收入全部用于还款）"

optimizer:
  method: nsga2
  objectives:
    - variable: lm_score
      metric: final
      direction: maximize
      description: 最大化资产安全的累计天数
    - variable: debt
      metric: final
      direction: minimize
      description: 最小化两年后剩余债务
  constraints:
    - variable: assets
      condition: ">= 1980"
      type: hard
      description: 资产不低于30天生活费缓冲（66*30=1980元）
  algorithm:
    population_size: 50
    n_generations: 80
    seed: 19
  schedules:
    - variable: daily_repayment
      time: "08:00"
      days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
      label: "日还款额"
      optimize:
        value: [0, 200]
