metadata:
  name: labor
  updated: 2026-05-17
  author: Fan Shen
  description:
    brief: 劳动力经济动力学模型，基于人力资本理论和效率工资理论，量化工作量、收入、储蓄与疲劳的动态关系。
    need: 为历史劳动场景（产业革命工人、现代职场压力）和经济政策分析（最低工资、劳工保护）提供可复用的经济-健康基础模块。
    method: |
      三核心状态（工作负荷、生产力、储蓄）+ 疲劳度状态。
      基于效率工资理论（Shapiro & Stiglitz 1984）：高疲劳降低生产力；
      技能培训通过人力资本积累（Becker 1964）提升时薪。
      周步长，适合年度到数十年的劳动经济时间尺度。
    simulation: 默认仿真1年（52周），标准工作制（40h/week）观察储蓄和疲劳动态。
    limitations: |
      未包含通货膨胀、失业风险和社会保障；
      个体间差异（技能初值、行业类型）通过参数调整；
      单个劳动者模型，不反映市场均衡和宏观动态。
  tags: [labor, economics, human_capital, efficiency_wage, fatigue, savings]
  references:
    - "Becker GS (1964) Human Capital: A Theoretical and Empirical Analysis. Columbia University Press, New York."
    - "Shapiro C & Stiglitz JE (1984) Equilibrium unemployment as a worker discipline device. Am Econ Rev 74(3):433-444."
    - "OECD (2023) Hours Worked: Average annual hours actually worked per worker. OECD Employment Database."
    - "Kivimäki M et al. (2015) Long working hours and risk of coronary heart disease and stroke. Lancet 385(9972):1739-1746."
  step_size:
    value: 1
    unit: week

variables:
  # R1: Labor Output
  work_load: {description: "工作负荷", value: 40, unit: "h/week", type: state, bounds: [0, 100]}
  productivity: {description: "生产力系数", value: 1.0, unit: "系数", type: state, bounds: [0.1, 2.0]}
  # R2: Economy
  income_rate: {description: "时薪收入", value: 20, unit: "元/h", type: state, bounds: [0, 1000]}
  savings: {description: "存款储蓄", value: 5000, unit: "元", type: state, bounds: [0, 1000000]}
  # R3: Physiological Cost
  fatigue_level: {description: "疲劳度", value: 0, unit: "分", type: state, bounds: [0, 100]}
  # P1: Inputs (Card Inputs)
  overtime_hours: {description: "加班时数", value: 0, unit: "h", type: input}
  vacation_days: {description: "休假天数", value: 0, unit: "d", type: input}
  skill_training: {description: "技能培训", value: 0, unit: "h", type: input}

formulas:
  # F1: Economic Dynamics
  money_dynamics:
    description: "周薪与支出计算"
    condition: true
    dynamics:
      savings: "savings + (work_load + overtime_hours) * income_rate * step - 1000 * step"
    priority: 5

  # F2: Fatigue Dynamics
  fatigue_dynamics:
    description: "工作导致疲劳累积"
    condition: true
    dynamics:
      fatigue_level: "max(0, fatigue_level + (overtime_hours * 2 - vacation_days * 10) * step)"
    priority: 5

  # F3: Productivity Impact
  skill_dynamics:
    description: "培训提升生产力"
    condition: skill_training > 0
    dynamics:
      productivity: "min(2.0, productivity + skill_training * 0.01 * step)"
      savings: "savings - skill_training * 50 * step"
    priority: 3

simulation:
  start_date: "2026-01-01"
  end_date: "2026-12-31"
  output_variables: [savings, fatigue_level, productivity]

optimizer:
  method: nsga2
  objectives:
    - variable: savings
      metric: final
      direction: maximize
    - variable: productivity
      metric: mean
      direction: maximize
  constraints:
    - variable: fatigue_level
      condition: "<= 0.8"
      type: hard
      description: "疲劳水平不超过0.8（防止过劳）"
  schedules:
    - variable: overtime_hours
      time: "18:00"
      days: [Mon, Tue, Wed, Thu, Fri]
      label: "加班时长（0=无加班，1=极限加班）"
      optimize:
        value: [0, 1]
    - variable: vacation_days
      time: "09:00"
      days: [Sat, Sun]
      label: "休假天数比例（0=不休假，1=充分休假）"
      optimize:
        value: [0, 1]
    - variable: skill_training
      time: "20:00"
      days: [Mon, Tue, Wed, Thu, Fri]
      label: "技能培训投入（0=无，1=高强度）"
      optimize:
        value: [0, 1]
  algorithm:
    population_size: 50
    n_generations: 80
    seed: 42
