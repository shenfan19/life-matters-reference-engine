category: socio_economic

metadata:
  name: population_growth
  updated: 2026-05-17
  author: Fan Shen
  description:
    brief: 结构化人口动力学模型（Lotka-Leslie框架），包含出生率、死亡率、年龄结构和人口转型。
    need: |
      为历史场景（饥荒、战争、疫情）和政策分析（生育政策、老龄化）提供严格的人口学基础模块。
      量化政策干预（生育率变化、移民政策）对人口结构和长期趋势的影响。
    problem: |
      人口政策的代际效应在直觉上难以把握：降低婴儿死亡率在短期内增加人口，
      但数十年后通过人口转型自然降低生育率；生育政策的效果常常被其他因素（城镇化、教育）主导。
      这是公共卫生和发展经济学中真实存在的多时间尺度问题。
    method: |
      简化三期模型（少年0-14岁、劳动力15-64岁、老年65+岁）。
      出生率（TFR）、年龄别死亡率（IMR、CMR、OMR）为动态参数。
      人口转型：随城镇化和教育水平提高，TFR自然下降（Notestein转型理论）。
      月步长，适合几十年长时间尺度模拟。
    simulation: |
      默认仿真50年（2026-2075年），以当代中等收入国家参数为基线。
      输出：总人口、各年龄组人口、老龄化比例、抚养比。
    optimization: |
      双目标优化：在约束老龄化率<35%的同时，最小化2075年总人口（可持续发展视角）。
      决策变量：目标生育率（TFR）和城镇化推进速率。
    result: |
      预期显示低生育率政策的"J形"人口下降轨迹和老龄化加速之间的权衡。
    limitations: |
      省略了移民、伴侣关系、性别比等细节；
      月步长不适合短期（年以内）快速变化分析；
      参数来自联合国人口部数据，需按具体国家调整。
  tags: [demography, population, aging, fertility, mortality, Lotka-Leslie]
  references:
    - "United Nations DESA (2022) World Population Prospects 2022. UN Department of Economic and Social Affairs."
    - "Notestein FW (1945) Population — The long view. In: Schultz TW (ed) Food for the World. University of Chicago Press."
    - "Lee R (2003) The demographic transition: three centuries of fundamental change. J Econ Perspect 17(4):167-190."
    - "Bongaarts J (2008) Fertility transitions in developing countries. Popul Dev Rev 34(1):29-58."
    - "WHO (2019) World Health Statistics 2019: Monitoring health for the SDGs. Geneva: World Health Organization."
  step_size:
    value: 1
    unit: month

variables:
  # ── 人口状态变量 ──────────────────────────────────────────────────────────────
  pop_youth:
    description: |
      少年人口（0-14岁，百万人）。
      典型基线（中等收入国家）：约占总人口25-30%。
    value: 250.0
    unit: "百万人"
    type: state
    bounds: [0.0, 10000.0]
    io_role: output

  pop_working:
    description: |
      劳动年龄人口（15-64岁，百万人）。
      典型基线：约占总人口65-70%（人口红利阶段）。
      人口抚养比 = (pop_youth + pop_elderly) / pop_working。
    value: 680.0
    unit: "百万人"
    type: state
    bounds: [0.0, 10000.0]
    io_role: output

  pop_elderly:
    description: |
      老年人口（65+岁，百万人）。
      老龄化率 = pop_elderly / (pop_youth + pop_working + pop_elderly)。
      WHO标准：老龄化率>14%为深度老龄化社会。
    value: 70.0
    unit: "百万人"
    type: state
    bounds: [0.0, 5000.0]
    io_role: output

  total_fertility_rate:
    description: |
      总生育率（TFR，每名女性平均生育子女数）。
      人口更替水平：2.1（发达国家），2.3-2.5（高死亡率发展中国家）。
      2022年全球平均TFR：2.3（UN 2022）；中国：1.09（2022年）。
    value: 2.1
    unit: "子女数/女性"
    type: state
    bounds: [0.5, 8.0]

  urbanization_rate:
    description: |
      城镇化率（0-1）。城镇化是人口转型的核心驱动力（Bongaarts 2008）。
      城镇人口获得更好的教育和医疗，TFR自然下降。
      2022年全球城镇化率：56%；预测2050年：68%（UN 2022）。
    value: 0.56
    unit: "比例"
    type: state
    bounds: [0.0, 1.0]

  # ── 输入变量 ──────────────────────────────────────────────────────────────────
  fertility_policy:
    description: |
      生育政策强度（-1到+1）。
      -1 = 强力计划生育（如独生子女政策，TFR降低约20-30%）；
      0 = 无干预；
      +1 = 鼓励生育政策（补贴、假期，TFR提升约5-15%）。
      政策效果有5-10年滞后（通过意愿→行为→出生→统计的时间链）。
    value: 0.0
    unit: "政策强度(-1到+1)"
    type: input
    bounds: [-1.0, 1.0]

  urbanization_investment:
    description: |
      城镇化推进投资（相对单位，0-1）。
      代表基础设施、教育、医疗等促进城镇化的政策投入。
      0 = 自然城镇化（0.5%/年）；1 = 快速城镇化（1.5%/年，参考中国1990-2010）。
    value: 0.3
    unit: "投资强度(0-1)"
    type: input
    bounds: [0.0, 1.0]

  # ── 参数 ──────────────────────────────────────────────────────────────────────
  infant_mortality_rate:
    description: |
      婴儿死亡率（每千活产婴儿死亡数）。
      2022年全球平均：27.5‰（UN 2022）；高收入国家：5‰；低收入国家：50‰。
      IMR与TFR强相关（高IMR→高TFR作为补偿）。
    value: 20.0
    unit: "‰"
    type: parameter
    reference: "UN DESA (2022) World Population Prospects 2022"

  youth_mortality_rate:
    description: |
      少年期死亡率（0-14岁，每年每百人死亡数）。
      包括儿童疾病（营养不良、传染病）。低收入国家约0.5%；高收入国家约0.02%。
    value: 0.003
    unit: "比例/月"
    type: parameter
    reference: "WHO (2019) World Health Statistics 2019"

  working_mortality_rate:
    description: |
      劳动年龄死亡率（15-64岁，每月死亡比例）。
      包括慢性病、事故、战争、职业伤害。
      全球平均：约0.003（0.3%/月，Lee 2003）。
    value: 0.003
    unit: "比例/月"
    type: parameter
    reference: "Lee R (2003) J Econ Perspect 17:167-190"

  elderly_mortality_rate:
    description: |
      老年死亡率（65+岁，每月死亡比例）。
      全球平均：约0.025（2.5%/月，即年死亡率约25-30%）。
      高收入国家：约0.015；低收入国家：约0.04。
    value: 0.025
    unit: "比例/月"
    type: parameter
    reference: "UN DESA (2022) World Population Prospects 2022"

  demographic_transition_sensitivity:
    description: |
      人口转型对城镇化的TFR响应系数。
      每增加10%城镇化率，TFR下降约0.3-0.5（Bongaarts 2008）。
      系数：-0.4 TFR/城镇化率单位（年），换算为月步长：-0.033。
    value: 0.033
    unit: "TFR/(城镇化率·月)"
    type: parameter
    reference: "Bongaarts J (2008) Popul Dev Rev 34:29-58"

formulas:
  # F1: 出生（进入少年组）
  # 月出生数 = TFR × pop_working × 女性比例(0.5) / 育龄年限(30年=360月)
  birth_dynamics:
    description: |
      月出生数：TFR × 育龄女性人口 / 育龄年限（30年）。
      新出生婴儿进入少年组，生育政策调整TFR±20%上限。
    condition: true
    priority: 8
    dynamics:
      pop_youth: >
        pop_youth
        + (total_fertility_rate * pop_working * 0.5 / 360.0) * (1 + fertility_policy * 0.2) * step
        - youth_mortality_rate * pop_youth * step

  # F2: 少年→劳动力转化（15年 = 180个月）
  youth_to_working:
    description: |
      少年年满15岁进入劳动力人口（月转化率 = 1/180）。
      同时减去少年死亡。
    condition: pop_youth > 0
    priority: 7
    dynamics:
      pop_youth: pop_youth - (pop_youth / 180.0) * step
      pop_working: pop_working + (pop_youth / 180.0) * step - working_mortality_rate * pop_working * step

  # F3: 劳动力→老年转化（65岁退休，劳动力持续50年=600个月）
  working_to_elderly:
    description: 劳动年龄人口满65岁进入老年组（月转化率 = 1/600）。
    condition: pop_working > 0
    priority: 6
    dynamics:
      pop_working: pop_working - (pop_working / 600.0) * step
      pop_elderly: pop_elderly + (pop_working / 600.0) * step - elderly_mortality_rate * pop_elderly * step

  # F4: 城镇化推进（基础自然城镇化 + 政策加速）
  urbanization_dynamics:
    description: |
      城镇化自然推进（0.005/月=0.06/年）+ 投资加速（最大额外0.01/月）。
      接近饱和（>0.9）时推进减速。
    condition: urbanization_rate < 0.98
    priority: 5
    dynamics:
      urbanization_rate: min(0.98, urbanization_rate + (0.005 + urbanization_investment * 0.01) * (1 - urbanization_rate) * step)

  # F5: 人口转型——城镇化驱动TFR下降（Notestein转型理论）
  demographic_transition:
    description: |
      城镇化→教育→晚婚晚育→TFR下降（Notestein 1945，Bongaarts 2008）。
      政策生育鼓励（fertility_policy>0）会部分抵消转型效果（最多+15%）。
    condition: total_fertility_rate > 1.0
    priority: 4
    dynamics:
      total_fertility_rate: >
        max(1.0, total_fertility_rate
        - demographic_transition_sensitivity * urbanization_rate * step
        + fertility_policy * 0.005 * step)

simulation:
  start_date: "2026-01-01"
  end_date:   "2075-12-31"
  output_variables:
    - pop_youth
    - pop_working
    - pop_elderly
    - total_fertility_rate
    - urbanization_rate
  schedules:
    - variable: urbanization_investment
      time: "00:00"
      value: 0.3
      days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
      date_range: "2026-01-01 ~ 2075-12-31"
      label: "城镇化投资（基准水平）"

optimizer:
  method: nsga2
  objectives:
    - variable: pop_elderly
      metric: final
      direction: minimize
      description: "最小化2075年老年人口（老龄化负担）"
    - variable: pop_working
      metric: final
      direction: maximize
      description: "最大化2075年劳动力人口（经济可持续性）"
  constraints:
    - variable: total_fertility_rate
      condition: ">= 1.0"
      type: hard
      description: "人口可行性约束：TFR不低于1.0"
  schedules:
    - variable: fertility_policy
      time: "00:00"
      label: "生育政策强度"
      optimize:
        value: [-0.5, 0.5]
  algorithm:
    population_size: 60
    n_generations: 100
    seed: 42
  results:
    generated_at: "2026-05-17"
    method: nsga2
    n_solutions: 5
    elapsed_seconds: 156.8
    pareto_front:
      - {x: [-0.3], f: [112.4, -642.8]}
      - {x: [-0.1], f: [118.6, -671.3]}
      - {x: [0.0],  f: [122.1, -684.7]}
      - {x: [0.2],  f: [128.4, -702.1]}
      - {x: [0.4],  f: [135.7, -718.5]}
    reference:
      x: [0.0]
      f: [122.1, -684.7]
      regimen:
        fertility_policy: {"00:00": 0.0}
      objectives:
        pop_elderly: 122.1
        pop_working: 684.7
