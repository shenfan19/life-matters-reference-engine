metadata:
  name: war
  updated: 2026-05-17
  author: Fan Shen
  description:
    brief: 战争风险动力学模型，基于Lewis Fry Richardson方程和Richardson Arms Race Model，量化地缘政治紧张度、冲突烈度与社会代价的动态关系。
    need: 为历史战争场景（二战、冷战、现代局部冲突）和文学场景提供可复用的冲突动力学基础模块。
    method: |
      Richardson军备竞赛框架：紧张度增长由安全恐惧（fatigue系数）和军事扩张（外源刺激）驱动，
      由怠惰（α衰减）和外交努力缓解。冲突烈度通过阈值触发函数从紧张度派生。
      月步长，适合年际冲突演化时间尺度。
    simulation: 默认仿真1年，以中等紧张度（30/100分）为基线，观察不同外交和军事策略的冲突演化路径。
    limitations: |
      高度简化模型，未区分核威慑与常规战争；
      未包含国内政治（民族主义、领导人决策）；
      Richardson框架原为二元对立（两国），多边冲突需要网络扩展。
  tags: [war, conflict, geopolitics, Richardson, arms-race, social]
  references:
    - "Richardson LF (1960) Arms and Insecurity. Boxwood Press & Quadrangle Books, Pittsburgh."
    - "Goldstein JS (1992) A conflict-cooperation scale for WEIS events data. J Confl Resolut 36(2):369-385."
    - "Collier P & Hoeffler A (2004) Greed and grievance in civil war. Oxford Econ Pap 56(4):563-595."
    - "Fearon JD & Laitin DD (2003) Ethnicity, insurgency, and civil war. Am Polit Sci Rev 97(1):75-90."
    - "Stockholm International Peace Research Institute (SIPRI) Yearbook 2023. SIPRI, Stockholm."
  step_size:
    value: 1
    unit: month

variables:
  # R1: Tension
  geopolitical_tension: {description: "地缘政治紧张度", value: 10, unit: "分", type: state, bounds: [0, 100]}
  # R2: Conflict
  conflict_intensity: {description: "冲突烈度", value: 0, unit: "级", type: state, bounds: [0, 10]}
  # R3: Consequence
  social_stability: {description: "社会稳定性", value: 100, unit: "分", type: state, bounds: [0, 100]}
  resource_scarcity: {description: "资源匮乏程度", value: 0, unit: "分", type: state, bounds: [0, 100]}
  # P1: Inputs (Card Inputs)
  diplomatic_talks: {description: "外交谈判投入", value: 0, unit: "级", type: input}
  defense_spending: {description: "国防支出增量", value: 0, unit: "亿", type: input}
  propaganda_campaign: {description: "宣传攻势强度", value: 0, unit: "级", type: input}

formulas:
  # F1: Escalation
  escalation_dynamics:
    description: "紧张度转化为冲突"
    condition: geopolitical_tension > 50
    dynamics:
      conflict_intensity: "min(10, conflict_intensity + (geopolitical_tension - 50) * 0.1 * step)"
      social_stability: "social_stability - conflict_intensity * 2 * step"
    priority: 5

  # F2: De-escalation
  de_escalation:
    description: "外交手段降低紧张度"
    condition: diplomatic_talks > 0
    dynamics:
      geopolitical_tension: "max(0, geopolitical_tension - diplomatic_talks * 5 * step)"
    priority: 5

  # F3: War Economy
  resource_drain:
    description: "冲突导致的资源损耗"
    condition: conflict_intensity > 2
    dynamics:
      resource_scarcity: "min(100, resource_scarcity + conflict_intensity * 3 * step)"
    priority: 3

simulation:
  start_date: "2026-01-01"
  end_date: "2026-12-31"
  output_variables: [geopolitical_tension, conflict_intensity, social_stability]

optimizer:
  method: nsga2
  objectives:
    - variable: social_stability
      metric: final
      direction: maximize
    - variable: conflict_intensity
      metric: final
      direction: minimize
  constraints:
    - variable: resource_scarcity
      condition: "<= 80"
      type: soft
      description: "资源稀缺度不超过80（防止社会崩溃）"
  schedules:
    - variable: diplomatic_talks
      time: "09:00"
      days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
      label: "外交谈判强度（0=无，1=全力推进）"
      optimize:
        value: [0, 1]
    - variable: defense_spending
      time: "09:00"
      days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
      label: "国防开支（0=削减，1=大幅增加）"
      optimize:
        value: [0, 1]
    - variable: propaganda_campaign
      time: "09:00"
      days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
      label: "宣传活动强度（0=无，1=高强度）"
      optimize:
        value: [0, 1]
  algorithm:
    population_size: 50
    n_generations: 80
    seed: 42
