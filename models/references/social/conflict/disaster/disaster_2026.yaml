metadata:
  name: disaster
  updated: 2026-05-17
  author: Fan Shen
  description:
    brief: 自然灾害响应动力学模型，基于Sendai框架和灾害风险管理理论，量化灾害强度、损毁程度、救援资源和人群安全的时序演化。
    need: 为历史灾难场景（庞贝、广岛、唐山地震）和现代灾害管理场景提供可复用的灾害动力学基础模块。
    method: |
      三核心状态：危害强度（hazard_intensity）、基础设施损毁（damage_index）、人群安全（population_safety）。
      救援资源（supplies_delivery）和重建投入（infrastructure_repair）为干预输入。
      小时步长，适合急性灾害（地震、洪水）的响应时间尺度（前72小时为黄金救援期）。
    simulation: 默认仿真3天（72小时），模拟7级地震后的响应场景。
    limitations: |
      未包含空间传播（灾害扩散前锋）；
      未区分不同灾害类型（地震 vs 洪水 vs 飓风）的特异性动力学；
      参数来自典型地震研究，须按具体灾害类型校准。
  tags: [disaster, earthquake, emergency_response, Sendai_framework, risk]
  references:
    - "UNDRR (2015) Sendai Framework for Disaster Risk Reduction 2015-2030. United Nations, Geneva."
    - "Quarantelli EL (2005) Catastrophes are different from disasters. Social Science Research Council, New York."
    - "FEMA (2019) National Response Framework, 4th edition. US Department of Homeland Security."
    - "Guha-Sapir D et al. (2016) Annual Disaster Statistical Review 2015. CRED, Brussels."
    - "De Groeve T et al. (2013) Global Disaster Alert and Coordination System. JRC Technical Report EUR 25929."
  step_size:
    value: 1
    unit: hour
variables:
  hazard_intensity:
    description: 灾害强度
    value: 0
    unit: 级
    type: state
    bounds:
    - 0
    - 10
  damage_index:
    description: 设施受损指数
    value: 0
    unit: 分
    type: state
    bounds:
    - 0
    - 100
  population_safety:
    description: 人群安全评分
    value: 100
    unit: 分
    type: state
    bounds:
    - 0
    - 100
  rescue_progress:
    description: 救援任务进度
    value: 0
    unit: '%'
    type: state
    bounds:
    - 0
    - 100
  supplies_delivery:
    description: 物资投送
    value: 0
    unit: 吨
    type: input
  evacuation_order:
    description: 撤离指令强度
    value: 0
    unit: 级
    type: input
  infrastructure_repair:
    description: 修缮投入
    value: 0
    unit: 万
    type: input
formulas:
  damage_dynamics:
    description: 灾害导致损毁
    condition: hazard_intensity > 3
    dynamics:
      damage_index: min(100, damage_index + (hazard_intensity - 3) * 5 * step)
      population_safety: max(0, population_safety - hazard_intensity * 2 * step)
    priority: 5
  rescue_dynamics:
    description: 救援提升安全并修复设施
    condition: supplies_delivery > 0
    dynamics:
      rescue_progress: min(100, rescue_progress + supplies_delivery * 0.5 * step)
      population_safety: min(100, population_safety + supplies_delivery * 0.2 * step)
    priority: 5
  repair_dynamics:
    description: 灾后重建
    condition: infrastructure_repair > 0 and hazard_intensity < 5
    dynamics:
      damage_index: max(0, damage_index - infrastructure_repair * 0.1 * step)
    priority: 3
simulation:
  start_date: "2026-01-01"
  end_date: "2026-01-03"
  output_variables:
  - damage_index
  - population_safety
  - rescue_progress
