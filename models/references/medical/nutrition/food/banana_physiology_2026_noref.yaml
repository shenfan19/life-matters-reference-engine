metadata:
  name: banana
  updated: 2026-04-23
  author: Fan Shen
  description:
    brief: "香蕉生长与采摘模型：单文件通用动力学演示。"
    need: 作为医学参考模块，为更高层场景、published 案例或组合模型提供可复用机制。
    method: 包含 4 个变量和 2 个方程，描述 ripeness、freshness、water_input、harvest_action 的基础动态。
    simulation: 默认仿真从 2026-01-01 到 2026-01-15，用于观察核心状态随时间变化。
    limitations: 文件名标记 noref，表示参数和机制仍需补充正式文献来源。
  tags: [agricultural, simple]
  step_size:
    value: 1
    unit: day

variables:
  ripeness: {description: "成熟度", value: 0, unit: "%", type: state, bounds: [0, 100]}
  freshness: {description: "新鲜度", value: 100, unit: "分", type: state, bounds: [0, 100]}
  water_input: {description: "浇水", value: 0, unit: "L", type: input}
  harvest_action: {description: "采摘", value: 0, unit: "次", type: input}

formulas:
  growing:
    description: "自然生长"
    condition: ripeness < 100
    dynamics:
      ripeness: "ripeness + (1 + water_input * 0.5) * step"
    priority: 5
  rotting:
    description: "过熟腐烂"
    condition: ripeness >= 100
    dynamics:
      freshness: "freshness - 5 * step"
    priority: 3

simulation:
  start_date: "2026-01-01"
  end_date: "2026-01-15"
  output_variables: [ripeness, freshness]
