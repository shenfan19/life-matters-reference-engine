category: intervention

metadata:
  name: "cooked_meat"
  updated: 2026-04-23
  author: "Antigravity"
  description:
    brief: "标准烤肉营养模型。每100g含：蛋白质 26g, 脂肪 15g, 碳水化合物 0g, 水分 58g。"
    need: 作为医学参考模块，为更高层场景、published 案例或组合模型提供可复用机制。
    method: 包含 5 个变量和 1 个方程，描述 meat_intake、food_carbohydrate、food_protein、food_fat 的基础动态。
    simulation: 默认仿真从 2026-01-01 到 2026-01-02，用于观察核心状态随时间变化。
    limitations: 该模块偏基础组件，参数应在被场景调用时结合具体上下文校准。
  tags: [food, diet, meat]
  step_size:
    value: 1
    unit: minute

variables:
  # ========== 输入变量 ==========
  meat_intake:
    type: input
    value: 0
    unit: "g"
    bounds: [0, 1000]
    io_role: input
    description: "摄入烤肉的重量"

  # ========== 输出指标 (供 nutrition_intake 使用) ==========
  food_carbohydrate:
    type: state
    value: 0
    unit: "g"
    io_role: output

  food_protein:
    type: state
    value: 0
    unit: "g"
    io_role: output

  food_fat:
    type: state
    value: 0
    unit: "g"
    io_role: output

  water_intake:
    type: state
    value: 0
    unit: "ml"
    io_role: output

formulas:
  calculate_nutrition_impact:
    condition: meat_intake > 0
    priority: 1
    dynamics:
      food_carbohydrate: 0
      food_protein: "meat_intake * 0.26"
      food_fat: "meat_intake * 0.15"
      water_intake: "meat_intake * 0.58"
      meat_intake: 0

simulation:
  start_date: "2026-01-01"
  end_date: "2026-01-02"
  output_variables: [food_carbohydrate, food_protein, food_fat, water_intake]

optimizer:
  method: nsga2
  objectives:
    - variable: food_protein
      metric: final
      direction: maximize
    - variable: food_fat
      metric: final
      direction: minimize
  schedules:
    - variable: meat_intake
      time: "12:00"
      days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
      label: "熟肉摄入量（g）"
      optimize:
        value: [0, 1000]
  algorithm:
    population_size: 50
    n_generations: 80
    seed: 42
