metadata:
  name: noodle
  updated: 2026-04-23
  author: Fan Shen
  description:
    brief: "面条制作与煮熟模型：通用单文件动力学演示。"
    need: 作为医学参考模块，为更高层场景、published 案例或组合模型提供可复用机制。
    method: 包含 4 个变量和 2 个方程，描述 softness、temperature、heat_input、salt_added 的基础动态。
    simulation: 默认仿真从 2026-01-01 到 2026-01-02，用于观察核心状态随时间变化。
    limitations: 文件名标记 noref，表示参数和机制仍需补充正式文献来源。
  tags: [cooking, simple]
  step_size:
    value: 1
    unit: minute

variables:
  softness: {description: "面条软度", value: 10, unit: "%", type: state, bounds: [0, 100]}
  temperature: {description: "锅内温度", value: 20, unit: "°C", type: state, bounds: [0, 120]}
  heat_input: {description: "火力调节", value: 0, unit: "级", type: input}
  salt_added: {description: "加盐量", value: 0, unit: "g", type: input}

formulas:
  heating:
    description: "加热过程"
    condition: temperature < 110
    dynamics:
      temperature: "temperature + heat_input * 5 * step"
    priority: 5
  cooking:
    description: "煮面过程"
    condition: temperature > 95
    dynamics:
      softness: "min(100, softness + (temperature - 90) * 0.2 * step)"
    priority: 4

simulation:
  start_date: "2026-01-01"
  end_date: "2026-01-02"
  output_variables: [softness, temperature]
