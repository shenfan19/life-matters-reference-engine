category: intervention
metadata:
  name: banana2
  updated: 2026-04-23
  author: Antigravity
  description:
    brief: 标准香蕉营养模型。每100g含：碳水化合物 23g, 蛋白质 1.1g, 脂肪 0.3g, 水分 75g。
    need: 作为医学参考模块，为更高层场景、published 案例或组合模型提供可复用机制。
    method: 包含 5 个变量和 1 个方程，描述 banana_intake、food_carbohydrate、food_protein、food_fat 的基础动态。
    simulation: 默认仿真从 2026-01-01 到 2026-01-02，用于观察核心状态随时间变化。
    optimization: 包含优化配置，包含优化目标，用于搜索可行的干预或参数组合。
    result: 预期用于观察候选干预或参数组合的风险收益边界。
    limitations: 该模块偏基础组件，参数应在被场景调用时结合具体上下文校准。
  ratings:
    research_demand: 2 - 香蕉营养组件是游戏场景专用，复用价值有限
    evidence_quality: 3 - 参数来自标准营养成分表，数值可靠但模型极简
    popularity: 1 - 专为游戏（_ag）设计的简化食物模块，通用度极低
  tags:
  - food
  - diet
  - fruit
  step_size:
    value: 1
    unit: minute
variables:
  banana_intake:
    description: 摄入香蕉的重量
    value: 0
    unit: g
    type: input
    bounds:
    - 0
    - 1000
  food_carbohydrate:
    description: 产生的碳水化合物摄入量
    value: 0
    unit: g
    type: state
    bounds:
  food_protein:
    description: 产生的蛋白质摄入量
    value: 0
    unit: g
    type: state
    bounds:
  food_fat:
    description: 产生的脂肪摄入量
    value: 0
    unit: g
    type: state
    bounds:
  water_intake:
    description: 产生的水分摄入量
    value: 0
    unit: ml
    type: state
    bounds:
formulas:
  calculate_nutrition_impact:
    description: ''
    condition: ''
    priority: 1
    dynamics:
      food_carbohydrate: banana_intake * 0.23
      food_protein: banana_intake * 0.011
      food_fat: banana_intake * 0.003
      water_intake: banana_intake * 0.75
      banana_intake: 0
simulation:
  start_date: "2026-01-01"
  end_date: "2026-01-02"
  output_variables: [food_carbohydrate, food_protein, food_fat, water_intake]

optimizer:
  method: nsga2
  objectives:
    - variable: food_carbohydrate
      metric: final
      direction: maximize
    - variable: food_fat
      metric: final
      direction: minimize
  schedules:
    - variable: banana_intake
      time: "08:00"
      days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
      label: "香蕉摄入量（g）"
      optimize:
        value: [0, 1000]
  algorithm:
    population_size: 50
    n_generations: 80
    seed: 42
