category: dynamics

metadata:
  name: "simple_nutrition"
  updated: 2026-04-23
  author: "Antigravity"
  description:
    brief: "简化的营养摄入动态模型，用于对照香蕉模型进行基础校验。"
    need: 作为医学参考模块，为更高层场景、published 案例或组合模型提供可复用机制。
    method: 包含 8 个变量和 1 个方程，描述 food_carbohydrate、food_protein、food_fat、water_intake 的基础动态。
    simulation: 默认仿真从 2026-01-01 到 2026-01-02，用于观察核心状态随时间变化。
    limitations: 该模块偏基础组件，参数应在被场景调用时结合具体上下文校准。
  tags: [nutrition, simple, demo]
  step_size:
    value: 1
    unit: minute

variables:
  # ========== 来自食物模型的输入 (匹配 banana.yaml 的输出) ==========
  food_carbohydrate:
    type: state
    value: 0
    unit: "g"
    io_role: intermediate
    description: "待转化的碳水化合物"

  food_protein:
    type: state
    value: 0
    unit: "g"
    io_role: intermediate
    description: "待转化的蛋白质"

  food_fat:
    type: state
    value: 0
    unit: "g"
    io_role: intermediate
    description: "待转化的脂肪"

  water_intake:
    type: state
    value: 0
    unit: "ml"
    io_role: intermediate
    description: "待转化的水分"

  # ========== 身体状态变量 ==========
  gastric_carbohydrate:
    type: state
    value: 0
    unit: "g"
    io_role: output
    description: "胃部碳水化合物含量"

  gastric_protein:
    type: state
    value: 0
    unit: "g"
    io_role: output
    description: "胃部蛋白质含量"

  gastric_fat:
    type: state
    value: 0
    unit: "g"
    io_role: output
    description: "胃部脂肪含量"

  body_water:
    type: state
    value: 42000
    unit: "ml"
    io_role: output
    description: "身体总水分"

formulas:
  ingestion_transfer:
    condition: "food_carbohydrate > 0 or food_protein > 0 or food_fat > 0 or water_intake > 0"
    priority: 1
    dynamics:
      gastric_carbohydrate: "gastric_carbohydrate + food_carbohydrate"
      gastric_protein: "gastric_protein + food_protein"
      gastric_fat: "gastric_fat + food_fat"
      body_water: "body_water + water_intake"
      # 清零输入，防止重复累加
      food_carbohydrate: 0
      food_protein: 0
      food_fat: 0
      water_intake: 0

simulation:
  start_date: "2026-01-01"
  end_date: "2026-01-02"
  output_variables: [gastric_carbohydrate, gastric_protein, gastric_fat, body_water]
