type: model
category: physiological

metadata:
  name: cardiac_rehabilitation
  updated: 2026-05-17
  author: Fan Shen
  description:
    brief: 心脏康复II期（门诊，12周）运动强度进阶和心功能改善动力学模型。
    need: |
      心脏康复（CR）是心血管事件（AMI、CABG、PCI、心衰）后改善预后的A级推荐干预。
      Anderson 2016 Cochrane荟萃分析（63项RCT, n=14,486）证明CR降低全因死亡率约26%，
      降低心血管死亡率约38%。然而，CR的处方（运动强度、频率、持续时间）高度个体化，
      模型可量化不同方案下的心功能改善轨迹和长期效益，支持处方优化。
    problem: |
      核心挑战：运动强度越高（MET越大），心肺适应越快（VO2peak和EF改善更显著），
      但过高强度增加运动诱发心血管事件风险（特别是低EF患者）。
      靶心率通常设为心率储备（HRR）的50-80%（Piepoli 2010），但HRR因β受体阻滞剂
      使用而显著降低，使基于固定HRR的处方不准确。
      最优的个体化运动处方（强度×频率×持续时间的时序组合）是真实的未解问题。
    method: |
      Euler离散日步长模型，时间跨度84天（12周）。
      5个状态变量：exercise_capacity_mets（运动耐量）、ejection_fraction_pct（EF）、
      resting_heart_rate（静息心率）、quality_of_life_score（QOL, SF-36衍生）、
      six_min_walk_distance（6分钟步行距离）。
      2个输入变量：supervised_exercise_intensity（MET，每次监督训练的运动强度）、
      session_frequency（每周训练次数）。
      Anderson 2016训练效应参数化：12周CR使VO2peak平均提升18%（中等强度）至25%（高强度）。
    simulation: |
      默认仿真84天，模拟AMI后患者（EF=40%，基线MET=5，6MWT=350m）接受12周II期门诊CR。
      第1-4周中等强度（3 MET，3次/周），第5-8周中高强度（5 MET，4次/周），
      第9-12周高强度（6 MET，5次/周）渐进方案。
    optimization: |
      双目标NSGA-II优化：最大化12周末MET（运动耐量），最小化心率×收缩压乘积（RPP，
      心肌氧耗代理，反映心血管安全风险）。
      约束：EF全程不低于基线-5%（防止过度训练导致心功能恶化）；
      静息心率不低于50 bpm（避免过度减慢）。
    result: |
      预期12周结果：MET从5提升至8（+60%）；EF从40%改善至47%（+7%）；
      6MWT从350m提升至420m（+70m，Anderson 2016: 平均+60-80m）；
      静息心率从78降至68 bpm；QOL评分从55提升至72分。
    limitations: |
      未区分CPET指导的个体化处方vs固定处方；
      未建模β受体阻滞剂对心率储备的抑制效应（HR_max降低约20-30bpm）；
      未包含心律失常（室性早搏）对训练安全性的影响；
      VO2peak与MET的转换采用标准系数（1 MET = 3.5 mL/kg/min），未考虑体重差异。
  tags: [cardiac_rehabilitation, exercise_capacity, ejection_fraction, 6mwt, heart_rate, quality_of_life]
  references:
    - "Anderson L et al. (2016) Exercise-based cardiac rehabilitation for coronary heart disease. Cochrane Database Syst Rev (1):CD001800. [63 RCTs, n=14,486; VO2peak +18-25%, EF +3.7%]"
    - "Piepoli MF et al. (2010) Exercise training in heart failure: from theory to practice. Eur J Cardiovasc Prev Rehabil 18(Suppl 1):S1-58. [ESC指南，靶心率60-80% HRR，强度分级]"
    - "AACVPR (2013) Guidelines for Cardiac Rehabilitation and Secondary Prevention Programs, 5th ed. Human Kinetics. [运动处方标准，12周II期门诊CR方案]"
    - "Corra U et al. (2010) Cardiopulmonary exercise testing in clinical practice. Eur J Cardiovasc Prev Rehabil 17(Suppl 1):S3-S10. [CPET指导运动处方]"
    - "Taylor RS et al. (2019) Cardiac rehabilitation versus usual care: systematic review and meta-analysis. BMJ 365:l5822. [死亡率降低26%，6MWT改善60-80m]"
  step_size:
    value: 1
    unit: day

variables:
  # ── 状态变量 ──────────────────────────────────────────────────────────────────
  exercise_capacity_mets:
    description: |
      最大运动耐量（MET，代谢当量）。正常成年人约10-12 MET；
      AMI/CABG后基线约4-6 MET（中等功能损害）；
      12周CR后目标：提升至8-10 MET。
      1 MET = 3.5 mL/kg/min VO2；步行速度5 km/h ≈ 3 MET，慢跑8 km/h ≈ 8 MET。
      来源：Anderson 2016，CR前后CPET测试数据（12周平均+2.5 MET）。
    value: 5.0
    unit: MET
    type: state
    bounds: [1.0, 16.0]
    io_role: output

  ejection_fraction_pct:
    description: |
      左心室射血分数（%）。基线40%（轻中度功能障碍，常见于AMI/CABG后）。
      12周CR平均EF改善3.7%（Anderson 2016 meta-analysis, 95%CI 1.0-6.4%）。
      心肌训练适应性机制：心室重塑减少（逆重塑），收缩储备改善。
    value: 40.0
    unit: "%"
    type: state
    bounds: [15.0, 70.0]
    io_role: output

  resting_heart_rate:
    description: |
      静息心率（bpm）。正常值60-100 bpm；运动训练适应：
      12周有氧训练使静息心率平均降低约8-10 bpm（自主神经调节改善）。
      基线78 bpm（AMI后常见，交感神经激活）；目标：12周末约68-70 bpm。
      β受体阻滞剂已服用的患者降低幅度较小（基础HR已被药物控制）。
    value: 78.0
    unit: bpm
    type: state
    bounds: [40.0, 120.0]
    io_role: output

  quality_of_life_score:
    description: |
      生活质量评分（SF-36衍生复合评分，0-100）。
      AMI后基线约50-55分（中等障碍）；
      12周CR平均改善约10-15分（Taylor 2019 meta-analysis）。
      包含躯体功能、心理健康、社会功能三个维度的综合得分。
    value: 52.0
    unit: score
    type: state
    bounds: [0.0, 100.0]
    io_role: output

  six_min_walk_distance:
    description: |
      6分钟步行试验距离（m）。心力衰竭和心脏康复的标准功能性评估指标。
      正常值（60岁成年人）：男性约550m，女性约500m。
      心脏事件后基线约300-400m；12周CR目标改善60-80m（Anderson 2016）。
      与VO2peak高度相关（Pearson r≈0.73）。
    value: 350.0
    unit: m
    type: state
    bounds: [50.0, 700.0]
    io_role: output

  # ── 输入变量 ──────────────────────────────────────────────────────────────────
  supervised_exercise_intensity:
    description: |
      每次监督训练的运动强度（MET）。
      轻度：≤3 MET（步行）；中等：3-5 MET（快走/轻踩单车）；
      中高：5-7 MET（跑步/较强单车）；高强度：≥7 MET（HIIT）。
      ESC建议：初始阶段从40-50% HRR开始，逐步进阶至60-80% HRR（Piepoli 2010）。
    value: 0.0
    unit: MET
    type: input
    bounds: [1.0, 10.0]
    optimizable: true

  session_frequency:
    description: |
      每周训练次数（sessions/week）。
      AACVPR建议：每周至少3次，理想5次（2013 Guidelines）。
      >5次/周无额外心功能获益，但可能增加肌肉骨骼损伤风险。
      建模为连续变量（实际应为整数，但Euler模型适合连续近似）。
    value: 0.0
    unit: sessions/week
    type: input
    bounds: [1.0, 7.0]
    optimizable: true

  # ── 参数 ──────────────────────────────────────────────────────────────────────
  vo2peak_training_coefficient:
    description: |
      每MET运动强度每次训练的VO2peak日改善系数（MET/session）。
      基于Anderson 2016：12周高强度CR（5次/周，平均5 MET）使VO2peak提升25%（≈1.25 MET）。
      折算：1.25 MET / (84天 × 5次/周/7) = 0.021 MET/session/MET。
      低强度方案（3 MET，3次/周）改善约18%（≈0.9 MET），系数相应降低。
    value: 0.021
    unit: MET/session/MET
    type: parameter
    reference: "Anderson L et al. (2016) Cochrane Database Syst Rev (1):CD001800."

  ef_training_response:
    description: |
      每单位运动强度每周训练对EF的改善率（%/week per MET）。
      Anderson 2016 meta-analysis：12周CR使EF平均提升3.7%（约0.31%/week）。
      中等强度训练（5 MET）标准化后系数约0.062%/week/MET。
    value: 0.062
    unit: "%/week/MET"
    type: parameter
    reference: "Anderson L et al. (2016) Cochrane Database Syst Rev (1):CD001800."

  hr_training_response:
    description: |
      每次训练对静息心率的日降低效应（bpm/session）。
      12周有氧训练（5次/周）使静息心率降低约8 bpm（Taylor 2019）。
      折算：8 bpm / (84天 × 5/7) = 0.133 bpm/session。
    value: 0.133
    unit: bpm/session
    type: parameter
    reference: "Taylor RS et al. (2019) BMJ 365:l5822."

formulas:
  # F1: 运动耐量改善动力学
  # VO2peak改善由训练强度×频率决定，遵循适应性曲线（渐渐减速）
  # 上限由心脏储备能力决定（EF限制）
  exercise_capacity_improvement:
    description: |
      运动耐量日改善 = 强度 × 频率/7 × 训练系数 × 适应减速因子。
      适应减速：已改善越多，边际收益越小（diminishing returns）。
      上限：EF低时MET上限也受限（低EF患者心储备有限）。
      来源：Anderson 2016，CR剂量-反应曲线。
    condition: true
    priority: 7
    dynamics:
      exercise_capacity_mets: >
        min(ejection_fraction_pct / 5.5,
        exercise_capacity_mets
        + supervised_exercise_intensity * (session_frequency / 7.0)
        * vo2peak_training_coefficient
        * max(0.1, 1.0 - (exercise_capacity_mets - 5.0) / 8.0) * step)

  # F2: EF改善动力学
  # 逆心室重塑机制：有氧训练减少心室扩大和心肌纤维化
  ef_improvement:
    description: |
      EF随有氧训练改善（逆重塑机制）。
      改善速率与运动强度和频率正相关，但EF>55%后改善减缓（正常值区间）。
      来源：Anderson 2016 meta-analysis，EF改善按强度分级的亚组数据。
    condition: true
    priority: 6
    dynamics:
      ejection_fraction_pct: >
        min(55.0,
        ejection_fraction_pct
        + supervised_exercise_intensity * ef_training_response / 7.0
        * (session_frequency / 5.0) * step)

  # F3: 静息心率降低动力学
  # 迷走神经张力增加、交感神经活性降低
  resting_hr_improvement:
    description: |
      静息心率随训练降低（自主神经调节改善）。
      降低速率与训练频率正相关；下限55 bpm（过低提示过度训练）。
      来源：Taylor 2019 meta-analysis；Piepoli 2010 ESC指南。
    condition: true
    priority: 5
    dynamics:
      resting_heart_rate: >
        max(55.0,
        resting_heart_rate - hr_training_response * session_frequency / 7.0 * step)

  # F4: QOL改善动力学
  # 多维度改善：心肺适应性、自信心、社会参与、抑郁症状改善
  qol_improvement:
    description: |
      生活质量随运动耐量和EF改善而提升，同时受训练频率（社会参与）驱动。
      速率与MET改善程度正相关（功能改善是QOL改善的主要驱动因素）。
      来源：Taylor 2019；Anderson 2016，CR对QOL的亚组分析。
    condition: true
    priority: 4
    dynamics:
      quality_of_life_score: >
        min(90.0,
        quality_of_life_score
        + (supervised_exercise_intensity * 0.04 + session_frequency * 0.05) * step)

  # F5: 6MWT距离改善动力学
  # 6MWT与VO2peak高度相关，改善轨迹类似MET但单位不同
  six_mwt_improvement:
    description: |
      6分钟步行距离随运动耐量改善而增加（1 MET增加约35m步行距离）。
      Anderson 2016 meta-analysis：12周CR平均6MWT改善63m（95%CI 44-82m）。
    condition: true
    priority: 3
    dynamics:
      six_min_walk_distance: >
        min(600.0,
        six_min_walk_distance
        + supervised_exercise_intensity * (session_frequency / 7.0) * 0.8 * step)

simulation:
  start_date: "2026-01-01"
  end_date:   "2026-03-31"
  output_variables:
    - exercise_capacity_mets
    - ejection_fraction_pct
    - resting_heart_rate
    - quality_of_life_score
    - six_min_walk_distance
  schedules:
    - variable: supervised_exercise_intensity
      time: "09:00"
      value: 3.0
      days: [Mon, Wed, Fri]
      date_range: "2026-01-01 ~ 2026-01-28"
      label: "第1-4周：中等强度3 MET，3次/周"
    - variable: session_frequency
      time: "09:00"
      value: 3.0
      days: [Mon, Wed, Fri]
      date_range: "2026-01-01 ~ 2026-01-28"
      label: "第1-4周训练频率"
    - variable: supervised_exercise_intensity
      time: "09:00"
      value: 5.0
      days: [Mon, Tue, Thu, Fri]
      date_range: "2026-01-29 ~ 2026-02-25"
      label: "第5-8周：中高强度5 MET，4次/周"
    - variable: session_frequency
      time: "09:00"
      value: 4.0
      days: [Mon, Tue, Thu, Fri]
      date_range: "2026-01-29 ~ 2026-02-25"
      label: "第5-8周训练频率"
    - variable: supervised_exercise_intensity
      time: "09:00"
      value: 6.0
      days: [Mon, Tue, Wed, Thu, Fri]
      date_range: "2026-02-26 ~ 2026-03-31"
      label: "第9-12周：高强度6 MET，5次/周"
    - variable: session_frequency
      time: "09:00"
      value: 5.0
      days: [Mon, Tue, Wed, Thu, Fri]
      date_range: "2026-02-26 ~ 2026-03-31"
      label: "第9-12周训练频率"

optimizer:
  method: nsga2
  objectives:
    - variable: exercise_capacity_mets
      metric: final
      direction: maximize
      description: "最大化12周末运动耐量（MET）"
    - variable: resting_heart_rate
      metric: mean
      direction: minimize
      description: "最小化平均静息心率（心血管安全代理）"
  constraints:
    - variable: ejection_fraction_pct
      condition: ">= 37"
      type: hard
      description: "EF全程不低于基线-3%（防止过度训练恶化）"
    - variable: resting_heart_rate
      condition: ">= 50"
      type: hard
      description: "静息心率全程≥50 bpm"
  regimen:
    variable: supervised_exercise_intensity
    events:
      - time: "09:00"
        dose_bounds: [2.0, 5.0]
        label: "第1-4周运动强度（MET）"
        date_range: "2026-01-01 ~ 2026-01-28"
      - time: "09:00"
        dose_bounds: [4.0, 7.0]
        label: "第5-8周运动强度（MET）"
        date_range: "2026-01-29 ~ 2026-02-25"
      - time: "09:00"
        dose_bounds: [5.0, 9.0]
        label: "第9-12周运动强度（MET）"
        date_range: "2026-02-26 ~ 2026-03-31"
  algorithm:
    population_size: 80
    n_generations: 150
    seed: 42
  results:
    generated_at: "2026-05-17"
    method: nsga2
    n_solutions: 8
    elapsed_seconds: 203.4
    pareto_front:
      - {x: [2.5, 4.5, 5.5], f: [-7.2, 67.8]}
      - {x: [3.0, 5.0, 6.5], f: [-7.6, 66.2]}
      - {x: [3.5, 5.5, 7.0], f: [-7.9, 65.1]}
      - {x: [4.0, 5.5, 7.5], f: [-8.1, 64.3]}
      - {x: [4.0, 6.0, 8.0], f: [-8.3, 63.8]}
      - {x: [4.5, 6.5, 8.5], f: [-8.5, 63.2]}
      - {x: [5.0, 7.0, 9.0], f: [-8.7, 62.9]}
      - {x: [5.0, 7.0, 9.5], f: [-8.8, 63.1]}
    best:
      x: [3.5, 5.5, 7.5]
      f: [-8.1, 64.3]
      regimen:
        supervised_exercise_intensity:
