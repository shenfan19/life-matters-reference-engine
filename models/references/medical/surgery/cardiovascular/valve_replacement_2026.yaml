category: physiological

metadata:
  name: valve_replacement
  updated: 2026-05-17
  author: Fan Shen
  description:
    brief: 主动脉瓣置换术（TAVR/SAVR）术后血流动力学恢复与抗凝管理模型（6周）。
    need: |
      主动脉瓣狭窄是最常见的需手术干预的心脏瓣膜病（患病率>75岁人群约3.4%）。
      TAVR（经导管主动脉瓣置换）的兴起使高危/极高危患者得以手术，但术后血流动力学
      恢复轨迹和抗凝管理策略与SAVR存在差异，需要动态模型量化个体化恢复过程。
    problem: |
      核心问题：TAVR后主动脉跨瓣压差（从≥40 mmHg降至<20 mmHg）的快速改善与左心
      功能的适应性重塑（肺动脉压下降、心脏指数提升）之间存在时序差异——压差立即改善，
      但肺血管阻力和左心室肥大的消退需要数周至数月。
      抗凝策略：生物瓣置换后3个月华法林（INR目标2.5），过后停用；机械瓣需终身抗凝。
      最优物理治疗进阶与INR管理的协同策略需要量化支持。
    method: |
      Euler离散日步长模型，时间跨度42天。
      5个状态变量：aortic_gradient（主动脉跨瓣压差）、cardiac_index（心脏指数）、
      pulmonary_pressure（肺动脉平均压）、anticoagulation_inr（实际INR）、
      mobility_score（活动能力评分）。
      2个输入变量：physical_therapy_intensity（物理治疗强度）、warfarin_dose（华法林日剂量）。
      压差动力学：TAVR后立即改善（术后第1天），随后随左室重塑缓慢优化。
    simulation: |
      默认仿真42天，模拟TAVR后典型患者（术前主动脉压差48 mmHg，严重狭窄）。
      华法林起始5 mg/day，根据INR调整目标值2.5（生物瓣3个月方案）。
      物理治疗第1周强度1（轻度活动），第2-6周渐进至强度4。
    optimization: |
      双目标优化：最大化第42天心脏指数，同时最小化INR超出目标范围的时间（INR波动最小化）。
      约束：INR全程1.5-3.5（安全范围）；肺动脉压第42天≤35 mmHg。
    result: |
      预期：TAVR后主动脉压差在24-48小时内从48降至18 mmHg（Leon 2010 PARTNER Trial）；
      心脏指数从1.8 L/min/m²恢复至2.4-2.6 L/min/m²（6周）；
      肺动脉压从38 mmHg降至30 mmHg（6周渐进改善）。
    limitations: |
      未包含瓣周漏（PVL）对有效瓣口面积的影响；
      INR模型采用简化的一室动力学，未考虑CYP2C9/VKORC1基因型差异；
      未建模TAVR特有并发症：传导阻滞（需起搏器植入率约10%）、卒中（30天约2-3%）。
  tags: [tavr, savr, valve_replacement, aortic_stenosis, cardiac_index, anticoagulation, warfarin]
  references:
    - "Leon MB et al. (2010) Transcatheter aortic-valve implantation for aortic stenosis in patients who cannot undergo surgery (PARTNER Trial). NEJM 363(17):1597-1607."
    - "Nishimura RA et al. (2014) 2014 ACC/AHA Guideline on the Management of Patients with Valvular Heart Disease. JACC 63(22):e57-185."
    - "Vahanian A et al. (2022) 2021 ESC/EACTS Guidelines for the management of valvular heart disease. Eur Heart J 43(7):561-632."
    - "Mack MJ et al. (2019) Transcatheter aortic-valve replacement with a balloon-expandable valve in low-risk patients (PARTNER 3). NEJM 380(18):1695-1705."
    - "Otto CM et al. (2021) 2020 ACC/AHA Guideline for the Management of Patients with Valvular Heart Disease. JACC 77(4):e25-197."
  step_size:
    value: 1
    unit: day

variables:
  # ── 状态变量 ──────────────────────────────────────────────────────────────────
  aortic_gradient:
    description: |
      主动脉跨瓣平均压差（mmHg）。
      重度主动脉瓣狭窄标准：平均压差≥40 mmHg（ACC/AHA 2014）。
      TAVR/SAVR后即刻降至新瓣膜的有效压差：生物瓣通常8-20 mmHg（Leon 2010）。
      残余压差受人工瓣有效口面积（EOA）决定，TAVR生物瓣EOA≈1.5-2.0 cm²。
    value: 48.0
    unit: mmHg
    type: state
    bounds: [3.0, 80.0]
    io_role: output

  cardiac_index:
    description: |
      心脏指数（L/min/m²），体表面积校正的心输出量。
      正常值2.5-4.0 L/min/m²；<2.2为低心排（需干预）；<1.8为心源性休克。
      重度主动脉瓣狭窄术前典型值1.8-2.2 L/min/m²；TAVR后随压差降低逐步改善。
      来源：Leon et al. (2010) PARTNER Trial，基线及随访数据。
    value: 1.9
    unit: "L/min/m²"
    type: state
    bounds: [1.0, 5.0]
    io_role: output

  pulmonary_pressure:
    description: |
      肺动脉平均压（mmHg）。正常值8-20 mmHg；≥25为肺动脉高压。
      主动脉瓣狭窄继发肺高压（左心室后负荷增加→左室压力升高→肺静脉压升高）。
      TAVR后肺压随左心室压力降低逐步下降，时间常数约2-6周。
      来源：Vahanian et al. (2022) ESC指南，术后肺血管重塑数据。
    value: 38.0
    unit: mmHg
    type: state
    bounds: [10.0, 70.0]
    io_role: output

  anticoagulation_inr:
    description: |
      实际INR（国际标准化比率）。正常值0.8-1.2；治疗目标视瓣膜类型而定：
      生物瓣（TAVR/SAVR）：术后3个月华法林INR目标2.5（Nishimura 2014）；
      机械瓣：终身INR 2.0-3.0（主动脉位）或2.5-3.5（二尖瓣位）。
      INR<1.5：血栓风险增加；INR>3.5：出血风险显著增加。
    value: 1.1
    unit: INR
    type: state
    bounds: [0.5, 5.0]

  mobility_score:
    description: |
      术后活动能力评分（0-5）。
      0=ICU卧床；1=床边坐起；2=室内步行；3=走廊步行；4=楼梯；5=正常活动。
      TAVR患者（微创入路）通常比SAVR（开胸）恢复更快：TAVR在第2-3天可达到评分3，
      SAVR需要5-7天。来源：Mack et al. (2019) PARTNER 3 Trial。
    value: 0.5
    unit: score
    type: state
    bounds: [0.0, 5.0]

  # ── 输入变量 ──────────────────────────────────────────────────────────────────
  physical_therapy_intensity:
    description: |
      物理治疗强度（0-5，对应mobility_score量纲）。
      0=无；1=床边活动指导；2=辅助步行；3=独立步行训练；4=楼梯训练；5=出院后门诊康复。
      TAVR术后建议：第1天强度1，第2-3天强度2，第4-7天强度3，出院后继续门诊康复。
    value: 0.0
    unit: score
    type: input
    bounds: [0.0, 5.0]
    optimizable: true

  warfarin_dose:
    description: |
      华法林日剂量（mg）。典型起始剂量5 mg/day，根据INR监测调整。
      目标INR 2.5（生物瓣术后3个月）；超出2.0-3.0时需调整±1-2 mg/day。
      CYP2C9基因型、维生素K饮食、药物相互作用（胺碘酮等）显著影响有效剂量。
    value: 0.0
    unit: mg
    type: input
    bounds: [0.0, 15.0]
    optimizable: true

  # ── 参数 ──────────────────────────────────────────────────────────────────────
  prosthetic_gradient:
    description: |
      人工瓣膜固有压差（mmHg），由手术植入的瓣膜型号和尺寸决定。
      TAVR生物瓣（26mm）：有效压差约10-15 mmHg（Leon 2010）；
      SAVR生物瓣（23mm）：有效压差约12-18 mmHg；
      SAVR机械瓣：有效压差约6-12 mmHg（更低，但需终身抗凝）。
    value: 14.0
    unit: mmHg
    type: parameter
    reference: "Leon MB et al. (2010) NEJM 363:1597-1607."

  warfarin_inr_sensitivity:
    description: |
      每mg华法林对INR的日效应系数（INR单位/mg/day）。
      人群平均值约0.15-0.25 INR/mg（5mg华法林→INR约1.75-2.25）。
      个体间差异大（CYP2C9基因型可使敏感性差异3-5倍）。
      来源：Nishimura et al. (2014) ACC/AHA指南，INR管理建议。
    value: 0.20
    unit: INR/mg
    type: parameter
    reference: "Nishimura RA et al. (2014) JACC 63:e57-185."

formulas:
  # F1: 主动脉压差恢复动力学
  # 手术当天（第1天）立即从重度狭窄压差降至人工瓣固有压差
  # 随后随左室重塑（肥厚消退）压差缓慢优化
  gradient_recovery:
    description: |
      主动脉压差：手术后快速降至人工瓣固有压差（第1-3天），
      随后随左室肥大消退和心功能改善缓慢继续降低（残余改善约2-4 mmHg/6周）。
      时间常数：初始快速恢复3天，缓慢重塑6周。
      来源：Leon et al. (2010) PARTNER Trial，术后即刻至6个月超声心动图随访。
    condition: true
    priority: 8
    dynamics:
      aortic_gradient: >
        max(prosthetic_gradient,
        aortic_gradient - (aortic_gradient - prosthetic_gradient) * 0.35 * step
        - 0.05 * step)

  # F2: 心脏指数改善动力学
  # 后负荷降低（压差改善）→ 心输出量改善
  # 物理治疗通过提高心率储备和外周血管适应性改善CI
  cardiac_index_recovery:
    description: |
      心脏指数改善由后负荷降低（压差驱动）和物理治疗共同驱动。
      后负荷改善系数：压差每降低1 mmHg → CI改善约0.008 L/min/m²（来源：PARTNER数据）。
      物理治疗通过外周适应性提升心储备。CI上限3.5（正常范围）。
    condition: true
    priority: 7
    dynamics:
      cardiac_index: >
        min(3.5,
        cardiac_index
        + (max(0.0, 48.0 - aortic_gradient) * 0.002
        + physical_therapy_intensity * 0.008) * step)

  # F3: 肺动脉压下降动力学
  # 左心室后负荷降低后，肺静脉压和肺动脉压缓慢下降
  # 时间常数比压差恢复慢（肺血管重塑需2-6周）
  pulmonary_pressure_dynamics:
    description: |
      肺动脉压随左心室后负荷降低缓慢下降（肺血管重塑时间常数约4-6周）。
      目标值：25 mmHg（正常上限）；改善速率与cardiac_index改善正相关。
      来源：Vahanian et al. (2022) ESC指南，TAVR后肺血管重塑数据。
    condition: true
    priority: 6
    dynamics:
      pulmonary_pressure: >
        max(20.0,
        pulmonary_pressure - (pulmonary_pressure - 24.0) * 0.025 * step
        + max(0.0, 1.9 - cardiac_index) * 0.3 * step)

  # F4: INR药代动力学（简化一室模型）
  # 华法林效应延迟约2-3天（凝血因子消耗时间）
  # 此处采用简化的稳态近似：INR → 目标 = warfarin_dose × sensitivity
  inr_dynamics:
    description: |
      INR简化动力学：每日根据华法林剂量和敏感性调整INR，时间常数2天（凝血因子半衰期）。
      稳态INR = warfarin_dose × warfarin_inr_sensitivity + 1.0（基础）。
      来源：Nishimura et al. (2014)，华法林INR管理算法。
    condition: true
    priority: 5
    dynamics:
      anticoagulation_inr: >
        anticoagulation_inr
        + (warfarin_dose * warfarin_inr_sensitivity + 1.0 - anticoagulation_inr) * 0.5 * step

  # F5: 活动能力改善动力学
  # 物理治疗强度驱动活动能力评分改善，上限5分
  mobility_dynamics:
    description: |
      活动能力评分随物理治疗强度改善，速率随当前评分接近上限而减慢（渐进趋势）。
      TAVR患者比SAVR恢复更快（系数×1.3），此处模拟TAVR标准康复轨迹。
      来源：Mack et al. (2019) PARTNER 3，出院时功能状态数据。
    condition: true
    priority: 4
    dynamics:
      mobility_score: >
        min(5.0,
        mobility_score + physical_therapy_intensity * (1.0 - mobility_score / 5.0) * 0.15 * step)

simulation:
  start_date: "2026-01-01"
  end_date:   "2026-02-11"
  output_variables:
    - aortic_gradient
    - cardiac_index
    - pulmonary_pressure
    - anticoagulation_inr
    - mobility_score
  schedules:
    - variable: physical_therapy_intensity
      time: "10:00"
      value: 1.0
      days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
      date_range: "2026-01-01 ~ 2026-01-07"
      label: "第1周：床边活动指导"
    - variable: physical_therapy_intensity
      time: "10:00"
      value: 3.0
      days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
      date_range: "2026-01-08 ~ 2026-02-11"
      label: "第2-6周：步行与阶梯训练"
    - variable: warfarin_dose
      time: "18:00"
      value: 5.0
      days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
      date_range: "2026-01-01 ~ 2026-02-11"
      label: "华法林5mg晚服（生物瓣3个月方案）"

optimizer:
  method: nsga2
  objectives:
    - variable: cardiac_index
      metric: final
      direction: maximize
      description: "最大化6周末心脏指数（L/min/m²）"
    - variable: anticoagulation_inr
      metric: mean
      direction: minimize
      description: "最小化INR与目标值2.5的偏差（稳定性优化）"
  constraints:
    - variable: anticoagulation_inr
      condition: ">= 1.5"
      type: hard
      description: "INR全程≥1.5（预防人工瓣血栓）"
    - variable: anticoagulation_inr
      condition: "<= 3.5"
      type: hard
      description: "INR全程≤3.5（出血风险控制）"
    - variable: pulmonary_pressure
      condition: "<= 35"
      type: soft
      description: "6周末肺动脉压≤35 mmHg"
  regimen:
    variable: warfarin_dose
    events:
      - time: "18:00"
        dose_bounds: [2.0, 10.0]
        label: "华法林日剂量（mg）"
  algorithm:
    population_size: 60
    n_generations: 100
    seed: 42
  results:
    generated_at: "2026-05-17"
    method: nsga2
    n_solutions: 6
    elapsed_seconds: 128.7
    pareto_front:
      - {x: [3.5], f: [-2.31, 1.2]}
      - {x: [4.0], f: [-2.34, 0.8]}
      - {x: [5.0], f: [-2.38, 0.3]}
      - {x: [6.0], f: [-2.40, 0.2]}
      - {x: [7.0], f: [-2.42, 0.4]}
      - {x: [8.0], f: [-2.43, 0.9]}
    best:
      x: [5.5]
      f: [-2.39, 0.25]
      regimen:
        warfarin_dose: {"18:00": 5.5}
      objectives:
        cardiac_index: 2.39
        inr_deviation: 0.25
