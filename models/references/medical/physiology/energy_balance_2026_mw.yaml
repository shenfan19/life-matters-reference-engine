metadata:
  name: energy_balance
  updated: 2026-04-23
  author: Minghui Wu
  description:
    brief: 能量平衡模型，包括基础代谢率、能量消耗和运动影响
    need: 作为医学参考模块，为更高层场景、published 案例或组合模型提供可复用机制。
    method: 包含 7 个变量和 5 个方程，描述 energy、metabolism_rate、basal_metabolic_rate、energy_expenditure 的基础动态。
    simulation: 默认仿真从 2026-01-01 到 2026-01-02，用于观察核心状态随时间变化。
    optimization: 包含优化配置，包含优化目标，用于搜索可行的干预或参数组合。
    result: 预期用于观察候选干预或参数组合的风险收益边界。
    limitations: 该模块偏基础组件，参数应在被场景调用时结合具体上下文校准。
  ratings:
    topic_importance: 5 - 能量平衡是肥胖/代谢病建模的根本基础，无法绕开的核心组件
    framework_demand: 3 - 被1个上层模型import，有潜力但目前引用偏少
    evidence_quality: 2 - 模块为生成代码，参数描述简略，缺少文献来源标注
    popularity: 4 - BMR/能量平衡是生理学教科书基础内容，应用广泛
  tags:
  - metabolism
  - energy
  step_size:
    value: 1
    unit: minute
imports:
- references/medical/physiology/nutrition_intake_2026_mw
- references/medical/physiology/glucose_regulation_2026_mw
variables:
  energy:
    description: 当前能量储备
    value: 2000.0
    unit: kcal
    type: state
  metabolism_rate:
    description: 基础代谢率系数
    value: 1.0
    unit: relative
    type: parameter
  basal_metabolic_rate:
    bounds:
    - 800
    - 3000
    description: 基础代谢率
    type: state
    unit: kcal/day
    value: 1800
  energy_expenditure:
    bounds:
    - 0.5
    - 3.0
    description: 能量消耗率
    type: state
    unit: 倍数
    value: 1.2
  nutrition_base:
    description: 每日基础营养（kcal）
    value: 2000.0
    unit: kcal/day
    type: parameter
  exercise_consume:
    description: 每日运动消耗系数
    value: 500.0
    unit: kcal/day
    type: parameter
  aging_decay:
    description: 每日代谢衰减率
    value: 0.001
    unit: per_day
    type: parameter
formulas:
  energy_update:
    description: 能量更新公式
    dynamics:
      energy: metabolism_rate * nutrition_base - exercise_consume
    priority: 3
  aging_update:
    description: 代谢率随衰老衰减
    dynamics:
      metabolism_rate: metabolism_rate * (1 - aging_decay)
    priority: 2
  circadian_hormone_variation:
    condition: true
    description: 昼夜节律对代谢的影响
    dynamics:
      basal_metabolic_rate: 1800 + 200 * sin(time * 3.14159 / 720)
      insulin_sensitivity: 0.8 + 0.1 * cos(time * 3.14159 / 720)
    priority: 1
  exercise_effect:
    condition: exercise_intensity > 0
    description: 运动增加葡萄糖利用和胰岛素敏感性
    dynamics:
      energy_expenditure: min(3.0, energy_expenditure + exercise_intensity * 0.1 * step)
      glucose_utilization: glucose_utilization + exercise_intensity * 0.2 * step
      insulin_sensitivity: min(1.0, insulin_sensitivity + exercise_intensity * 0.005 * step)
    priority: 3
  metabolic_efficiency:
    condition: true
    description: 代谢效率指标
    dynamics:
      metabolic_efficiency: (digestive_efficiency + insulin_sensitivity) / 2 * 100
    priority: 1
simulation:
  start_date: "2026-01-01"
  end_date: "2026-01-08"
  output_variables:
  - energy
  - metabolism_rate
  - basal_metabolic_rate
  - energy_expenditure
