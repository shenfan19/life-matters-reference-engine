metadata:
  name: physiology
  updated: 2026-04-23
  author: Minghui Wu
  description:
    brief: 肝、胰腺、胃、小肠等器官功能系数及恢复机制
    need: 作为医学参考模块，为更高层场景、published 案例或组合模型提供可复用机制。
    method: 包含 15 个变量和 1 个方程，描述 liver_function、pancreatic_function、water、gastric_function 的基础动态。
    simulation: 默认仿真从 2026-01-01 到 2026-01-02，用于观察核心状态随时间变化。
    optimization: 包含优化配置，包含优化目标，用于搜索可行的干预或参数组合。
    result: 预期用于观察候选干预或参数组合的风险收益边界。
    limitations: 该模块偏基础组件，参数应在被场景调用时结合具体上下文校准。
  conflicts: []
  ratings:
    topic_importance: 4 - 多器官功能系数聚合组件，为复杂场景提供生理基础
    framework_demand: 2 - 顶层聚合组件，被1个上层模型import，实际引用低
    evidence_quality: 2 - 模块为生成代码，15个变量参数无文献标注，为定性近似
    popularity: 3 - 顶层生理聚合组件在多系统建模中有价值，但不独立引用
  tags:
  - organs
  - function
  step_size:
    value: 1
    unit: minute
imports:
- references/medical/physiology/insulin_system_2026_mw
- references/medical/physiology/glucose_regulation_2026_mw
