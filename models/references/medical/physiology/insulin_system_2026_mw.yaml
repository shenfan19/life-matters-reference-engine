metadata:
  name: insulin_system
  updated: 2026-04-23
  author: Minghui Wu
  description:
    brief: 胰岛素分泌、敏感性和β细胞功能
    need: 作为医学参考模块，为更高层场景、published 案例或组合模型提供可复用机制。
    method: 包含 5 个变量和 3 个方程，描述 plasma_insulin、insulin_secretion_rate、beta_cell_function、beta_cell_mass 的基础动态。
    simulation: 默认仿真从 2026-01-01 到 2026-01-02，用于观察核心状态随时间变化。
    optimization: 包含优化配置，包含优化目标，用于搜索可行的干预或参数组合。
    result: 预期用于观察候选干预或参数组合的风险收益边界。
    limitations: 该模块偏基础组件，参数应在被场景调用时结合具体上下文校准。
  conflicts: []
  tags:
  - insulin
  - beta_cell
  step_size:
    value: 1
    unit: minute
imports:
- glucose_regulation
variables:
  plasma_insulin:
    description: 血浆胰岛素浓度
    value: 8
    unit: μU/mL
    type: state
    bounds:
    - 1
    - 300
  insulin_secretion_rate:
    description: 胰岛素分泌速率
    value: 1.0
    unit: μU/mL/min
    type: state
    bounds:
    - 0
    - 20
  beta_cell_function:
    description: 胰岛β细胞功能，0-1之间，1为完全正常
    value: 0.8
    unit: 功能系数
    type: state
    bounds:
    - 0
    - 1.0
  beta_cell_mass:
    description: 胰岛β细胞数量/质量
    value: 100
    unit: 相对单位
    type: state
    bounds:
    - 10
    - 120
  insulin_sensitivity:
    description: 胰岛素敏感性，影响葡萄糖摄取效率
    value: 0.75
    unit: 敏感性指数
    type: state
    bounds:
    - 0.1
    - 1.0
formulas:
  insulin_secretion:
    description: 胰岛素分泌响应血糖
    condition: blood_glucose > 100 and beta_cell_function > 0.1
    dynamics:
      insulin_secretion_rate: min(20, insulin_secretion_rate + (blood_glucose - 100) * beta_cell_function * 0.005 * step)
      plasma_insulin: plasma_insulin + insulin_secretion_rate * step - plasma_insulin * 0.05 * step
    priority: 5
  type1_autoimmune_destruction:
    description: 1型糖尿病的自身免疫性β细胞破坏
    condition: diabetes_type == 1 and beta_cell_mass > 15
    dynamics:
      beta_cell_mass: beta_cell_mass - 0.01
      beta_cell_function: max(0, beta_cell_function - 0.001)
    priority: 3
  insulin_sensitivity_recovery:
    description: 运动改善胰岛素敏感性
    condition: blood_glucose < 100 and physical_activity > 100
    dynamics:
      insulin_sensitivity: min(1.0, insulin_sensitivity + 0.0005)
    priority: 2
simulation:
  start_date: "2026-01-01"
  end_date: "2026-01-02"
  output_variables:
  - plasma_insulin
  - insulin_secretion_rate
  - beta_cell_function
  - beta_cell_mass
  - insulin_sensitivity
optimizer:
  method: grid
  duration: 60.0
  targets_of_optimization:
  - insulin_sensitivity
  variables_to_optimize:
  - beta_cell_function
