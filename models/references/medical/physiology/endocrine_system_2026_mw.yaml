metadata:
  name: endocrine_system
  updated: 2026-04-23
  author: Minghui Wu
  description:
    brief: 胰高血糖素、皮质醇、生长激素等
    need: 作为医学参考模块，为更高层场景、published 案例或组合模型提供可复用机制。
    method: 包含 3 个变量和 2 个方程，描述 glucagon_level、cortisol_level、growth_hormone 的基础动态。
    simulation: 默认仿真从 2026-01-01 到 2026-01-02，用于观察核心状态随时间变化。
    optimization: 包含优化配置，包含优化目标，用于搜索可行的干预或参数组合。
    result: 预期用于观察候选干预或参数组合的风险收益边界。
    limitations: 该模块偏基础组件，参数应在被场景调用时结合具体上下文校准。
  conflicts: []
  ratings:
    research_demand: 4 - 内分泌系统（胰高血糖素/皮质醇/生长激素）是代谢调控核心组件
    evidence_quality: 2 - 模块为生成代码，变量描述简略，参数缺少文献来源
    popularity: 3 - 内分泌组件在代谢建模中有复用价值，但不独立使用
  tags:
  - hormones
  - glucagon
  step_size:
    value: 1
    unit: minute
imports:
- references/medical/physiology/glucose_regulation_2026_mw
variables:
  glucagon_level:
    description: 胰高血糖素水平
    value: 50
    unit: pg/mL
    type: state
    bounds:
    - 20
    - 250
  cortisol_level:
    description: 皮质醇水平
    value: 15
    unit: μg/dL
    type: state
    bounds:
    - 5
    - 40
  growth_hormone:
    description: 生长激素水平
    value: 5
    unit: ng/mL
    type: state
    bounds:
    - 1
    - 15
formulas:
  glucagon_response:
    description: 低血糖时胰高血糖素分泌
    condition: blood_glucose < 70
    dynamics:
      glucagon_level: min(250, glucagon_level + (70 - blood_glucose) * 2 * step)
      blood_glucose: blood_glucose + glucagon_level * 0.01 * step
    priority: 6
  hypoglycemia_counter_regulation:
    description: 低血糖时的反调节激素反应
    condition: blood_glucose < 60
    dynamics:
      glucagon_level: min(250, glucagon_level + (60 - blood_glucose) * 2)
      growth_hormone: min(15, growth_hormone + (60 - blood_glucose) * 0.1)
      cortisol_level: min(40, cortisol_level + (60 - blood_glucose) * 0.2)
    priority: 9
simulation:
  start_date: "2026-01-01"
  end_date: "2026-01-03"
  output_variables:
  - glucagon_level
  - cortisol_level
  - growth_hormone
