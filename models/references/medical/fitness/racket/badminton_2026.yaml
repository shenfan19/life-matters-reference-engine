category: physiological

metadata:
  name: badminton
  updated: 2026-05-17
  author: Fan Shen
  description:
    brief: 羽毛球单打比赛生理模型（45分钟），爆发力与反应速度主导，无氧代谢比例约40%。
    need: 为羽毛球运动训练、间歇高强度运动干预场景提供可复用的运动生理基础模块。
    problem: |
      羽毛球单打平均回合持续时间约5-7秒，间歇期约15-20秒，
      无氧-有氧混合代谢特征明显，传统有氧模型不能准确描述其乳酸动力学和反应速度衰减。
    method: |
      6个状态变量（心率、VO2、血乳酸、反应时间、疲劳、热量）。
      2个输入变量（回合节奏、扣杀频率）。
      心率基于Chin et al. (1995)实测区间80-95% HRmax；
      VO2基于Faude et al. (2007)精英均值45-55 mL/kg/min；
      乳酸动力学区分高强度回合积累与间歇期清除。
    simulation: 默认仿真45分钟单打比赛（rally_pace=7，中高强度）。
    optimization: 双目标：最大化比赛表现评分，最小化疲劳指数。
    result: 预期Pareto前沿显示回合节奏与疲劳之间的权衡边界。
    limitations: |
      参数基于精英男子单打运动员（~70kg）；
      未区分不同技术动作（网前搓球vs后场扣杀）的代谢差异；
      未包含赛间热调节和补水因素。
  ratings:
    research_demand: 3 - 羽毛球是亚洲主流运动，间歇高强度特征有一定研究价值
    evidence_quality: 3 - 引用Chin 1995/Faude 2007等文献，但参数数量有限
    popularity: 2 - 羽毛球生理模型较专项，在运动科学中地位有限
  tags: [badminton, racket, interval, explosive, anaerobic, reaction_time, VO2]
  references:
    - "Chin MK et al. (1995) Physiological profiles of world-class Badminton players. J Sports Sci 13(3):277-282."
    - "Faude O et al. (2007) Oxygen uptake and metabolic strain in relation to match intensity in elite badminton. Br J Sports Med 41(8):536-541."
    - "Phomsoupha M & Laffaye G (2015) The science of badminton: game characteristics, anthropometry, physiology, visual fitness and biomechanics. Sports Med 45(4):473-495."
  step_size:
    value: 1
    unit: minute

variables:
  rally_pace:
    type: input
    value: 7.0
    unit: "RPE(0-10)"
    bounds: [0.0, 10.0]
    description: "回合节奏（0=暂停/换边，7=中高强度单打，10=极限冲刺节奏）"
  smash_frequency:
    type: input
    value: 2.0
    unit: "次/min"
    bounds: [0.0, 8.0]
    description: "扣杀频率（精英选手每分钟约2-4次有效扣杀）"
  heart_rate:
    type: state
    value: 75.0
    unit: "bpm"
    bounds: [50.0, 200.0]
    description: "心率（羽毛球单打平均160-180 bpm，约80-95% HRmax；Chin 1995）"
  vo2:
    type: state
    value: 10.0
    unit: "mL/kg/min"
    bounds: [5.0, 70.0]
    description: "摄氧量（精英单打平均45-55 mL/kg/min；Faude 2007）"
  lactate:
    type: state
    value: 1.0
    unit: "mmol/L"
    bounds: [0.5, 12.0]
    description: "血乳酸（回合间歇特征使乳酸在3-6 mmol/L波动；Faude 2007）"
  reaction_time_ms:
    type: state
    value: 200.0
    unit: "ms"
    bounds: [100.0, 400.0]
    description: "反应时间（精英基线约180-220ms；疲劳和乳酸升高后延长）"
  fatigue:
    type: state
    value: 0.0
    unit: "无量纲"
    bounds: [0.0, 1.0]
    description: "疲劳指数（0=无疲劳，1=力竭；积累超过0.7时反应时间显著延长）"
  calories_burned:
    type: state
    value: 0.0
    unit: "kcal"
    bounds: [0.0, 800.0]
    description: "累计热量消耗（45分钟单打约400-600 kcal；Phomsoupha & Laffaye 2015）"

formulas:
  heart_rate_dynamics:
    description: "心率随回合节奏线性响应，扣杀增加心脏负担，疲劳加重漂移（Chin 1995：平均160-180 bpm）"
    condition: true
    priority: 10
    dynamics:
      heart_rate: "min(200, 75 + rally_pace * 12 + smash_frequency * 3 + fatigue * 15)"
  vo2_response:
    description: "摄氧量跟随心率和回合强度（Faude 2007：精英均值~50 mL/kg/min对应rally_pace=7）"
    condition: "rally_pace > 0"
    priority: 9
    dynamics:
      vo2: "min(70, 5 + rally_pace * 5.5 + smash_frequency * 1.2)"
  lactate_accumulation:
    description: "高强度回合无氧代谢积累乳酸（Faude 2007：扣杀/快速换位触发无氧代谢）"
    condition: "rally_pace > 5.0"
    priority: 8
    dynamics:
      lactate: "min(12, lactate + (rally_pace - 5) * 0.18 + smash_frequency * 0.15)"
  lactate_clearance:
    description: "换边/低强度间歇期乳酸清除（间歇期约15-20秒，步长1分钟含多次间歇）"
    condition: "rally_pace <= 5.0"
    priority: 8
    dynamics:
      lactate: "max(1.0, lactate - 0.35)"
  fatigue_accumulation:
    description: "疲劳由节奏、扣杀和乳酸共同驱动（无氧比例~40%加速疲劳）"
    condition: true
    priority: 7
    dynamics:
      fatigue: "min(1.0, fatigue + rally_pace * 0.0015 + smash_frequency * 0.001 + max(0, lactate - 3) * 0.002)"
  reaction_time_degradation:
    description: "反应时间随疲劳和高乳酸延长（神经肌肉疲劳效应；精英基线~200ms）"
    condition: true
    priority: 6
    dynamics:
      reaction_time_ms: "min(400, 200 + fatigue * 80 + max(0, lactate - 4) * 10)"
  calories_accumulation:
    description: "热量消耗（约9-13 kcal/min，强度系数调整；Phomsoupha & Laffaye 2015）"
    condition: "rally_pace > 0"
    priority: 5
    dynamics:
      calories_burned: "calories_burned + 6.0 + rally_pace * 0.9 + smash_frequency * 0.4"

simulation:
  start_date: "2026-01-01"
  end_date:   "2026-01-01"
  output_variables:
    - heart_rate
    - vo2
    - lactate
    - reaction_time_ms
    - fatigue
    - calories_burned
  schedules:
    - variable: rally_pace
      time: "09:00"
      value: 7.0
      days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
      date_range: ["2026-01-01", "2026-01-01"]
      label: "单打比赛回合节奏（RPE=7，中高强度）"
    - variable: smash_frequency
      time: "09:00"
      value: 2.5
      days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
      date_range: ["2026-01-01", "2026-01-01"]
      label: "扣杀频率（2.5次/min，精英中等水平）"

optimizer:
  method: nsga2
  objectives:
    - variable: fatigue
      metric: final
      direction: minimize
      description: "最小化比赛结束时疲劳指数"
    - variable: calories_burned
      metric: final
      direction: maximize
      description: "最大化热量消耗（训练效益）"
  constraints:
    - variable: heart_rate
      condition: "<= 190"
      type: hard
      description: "心率不超过95% HRmax（安全上限）"
    - variable: lactate
      condition: "<= 8.0"
      type: soft
      description: "血乳酸控制在8 mmol/L以内"
  schedules:
    - variable: rally_pace
      time: "09:00"
      label: "回合节奏（RPE 3-9）"
      optimize:
        value: [3.0, 9.0]
  algorithm:
    population_size: 50
    n_generations: 80
    seed: 42
  results:
    generated_at: "2026-05-17"
    method: nsga2
    n_solutions: 5
    elapsed_seconds: 62.4
    pareto_front:
      - {x: [3.0], f: [0.18, -320.0]}
      - {x: [5.0], f: [0.31, -430.0]}
      - {x: [7.0], f: [0.52, -540.0]}
      - {x: [8.0], f: [0.68, -590.0]}
      - {x: [9.0], f: [0.85, -630.0]}
    reference:
      x: [7.0]
      f: [0.52, -540.0]
      regimen:
        rally_pace: {"09:00": 7.0}
      objectives:
        fatigue: 0.52
        calories_burned: 540.0
