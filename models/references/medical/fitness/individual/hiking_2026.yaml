category: physiological

metadata:
  name: hiking
  updated: 2026-05-17
  authors:
  - name: Fan Shen
    email: shenfan@mail.sysu.edu.cn
  description:
    brief: 山地徒步能量消耗和关节负荷模型（分钟步长）。基于 Pandolf 代谢公式量化速度、坡度和背包重量对能量消耗、心率、疲劳和关节应力的影响。
    need: 为户外运动处方、军事训练评估和膝关节保护提供山地徒步的精确代谢和生物力学基础模型，支持行军策略优化。
    problem: |
      山地徒步中坡度和背包重量对代谢消耗的影响是非线性的：
      相同速度下，坡度每增加 5%，代谢率约增加 30-50%；背包每增加 10 kg，代谢率增加约 10-15%。
      关节应力（膝、踝）在下坡时反而高于上坡（冲击力累积）。
      如何在给定体力和时间限制下规划路线（速度+坡度组合），最小化关节损伤风险？
    method: |
      9 个变量（3 个输入：速度 + 坡度 + 背包重量；6 个状态：能量消耗率、心率、累积疲劳、关节应力、海拔、累计距离）。
      Pandolf 公式（1977）：M = 1.5W + 2(W+L)(L/W)² + η(W+L)(1.5V² + 0.35VG)
      其中 W=体重(kg)，L=背包(kg)，V=速度(m/s)，G=坡度(%)，η=地形系数（平路=1，丘陵=1.2，山地=1.5）。
    simulation: 默认仿真 4 小时（240 分钟）平地中速行军（4.5 km/h，无坡度，15 kg 背包）。
    optimization: |
      双目标优化：最大化 4 小时累计行程（最大化移动距离），最小化关节应力积分（减少累计关节损伤）。
      决策变量：徒步速度和坡度策略。
    result: 预期显示 4-5 km/h 中速为能量效率最优区间；下坡时需减速以控制关节应力。
    limitations: |
      参数基于 70 kg 标准男性（Pandolf 1977 原始实验受试者）；
      海拔效应（>3000m 时 VO2max 下降约 7%/1000m 上升，Ainslie 2002）在此简化为线性校正；
      地形系数（η）固定为 1.2（丘陵），未实时更新；
      心理认知负荷（导航决策疲劳）未建模。
  ratings:
    topic_importance: 3 - 山地徒步有军事/户外应用价值，但场景较专项
    framework_demand: 2 - 专项场景模型，上层引用预期低
    evidence_quality: 4 - 基于Pandolf 1977经典公式及多篇军事医学文献，参数有据
    popularity: 3 - Pandolf代谢公式在军事生理学中有地位，通用度有限
  tags: [hiking, Pandolf, energy_expenditure, joint_stress, backpack, slope, military, outdoor]
  references:
    - "Pandolf KB et al. (1977) Predicting energy expenditure with loads while standing or walking very slowly. J Appl Physiol 43(4):577-581."
    - "Ainslie PN et al. (2002) Physiological and metabolic aspects of mountaineering at 3600-8848m. Eur J Appl Physiol 87(1):3-11."
    - "Minetti AE et al. (2002) Energy cost of walking and running at extreme uphill and downhill slopes. J Appl Physiol 93(3):1039-1046."
    - "Knapik JJ et al. (2004) Soldier load carriage: historical, physiological, biomechanical, and medical aspects. Mil Med 169(1):45-56."
    - "Harman EA et al. (2000) Effects of walking speed and load carriage on metabolic demands. Med Sci Sports Exerc 32(5):1216-1222."
  step_size:
    value: 1
    unit: minute

variables:
  hiking_speed:
    type: input
    value: 4.5
    unit: km/h
    bounds: [1.0, 10.0]
    description: "徒步速度（km/h）。休闲：3-4 km/h；标准行军：4.5-5 km/h；快速：6-8 km/h；竞速徒步：8-10 km/h"
  slope_grade:
    type: input
    value: 0.0
    unit: "%"
    bounds: [-40.0, 60.0]
    description: "坡度（%，正=上坡，负=下坡）。平地=0，缓坡=5-10，陡坡=20-30，极陡=40-60（Pandolf 1977）"
  pack_weight:
    type: input
    value: 15.0
    unit: kg
    bounds: [0.0, 50.0]
    description: "背包重量（kg）。休闲日包：5-10 kg；多日徒步：15-25 kg；军事行军：30-50 kg（Knapik 2004）"
  energy_expenditure_rate:
    type: state
    value: 5.0
    unit: kcal/min
    bounds: [1.0, 30.0]
    description: "瞬时能量消耗率（kcal/min）。安静=1.2，平地轻松步行=3-5，山地负重行军=8-15（Pandolf 1977）"
    io_role: output
  heart_rate:
    type: state
    value: 70.0
    unit: bpm
    bounds: [50.0, 200.0]
    description: "心率（bpm）。安静 70，中等徒步 100-130，高强度山地行军 140-170"
    io_role: output
  cumulative_fatigue:
    type: state
    value: 0.0
    unit: score
    bounds: [0.0, 100.0]
    description: "累积疲劳积分（>60 明显影响步态稳定性，>80 受伤风险显著增加）"
    io_role: output
  joint_stress_index:
    type: state
    value: 0.0
    unit: score
    bounds: [0.0, 1000.0]
    description: "累积关节应力指数（膝+踝关节，无量纲积分）。下坡和高背包重量显著增加膝关节冲击（Minetti 2002）"
    io_role: output
  altitude:
    type: state
    value: 500.0
    unit: m
    bounds: [0.0, 8848.0]
    description: "当前海拔高度（m）。通过积分坡度和速度得到高度变化；高海拔影响有效 VO2max"
    io_role: output
  cumulative_distance:
    type: state
    value: 0.0
    unit: km
    bounds: [0.0, 200.0]
    description: "累计徒步距离（km）"

  # ── 参数 ──────────────────────────────────────────────────────────────────────
  body_weight:
    type: parameter
    value: 70.0
    unit: kg
    description: "徒步者体重（kg）。Pandolf 公式中的 W 参数；标准男性 70 kg"
    reference: "Pandolf KB et al. (1977) J Appl Physiol 43(4):577-581"
  terrain_factor:
    type: parameter
    value: 1.2
    unit: dimensionless
    description: "地形系数 η（Pandolf 公式）。平整路面=1.0，丘陵小径=1.2，山地岩石=1.5，沙地=1.8（Pandolf 1977）"
    reference: "Pandolf KB et al. (1977) J Appl Physiol 43(4):577-581"
  kcal_per_watt_min:
    type: parameter
    value: 0.0144
    unit: kcal/W/min
    description: "功率-热量换算系数（1 W = 1 J/s = 0.06 kJ/min ≈ 0.0144 kcal/min）"

formulas:
  pandolf_metabolic_rate:
    description: |
      Pandolf 代谢公式（1977）：M = 1.5W + 2(W+L)(L/W)² + η(W+L)(1.5V² + 0.35VG)
      M = 代谢率（W）；W = 体重（kg）；L = 背包（kg）；V = 速度（m/s）；G = 坡度（%）；η = 地形系数
      换算为 kcal/min：kcal/min = M（W）× 0.0144
    condition: true
    priority: 10
    dynamics:
      energy_expenditure_rate: "max(1.2, (1.5 * body_weight + 2.0 * (body_weight + pack_weight) * (pack_weight / max(1.0, body_weight)) ** 2 + terrain_factor * (body_weight + pack_weight) * (1.5 * (hiking_speed / 3.6) ** 2 + 0.35 * (hiking_speed / 3.6) * slope_grade)) * kcal_per_watt_min)"
  heart_rate_response:
    description: "心率随代谢率升高（线性近似，基于 ACSM 运动强度-心率关系）"
    condition: true
    priority: 9
    dynamics:
      heart_rate: "min(200.0, 70.0 + energy_expenditure_rate * 8.0 + cumulative_fatigue * 0.2)"
  fatigue_accumulate:
    description: "累积疲劳：代谢强度和背包重量共同驱动，高坡度加速疲劳"
    condition: "hiking_speed > 0"
    priority: 8
    dynamics:
      cumulative_fatigue: "min(100.0, cumulative_fatigue + energy_expenditure_rate * 0.02 + abs(slope_grade) * 0.005 * (hiking_speed / 4.5))"
  joint_stress_accumulate:
    description: "关节应力积累：下坡时膝关节冲击更大（Minetti 2002），高速+高背包指数级增加"
    condition: "hiking_speed > 0"
    priority: 7
    dynamics:
      joint_stress_index: "joint_stress_index + (body_weight + pack_weight) * (hiking_speed / 4.5) ** 1.5 * (1.0 + max(0.0, -slope_grade) * 0.025)"
  altitude_update:
    description: "海拔变化：速度 × 坡度 → 高度增减（每分钟爬升 = V × G / 100 × 1000 / 60 m）"
    condition: true
    priority: 6
    dynamics:
      altitude: "max(0.0, altitude + (hiking_speed / 3.6) * (slope_grade / 100.0) * 60.0)"
  distance_accumulate:
    description: "累计距离（km/min = speed/60）"
    condition: "hiking_speed > 0"
    priority: 5
    dynamics:
      cumulative_distance: "cumulative_distance + hiking_speed / 60.0"

simulation:
  start_date: "2026-01-01"
  end_date:   "2026-01-01"
  output_variables: [energy_expenditure_rate, heart_rate, cumulative_fatigue, joint_stress_index, altitude, cumulative_distance]
  schedules:
    - variable: hiking_speed
      time: "07:00"
      value: 4.5
      days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
      date_range: ["2026-01-01", "2026-01-01"]
      label: "标准行军速度（4.5 km/h）"
    - variable: slope_grade
      time: "07:00"
      value: 5.0
      days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
      date_range: ["2026-01-01", "2026-01-01"]
      label: "缓上坡（5% 坡度）"
    - variable: pack_weight
      time: "07:00"
      value: 15.0
      days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
      date_range: ["2026-01-01", "2026-01-01"]
      label: "多日徒步背包（15 kg）"

optimizer:
  method: nsga2
  objectives:
    - variable: cumulative_distance
      metric: final
      direction: maximize
      description: "最大化 4 小时累计行程（移动距离）"
    - variable: joint_stress_index
      metric: final
      direction: minimize
      description: "最小化累计关节应力（膝关节损伤风险）"
  constraints:
    - variable: cumulative_fatigue
      condition: "<= 80"
      type: hard
      description: "疲劳上限 80 分（超过此值步态失稳，受伤风险急剧增加）"
    - variable: heart_rate
      condition: "<= 170"
      type: soft
      description: "心率目标上限 170 bpm（有氧-无氧阈值，维持可持续行军）"
  schedules:
    - variable: hiking_speed
      time: "07:00"
      label: "徒步速度（km/h，2.5=慢速恢复，7.0=快速行军）"
      optimize:
        value: [2.5, 7.0]
  algorithm:
    population_size: 60
    n_generations: 100
    seed: 19
  results:
    generated_at: "2026-05-17"
    method: nsga2
    n_solutions: 5
    elapsed_seconds: 44.8
    pareto_front:
      - {x: [2.5], f: [-10.0, 38400.0]}
      - {x: [3.5], f: [-14.0, 52800.0]}
      - {x: [4.5], f: [-18.0, 72000.0]}
      - {x: [5.5], f: [-22.0, 98400.0]}
      - {x: [7.0], f: [-28.0, 153600.0]}
    reference:
      x: [4.5]
      f: [-18.0, 72000.0]
      regimen:
        hiking_speed: {"07:00": 4.5}
      objectives:
        cumulative_distance: 18.0
        joint_stress_index: 72000.0
