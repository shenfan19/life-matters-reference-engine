metadata:
  name: stress_health_scene
  updated: 2026-04-23
  description:
    brief: 高压环境下糖分摄入与运动的健康权衡优化

    need: 作为医学参考模块，为更高层场景、published 案例或组合模型提供可复用机制。
    method: 提供可导入的医学机制或配置骨架。
    simulation: 默认仿真从 2026-01-01 到 2026-04-11，用于观察核心状态随时间变化。
    optimization: 包含优化配置，包含优化目标，用于搜索可行的干预或参数组合。
    result: 预期用于观察候选干预或参数组合的风险收益边界。
    limitations: 文件名标记 noref，表示参数和机制仍需补充正式文献来源。
  step_size:
    value: 1
    unit: day
python_envs:
- pymoo: ">=0.6.0"    # 用于 MOO
- matplotlib: ">=3.5.0"    # Pareto 前沿可视化
- scipy: ">=1.10.0"    # 可选：单目标优化

simulation:
  start_date: "2026-01-01"
  end_date: "2026-04-11"
optimizer:
  method: nsga2  # MOO 算法
  targets_of_optimization:
  - max_happiness
  - min_health_risk
  pop_size: 50  # 种群大小
  n_gen: 100  # 迭代次数
  bounds: [[0, 100], [0, 60]]  # 参数边界：sugar_intake, exercise_time
  variables_to_optimize:
  - insulin_sensitivity
  - energy_expenditure
