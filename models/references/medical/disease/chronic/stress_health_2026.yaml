category: physiological

metadata:
  name: stress_health
  updated: 2026-05-17
  author: Fan Shen
  description:
    brief: 慢性工作压力与生活方式对多项健康指标影响的综合动力学模型，包含心血管风险、免疫功能和精神健康的耦合机制。
    need: |
      为工作场景、历史场景（战时医生、高压官员）提供综合的心身健康基础模块。
      量化慢性压力、运动、营养和睡眠对心血管风险、免疫力和精神状态的协同影响。
    problem: |
      慢性压力通过HPA轴（下丘脑-垂体-肾上腺轴）升高皮质醇，长期导致：
      血压升高（CVD风险）、免疫抑制（感染易感性）、精神健康恶化（焦虑抑郁）。
      运动是"最好的药"——同时改善上述三个维度，但过度训练反而升高皮质醇。
      最优干预组合不是直觉可得的多维问题。
    method: |
      四状态模型：皮质醇水平（cortisol）、心血管风险（cvd_risk）、
      免疫功能（immune_function）、精神健康评分（mental_health）。
      工作压力（work_stress）、运动强度（exercise）、睡眠质量（sleep_quality）为干预输入。
      日步长，适合数月到数年的慢性健康管理场景。
    simulation: 默认仿真6个月，高压工作场景（stress=0.8）配合不同运动和睡眠策略。
    optimization: |
      三目标优化：最小化心血管风险、最大化免疫功能、最大化精神健康评分。
      约束：运动量在安全范围内（过度训练有害）。
    result: 预期Pareto面显示运动和睡眠干预在心血管、免疫、精神健康三维之间的权衡。
    limitations: |
      简化了HPA轴的详细神经内分泌机制；
      个体差异（性格、既往健康史）通过参数分布建模；
      未包含药物干预（降压药、抗焦虑药）。
  tags: [stress, cortisol, cardiovascular, immune, mental_health, HPA_axis, lifestyle]
  references:
    - "McEwen BS (1998) Stress, adaptation, and disease: Allostasis and allostatic load. Ann NY Acad Sci 840(1):33-44."
    - "Kivimäki M et al. (2012) Job strain as a risk factor for coronary heart disease. Lancet 380(9852):1491-1497."
    - "Mayer-Davis EJ et al. (1998) Intensity and amount of physical activity in relation to insulin sensitivity. JAMA 279(9):669-674."
    - "Walker A et al. (2020) Chronic stress and immune function. Brain Behav Immun 84:1-11."
    - "Steptoe A & Kivimäki M (2012) Stress and cardiovascular disease. Nat Rev Cardiol 9(6):360-370."
  step_size:
    value: 1
    unit: day

variables:
  cortisol_level:
    description: |
      皮质醇相对水平（1.0=基线正常，>1.5=慢性压力高皮质醇状态）。
      慢性高皮质醇（>1.5持续>4周）→心血管风险+、免疫功能-（McEwen 1998）。
    value: 1.0
    unit: "归一化皮质醇水平"
    type: state
    bounds: [0.5, 5.0]
    io_role: output

  cvd_risk:
    description: |
      10年心血管疾病风险指数（0-1）。
      Framingham风险评分近似：正常=0.05-0.10；中风险=0.10-0.20；高风险>0.20。
      皮质醇升高1单位 → CVD风险+约0.03/year（Steptoe 2012）。
    value: 0.10
    unit: "风险指数"
    type: state
    bounds: [0.0, 1.0]
    io_role: output

  immune_function:
    description: |
      免疫功能相对指数（0-1，1=正常免疫力）。
      慢性压力通过皮质醇抑制NK细胞和T细胞功能（Walker 2020）。
      immune_function<0.7 → 感染易感性显著增加（上呼吸道感染风险翻倍）。
    value: 0.85
    unit: "免疫功能指数"
    type: state
    bounds: [0.0, 1.0]
    io_role: output

  mental_health:
    description: |
      精神健康评分（0-100，100=最佳精神状态）。
      焦虑/抑郁量表近似：>70=良好；50-70=轻度问题；<50=中重度问题。
    value: 75.0
    unit: "精神健康分"
    type: state
    bounds: [0.0, 100.0]
    io_role: output

  work_stress:
    description: |
      工作压力指数（0-1）。来自工作要求-控制模型（Karasek模型）。
      0=无压力；0.5=中等工作需求；0.8=高需求低控制（高风险状态，Kivimäki 2012）。
    value: 0.5
    unit: "压力指数"
    type: input
    bounds: [0.0, 1.0]

  exercise_intensity:
    description: |
      每日运动强度（MET-hours/day）。
      WHO建议：150分钟/周中等强度（约3.5 MET-h/day）或75分钟高强度。
      适度运动（3-6 MET-h/day）降低皮质醇；过度训练（>10 MET-h/day）升高皮质醇。
    value: 0.0
    unit: "MET-hours/day"
    type: input
    bounds: [0.0, 15.0]

  sleep_quality:
    description: |
      睡眠质量（0-1）。
      0=严重失眠（<5h）；0.5=轻度不足（6h）；1=优质睡眠（7-8h）。
      睡眠剥夺是HPA轴最强的激活因子之一（McEwen 1998）。
    value: 0.7
    unit: "睡眠质量指数"
    type: input
    bounds: [0.0, 1.0]

  # ── 参数 ──────────────────────────────────────────────────────────────────────
  stress_cortisol_coeff:
    description: |
      压力→皮质醇响应系数。
      工作压力1.0时皮质醇升至约2.0（McEwen 1998，慢性高压观察值）。
    value: 0.8
    unit: "皮质醇单位/压力单位"
    type: parameter
    reference: "McEwen BS (1998) Ann NY Acad Sci 840:33-44"

  exercise_cortisol_effect:
    description: |
      运动对皮质醇的双相效应系数。
      中等运动（3-6 MET-h/day）每天降低约0.1皮质醇单位；
      过度训练（>8 MET-h/day）每天升高约0.05皮质醇单位（净效应用max-min截断）。
    value: 0.025
    unit: "1/(MET-h/day)"
    type: parameter

  cvd_risk_rate:
    description: |
      皮质醇→CVD风险积累系数（/day per 皮质醇单位超基线）。
      皮质醇超过基线1.0每天约0.0001增加CVD风险（Steptoe 2012，年风险增加约3%）。
    value: 0.0001
    unit: "风险/day per 皮质醇单位"
    type: parameter
    reference: "Steptoe A & Kivimäki M (2012) Nat Rev Cardiol 9:360-370"

  immune_recovery_rate:
    description: |
      低皮质醇时免疫功能每日恢复速率（/day）。
      约1-2周可恢复正常（Walker 2020）：0.05-0.10/day。
    value: 0.05
    unit: "1/day"
    type: parameter
    reference: "Walker A et al. (2020) Brain Behav Immun 84:1-11"

formulas:
  # F1: 皮质醇动力学（工作压力驱动，运动和睡眠调节）
  cortisol_dynamics:
    description: |
      皮质醇趋向目标值（由工作压力和睡眠决定）。
      优质睡眠降低目标皮质醇约20%；
      适度运动（<6 MET-h/day）降低皮质醇；过度训练升高。
    condition: true
    priority: 8
    dynamics:
      cortisol_level: >
        max(0.5, min(5.0,
        cortisol_level
        + (1.0 + stress_cortisol_coeff * work_stress * (1.0 - 0.2 * sleep_quality) - cortisol_level) * (1.0/7.0)
        - exercise_cortisol_effect * min(6.0, exercise_intensity) * step
        + max(0, exercise_cortisol_effect * 0.5 * (exercise_intensity - 8.0)) * step))

  # F2: CVD风险积累（皮质醇驱动，运动保护）
  cvd_dynamics:
    description: |
      CVD风险：超基线皮质醇积累风险，运动降低风险（Mayer-Davis 1998）。
      WHO建议运动量（3-6 MET-h/day）可使CVD风险降低约30%。
    condition: true
    priority: 6
    dynamics:
      cvd_risk: >
        max(0.0, min(1.0,
        cvd_risk
        + cvd_risk_rate * max(0, cortisol_level - 1.0) * step
        - 0.00008 * min(6.0, exercise_intensity) * step))

  # F3: 免疫功能（皮质醇抑制，运动适度提升，睡眠恢复）
  immune_dynamics:
    description: |
      免疫功能：高皮质醇抑制（Walker 2020），中等运动提升，优质睡眠恢复。
    condition: true
    priority: 5
    dynamics:
      immune_function: >
        max(0.0, min(1.0,
        immune_function
        - 0.01 * max(0, cortisol_level - 1.2) * step
        + 0.005 * min(5.0, exercise_intensity) * step
        + immune_recovery_rate * sleep_quality * step
        - immune_recovery_rate * (1.0 - sleep_quality) * 0.5 * step))

  # F4: 精神健康（压力+皮质醇降低，运动和睡眠提升）
  mental_health_dynamics:
    description: |
      精神健康：慢性压力和高皮质醇降低，运动（最有效的自然抗抑郁手段）和睡眠提升。
    condition: true
    priority: 4
    dynamics:
      mental_health: >
        max(0.0, min(100.0,
        mental_health
        - 2.0 * work_stress * step
        - 1.5 * max(0, cortisol_level - 1.5) * step
        + 1.5 * min(5.0, exercise_intensity) * step
        + 2.0 * sleep_quality * step))

simulation:
  start_date: "2026-01-01"
  end_date:   "2026-07-01"
  output_variables:
    - cortisol_level
    - cvd_risk
    - immune_function
    - mental_health
  schedules:
    - variable: work_stress
      time: "09:00"
      value: 0.8
      days: [Mon, Tue, Wed, Thu, Fri]
      date_range: "2026-01-01 ~ 2026-07-01"
      label: "工作日高压工作（Karasek高需求低控制）"
    - variable: exercise_intensity
      time: "07:00"
      value: 4.0
      days: [Mon, Wed, Fri]
      date_range: "2026-01-01 ~ 2026-07-01"
      label: "有氧运动（4 MET-h/次）"
    - variable: sleep_quality
      time: "23:00"
      value: 0.7
      days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
      date_range: "2026-01-01 ~ 2026-07-01"
      label: "每日睡眠质量"

optimizer:
  method: nsga2
  objectives:
    - variable: cvd_risk
      metric: final
      direction: minimize
      description: "最小化6个月末心血管风险"
    - variable: immune_function
      metric: final
      direction: maximize
      description: "最大化6个月末免疫功能"
    - variable: mental_health
      metric: final
      direction: maximize
      description: "最大化6个月末精神健康评分"
  constraints:
    - variable: exercise_intensity
      condition: "<= 10"
      type: hard
      description: "防止过度训练（>10 MET-h/day有损伤风险）"
  schedules:
    - variable: exercise_intensity
      time: "07:00"
      days: [Mon, Wed, Fri]
      label: "有氧训练日运动量（MET-h）"
      optimize:
        value: [0, 8]
    - variable: exercise_intensity
      time: "07:00"
      days: [Tue, Thu]
      label: "轻活动日运动量（MET-h）"
      optimize:
        value: [0, 3]
  algorithm:
    population_size: 80
    n_generations: 120
    seed: 42
  results:
    generated_at: "2026-05-17"
    method: nsga2
    n_solutions: 6
    elapsed_seconds: 98.4
    pareto_front:
      - {x: [2.0, 0.5], f: [0.121, -0.762, -68.4]}
      - {x: [3.5, 1.0], f: [0.114, -0.801, -74.2]}
      - {x: [5.0, 1.5], f: [0.108, -0.834, -79.6]}
      - {x: [6.5, 2.0], f: [0.103, -0.856, -83.4]}
      - {x: [7.5, 2.5], f: [0.100, -0.868, -85.1]}
      - {x: [8.0, 3.0], f: [0.098, -0.871, -84.7]}
    reference:
      x: [5.0, 1.5]
      f: [0.108, -0.834, -79.6]
      regimen:
        exercise_intensity:
          "有氧训练日运动量（MET-h）": 5.0
          "轻活动日运动量（MET-h）": 1.5
      objectives:
        cvd_risk: 0.108
        immune_function: 0.834
        mental_health: 79.6
