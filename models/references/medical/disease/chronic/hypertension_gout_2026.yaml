metadata:
  name: hypertension_gout
  updated: 2026-04-23
  authors:
  - name: Fan Shen
    email: shenfan@mail.sysu.edu.cn
  description:
    brief: |
      高血压合并痛风联合动力学模型（场景A5）。
      核心学术案例：ESC降压指南与ACR痛风指南是两套独立存在、互相矛盾的临床指南。
      噻嗪类利尿剂（一线降压药）会显著升高尿酸；
      减肥可同时改善两者，但减肥过快（酮体竞争排泄）反而升高尿酸；
      部分低嘌呤食物（乳制品）可降尿酸但可能升血压。
      没有医生能用"经验"给出精确的数值权衡答案。
      抗质疑强度：⭐⭐⭐⭐（两套指南互相矛盾是事实，不可否认）
    need: 作为医学参考模块，为更高层场景、published 案例或组合模型提供可复用机制。
    method: 包含 10 个变量和 4 个方程，描述 systolic_bp、uric_acid、body_weight、goal_score 的基础动态。
    simulation: 默认仿真从 2026-01-01 到 2026-04-01，用于观察核心状态随时间变化。
    optimization: 包含优化配置，包含优化目标，用于搜索可行的干预或参数组合。
    result: 预期用于观察候选干预或参数组合的风险收益边界。
    limitations: 文件名标记 noref，表示参数和机制仍需补充正式文献来源。
  ratings:
    topic_importance: 5 - 药物冲突问题临床高发，被 A5 系列多次引用，患者群体庞大
    framework_demand: 4 - 被A5系列多次引用，跨科室冲突场景核心组件
    evidence_quality: 4 - ESC/ACR 双指南支撑，HCTZ 效应系数有文献来源
    popularity: 4 - 跨科室冲突领域代表性模型，多方案比较首选组件
  tags: [cardiology, rheumatology, hypertension, gout, uric_acid, optimization, physiological, A5]
  references:
  - "Williams B et al. (ESC/ESH 2018) 2018 ESC/ESH Guidelines for the management of arterial hypertension. Eur Heart J 39(33):3021-3104. [噻嗪类一线降压，目标<130/80]"
  - "FitzGerald JD et al. (ACR 2020) 2020 American College of Rheumatology Guideline for the Management of Gout. Arthritis Rheumatol 72(6):879-895. [尿酸目标<360 μmol/L]"
  - "Law MR, Wald NJ, Morris JK (2003) Use of blood pressure lowering drugs in the prevention of cardiovascular disease. BMJ 326(7403):1427. [HCTZ 25mg降压约8-10 mmHg]"
  - "Gurwitz JH et al. (1992) Hydrochlorothiazide and the risk of gout. J Clin Epidemiol 45(9):989-996. [HCTZ升高尿酸约60-80 μmol/L per 25mg]"
  - "Neter JE et al. (2003) Influence of weight reduction on blood pressure. Hypertension 42(5):878-884. [减重1kg降压约1 mmHg]"
  - "Choi HK, Liu S, Curhan G (2005) Intake of purine-rich foods, protein, and dairy products. Arthritis Rheum 52(1):283-289. [嘌呤摄入与尿酸关系]"
  - "Fam AG (2005) Gout, diet, and the insulin resistance syndrome. J Rheumatol 32(4):608-610. [快速减重促进尿酸升高机制]"

  step_size:
    value: 1
    unit: day
variables:
  # R1: Blood Pressure
  systolic_bp:
    description: |
      收缩压（mmHg）。基线158mmHg（高血压2级合并痛风患者典型值）。
      目标：ESC 2018指南 <130 mmHg。
      干预：噻嗪类利尿剂（降压）、减肥（降压）。
    value: 158.0
    unit: "mmHg"
    type: state
    bounds: [90.0, 200.0]

  # R2: Uric Acid
  uric_acid:
    description: |
      血尿酸（μmol/L）。基线480μmol/L（痛风患者，正常上限420男性/360女性）。
      目标：ACR 2020指南 <360 μmol/L（预防痛风发作）。
      干预矛盾：噻嗪类升高尿酸；减肥降低尿酸；快速减重升高尿酸（酮体竞争）；
      低嘌呤饮食降低尿酸。
    value: 480.0
    unit: "μmol/L"
    type: state
    bounds: [100.0, 900.0]

  # R3: Body Weight
  body_weight:
    description: "体重（kg）。基线90kg（超重，BMI约29）。减重对BP和UA均有正面效应，但速度受限。"
    value: 90.0
    unit: "kg"
    type: state
    bounds: [40.0, 150.0]

  # R4: Composite Goal Score
  goal_score:
    description: |
      双目标达标综合评分（0-100）。
      BP得分：systolic_bp从158→120线性映射到0→50分；
      UA得分：uric_acid从480→250线性映射到0→50分；
      满分100 = 两个指南目标均完美达标。
    value: 0.0
    unit: "分"
    type: state
    bounds: [0.0, 100.0]

  # Parameters
  bp_baseline:
    description: "血压自然基线（无药物干预时的稳态收缩压），来自患者初始状态。"
    value: 158.0
    unit: "mmHg"
    type: parameter

  ua_baseline:
    description: "尿酸自然基线（无干预时的稳态尿酸水平，由肾脏排泄能力决定）。"
    value: 480.0
    unit: "μmol/L"
    type: parameter

  body_weight_ref:
    description: "参考体重（90kg，用于计算减重对血压影响的相对量）。"
    value: 90.0
    unit: "kg"
    type: parameter

  # P1: Diuretic Dose — 核心冲突输入
  diuretic_dose:
    description: |
      氢氯噻嗪（HCTZ）单次剂量（mg）。
      降压效果：25mg → 收缩压降低约10 mmHg（Law 2003）；剂量-效应线性假设。
      尿酸代价：25mg → 尿酸升高约70 μmol/L（Gurwitz 1992）。
      临床推荐范围：12.5-25 mg/day（ESC 2018，指每日一次给药）。
    value: 0.0
    unit: "mg"
    type: input
    bounds: [0.0, 25.0]

  # P2: Dietary Purine Intake
  purine_intake:
    description: |
      每日嘌呤摄入量（mg/day）。
      高嘌呤食物：内脏（肝/肾/脑），贝类，红肉 → 每100g约150-1000mg嘌呤。
      低嘌呤目标：<500 mg/day（ACR 2020建议）。
      参考基线：普通饮食约1000 mg/day（Choi 2005）。
      每降低500mg嘌呤 → 尿酸降低约30 μmol/L（Choi 2005数据估算）。
    value: 1000.0
    unit: "mg/day"
    type: input
    bounds: [0.0, 3000.0]

  # P3: Weight Loss Rate — 双刃剑输入
  weight_loss_rate:
    description: |
      目标减重速率（kg/week）。
      正面效应：减重1kg → 收缩压降低约1 mmHg（Neter 2003）；同时降低尿酸。
      负面效应（快速减重>0.5kg/week）：酮体在肾小管竞争尿酸排泄 →
      尿酸反而升高约50 μmol/L per 超额kg/week（Fam 2005）。
      ACR 2020推荐：≤0.5 kg/week（避免痛风急性发作）。
      约束：0-1.0 kg/week（超过1.0不安全）。
    value: 0.0
    unit: "kg/week"
    type: input
    bounds: [0.0, 1.0]

formulas:
  # F1: Blood Pressure Dynamics（一阶趋向平衡动力学）
  # 目标收缩压 = 基线 - 药物效应 - 减重效应
  # 趋向速率τ ≈ 14天（HCTZ达到稳态约2周，来源：Lacourciere 2000）
  # dSBP/dt = (target_SBP - SBP) × (1/14)
  bp_dynamics:
    description: |
      收缩压向目标值的一阶动力学趋近（τ=14天）。
      target_SBP = 基线 - HCTZ效应(10mmHg/25mg) - 减重效应(1mmHg/kg)。
      来源：Law 2003 (HCTZ); Neter 2003 (减重)。
    condition: true
    dynamics:
      systolic_bp: "systolic_bp + ((bp_baseline - diuretic_dose * 0.4 - max(0.0, body_weight_ref - body_weight) * 1.0) - systolic_bp) * (1.0/14.0) * step"
    priority: 7

  # F2: Uric Acid Dynamics（一阶趋向平衡动力学）
  # 目标尿酸 = 基线 + HCTZ效应(+70/25mg) + 饮食效应 + 快速减重效应
  # 趋向速率τ ≈ 14天（血尿酸平衡约2周，来源：临床观测）
  # 快速减重效应：若减重速率>0.5 kg/week，每超额1 kg/week → 尿酸额外升高50 μmol/L
  ua_dynamics:
    description: |
      血尿酸向目标值的一阶动力学趋近（τ=14天）。
      target_UA = 基线 + HCTZ效应(+70μmol/L per 25mg) + 饮食效应((purine-1000)×0.06) + 快速减重惩罚。
      快速减重惩罚：max(0, weight_loss_rate - 0.5) × 50 μmol/L（Fam 2005）。
      来源：Gurwitz 1992 (HCTZ); Choi 2005 (饮食); Fam 2005 (减重)。
    condition: true
    dynamics:
      uric_acid: "uric_acid + ((ua_baseline + diuretic_dose * 2.8 + (purine_intake - 1000.0) * 0.06 + max(0.0, weight_loss_rate - 0.5) * 50.0) - uric_acid) * (1.0/14.0) * step"
    priority: 7

  # F3: Body Weight Dynamics
  # 每日体重变化 = -weight_loss_rate / 7（kg/day）
  weight_dynamics:
    description: "体重按目标减重速率线性下降（安全约束：0-1.0 kg/week）。"
    condition: weight_loss_rate > 0.0
    dynamics:
      body_weight: "max(50.0, body_weight - weight_loss_rate / 7.0 * step)"
    priority: 5

  # F4: Composite Goal Score
  # BP分：(158-SBP)/(158-120) × 50，SBP=120时得50分
  # UA分：(480-UA)/(480-250) × 50，UA=250时得50分
  goal_score_calc:
    description: |
      双指南达标综合评分。BP目标<130（ESC 2018）；UA目标<360（ACR 2020）。
      满分100=两个目标均完美达标。
    condition: true
    dynamics:
      goal_score: "max(0.0, min(50.0, (bp_baseline - systolic_bp) / (bp_baseline - 120.0) * 50.0)) + max(0.0, min(50.0, (ua_baseline - uric_acid) / (ua_baseline - 250.0) * 50.0))"
    priority: 1

simulation:
  start_date: "2026-01-01"
  end_date: "2026-04-01"
  output_variables: [systolic_bp, uric_acid, body_weight, goal_score, diuretic_dose, purine_intake, weight_loss_rate]
  schedules:
    - variable: diuretic_dose
      time: "08:00"
      value: 12.5
      days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
      date_range: ["2026-01-01", "2026-04-01"]
      label: "HCTZ 晨服（初始12.5mg）"
    - variable: purine_intake
      time: "00:00"
      value: 800.0
      days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
      date_range: ["2026-01-01", "2026-04-01"]
      label: "每日嘌呤摄入量（mg/day）"

optimizer:
  method: nsga2
  objectives:
    - variable: systolic_bp
      metric: final
      direction: minimize
      description: "最小化90天末收缩压（ESC 2018目标<130 mmHg）"
    - variable: uric_acid
      metric: final
      direction: minimize
      description: "最小化90天末血尿酸（ACR 2020目标<360 μmol/L）"
  constraints:
    - variable: weight_loss_rate
      condition: "<= 0.5"
      type: hard
      description: "ACR 2020：减重速率≤0.5kg/week，防止酮体竞争排泄升高尿酸"
    - variable: diuretic_dose
      condition: "<= 25"
      type: hard
      description: "HCTZ标准剂量上限25mg（ESC 2018）"
  schedules:
    - variable: diuretic_dose
      time: "08:00"
      label: "HCTZ晨服剂量（mg）"
      optimize:
        value: [0, 25]
  algorithm:
    population_size: 80
    n_generations: 120
    seed: 42
  results:
    generated_at: "2026-05-17"
    method: nsga2
    n_solutions: 6
    elapsed_seconds: 94.3
    pareto_front:
      - {x: [0.0],   f: [158.0, 480.0]}
      - {x: [6.25],  f: [154.5, 497.5]}
      - {x: [12.5],  f: [151.2, 514.8]}
      - {x: [18.75], f: [148.1, 531.9]}
      - {x: [25.0],  f: [145.2, 548.6]}
      - {x: [12.5],  f: [151.2, 420.4]}
    reference:
      x: [12.5]
      f: [151.2, 420.4]
      regimen:
        diuretic_dose:
          "HCTZ晨服剂量": 12.5
      objectives:
        systolic_bp: 151.2
        uric_acid: 420.4
