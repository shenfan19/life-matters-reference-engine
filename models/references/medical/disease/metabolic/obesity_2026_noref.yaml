metadata:
  name: obesity
  updated: 2026-04-23
  author: Fan Shen
  description:
    brief: 肥胖增加糖尿病风险的动态模型
    need: 作为医学参考模块，为更高层场景、published 案例或组合模型提供可复用机制。
    method: 包含 2 个变量和 3 个方程，描述 obesity_index、exposure_duration 的基础动态。
    simulation: 默认仿真从 2026-01-01 到 2026-01-02，用于观察核心状态随时间变化。
    optimization: 包含优化配置，包含优化目标，用于搜索可行的干预或参数组合。
    result: 预期用于观察候选干预或参数组合的风险收益边界。
    limitations: 文件名标记 noref，表示参数和机制仍需补充正式文献来源。
  conflicts: []
  tags:
  - obesity
  - diabetes
  - risk_model
  step_size:
    value: 1
    unit: minute
imports:
- glucose_regulation
- insulin_system
variables:
  obesity_index:
    description: 肥胖指数 (0=正常, 1=轻度肥胖, 2=中度, 3=重度)
    value: 0.0
    unit: 指数级别
    type: state
    bounds:
    - 0.0
    - 3.0
  exposure_duration:
    description: 暴露持续时间（分钟），用于时间依赖计算
    value: 0.0
    unit: 分钟
    type: state
    bounds:
    - 0.0
    - 100000.0
formulas:
  obesity_increase:
    description: 高血糖和胰岛素促进脂肪储存
    condition: blood_glucose > 120 or plasma_insulin > 20
    dynamics:
      obesity_index: min(1.0, obesity_index + 0.0003 * step)
    priority: 3
  risk_accumulation:
    description: 肥胖指数导致糖尿病风险累积增加，受时间影响
    condition: obesity_index > 0
    dynamics:
      diabetes_risk: min(1.0, diabetes_risk + (0.0002 * obesity_index * exposure_duration / 1000) * step)
      exposure_duration: exposure_duration + step
    priority: 100
  risk_decay:
    description: 正常体重时风险缓慢衰减（模拟减肥效果）
    condition: obesity_index == 0 and diabetes_risk > 0
    dynamics:
      diabetes_risk: max(0.01, diabetes_risk - 0.0001 * step)
    priority: 90
simulation:
  start_date: "2026-01-01"
  end_date: "2026-01-02"
  output_variables:
  - obesity_index
  - exposure_duration
optimizer:
  method: grid
  duration: 60.0
  targets_of_optimization:
  - diabetes_risk
  variables_to_optimize:
  - obesity_index
