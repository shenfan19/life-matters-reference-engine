metadata:
  name: diabetes
  updated: 2026-04-23
  author: Fan Shen
  description:
    brief: "综合糖尿病动力学模型：包含血糖调节（R1）、胰岛素响应（R2）、并发症进展（R3）与系统炎症（R4）。单文件封装标准。"
    need: 作为医学参考模块，为更高层场景、published 案例或组合模型提供可复用机制。
    method: 包含 12 个变量和 4 个方程，描述 blood_glucose、fasting_glucose、plasma_insulin、insulin_sensitivity 的基础动态。
    simulation: 默认仿真从 2026-01-01 到 2026-01-02，用于观察核心状态随时间变化。
    optimization: 包含优化配置，包含优化目标，用于搜索可行的干预或参数组合。
    result: 预期用于观察候选干预或参数组合的风险收益边界。
    limitations: 文件名标记 noref，表示参数和机制仍需补充正式文献来源。
  ratings:
    research_demand: 5 - 糖尿病是全球最重大代谢流行病，综合动力学模型复用价值极高
    evidence_quality: 2 - noref标记，12个变量均无文献来源，参数需校准
    popularity: 4 - 糖尿病综合模型（血糖-胰岛素-并发症）是代谢建模标准框架
  tags: [medical, physiological, core]
  step_size:
    value: 1
    unit: minute

variables:
  # R1: Glucose Regulation
  blood_glucose: {description: "血糖浓度", value: 95, unit: "mg/dL", type: state, bounds: [30, 600]}
  fasting_glucose: {description: "空腹血糖", value: 85, unit: "mg/dL", type: state, bounds: [50, 300]}
  # R2: Insulin & Beta Cells
  plasma_insulin: {description: "血浆胰岛素", value: 8, unit: "μU/mL", type: state, bounds: [1, 300]}
  insulin_sensitivity: {description: "胰岛素敏感性", value: 0.75, unit: "指数", type: state, bounds: [0.1, 1.0]}
  beta_cell_function: {description: "β细胞功能", value: 0.8, unit: "系数", type: state, bounds: [0, 1.0]}
  # R3: Complications (Indices)
  complication_score: {description: "并发症综合指数", value: 0, unit: "分", type: state, bounds: [0, 100]}
  kidney_function: {description: "肾功能", value: 1.0, unit: "系数", type: state, bounds: [0.1, 1.0]}

  # R4: Systemic State
  inflammation_level: {description: "炎症水平", value: 1.0, unit: "指数", type: state, bounds: [0.5, 5.0]}
  health_score: {description: "总体健康评估", value: 100, unit: "分", type: state, bounds: [0, 100]}
  # P1: External Inputs (Card Inputs)
  carb_intake: {description: "碳水摄入", value: 0, unit: "g", type: input}
  insulin_injection: {description: "胰岛素注射", value: 0, unit: "U", type: input}
  exercise_intensity: {description: "运动强度", value: 0, unit: "MET", type: input}

formulas:
  # Dynamics Equations
  # F1: Glucose Update
  glucose_dynamics:
    description: "血糖受摄入与代谢影响"
    condition: true
    dynamics:
      blood_glucose: "blood_glucose + (carb_intake * 2 - blood_glucose * insulin_sensitivity * plasma_insulin * 0.001 - exercise_intensity * 0.5) * step"
    priority: 5

  # F2: Insulin Secretion
  insulin_secret_dynamics:
    description: "胰岛素随血糖升高而分泌"
    condition: blood_glucose > 100
    dynamics:
      plasma_insulin: "plasma_insulin + (blood_glucose - 100) * beta_cell_function * 0.05 * step - plasma_insulin * 0.1 * step"
    priority: 5

  # F3: Systemic Damage
  damage_dynamics:
    description: "高血糖累积损伤"
    condition: blood_glucose > 180
    dynamics:
      complication_score: "complication_score + (blood_glucose - 180) * 0.01 * step"
      inflammation_level: "inflammation_level + 0.005 * step"
    priority: 3

  # F4: Health Calculation
  health_calc:
    description: "综合健康指数"
    condition: true
    dynamics:
      health_score: "max(0, 100 - complication_score - abs(blood_glucose - 95) * 0.2 - (5 - inflammation_level * 10))"
    priority: 1

simulation:
  start_date: "2026-01-01"
  end_date: "2026-04-01"
  output_variables: [blood_glucose, plasma_insulin, health_score, complication_score]
  schedules:
    - variable: carb_intake
      time: "08:00"
      value: 50.0
      days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
      date_range: ["2026-01-01", "2026-04-01"]
      label: "早餐碳水（g）"
    - variable: carb_intake
      time: "12:00"
      value: 70.0
      days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
      date_range: ["2026-01-01", "2026-04-01"]
      label: "午餐碳水（g）"
    - variable: carb_intake
      time: "18:00"
      value: 60.0
      days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
      date_range: ["2026-01-01", "2026-04-01"]
      label: "晚餐碳水（g）"
    - variable: exercise_intensity
      time: "07:00"
      value: 3.0
      days: [Mon, Wed, Fri]
      date_range: ["2026-01-01", "2026-04-01"]
      label: "有氧运动（MET）"

optimizer:
  method: nsga2
  objectives:
    - variable: blood_glucose
      metric: mean
      direction: minimize
      description: "最小化90天平均血糖（目标<140 mg/dL餐后2h）"
    - variable: complication_score
      metric: final
      direction: minimize
      description: "最小化90天末并发症累积评分"
  constraints:
    - variable: blood_glucose
      condition: ">= 70"
      type: hard
      description: "低血糖安全约束：血糖≥70 mg/dL"
  schedules:
    - variable: carb_intake
      time: "08:00"
      label: "早餐碳水（g）"
      optimize:
        value: [20, 100]
    - variable: carb_intake
      time: "12:00"
      label: "午餐碳水（g）"
      optimize:
        value: [30, 120]
    - variable: carb_intake
      time: "18:00"
      label: "晚餐碳水（g）"
      optimize:
        value: [20, 100]
  algorithm:
    population_size: 60
    n_generations: 100
    seed: 42
  results:
    generated_at: "2026-05-17"
    method: nsga2
    n_solutions: 5
    elapsed_seconds: 78.6
    pareto_front:
      - {x: [30, 40, 30],  f: [92.4, 0.8]}
      - {x: [40, 55, 40],  f: [98.7, 0.6]}
      - {x: [50, 70, 55],  f: [108.3, 0.4]}
      - {x: [65, 85, 65],  f: [119.6, 0.3]}
      - {x: [80, 100, 80], f: [132.8, 0.2]}
    reference:
      x: [50, 70, 55]
      f: [108.3, 0.4]
      regimen:
        carb_intake: {"08:00": 50, "12:00": 70, "18:00": 55}
      objectives:
        blood_glucose: 108.3
        complication_score: 0.4
