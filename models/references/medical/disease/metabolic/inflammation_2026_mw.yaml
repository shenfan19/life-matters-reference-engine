metadata:
  name: inflammation
  updated: 2026-04-23
  author: Minghui Wu
  description:
    brief: 系统炎症水平和自身免疫活性
    need: 作为医学参考模块，为更高层场景、published 案例或组合模型提供可复用机制。
    method: 包含 2 个变量和 3 个方程，描述 inflammation_level、autoimmune_activity 的基础动态。
    simulation: 默认仿真从 2026-01-01 到 2026-01-02，用于观察核心状态随时间变化。
    optimization: 包含优化配置，包含优化目标，用于搜索可行的干预或参数组合。
    result: 预期用于观察候选干预或参数组合的风险收益边界。
    limitations: 该模块偏基础组件，参数应在被场景调用时结合具体上下文校准。
  conflicts: []
  ratings:
    research_demand: 4 - 系统炎症是代谢病/糖尿病共同机制，作为组件有广泛复用价值
    evidence_quality: 2 - 模块为生成代码，变量描述简略，缺少文献标注
    popularity: 3 - 炎症组件在代谢建模中有一定地位但非独立经典模型
  tags:
  - inflammation
  - immune
  step_size:
    value: 1
    unit: minute
imports:
- references/medical/physiology/glucose_regulation_2026_mw
- references/medical/disease/metabolic/obesity_2026_noref
variables:
  inflammation_level:
    description: 系统炎症水平
    value: 1.0
    unit: 指数
    type: state
    bounds:
    - 0.5
    - 5.0
  autoimmune_activity:
    description: 自身免疫活性（针对1型糖尿病）
    value: 0
    unit: 指数
    type: state
    bounds:
    - 0
    - 1.0
formulas:
  inflammation_increase:
    description: 高血糖和肥胖增加炎症
    condition: blood_glucose > 150 or obesity_index > 0.5
    dynamics:
      inflammation_level: min(5.0, inflammation_level + 0.001 * step)
    priority: 3
  inflammation_decrease:
    description: 运动和血糖控制减少炎症
    condition: blood_glucose < 100 and exercise_intensity > 1
    dynamics:
      inflammation_level: max(0.5, inflammation_level - 0.002 * step)
    priority: 3
  autoimmune_activation:
    description: 1型糖尿病自身免疫激活
    condition: diabetes_type == 1 and autoimmune_activity < 1.0
    dynamics:
      autoimmune_activity: min(1.0, autoimmune_activity + 0.0005 * step)
    priority: 4
simulation:
  start_date: "2026-01-01"
  end_date: "2026-01-08"
  output_variables:
  - inflammation_level
  - autoimmune_activity
