metadata:
  name: complications
  updated: 2026-04-23
  author: Minghui Wu
  description:
    brief: 糖尿病并发症进展，如神经病变、肾病变等
    need: 作为医学参考模块，为更高层场景、published 案例或组合模型提供可复用机制。
    method: 包含 4 个变量和 4 个方程，描述 neuropathy_severity、nephropathy_severity、retinopathy_severity、cardiovascular_risk 的基础动态。
    simulation: 默认仿真从 2026-01-01 到 2026-01-02，用于观察核心状态随时间变化。
    optimization: 包含优化配置，包含优化目标，用于搜索可行的干预或参数组合。
    result: 预期用于观察候选干预或参数组合的风险收益边界。
    limitations: 该模块偏基础组件，参数应在被场景调用时结合具体上下文校准。
  conflicts: []
  ratings:
    research_demand: 4 - 糖尿病并发症（神经/肾/视网膜/心血管）是糖尿病管理核心模块
    evidence_quality: 2 - 模块为生成代码，参数描述简略，缺少文献标注
    popularity: 3 - 并发症进展组件在糖尿病建模中有复用价值但不独立使用
  tags:
  - complications
  - diabetes
  step_size:
    value: 1
    unit: minute
imports:
- references/medical/physiology/glucose_regulation_2026_mw
- references/medical/disease/metabolic/inflammation_2026_mw
variables:
  neuropathy_severity:
    description: 神经病变严重程度
    value: 0
    unit: 指数
    type: state
    bounds:
    - 0
    - 100
  nephropathy_severity:
    description: 肾病变严重程度
    value: 0
    unit: 指数
    type: state
    bounds:
    - 0
    - 100
  retinopathy_severity:
    description: 视网膜病变严重程度
    value: 0
    unit: 指数
    type: state
    bounds:
    - 0
    - 100
  cardiovascular_risk:
    description: 心血管风险指数
    value: 0.1
    unit: 风险系数
    type: state
    bounds:
    - 0
    - 1.0
formulas:
  neuropathy_progression:
    description: 高血糖导致神经病变进展
    condition: blood_glucose > 150
    dynamics:
      neuropathy_severity: min(100, neuropathy_severity + (blood_glucose - 150) * 0.001 * step)
    priority: 7
  nephropathy_progression:
    description: 高血糖导致肾病变进展
    condition: blood_glucose > 160
    dynamics:
      nephropathy_severity: min(100, nephropathy_severity + (blood_glucose - 160) * 0.0008 * step)
      kidney_function: max(0.1, kidney_function - 0.0001 * step)
    priority: 7
  retinopathy_progression:
    description: 高血糖导致视网膜病变进展
    condition: blood_glucose > 140
    dynamics:
      retinopathy_severity: min(100, retinopathy_severity + (blood_glucose - 140) * 0.0005 * step)
    priority: 7
  cardiovascular_risk_increase:
    description: 高血糖和炎症增加心血管风险
    condition: blood_glucose > 130 or inflammation_level > 2.0
    dynamics:
      cardiovascular_risk: min(1.0, cardiovascular_risk + 0.0002 * step)
    priority: 7
simulation:
  start_date: "2026-01-01"
  end_date: "2026-04-01"
  output_variables:
  - neuropathy_severity
  - nephropathy_severity
  - retinopathy_severity
  - cardiovascular_risk
