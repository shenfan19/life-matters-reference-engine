metadata:
  name: flu
  updated: 2026-04-23
  author: Fan Shen
  description:
    brief: "感冒动力学模型：包含病毒载量（R1）、免疫响应（R2）与体能状态（R3）。"
    need: 作为医学参考模块，为更高层场景、published 案例或组合模型提供可复用机制。
    method: 包含 7 个变量和 3 个方程，描述 viral_load、immune_activity、body_temperature、vitality 的基础动态。
    simulation: 默认仿真从 2026-01-01 到 2026-01-25，用于观察核心状态随时间变化。
    limitations: 文件名标记 noref，表示参数和机制仍需补充正式文献来源。
  ratings:
    topic_importance: 4 - 感冒是最常见急性感染，免疫-病毒动力学有广泛复用价值
    framework_demand: 1 - noref + 未被其他模型引用，复用价值极低
    evidence_quality: 2 - noref标记，参数无文献来源，机制为定性近似
    popularity: 3 - 感冒模型常见但非教科书经典基准
  tags: [medical, physiological, flu]
  step_size:
    value: 1
    unit: day

variables:
  # R1: Pathogen
  viral_load: {description: "病毒载量", value: 1.0, unit: "相对单位", type: state, bounds: [0, 1000]}
  # R2: Immune System
  immune_activity: {description: "免疫活性", value: 10, unit: "指数", type: state, bounds: [0, 100]}
  body_temperature: {description: "体温", value: 37.0, unit: "°C", type: state, bounds: [35, 42]}
  # R3: Systemic State
  vitality: {description: "体能/活力", value: 100, unit: "分", type: state, bounds: [0, 100]}
  # P1: Inputs (Card Inputs)
  rest_hours: {description: "休息时间", value: 0, unit: "h", type: input}
  medicine_intake: {description: "药物干预", value: 0, unit: "mg", type: input}
  water_intake: {description: "饮水量", value: 0, unit: "ml", type: input}

formulas:
  # F1: Viral Replication vs Immune Kill
  infection_dynamics:
    description: "病毒增殖与免疫对抗"
    condition: viral_load > 0
    dynamics:
      viral_load: "viral_load + (viral_load * 0.1 - immune_activity * 0.05 - medicine_intake * 0.2) * step"
    priority: 5

  # F2: Immune Response (Fever)
  immune_dynamics:
    description: "免疫系统激活"
    condition: viral_load > 10
    dynamics:
      immune_activity: "immune_activity + viral_load * 0.01 * step"
      body_temperature: "37.0 + viral_load * 0.005"
    priority: 5

  # F3: Recovery & Vitality
  recovery_dynamics:
    description: "体能恢复与损耗"
    condition: true
    dynamics:
      vitality: "vitality + (rest_hours * 5 + water_intake * 0.01 - viral_load * 0.1) * step"
    priority: 3

simulation:
  start_date: "2026-01-01"
  end_date: "2026-01-25"
  output_variables: [viral_load, body_temperature, vitality]

optimizer:
  method: nsga2
  objectives:
    - variable: vitality
      metric: final
      direction: maximize
    - variable: viral_load
      metric: final
      direction: minimize
  constraints:
    - variable: body_temperature
      condition: "<= 38.5"
      type: hard
      description: "体温不超过38.5°C（避免高热危机）"
  schedules:
    - variable: rest_hours
      time: "22:00"
      days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
      label: "每日休息（0=不休息，1=充分休息）"
      optimize:
        value: [0, 1]
    - variable: medicine_intake
      time: "08:00"
      days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
      label: "每日用药（0=不用药，1=足量）"
      optimize:
        value: [0, 1]
    - variable: water_intake
      time: "08:00"
      days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
      label: "每日饮水（0=不足，1=充足）"
      optimize:
        value: [0, 1]
  algorithm:
    population_size: 50
    n_generations: 80
    seed: 42
