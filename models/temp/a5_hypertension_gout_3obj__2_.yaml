optimizer:
  enabled: true
  method: nsga2
  objectives:
  - variable: blood_pressure
    metric: final
    direction: minimize
    description: 最小化26周末收缩压
  - variable: uric_acid
    metric: final
    direction: minimize
    description: 最小化26周末血尿酸
  - variable: body_weight
    metric: final
    direction: minimize
    description: 最小化26周末体重（减重目标）
  constraints:
  - variable: blood_pressure
    condition: <= 130
    type: hard
  - variable: uric_acid
    condition: <= 360
    type: hard
  - variable: caloric_deficit
    condition: <= 700
    type: hard
  regimen:
    variable: thiazide_dose
    events:
