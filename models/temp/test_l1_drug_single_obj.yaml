
metadata:
  name: l1_drug_single_obj
  title: "[TEST L1] 单目标快速优化"
  description:
    brief: |
      【调试用 TEST L1】单目标优化 · 30天日步长 · 预估完成 < 1分钟

      ── 用途 ──────────────────────────────────────────────
      调试优化链路：endpoint → job 系统 → 结果回传。
      最快验证路径，出现问题首先用此模型排查。

      ── 场景 ──────────────────────────────────────────────
      单一口服药物，每日早晨给药（08:00）。
      目标：最大化第30天血浆浓度，约束肝脏累积负荷 ≤ 250 mg/L·day。

      ── 参数规模 ──────────────────────────────────────────
      pop=10, gen=15 → 150次评估 × 30步 ≈ 1–3秒
      决策变量: 1（dose_mg: 0–50 mg）
      MC: 未启用（clearance_rate 固定为均值）
    need: 作为开发期测试模型，用于验证仿真、调度、MC 或优化链路是否稳定。
    method: 包含 4 个变量和 2 个方程，围绕 plasma_level、liver_load、clearance_rate、dose_mg 构造最小可运行动力学。
    simulation: 默认仿真从 2025-01-01 到 2025-01-31，用于观察核心状态随时间变化。
    optimization: 包含优化配置，目标 1 个，决策输入 1 个，用于搜索可行的干预或参数组合。
    result: 预期用于发现回归错误，并确认 GUI 与后端输出保持一致。
  tags: [test, L1, single-objective, pharmacokinetics, debug]
  references:
    - "TEST L1: Simplified first-order PK model for optimizer unit test"
  step_size:
    value: 1
    unit: day

variables:
  plasma_level:
    description: 血浆药物浓度（mg/L），一阶吸收-清除动力学
    value: 0.0
    unit: mg/L
    type: state
    bounds: [0.0, 120.0]

  liver_load:
    description: 肝脏累积代谢负荷（mg/L·day），越高副作用风险越大
    value: 0.0
    unit: mg/L·day
    type: state
    bounds: [0.0, 1200.0]

  clearance_rate:
    description: |
      药物清除率（个体差异）。
      MC 参数：normal(0.3, 0.05) /day。
      均值 0.3：即半衰期 ≈ 2.3天。
    value: "normal(0.3, 0.05)"
    unit: per_day
    type: parameter
    bounds: [0.1, 0.6]

  dose_mg:
    description: 每日口服给药剂量（mg），优化决策变量
    value: 10.0
    unit: mg
    type: input
    bounds: [0.0, 50.0]

formulas:
  drug_kinetics:
    description: |
      一阶药代动力学。吸收率 60%，清除率 clearance_rate。
      稳态：plasma_level_ss = dose_mg * 0.6 / clearance_rate
      （dose=10 → ss≈20; dose=42 → ss≈84，约为约束上限）
    condition: true
    dynamics:
      plasma_level: "plasma_level + (dose_mg * 0.6 - plasma_level * clearance_rate) * step"
    priority: 10

  liver_accumulation:
    description: 肝脏负荷累积（每日 plasma_level 的 20%）
    condition: true
    dynamics:
      liver_load: "liver_load + plasma_level * 0.2 * step"
    priority: 5

simulation:
  start_date: "2025-01-01"
  end_date: "2025-01-31"
  schedules:
    - variable: dose_mg
      time: "08:00"
      value: 10.0
      label: "Daily dose"
  output_variables: [plasma_level, liver_load, dose_mg]

optimizer:
  method: nsga2

  objectives:
    - variable: plasma_level
      metric: final
      direction: maximize

  constraints:
    - variable: liver_load
      condition: "<= 250"

  inputs:
    - variable: dose_mg
      time: "08:00"
      value: 10.0
      label: "Daily dose (mg)"
      optimize:
        value: [0.0, 50.0]

  algorithm:
    population_size: 10
    n_generations: 15
    seed: 42

  mc:
    enabled: false
    sim_runs: 1
