type: model
category: intervention

metadata:
  name: "raw_berry"
  version: "1.0.0"
  author: "Antigravity"
  description: "生浆果营养模型。每100g含：碳水化合物 14g, 蛋白质 1.5g, 脂肪 0.5g, 水分 84g。"
  tags: [food, diet, fruit, berry]

variables:
  # ========== 输入变量 ==========
  berry_intake:
    type: input
    value: 0
    unit: "g"
    bounds: [0, 1000]
    io_role: input
    optimizable: true
    description: "摄入浆果的重量"

  # ========== 输出指标 (供 nutrition_intake 使用) ==========
  food_carbohydrate:
    type: state
    value: 0
    unit: "g"
    io_role: output
  
  food_protein:
    type: state
    value: 0
    unit: "g"
    io_role: output

  food_fat:
    type: state
    value: 0
    unit: "g"
    io_role: output

  water_intake:
    type: state
    value: 0
    unit: "ml"
    io_role: output

formulas:
  calculate_nutrition_impact:
    condition: berry_intake > 0
    priority: 1
    dynamics:
      food_carbohydrate: "berry_intake * 0.14"
      food_protein: "berry_intake * 0.015"
      food_fat: "berry_intake * 0.005"
      water_intake: "berry_intake * 0.84"
      berry_intake: 0

simulation:
  step_size: 1
  time_unit: minute
  total_time: 60
  output_variables: [food_carbohydrate, food_protein, food_fat, water_intake]
