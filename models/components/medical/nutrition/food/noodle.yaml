metadata:
  name: noodle
  updated: 2026-04-23
  author: TODO:AUTHOR
  description: "面条制作与煮熟模型：通用单文件动力学演示。"
  tags: [cooking, simple]

variables:
  softness: { description: "面条软度", value: 10, unit: "%", type: state, bounds: [0, 100] }
  temperature: { description: "锅内温度", value: 20, unit: "°C", type: state, bounds: [0, 120] }
  heat_input: { description: "火力调节", value: 0, unit: "级", type: input }
  salt_added: { description: "加盐量", value: 0, unit: "g", type: input }

formulas:
  heating:
    description: "加热过程"
    condition: temperature < 110
    dynamics:
      temperature: "temperature + heat_input * 5 * step_size"
    priority: 5
  cooking:
    description: "煮面过程"
    condition: temperature > 95
    dynamics:
      softness: "min(100, softness + (temperature - 90) * 0.2 * step_size)"
    priority: 4

simulator:
  step_size: 1
  time_unit: minute   # 15 步 = 15 分钟烹饪
  total_time: 15
  output_variables: [softness, temperature]
