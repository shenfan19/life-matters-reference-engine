type: model

metadata:
  name: l3_two_drug_mc
  title: "[TEST L3] 五周用药方案 · 双目标 + MC"
  description: >
    【调试用 TEST L3】5 决策变量 · 双目标 Pareto · MC 启用 · 预估完成 3–8分钟

    ── 用途 ──────────────────────────────────────────────
    验证高维决策变量 + 蒙特卡洛积分的完整优化链路。
    5 个决策变量对应5个每周用药时段，测试 NSGA-II 在高维空间的寻优能力。

    ── 场景 ──────────────────────────────────────────────
    慢性病患者每周5天用药（工作日），优化各天剂量。
      · 目标1：最大化 plasma_level 均值（维持治疗窗口）
      · 目标2：最小化 liver_load 终值（减少毒性累积）
    MC 扰动：个体清除率差异（normal分布），pop × 2 次仿真。

    ── 参数规模 ──────────────────────────────────────────
    pop=25, gen=30 → 750次评估 × 2 MC × 35步 ≈ 3–8分钟
    决策变量: 5（Mon/Tue/Wed/Thu/Fri 各天剂量: 0–25 mg）
    MC: 启用（sim_runs=2）
  tags: [test, L3, multi-objective, pareto, 5-variable, mc, chronic]
  references:
    - "TEST L3: Five-day weekly schedule optimizer with MC integration test"
  step_size:
    value: 1
    unit: day

variables:
  plasma_level:
    description: 血浆药物浓度（mg/L），工作日给药+周末自然消退
    value: 0.0
    unit: mg/L
    type: state
    bounds: [0.0, 120.0]

  liver_load:
    description: 肝脏35天累积代谢负荷
    value: 0.0
    unit: mg/L·day
    type: state
    bounds: [0.0, 1500.0]

  clearance_rate:
    description: >
      药物日清除率（MC参数，个体差异）。
      normal(0.30, 0.04)：均值半衰期 ≈ 2.3天。
    value: "normal(0.30, 0.04)"
    unit: per_day
    type: parameter
    bounds: [0.15, 0.55]

  mon_dose:
    description: 周一剂量（mg）
    value: 10.0
    unit: mg
    type: input
    bounds: [0.0, 25.0]

  tue_dose:
    description: 周二剂量（mg）
    value: 10.0
    unit: mg
    type: input
    bounds: [0.0, 25.0]

  wed_dose:
    description: 周三剂量（mg）
    value: 10.0
    unit: mg
    type: input
    bounds: [0.0, 25.0]

  thu_dose:
    description: 周四剂量（mg）
    value: 10.0
    unit: mg
    type: input
    bounds: [0.0, 25.0]

  fri_dose:
    description: 周五剂量（mg）
    value: 10.0
    unit: mg
    type: input
    bounds: [0.0, 25.0]

formulas:
  drug_kinetics:
    description: >
      工作日给药（吸收率65%），周末停药。
      day_of_week = (step_index % 7): 0=Mon, 1=Tue, ... 4=Fri, 5=Sat, 6=Sun
      使用 mon_dose 等按日激活（通过 optimizer.inputs.days 控制）。
    condition: true
    dynamics:
      plasma_level: "plasma_level + (mon_dose * 0.65 + tue_dose * 0.65 + wed_dose * 0.65 + thu_dose * 0.65 + fri_dose * 0.65 - plasma_level * clearance_rate) * step"
    priority: 10

  liver_accumulation:
    description: 日肝脏负荷（plasma_level的16%）
    condition: true
    dynamics:
      liver_load: "liver_load + plasma_level * 0.16 * step"
    priority: 5

simulation:
  start_date: "2025-01-01"
  end_date: "2025-02-04"
  output_variables: [plasma_level, liver_load, mon_dose, tue_dose, wed_dose, thu_dose, fri_dose]

optimizer:
  method: nsga2

  objectives:
    - variable: plasma_level
      metric: mean
      direction: maximize

    - variable: liver_load
      metric: final
      direction: minimize

  constraints:
    - variable: liver_load
      condition: "<= 450"

  inputs:
    - variable: mon_dose
      time: "08:00"
      value: 10.0
      label: "Monday dose (mg)"
      optimize:
        value: [0.0, 25.0]

    - variable: tue_dose
      time: "08:00"
      value: 10.0
      label: "Tuesday dose (mg)"
      optimize:
        value: [0.0, 25.0]

    - variable: wed_dose
      time: "08:00"
      value: 10.0
      label: "Wednesday dose (mg)"
      optimize:
        value: [0.0, 25.0]

    - variable: thu_dose
      time: "08:00"
      value: 10.0
      label: "Thursday dose (mg)"
      optimize:
        value: [0.0, 25.0]

    - variable: fri_dose
      time: "08:00"
      value: 10.0
      label: "Friday dose (mg)"
      optimize:
        value: [0.0, 25.0]

  algorithm:
    population_size: 25
    n_generations: 30
    seed: 42

  mc:
    enabled: true
    sim_runs: 2
