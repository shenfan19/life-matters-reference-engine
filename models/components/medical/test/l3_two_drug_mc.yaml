type: model

metadata:
  name: l3_two_drug_mc
  title: "[TEST L3] 双药双目标 + MC 优化"
  description: >
    【调试用 TEST L3】双决策变量 · 双目标 Pareto · MC 启用 · 预估完成 2–5分钟

    ── 用途 ──────────────────────────────────────────────
    验证多变量优化 + 蒙特卡洛积分：
      · 2个决策变量（drug_a_dose, drug_b_dose）
      · 2个目标（联合疗效最大化 / 肝脏毒性最小化）
      · MC启用（clearance_rate个体差异）

    ── 场景 ──────────────────────────────────────────────
    两种药物同时给药，各有清除动力学。
    联合使用提高疗效（plasma_a + plasma_b），
    但肝脏同时处理两种药物代谢，毒性叠加。

    ── 参数规模 ──────────────────────────────────────────
    pop=20, gen=25 → 500次评估 × 2个MC × 30步 ≈ 2–5分钟
    决策变量: 2（drug_a: 0–40mg, drug_b: 0–40mg）
    MC: 启用（sim_runs=2，个体clearance差异）
  tags: [test, L3, multi-variable, multi-objective, mc, pharmacokinetics]
  references:
    - "TEST L3: Two-drug multi-variable optimizer + MC integration test"
  step_size:
    value: 1
    unit: day

variables:
  plasma_a:
    description: 药物A血浆浓度（mg/L），一阶动力学
    value: 0.0
    unit: mg/L
    type: state
    bounds: [0.0, 100.0]

  plasma_b:
    description: 药物B血浆浓度（mg/L），一阶动力学（清除更快）
    value: 0.0
    unit: mg/L
    type: state
    bounds: [0.0, 100.0]

  liver_load:
    description: 肝脏总代谢负荷（两药之和）
    value: 0.0
    unit: mg/L·day
    type: state
    bounds: [0.0, 2000.0]

  clearance_a:
    description: >
      药物A清除率（MC参数，个体差异）。
      normal(0.25, 0.04)：均值半衰期 ≈ 2.8天。
    value: "normal(0.25, 0.04)"
    unit: per_day
    type: parameter
    bounds: [0.1, 0.5]

  clearance_b:
    description: >
      药物B清除率（MC参数，比A快约50%）。
      normal(0.40, 0.05)：均值半衰期 ≈ 1.7天。
    value: "normal(0.40, 0.05)"
    unit: per_day
    type: parameter
    bounds: [0.2, 0.6]

  drug_a_dose:
    description: 药物A每日给药剂量（mg），决策变量
    value: 10.0
    unit: mg
    type: input
    bounds: [0.0, 40.0]

  drug_b_dose:
    description: 药物B每日给药剂量（mg），决策变量
    value: 10.0
    unit: mg
    type: input
    bounds: [0.0, 40.0]

formulas:
  kinetics_a:
    description: 药物A一阶动力学，吸收率65%
    condition: true
    dynamics:
      plasma_a: "plasma_a + (drug_a_dose * 0.65 - plasma_a * clearance_a) * step"
    priority: 10

  kinetics_b:
    description: 药物B一阶动力学，吸收率70%（更高生物利用度但清除也快）
    condition: true
    dynamics:
      plasma_b: "plasma_b + (drug_b_dose * 0.70 - plasma_b * clearance_b) * step"
    priority: 10

  liver_total:
    description: 肝脏总负荷：两药各贡献其血浆浓度的15%
    condition: true
    dynamics:
      liver_load: "liver_load + (plasma_a + plasma_b) * 0.15 * step"
    priority: 5

simulation:
  start_date: "2025-01-01"
  end_date: "2025-01-31"
  output_variables: [plasma_a, plasma_b, liver_load, drug_a_dose, drug_b_dose]

optimizer:
  method: nsga2

  objectives:
    - variable: plasma_a
      metric: mean
      direction: maximize
      # 注: 联合疗效用 plasma_a mean 作为主代理（两药协同）

    - variable: liver_load
      metric: final
      direction: minimize

  constraints:
    - variable: liver_load
      condition: "<= 400"

  inputs:
    - variable: drug_a_dose
      time: "08:00"
      value: 10.0
      label: "Drug A morning dose (mg)"
      optimize:
        value: [0.0, 40.0]

    - variable: drug_b_dose
      time: "08:00"
      value: 10.0
      label: "Drug B morning dose (mg)"
      optimize:
        value: [0.0, 40.0]

  algorithm:
    population_size: 20
    n_generations: 25
    seed: 42

  mc:
    enabled: true
    sim_runs: 2
