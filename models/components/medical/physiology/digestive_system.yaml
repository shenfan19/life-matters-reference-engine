type: model
category: dynamics

metadata:
  name: "digestive_system"
  updated: 2026-04-23
  author: "Minghui Wu, Antigravity"
  description: "胃肠道状态、营养吸收、激素酶和小肠大肠动力学模型。"
  tags: [digestion, gastrointestinal]
  step_size:
    value: 1
    unit: minute

imports:
- nutrition_intake

variables:
  amino_acids:
    type: state
    value: 0.0
    unit: "mmol/L"
    bounds: [0.0, 5.0]
    io_role: intermediate
    description: "氨基酸血浆浓度"

  bile_acids:
    type: state
    value: 0.0
    unit: "mmol/L"
    bounds: [0.0, 50.0]
    io_role: intermediate
    description: "胆汁酸水平"

  bile_function:
    type: parameter
    value: 0.8
    unit: "效率系数"
    bounds: [0.0, 1.0]
    io_role: intermediate
    description: "胆汁分泌功能，0-1"

  cholecystokinin_level:
    type: state
    value: 0.0
    unit: "pg/mL"
    bounds: [0.0, 100.0]
    io_role: intermediate
    description: "胆囊收缩素水平"

  digestive_efficiency:
    type: state
    value: 0.8
    unit: "效率系数"
    bounds: [0.0, 1.0]
    io_role: output
    description: "整体消化效率"

  fatty_acids:
    type: state
    value: 0.0
    unit: "mmol/L"
    bounds: [0.0, 2.0]
    io_role: intermediate
    description: "脂肪酸血浆浓度"

  gastric_carbohydrate:
    type: state
    value: 0
    unit: "克"
    bounds: [0, 500]
    io_role: intermediate
    description: "胃内碳水化合物含量"

  gastric_fat:
    type: state
    value: 0
    unit: "克"
    bounds: [0, 200]
    io_role: intermediate
    description: "胃内脂肪含量"

  gastric_ph:
    type: state
    value: 1.5
    unit: "pH单位"
    bounds: [1.0, 7.0]
    io_role: intermediate
    description: "胃内pH值"

  gastric_protein:
    type: state
    value: 0
    unit: "克"
    bounds: [0, 300]
    io_role: intermediate
    description: "胃内蛋白质含量"

  gastric_ulcer_risk:
    type: state
    value: 0.0
    unit: "风险指数"
    bounds: [0.0, 1.0]
    io_role: output
    description: "胃溃疡风险"

  gastric_volume:
    type: state
    value: 500
    unit: "毫升"
    bounds: [50, 1500]
    io_role: intermediate
    description: "胃容积"

  intestinal_fluid:
    type: state
    value: 200
    unit: "毫升"
    bounds: [100, 1000]
    io_role: intermediate
    description: "小肠液量"

  intestinal_motility:
    type: state
    value: 12
    unit: "次/分钟"
    bounds: [5, 20]
    io_role: intermediate
    description: "小肠蠕动次数/分钟"

  absorption_rate:
    type: state
    value: 70
    unit: "百分比"
    bounds: [70, 90]
    io_role: intermediate
    description: "小肠吸收率"

  residue_protein:
    type: state
    value: 0
    unit: "克"
    bounds: [0, 50]
    io_role: intermediate
    description: "大肠蛋白质残渣"

  residue_glucose:
    type: state
    value: 0
    unit: "克"
    bounds: [0, 50]
    io_role: intermediate
    description: "大肠葡萄糖残渣"

  residue_fats:
    type: state
    value: 0
    unit: "克"
    bounds: [0, 30]
    io_role: intermediate
    description: "大肠脂肪残渣"

  water_absorption:
    type: state
    value: 0
    unit: "毫升"
    bounds: [0, 500]
    io_role: intermediate
    description: "大肠水分吸收量"

  colonic_motility:
    type: state
    value: 8
    unit: "次/分钟"
    bounds: [5, 15]
    io_role: intermediate
    description: "大肠蠕动次数/分钟"

  # 补充一些缺失但被公式使用的变量
  glucose:
    type: state
    value: 0.0
    unit: "mmol/L"
    io_role: intermediate

  pepsin_level:
    type: state
    value: 10.0
    unit: "U/mL"
    io_role: intermediate

  secretin_level:
    type: state
    value: 5.0
    unit: "pg/mL"
    io_role: intermediate

  intestinal_function:
    type: state
    value: 0.9
    unit: "效率"
    io_role: intermediate

  gastric_function:
    type: state
    value: 0.9
    unit: "效率"
    io_role: intermediate

  malnutrition_risk:
    type: state
    value: 0.0
    unit: "风险"
    io_role: output

  nutritional_status:
    type: state
    value: 100
    unit: "评分"
    io_role: output

  body_water:
    type: state
    value: 42000
    unit: "ml"
    io_role: intermediate

  # 注意：blood_glucose 通常由 glucose_regulation 提供，此处若无 import 则需定义或由外部注入
  blood_glucose:
    type: state
    value: 5.0
    unit: "mmol/L"
    io_role: intermediate

formulas:
  gastric_acid_secretion:
    condition: gastric_ph > 2.5 and gastric_protein > 0
    description: "胃酸分泌"
    priority: 3
    dynamics:
      gastric_ph: "max(1.0, gastric_ph - 0.1 * dt)"
  gastric_emptying:
    condition: gastric_volume > 200
    description: "胃排空过程"
    priority: 4
    dynamics:
      gastric_carbohydrate: "max(0, gastric_carbohydrate - gastric_carbohydrate * 0.02 * dt)"
      gastric_fat: "max(0, gastric_fat - gastric_fat * 0.015 * dt)"
      gastric_protein: "max(0, gastric_protein - gastric_protein * 0.025 * dt)"
      gastric_volume: "max(50, gastric_volume - gastric_volume * 0.02 * dt)"
  gastric_ulcer_risk_update:
    condition: gastric_ph < 2.0
    description: "更新胃溃疡风险"
    priority: 6
    dynamics:
      gastric_ulcer_risk: "min(1.0, gastric_ulcer_risk + 0.001 * dt)"
  gastric_function_update:
    condition: gastric_function < 0.7
    description: "胃功能更新"
    priority: 1
    dynamics:
      gastric_function: "max(0.3, gastric_function - 0.02 * dt)"
  cholecystokinin_secretion:
    condition: gastric_fat > 20 or gastric_protein > 30
    description: "脂肪和蛋白质刺激胆囊收缩素分泌"
    priority: 3
    dynamics:
      cholecystokinin_level: "min(100, cholecystokinin_level + (gastric_fat / 20 + gastric_protein / 30) * 5 * dt)"
  bile_secretion:
    condition: cholecystokinin_level > 20
    description: "胆囊收缩素刺激胆汁分泌"
    priority: 4
    dynamics:
      bile_acids: "min(50, bile_acids + cholecystokinin_level * 0.2 * dt)"
      cholecystokinin_level: "max(0, cholecystokinin_level - 5 * dt)"
  fat_digestion:
    condition: bile_acids > 5 and gastric_fat > 0
    description: "胆汁酸辅助脂肪消化"
    priority: 5
    dynamics:
      fatty_acids: "fatty_acids + gastric_fat * bile_function * 0.05 * dt"
      gastric_fat: "max(0, gastric_fat - gastric_fat * bile_function * 0.05 * dt)"
      bile_acids: "max(0, bile_acids - 1 * dt)"
  intestinal_absorption:
    condition: intestinal_function > 0 and (amino_acids > 0 or glucose > 0 or fatty_acids > 0)
    description: "小肠吸收过程"
    priority: 4
    dynamics:
      amino_acids: "max(0, amino_acids - amino_acids * intestinal_function * 0.1 * dt)"
      blood_glucose: "blood_glucose + glucose * intestinal_function * 0.15 * dt"
      fatty_acids: "max(0, fatty_acids - fatty_acids * intestinal_function * 0.08 * dt)"
      glucose: "max(0, glucose - glucose * intestinal_function * 0.15 * dt)"
      residue_protein: "residue_protein + amino_acids * (1 - intestinal_function) * 0.05 * dt"
      residue_glucose: "residue_glucose + glucose * (1 - intestinal_function) * 0.05 * dt"
      residue_fats: "residue_fats + fatty_acids * (1 - intestinal_function) * 0.05 * dt"
  malnutrition_risk_update:
    condition: amino_acids < 1.0 and glucose < 3.0 and fatty_acids < 0.5
    description: "更新营养不良风险"
    priority: 6
    dynamics:
      malnutrition_risk: "min(1.0, malnutrition_risk + 0.005 * dt)"
  nutritional_status_calc:
    description: "营养状态评分"
    dynamics:
      nutritional_status: "min(100, (amino_acids * 20 + glucose) / 2)"
  pepsin_activation:
    condition: gastric_ph < 3.0 and gastric_protein > 0
    description: "胃酸激活胃蛋白酶"
    priority: 2
    dynamics:
      pepsin_level: "min(100, pepsin_level + (3.0 - gastric_ph) * 5 * dt)"
  secretin_secretion:
    condition: gastric_ph < 4.5 and (gastric_carbohydrate > 0 or gastric_fat > 0)
    description: "酸性食糜刺激分泌素分泌"
    priority: 2
    dynamics:
      secretin_level: "min(100, secretin_level + (4.5 - gastric_ph) * 10 * dt)"
  intestinal_motility_update:
    condition: "true"
    description: "小肠蠕动速度更新"
    priority: 2
    dynamics:
      intestinal_motility: "12 + (glucose + fatty_acids) / 100"
  absorption_rate_update:
    condition: "true"
    description: "小肠吸收率更新"
    priority: 2
    dynamics:
      absorption_rate: "min(90, max(70, 70 + 0.1 * (intestinal_fluid - 200)))"
  colonic_motility_update:
    condition: "true"
    description: "大肠蠕动速度更新"
    priority: 2
    dynamics:
      colonic_motility: "8 + (residue_protein + residue_glucose + residue_fats) / 100"
  water_absorption_update:
    condition: water_intake > 0
    description: "大肠水分吸收更新"
    priority: 3
    dynamics:
      water_absorption: "(water_intake / 2) + 0.05 * (residue_protein + residue_glucose + residue_fats)"
      body_water: "body_water + water_absorption * dt"
simulation:
  start_date: "2026-01-01"
  end_date: "2026-01-02"
  output_variables: [gastric_carbohydrate, gastric_protein, gastric_fat, digestive_efficiency, amino_acids, fatty_acids]
