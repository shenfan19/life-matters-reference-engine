metadata:
  name: physiology
  updated: 2026-04-23
  author: Minghui Wu
  description: 肝、胰腺、胃、小肠等器官功能系数及恢复机制
  conflicts: []
  tags:
  - organs
  - function
  step_size:
    value: 1
    unit: minute
imports:
- insulin_system
- glucose_regulation
variables:
  liver_function:
    description: 肝功能系数
    value: 1.0
    unit: 系数
    type: parameter
    bounds:
    - 0.1
    - 1.0
  pancreatic_function:
    description: 胰腺功能系数
    value: 1.0
    unit: 系数
    type: parameter
    bounds:
    - 0.1
    - 1.0
  water:
    description: 喝水
    value: 1.0
    unit: L
    type: input
    bounds:
    - 0.0
    - 1.0
  gastric_function:
    description: 胃功能效率
    value: 0.9
    unit: 系数
    type: state
    bounds:
    - 0.0
    - 1.0
  intestinal_function:
    description: 小肠功能效率
    value: 0.85
    unit: 系数
    type: state
    bounds:
    - 0.0
    - 1.0
  kidney_function:
    description: 肾功能系数
    value: 0.8
    unit: 系数
    type: state
    bounds:
    - 0.0
    - 1.0

  body_water:
    description: Placeholder for body_water
    value: 0.0
    type: state
    unit: unknown
    bounds:
    - 0
    - 100
