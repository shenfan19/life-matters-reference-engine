metadata:
  name: ckd_protein_muscle
  updated: 2026-04-23
  author: TODO:AUTHOR
  description: >
    慢性肾病（CKD）蛋白质摄入 vs 肌肉保持动态模型（场景A4）。
    核心学术案例：低蛋白饮食减缓GFR下降（保护肾功能），但同时导致肌肉萎缩，
    而肌少症反过来加速肾功能恶化——形成恶性循环。
    KDIGO 2020年指南原文明确写道："低蛋白饮食与肌少症风险之间的权衡目前证据不足，
    无法给出统一建议"（Kidney Int Suppl 2021, Section 3.1.3）。
    这是指南委员会自承的学术空白，不可用"临床经验"一句话反驳。
    最优蛋白质摄入时序（分期策略）是真实的未解问题。
    抗质疑强度：⭐⭐⭐⭐⭐
  tags: [nephrology, ckd, protein, muscle, sarcopenia, optimization, physiological, A4]
  references:
  - "KDIGO (2021) KDIGO 2020 CKD Clinical Practice Guideline. Kidney Int Suppl 11(1):1-169. [Section 3.1.3 低蛋白建议与肌少症权衡]"
  - "Klahr S et al. (1994) The effects of dietary protein restriction and blood-pressure control on the progression of CKD (MDRD Study). NEJM 330(13):877-884. [低蛋白可减缓35%GFR下降]"
  - "Kalantar-Zadeh K et al. (2017) Dietary restrictions in dialysis patients. JASN 28(8):2354-2368. [透析患者高蛋白需求]"
  - "Fouque D, Aparicio M (2007) Eleven reasons to control protein intake of patients with CKD. Nat Clin Pract Nephrol 3(7):383-392. [蛋白限制临床依据]"
  - "Carrero JJ et al. (2013) Etiology of the protein-energy wasting syndrome in CKD. J Ren Nutr 23(2):77-90. [CKD蛋白-能量消耗综合征]"

  step_size:
    value: 1
    unit: day
variables:
  # R1: Renal Function
  gfr:
    description: >
      肾小球滤过率（GFR），单位mL/min/1.73m²。
      CKD分期：1期≥90；2期60-89；3期30-59；4期15-29；5期<15。
      模型基线设为CKD 3b期（45 mL/min），代表中度CKD（最需要决策的阶段）。
    value: 45.0
    unit: "mL/min/1.73m²"
    type: state
    bounds: [1.0, 120.0]

  bun:
    description: >
      血尿素氮（BUN），氮质废物积累指标，正常值7-20 mg/dL。
      在CKD中BUN随蛋白摄入增加且随GFR下降而升高，反映尿毒症毒素负担。
      采用稳态近似：BUN ≈ 24.1 × protein_intake × body_weight / GFR。
      系数来源：标准尿素清除率动力学（Daugirdas et al. 2015, Handbook of Dialysis）。
    value: 30.0
    unit: "mg/dL"
    type: state
    bounds: [5.0, 150.0]

  # R2: Muscle Mass
  muscle_mass:
    description: >
      骨骼肌质量（瘦体重），正常成年男性约28-32kg。
      CKD患者因蛋白质限制、代谢性酸中毒、炎症等原因加速肌肉分解（蛋白-能量消耗综合征）。
      基线设为28kg（轻度肌少症起点，符合CKD 3期患者典型值）。
    value: 28.0
    unit: "kg"
    type: state
    bounds: [5.0, 60.0]

  muscle_synthesis_rate:
    description: >
      净肌肉合成速率（正=合成，负=分解）。
      由protein_intake与维持阈值（0.8 g/kg/day）之差决定，CKD晚期额外加速分解。
      来源：Kalantar-Zadeh (2017) 肌少症进展数据。
    value: 0.0
    unit: "g/day"
    type: state
    bounds: [-100.0, 50.0]

  # Parameters
  body_weight:
    description: "体重（kg），用于换算绝对蛋白摄入量（g/day = g/kg/day × body_weight）。"
    value: 70.0
    unit: "kg"
    type: parameter

  gfr_base_decline:
    description: >
      未干预时GFR年下降速率（mL/min/yr）。
      CKD 3期平均值约3 mL/min/yr（来源：MDRD Study 10年随访数据）。
      高血压/糖尿病合并时可达5-7 mL/min/yr。
    value: 3.0
    unit: "mL/min/yr"
    type: parameter
    bounds: [1.0, 10.0]

  # P1: Input — Daily Protein Intake
  protein_intake:
    description: >
      每日蛋白质摄入量（g/kg/day）。
      KDIGO 2020建议（非透析CKD 3-5期）：0.6-0.8 g/kg/day。
      低于0.6 → 氮平衡负值，肌肉净分解加速。
      高于0.8 → 含氮废物增多，GFR下降加速。
      透析患者需要 ≥1.2 g/kg/day（与非透析患者建议相反，核心冲突所在）。
      最优值区间因个体CKD分期、肌肉质量、透析状态而异——KDIGO自承无统一建议。
    value: 0.8
    unit: "g/kg/day"
    type: input
    bounds: [0.3, 2.0]

formulas:
  # F1: GFR Decline Dynamics
  # MDRD研究：低蛋白（0.6 g/kg/d）vs 正常蛋白（1.2 g/kg/d）→ 35%减缓GFR下降
  # 线性插值：protein_modifier = 0.65（0.6g/kg/d）→ 1.0（1.2g/kg/d）
  # 完整公式：decline/day = (年速率/365) × modifier
  gfr_decline:
    description: >
      GFR日下降动力学。
      protein_modifier范围：0.6g/kg/d→0.65（35%减缓），1.2g/kg/d→1.0（无减缓），线性插值。
      来源：MDRD Study (Klahr 1994)。
    condition: gfr > 2.0
    dynamics:
      gfr: "gfr - (gfr_base_decline / 365.0) * (0.65 + 0.35 * min(1.0, max(0.0, (protein_intake - 0.6) / 0.6))) * step"
    priority: 7

  # F2: BUN Steady-State Approximation
  # BUN ≈ 24.1 × protein_intake × body_weight / GFR
  # 系数推导：70kg体重，0.8g/kg/d蛋白，GFR=90 → BUN≈15 mg/dL（正常上限）
  # 标准参考：Daugirdas JT et al. (2015) Handbook of Dialysis, 5th Ed.
  bun_calc:
    description: >
      BUN稳态近似（尿素清除率动力学）。
      系数24.1由标准参考点校准：70kg, 0.8g/kg/d, GFR=90 → BUN=15 mg/dL。
      来源：Daugirdas et al. (2015)。
    condition: true
    dynamics:
      bun: "min(150.0, 24.1 * protein_intake * body_weight / max(5.0, gfr))"
    priority: 5

  # F3: Muscle Mass Dynamics
  # 净合成速率 = (protein_intake - 0.8) × 合成系数 × body_weight
  # 合成系数 0.05: 每偏离0.1 g/kg/day，净合成±0.005 kg/day（即±1.8 kg/yr，符合临床观测）
  # CKD晚期（GFR<30）额外加速分解：代谢性酸中毒、炎症介质增加蛋白分解
  # 来源：Carrero et al. (2013) 蛋白-能量消耗综合征数据
  muscle_dynamics:
    description: >
      骨骼肌净合成动力学。
      net_rate = (protein_intake - 0.8) × 0.05 - CKD晚期额外分解因子。
      晚期CKD（GFR<30）因代谢性酸中毒额外增加分解：+0.003 kg/day。
      来源：Carrero et al. (2013)。
    condition: true
    dynamics:
      muscle_mass: "muscle_mass + ((protein_intake - 0.8) * 0.05 - max(0.0, (30.0 - gfr) / 30.0) * 0.003) * step"
      muscle_synthesis_rate: "(protein_intake - 0.8) * 0.05 * body_weight - max(0.0, (30.0 - gfr) / 30.0) * 0.3"
    priority: 5

simulation:
  start_date: "2026-01-01"
  end_date: "2026-12-31"
  output_variables: [gfr, muscle_mass, bun, protein_intake, muscle_synthesis_rate]
optimizer:
  method: grid
  duration: 120.0
  targets_of_optimization: [muscle_mass]
  variables_to_optimize: [protein_intake]
  # 优化目标：在365天内，寻找使肌肉质量最大化同时GFR不跌破阈值（BUN不超80）的蛋白摄入策略。
  # 约束（需在Story层配置）：
  #   - gfr 不低于 30（避免进入CKD 4期）
  #   - bun 不超过 80 mg/dL
  # Pareto前沿：muscle_mass vs gfr（不同CKD分期的权衡曲线）
