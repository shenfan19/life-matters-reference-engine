category: social
metadata:
  name: fr1815_fr_jean_valjean
  author: Fan Shen
  description:
    brief: 冉·阿让：苦役之后的人。冉·阿让因偷一块面包被判五年苦役，屡次逃跑变成十九年。 出狱后：没有人愿意收留一个前囚犯。 直到一个主教给了他银烛台，并说：我用这些买下了你的灵魂。 他选择成为另一种人。但贾维尔警探永远不会停下来。
    problem: 在该情境中，需要平衡 践行善行强度、隐藏身份、自我照料 对生存、目标进展或长期代价的影响。
    method: 包含 3 个可调输入、4 个状态变量和 4 个方程，将叙事冲突转化为可运行的动态系统。
    simulation: 默认仿真长度为 216 个 month，用于比较不同输入策略下的轨迹。
    optimization: 包含优化配置，包含优化目标，用于搜索可行的干预或参数组合。
    result: 预期用于比较不同策略在主要目标和约束之间的取舍。
    limitations: 当前仍是草案或 TODO 文件，参数、目标和叙事细节需要后续校准。
  ratings:
    research_demand: 4 - 冉·阿让是文学史上最著名的救赎叙事，司法不公与道德重生有深刻社会意义
    evidence_quality: 1 - TODO草案，参数未完善，且为文学设定
    innovation: 2 - 将善行-隐藏身份-自我照料的三角权衡转化为动力学意图清晰，但尚未完善
    social_value: 5 - 《悲惨世界》是探讨社会正义和人性救赎的世界级经典，社会价值极高
  tags:
  - justice
  - redemption
  - labor-injury
  - aging
  - identity
  - literature
  references:
  - 悲惨世界 (Victor Hugo, 1862)
  step_size:
    value: 1
    unit: month
variables:
  virtue_effort:
    type: input
    value: 1.5
    unit: intensity
    bounds:
    - 0
    - 2
    description: 践行善行强度：用行动救助他人、回报社会的努力
    reference: TODO:SOURCE
  concealment:
    type: input
    value: 0.7
    unit: ratio
    bounds:
    - 0
    - 1
    description: 隐藏身份：掩盖前囚犯身份以在社会中生存
    reference: TODO:SOURCE
  self_care:
    type: input
    value: 0.3
    unit: intensity
    bounds:
    - 0
    - 1
    description: 自我照料：注意身体恢复，减少苦役后遗症的进展
    reference: TODO:SOURCE
  physical_health:
    type: state
    value: 60
    unit: hp
    bounds:
    - 0
    - 100
    description: 身体状态：19年苦役的长期损伤与老化的综合健康
    reference: TODO:SOURCE
    io_role: output
  redemption_progress:
    type: state
    value: 5
    unit: score
    bounds:
    - 0
    - 100
    description: 救赎进度：用善行弥补过去的积累
    reference: TODO:SOURCE
    io_role: output
  javert_pursuit:
    type: state
    value: 15
    unit: score
    bounds:
    - 0
    - 100
    description: 贾维尔的追踪：警察对他身份和下落的掌握程度
    reference: TODO:SOURCE
    io_role: output
  community_trust:
    type: state
    value: 5
    unit: score
    bounds:
    - 0
    - 100
    description: 社区信任：在新身份下建立的社会信任资本
    reference: TODO:SOURCE
    io_role: output
formulas:
  health_decay:
    formula:
      physical_health: max(0, physical_health - (0.8) - (virtue_effort * 0.6) + (self_care * 1.5))
    description: 苦役后遗症不可逆；善行消耗体力；自我照料可减缓
    reference: TODO:SOURCE
  redemption_growth:
    formula:
      redemption_progress: min(100, redemption_progress + virtue_effort * 2.5)
    description: 善行积累救赎
    reference: TODO:SOURCE
  javert_tracking:
    formula:
      javert_pursuit: min(100, max(0, javert_pursuit + (0.5) + (virtue_effort * 0.3) - (concealment * 1.5)))
    description: 隐藏身份减缓追踪；善行的曝光度反而可能泄露线索
    reference: TODO:SOURCE
  trust_growth:
    formula:
      community_trust: min(100, community_trust + (virtue_effort * 1.5) + (concealment * 0.8))
    description: 社区信任随善行和稳定身份积累
    reference: TODO:SOURCE
simulation:
  start_date: '1815-01-01'
  end_date: '1832-12-31'
  output_types:
  - input
  - state
optimizer:
  method: nsga2
  objectives:
  - variable: redemption_progress
    metric: final
    direction: maximize
  - variable: community_trust
    metric: final
    direction: maximize
  schedules:
  - variable: virtue_effort
    time: 09:00
    days:
    - Mon
    - Tue
    - Wed
    - Thu
    - Fri
    - Sat
    - Sun
    label: 践行善行强度
    optimize:
      value:
      - 0
      - 2
  - variable: concealment
    time: 09:00
    days:
    - Mon
    - Tue
    - Wed
    - Thu
    - Fri
    - Sat
    - Sun
    label: 隐藏身份
    optimize:
      value:
      - 0
      - 1
  - variable: self_care
    time: 09:00
    days:
    - Mon
    - Tue
    - Wed
    - Thu
    - Fri
    - Sat
    - Sun
    label: 自我照料
    optimize:
      value:
      - 0
      - 1
  algorithm:
    population_size: 50
    n_generations: 80
    seed: 42
