category: social
metadata:
  name: af1943_fr_little_prince
  author: Fan Shen
  description:
    brief: 小王子：沙漠中的告别。一个飞行员的飞机在撒哈拉沙漠迫降。他遇见了一个小男孩——从另一颗星球来的王子。 他们交谈了八天。 小王子说：我的玫瑰，我必须回去了。 他不会飞，只有一种方式能回去。 这个模拟的问题是：飞行员能不能给小王子另一个选择。
    problem: 在该情境中，需要平衡 修飞机努力、真正聆听小王子、说服小王子留下 对生存、目标进展或长期代价的影响。
    method: 包含 3 个可调输入、4 个状态变量和 4 个方程，将叙事冲突转化为可运行的动态系统。
    simulation: 默认仿真长度为 8 个 day，用于比较不同输入策略下的轨迹。
    optimization: 包含优化配置，包含优化目标，用于搜索可行的干预或参数组合。
    result: 预期用于比较不同策略在主要目标和约束之间的取舍。
    limitations: 当前仍是草案或 TODO 文件，参数、目标和叙事细节需要后续校准。
  ratings:
    topic_importance: 4 - 小王子是最广泛阅读的文学作品之一，沙漠生存+哲学对话有独特展示价值
    framework_demand: 1 - TODO存根，尚未被其他模型引用
    evidence_quality: 1 - TODO草案，参数未实现，且为文学设定
    innovation: 2 - 将叙事选择（聆听vs修飞机）转化为可优化动力学意图存在，但尚未实现
    social_value: 5 - 触及人与人之间联系、意义和告别的普世主题，文学价值极高
  tags:
  - desert
  - meaning
  - connection
  - loss
  - philosophy
  - literature
  references:
  - Le Petit Prince (Antoine de Saint-Exupéry, 1943)
  step_size:
    value: 1
    unit: day
variables:
  repair_effort:
    type: input
    value: 1.5
    unit: intensity
    bounds:
    - 0
    - 3
    description: 修飞机努力：飞行员修复发动机的专注程度（关系到他自己的生存）
    reference: TODO:SOURCE
  listening_depth:
    type: input
    value: 0.5
    unit: intensity
    bounds:
    - 0
    - 1
    description: 真正聆听小王子：放下大人视角，真正理解小王子说的话
    reference: TODO:SOURCE
  persuasion_attempt:
    type: input
    value: 0.3
    unit: intensity
    bounds:
    - 0
    - 1
    description: 说服小王子留下：尝试说服小王子不要回去（留在地球）
    reference: TODO:SOURCE
  pilot_survival:
    type: state
    value: 40
    unit: score
    bounds:
    - 0
    - 100
    description: 飞行员生存概率：在沙漠中的水和飞机修复进度（低=必死）
    reference: TODO:SOURCE
    io_role: output
  understanding:
    type: state
    value: 10
    unit: score
    bounds:
    - 0
    - 100
    description: 真正理解：飞行员对小王子所说重要之物的真实理解程度
    reference: TODO:SOURCE
    io_role: output
  prince_resolve:
    type: state
    value: 70
    unit: score
    bounds:
    - 0
    - 100
    description: 小王子的回家意志：小王子对回到玫瑰身边的决心（高=不可动摇）
    reference: TODO:SOURCE
    io_role: output
  connection_depth:
    type: state
    value: 5
    unit: score
    bounds:
    - 0
    - 100
    description: 连接的深度：两人之间真实的理解与连接（这才是故事真正的遗产）
    reference: TODO:SOURCE
    io_role: output
formulas:
  survival_progress:
    formula:
      pilot_survival: min(100, max(0, pilot_survival + repair_effort * 8.0 - 5.0))
    description: 修复飞机+减少水消耗
    reference: TODO:SOURCE
  understanding_growth:
    formula:
      understanding: min(100, max(0, understanding + (listening_depth * 12.0) - (persuasion_attempt * 4.0)))
    description: 真正聆听带来理解；急于说服反而阻断理解
    reference: TODO:SOURCE
  prince_resolve_change:
    formula:
      prince_resolve: min(100, max(0, prince_resolve + (persuasion_attempt * 3.0) - ((understanding / 100) * 2.0)))
    description: 说服尝试反而强化他的意志（越被阻止越坚定）
    reference: TODO:SOURCE
  connection_growth:
    formula:
      connection_depth: min(100, connection_depth + listening_depth * 10.0 + (1 - persuasion_attempt) * 3.0)
    description: 连接随聆听和共同时间积累；是故事留下的唯一真实
    reference: TODO:SOURCE
simulation:
  start_date: '1943-05-01'
  end_date: '1943-05-08'
  output_types:
  - input
  - state
optimizer:
  method: nsga2
  objectives:
  - variable: connection_depth
    metric: final
    direction: maximize
  - variable: understanding
    metric: final
    direction: maximize
  schedules:
  - variable: repair_effort
    time: 09:00
    days:
    - Mon
    - Tue
    - Wed
    - Thu
    - Fri
    - Sat
    - Sun
    label: 修飞机努力
    optimize:
      value:
      - 0
      - 3
  - variable: listening_depth
    time: 09:00
    days:
    - Mon
    - Tue
    - Wed
    - Thu
    - Fri
    - Sat
    - Sun
    label: 真正聆听小王子
    optimize:
      value:
      - 0
      - 1
  - variable: persuasion_attempt
    time: 09:00
    days:
    - Mon
    - Tue
    - Wed
    - Thu
    - Fri
    - Sat
    - Sun
    label: 说服小王子留下
    optimize:
      value:
      - 0
      - 1
  algorithm:
    population_size: 50
    n_generations: 80
    seed: 42
