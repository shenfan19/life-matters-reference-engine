category: social
metadata:
  name: uk1886_uk_dr_jekyll
  author: Fan Shen
  description:
    brief: 杰基尔博士：失控的实验。亨利·杰基尔博士，维多利亚社会的体面绅士，秘密研发出一种药物， 能够让他暂时变成另一个人——海德先生，那个被压抑的阴暗面。 起初他能自由切换。后来需要药物才能变回来。 再后来，他在睡梦中就开始变化了。
      这是一个关于：成瘾是如何从控制变为被控制的模拟。
    problem: 在该情境中，需要平衡 药物使用频率、科学研究严谨度、维持社会形象 对生存、目标进展或长期代价的影响。
    method: 包含 3 个可调输入、5 个状态变量和 5 个方程，将叙事冲突转化为可运行的动态系统。
    simulation: 默认仿真长度为 52 个 week，用于比较不同输入策略下的轨迹。
    optimization: 包含优化配置，包含优化目标，用于搜索可行的干预或参数组合。
    result: 预期用于比较不同策略在主要目标和约束之间的取舍。
    limitations: 当前仍是草案或 TODO 文件，参数、目标和叙事细节需要后续校准。
  tags:
  - addiction
  - self-experimentation
  - dual-personality
  - ethics
  - literature
  references:
  - Strange Case of Dr Jekyll and Mr Hyde (R.L. Stevenson, 1886)
  step_size:
    value: 1
    unit: week
variables:
  drug_usage_frequency:
    type: input
    value: 1.0
    unit: times_per_week
    bounds:
    - 0
    - 5
    description: 药物使用频率：每周使用变身药物的次数（越高→Hyde停留时间越长）
    reference: TODO:SOURCE
  research_rigor:
    type: input
    value: 0.5
    unit: intensity
    bounds:
    - 0
    - 1
    description: 科学研究严谨度：分析药物机制·寻找解药的努力
    reference: TODO:SOURCE
  social_facade:
    type: input
    value: 0.7
    unit: intensity
    bounds:
    - 0
    - 1
    description: 维持社会形象：以Jekyll身份维持绅士形象，掩盖Hyde的行为
    reference: TODO:SOURCE
  self_control:
    type: state
    value: 90
    unit: score
    bounds:
    - 0
    - 100
    description: 自我控制力：Jekyll保持主导意识的能力（降至0=完全被Hyde接管）
    reference: TODO:SOURCE
    io_role: output
  hyde_dominance:
    type: state
    value: 5
    unit: score
    bounds:
    - 0
    - 100
    description: Hyde人格强度：阴暗面人格对身体的控制程度
    reference: TODO:SOURCE
    io_role: output
  drug_dependency:
    type: state
    value: 0
    unit: score
    bounds:
    - 0
    - 100
    description: 药物依赖度：需要越来越多剂量才能维持同等效果的成瘾进展
    reference: TODO:SOURCE
    io_role: output
  social_exposure_risk:
    type: state
    value: 5
    unit: score
    bounds:
    - 0
    - 100
    description: 社会曝光风险：Hyde的行为被追查到Jekyll的风险
    reference: TODO:SOURCE
    io_role: output
  antidote_progress:
    type: state
    value: 0
    unit: score
    bounds:
    - 0
    - 100
    description: 解药研究进度：找到永久控制Hyde的科学方案的进度
    reference: TODO:SOURCE
    io_role: output
formulas:
  dependency_growth:
    formula:
      drug_dependency: min(100, drug_dependency + (drug_usage_frequency * 2.5))
    description: 成瘾性随使用频率指数增长
    reference: TODO:SOURCE
  self_control_decay:
    formula:
      self_control: max(0, min(100, self_control - ((drug_dependency / 100) * 3.0) - ((hyde_dominance / 100) * 2.0) + (research_rigor
        * 1.5)))
    description: 自我控制力随依赖度和Hyde强度消耗
    reference: TODO:SOURCE
  hyde_growth:
    formula:
      hyde_dominance: min(100, max(0, hyde_dominance + (drug_usage_frequency * 1.5 + (drug_dependency / 100) * 2.0) - (self_control
        / 100 * 1.0)))
    description: Hyde人格随使用次数和依赖度增强
    reference: TODO:SOURCE
  exposure_risk:
    formula:
      social_exposure_risk: min(100, max(0, social_exposure_risk + ((hyde_dominance / 100) * 3.0) - (social_facade * 1.5)))
    description: 曝光风险随Hyde强度增长，facade维持可延缓
    reference: TODO:SOURCE
  antidote_research:
    formula:
      antidote_progress: min(100, antidote_progress + (research_rigor * (self_control / 100)) * 3.0)
    description: 解药研究进度随科研努力推进，但self_control降低则研究效率下降
    reference: TODO:SOURCE
simulation:
  start_date: '1886-01-01'
  end_date: '1886-12-30'
  output_types:
  - input
  - state
optimizer:
  method: nsga2
  objectives:
  - variable: self_control
    metric: final
    direction: maximize
  - variable: antidote_progress
    metric: final
    direction: maximize
  schedules:
  - variable: drug_usage_frequency
    time: 09:00
    days:
    - Mon
    - Tue
    - Wed
    - Thu
    - Fri
    - Sat
    - Sun
    label: 药物使用频率
    optimize:
      value:
      - 0
      - 5
  - variable: research_rigor
    time: 09:00
    days:
    - Mon
    - Tue
    - Wed
    - Thu
    - Fri
    - Sat
    - Sun
    label: 科学研究严谨度
    optimize:
      value:
      - 0
      - 1
  - variable: social_facade
    time: 09:00
    days:
    - Mon
    - Tue
    - Wed
    - Thu
    - Fri
    - Sat
    - Sun
    label: 维持社会形象
    optimize:
      value:
      - 0
      - 1
  algorithm:
    population_size: 50
    n_generations: 80
    seed: 42
