metadata:
  name: ad1666_uk_issac_newton
  updated: 2026-04-23
  author: Fan Shen
  description: >
    牛顿奇迹年仿真/优化场景（1665-1667，伍尔斯索普庄园）。
    sim模式：按牛顿典型一天的历史作息运行（1440分钟 = 24小时）。
    opt模式：在1665年英国约束条件下搜索最优作息——
    怎样分配饮食、研究强度、户外时间，在保持健康的同时最大化科学洞见？
  tags: [historical, newton, cognition, nutrition, 17th-century, england]
  period: "1665-1667"
  location: "Woolsthorpe Manor, Lincolnshire, England"
  science_note: >
    基于认知负荷理论（Sweller 1988）与历史传记（Westfall 1980）。
    洞见公式：insight_gain = study_intensity × max(0.2, 1−fatigue/120) × max(0.4, nutrition/80)。
    疲劳和营养共同调制研究效率，与牛顿沉浸研究忘记进食的历史记录吻合。
    步长=1分钟，总时长=1440分钟（1天）。食物变量为摄入速率（g/min 或 ml/min）。

# ── 变量定义（完全内联，无需导入模型文件）────────────────────────────────────────
  step_size:
    value: 1
    unit: minute
variables:
  # 饮食摄入输入（每次摄入量，由 schedules 驱动；仿真引擎按步长累积）
  bread_intake:
    type: input
    value: 120.0
    unit: "g"
    bounds: [0, 300]
    description: "黑麦/大麦混合面包每餐摄入量（主食，250kcal/120g）"

  pottage_intake:
    type: input
    value: 200.0
    unit: "g"
    bounds: [0, 500]
    description: "浓粥汤每餐摄入量（谷物+根菜炖煮，营养全面，1kcal/g）"

  ale_intake:
    type: input
    value: 300.0
    unit: "ml"
    bounds: [0, 800]
    description: "小啤酒每次摄入量（鼠疫时期代替生水，低酒精，0.6kcal/ml）"

  meat_intake:
    type: input
    value: 50.0
    unit: "g"
    bounds: [0, 150]
    description: "咸猪肉/培根每餐摄入量（高蛋白，价格较贵，2.5kcal/g）"

  cheese_intake:
    type: input
    value: 30.0
    unit: "g"
    bounds: [0, 100]
    description: "农家奶酪每餐摄入量（热量密集，保存方便，3kcal/g）"

  apple_intake:
    type: input
    value: 100.0
    unit: "g"
    bounds: [0, 250]
    description: "苹果每次摄入量（庄园自产免费，维生素C来源，0.53kcal/g）"

  # ── parameter：模型系数（MC采样用）────────────────────────────────────────────
  cognitive_efficiency:
    type: parameter
    value: "normal(1.0, 0.5)"
    unit: "系数"
    bounds: [0.5, 1.5]
    description: "认知效率个体差异（MC仿真：均值1.0，标准差0.15，代表不同平行世界的牛顿）"

  plague_susceptibility:
    type: parameter
    value: "normal(1.0, 0.25)"
    unit: "系数"
    bounds: [0.3, 2.0]
    description: "鼠疫易感性个体差异（MC仿真：均值1.0，标准差0.25，高值更易受1665年大瘟疫影响）"

  # 行为输入（强度/系数，schedules 驱动，非速率）
  study_intensity:
    type: input
    value: 0.0
    unit: "强度"
    bounds: [0.0, 3.0]
    description: "研究强度：0=休息/农务, 1=轻度阅读, 2=集中推导, 3=深度实验（棱镜）"

  candle_study:
    type: input
    value: 0.0
    unit: "强度"
    bounds: [0.0, 4.0]
    description: "烛光工作强度（等效小时系数；主要眼部疲劳来源）"

  outdoor_time:
    type: input
    value: 0.0
    unit: "强度"
    bounds: [0.0, 4.0]
    description: "户外活动强度（等效小时系数；苹果园散步，恢复疲劳）"

  sleep_quality:
    type: input
    value: 0.0
    unit: "系数"
    bounds: [0.0, 1.0]
    description: "睡眠质量系数（0=失眠, 1=良好；睡眠时段激活）"

  # 营养累积量（每日统计，初始为0）
  calories_today:
    type: state
    value: 0.0
    unit: "kcal"
    bounds: [0, 4000]
    description: "今日已摄入总热量（目标1800-2200 kcal/天）"

  protein_today:
    type: state
    value: 0.0
    unit: "g"
    bounds: [0, 200]
    description: "今日蛋白质摄入（目标50-70 g/天）"

  vitamin_score:
    type: state
    value: 45.0
    unit: "分"
    bounds: [0, 100]
    description: "维生素/微量元素评分（果蔬补充；自然衰减约4分/天）"

  # 核心生理状态（初始值基于历史记录）
  nutrition:
    type: state
    value: 60.0
    unit: "分"
    bounds: [0, 100]
    io_role: output
    description: "综合营养状态（<30触发健康损耗；受各类食物驱动）"

  hydration:
    type: state
    value: 65.0
    unit: "分"
    bounds: [0, 100]
    io_role: output
    description: "水分状态（<25触发认知/健康惩罚；主要由ale补充）"

  health:
    type: state
    value: 85.0
    unit: "分"
    bounds: [0, 100]
    io_role: output
    description: "身体健康（鼠疫、营养不良、过劳的综合体现）"

  fatigue:
    type: state
    value: 25.0
    unit: "分"
    bounds: [0, 100]
    io_role: output
    description: "心智疲劳（>70时洞见效率显著下降；睡眠和户外恢复）"

  eye_strain:
    type: state
    value: 10.0
    unit: "分"
    bounds: [0, 100]
    io_role: output
    description: "眼部疲劳（烛光+棱镜实验累积；>60时损害健康和效率）"

  insight:
    type: state
    value: 5.0
    unit: "分"
    bounds: [0, 100]
    io_role: output
    description: "科学洞见积累（目标100=完成奇迹年核心发现）"

  plague_risk:
    type: state
    value: 15.0
    unit: "分"
    bounds: [0, 100]
    description: "鼠疫感染风险（伍尔斯索普比剑桥低但不为零；户外轻降）"

# ── 基线作息时间表（schedules，sim直接使用；opt以此为搜索起点）─────────────────
# 基于 Westfall (1980) 传记记录的牛顿典型日，简化为：
#   进食3次（早07:00 / 午12:00 / 晚19:00），研究2块（上午 / 下午+晚）
# 时间点单位：秒（引擎内部时间始终为秒）
# 食物变量为摄入速率（g/min 或 ml/min），进餐窗口60分钟内非零
#   早餐：07:00-08:00 (25200-28800)  bread+cheese+ale
#   午餐：12:00-13:00 (43200-46800)  bread+pottage+ale（主餐）
#   晚餐：19:00-20:00 (68400-72000)  pottage+ale（苹果园后回来，轻餐）
schedules:
  bread_intake:
    interpolation: step
    points:
    - {time: 25200, value: 2.0}       # 07:00 早餐：120g / 60min = 2.0 g/min
    - {time: 28800, value: 0}
    - {time: 43200, value: 1.0}       # 12:00 午餐：60g / 60min = 1.0 g/min
    - {time: 46800, value: 0}

  pottage_intake:
    interpolation: step
    points:
    - {time: 43200, value: 5.0}       # 12:00 午餐：300g / 60min = 5.0 g/min（主餐）
    - {time: 46800, value: 0}
    - {time: 68400, value: 3.3}       # 19:00 晚餐：200g / 60min ≈ 3.3 g/min
    - {time: 72000, value: 0}

  ale_intake:
    interpolation: step
    points:
    - {time: 25200, value: 4.2}       # 07:00 早餐：250ml / 60min ≈ 4.2 ml/min
    - {time: 28800, value: 0}
    - {time: 43200, value: 4.2}       # 12:00 午餐：250ml / 60min
    - {time: 46800, value: 0}
    - {time: 68400, value: 4.2}       # 19:00 晚餐：250ml / 60min
    - {time: 72000, value: 0}

  cheese_intake:
    interpolation: step
    points:
    - {time: 25200, value: 0.67}      # 07:00 早餐：40g / 60min ≈ 0.67 g/min
    - {time: 28800, value: 0}

  apple_intake:
    interpolation: step
    points:
    - {time: 50400, value: 2.5}       # 14:00 苹果园：150g / 60min = 2.5 g/min
    - {time: 54000, value: 0}

  # 研究分为2块：上午（09:00-12:00）和下午（14:00-22:00 含棱镜+写作）
  # 14:00-16:00 同时有 outdoor_time（苹果园），两者共存，户外沉思 study_intensity=1
  study_intensity:
    interpolation: step
    points:
    - {time: 0, value: 0}             # 00:00-09:00 睡眠+早晨准备
    - {time: 32400, value: 2}         # 09:00 上午研究（微积分，集中推导）
    - {time: 43200, value: 0}         # 12:00 午餐休息
    - {time: 50400, value: 1}         # 14:00 苹果园沉思（散步中思考引力）
    - {time: 57600, value: 3}         # 16:00 下午实验（棱镜分光，高强度）
    - {time: 68400, value: 0}         # 19:00 晚餐休息
    - {time: 72000, value: 2}         # 20:00 烛光写作（整理推导）
    - {time: 79200, value: 0}         # 22:00 就寝
    - {time: 86400, value: 0}

  candle_study:
    interpolation: step
    points:
    - {time: 72000, value: 2}         # 20:00-22:00 烛光写作（眼部疲劳来源）
    - {time: 79200, value: 0}

  outdoor_time:
    interpolation: step
    points:
    - {time: 50400, value: 2}         # 14:00-16:00 苹果园散步（帕累托改进点）
    - {time: 57600, value: 0}

  sleep_quality:
    interpolation: step
    points:
    - {time: 0, value: 0.75}          # 00:00-09:00 夜间睡眠（乡间安静）
    - {time: 32400, value: 0}         # 09:00 起床入书房
    - {time: 79200, value: 0.75}      # 22:00 入睡
    - {time: 86400, value: 0.75}

# ── 仿真配置 ──────────────────────────────────────────────────────────────────
simulation:
  start_date: "1666-09-01"
  end_date: "1666-09-02"
  output_variables:
  - health
  - fatigue
  - insight
  - nutrition
  - hydration
  - eye_strain
  - calories_today
  - protein_today
  - vitamin_score
  - study_intensity
  - candle_study
  - plague_risk
# ── 核心动力学公式（完全内联）────────────────────────────────────────────────
# 重要：公式计算结果为变量的新值（非增量），step_size=1（分钟）
formulas:

  # 1. 面包消化
  # 30分钟窗口 × 4g/min × 0.08 = 9.6 nutrition（相当于单次进餐效果）
  bread_eaten:
    description: "黑麦面包消化：碳水化合物和能量，蛋白质有限"
    condition: bread_intake > 0
    priority: 10
    dynamics:
      calories_today: "calories_today + bread_intake * 2.1"
      protein_today: "protein_today + bread_intake * 0.059"
      nutrition: "min(100, nutrition + bread_intake * 0.08)"

  # 2. 浓粥汤消化
  # 30分钟 × 10g/min × 0.12 = 36 nutrition（午餐主食，效果显著）
  pottage_eaten:
    description: "浓粥汤消化：谷物+根菜，营养全面，1665年英国最佳日常食物"
    condition: pottage_intake > 0
    priority: 10
    dynamics:
      calories_today: "calories_today + pottage_intake * 1.0"
      protein_today: "protein_today + pottage_intake * 0.027"
      vitamin_score: "min(100, vitamin_score + pottage_intake * 0.05)"
      nutrition: "min(100, nutrition + pottage_intake * 0.12)"
      hydration: "min(100, hydration + pottage_intake * 0.05)"

  # 3. 小啤酒饮用
  # 主要补水效果；ale_intake = ml/min
  ale_drunk:
    description: "小啤酒：鼠疫时期主要安全液体，低酒精，补充水分和热量"
    condition: ale_intake > 0
    priority: 10
    dynamics:
      calories_today: "calories_today + ale_intake * 0.6"
      hydration: "min(100, hydration + ale_intake * 0.08)"
      nutrition: "min(100, nutrition + ale_intake * 0.02)"

  # 4. 咸猪肉消化（基线无肉，opt可发现其价值）
  meat_eaten:
    description: "咸猪肉/培根：高蛋白高脂肪，体力补充，价格较贵（3便士/100g）"
    condition: meat_intake > 0
    priority: 10
    dynamics:
      calories_today: "calories_today + meat_intake * 2.5"
      protein_today: "protein_today + meat_intake * 0.22"
      nutrition: "min(100, nutrition + meat_intake * 0.18)"

  # 5. 奶酪消化
  cheese_eaten:
    description: "农家奶酪：热量密集，蛋白质和脂肪，携带方便"
    condition: cheese_intake > 0
    priority: 10
    dynamics:
      calories_today: "calories_today + cheese_intake * 3.0"
      protein_today: "protein_today + cheese_intake * 0.2"
      nutrition: "min(100, nutrition + cheese_intake * 0.15)"

  # 6. 苹果消化（庄园自产，免费）
  apple_eaten:
    description: "苹果：伍尔斯索普庄园特产，维生素C来源，防坏血病"
    condition: apple_intake > 0
    priority: 10
    dynamics:
      calories_today: "calories_today + apple_intake * 0.53"
      vitamin_score: "min(100, vitamin_score + apple_intake * 0.15)"
      nutrition: "min(100, nutrition + apple_intake * 0.06)"

  # 7. 自然消耗（每分钟持续）
  # nutrition: -0.010/min × 1440 ≈ -14.4/天；靠进餐补偿
  # hydration: -0.008/min × 1440 ≈ -11.5/天
  # vitamin_score: -0.003/min × 1440 ≈ -4.3/天
  natural_decay:
    description: "营养、水分和维生素的持续身体代谢消耗"
    condition: true
    priority: 5
    dynamics:
      nutrition: "max(0, nutrition - 0.010)"
      hydration: "max(0, hydration - 0.008)"
      vitamin_score: "max(0, vitamin_score - 0.003)"

  # 8. 研究产生洞见（核心公式）
  # 效率调制：fatigue/120 和 nutrition/80 双重衰减
  # 典型值：强度2，fatigue=30，nutrition=60
  #   gain/min = 2 × max(0.2, 1-30/120) × max(0.4, 60/80) × 0.069
  #            = 2 × 0.75 × 0.75 × 0.069 = 0.0776/min
  # 3小时（180步）× 0.0776 = 14.0 insight
  # 全天最优估计：~25-35 insight（对应"奇迹年"级别产出）
  insight_gain:
    description: "研究产生洞见：强度×效率（疲劳和营养共同调制），同步积累疲劳"
    condition: study_intensity > 0
    priority: 10
    dynamics:
      insight: "min(100, insight + study_intensity * 0.069 * cognitive_efficiency * max(0.2, 1 - fatigue / 120) * max(0.4, nutrition / 80))"
      fatigue: "min(100, fatigue + study_intensity * 0.036)"

  # 9. 睡眠恢复（夜间：0:00-6:00 和 22:00-24:00）
  # 8小时 × 480步：fatigue恢复 = 0.75 × 0.111 × 480 ≈ 40分
  # 从白天峰值~65回到次日初始~25
  sleep_recovery:
    description: "夜间睡眠恢复疲劳和眼部疲劳，微量恢复健康"
    condition: sleep_quality > 0
    priority: 6
    dynamics:
      fatigue: "max(0, fatigue - sleep_quality * 0.111)"
      eye_strain: "max(0, eye_strain - sleep_quality * 0.042)"
      health: "min(100, health + sleep_quality * 0.004)"

  # 10. 户外活动恢复（14:00-16:00 苹果园）
  # 2小时窗口：120步 × outdoor_time=2 × 0.0625 = 15 fatigue 恢复
  # 这是帕累托改进点：休息后效率提升 > 持续高强度研究
  outdoor_recovery:
    description: "户外活动（苹果园散步）：恢复疲劳和眼部疲劳，微降鼠疫风险"
    condition: outdoor_time > 0
    priority: 9
    dynamics:
      fatigue: "max(0, fatigue - outdoor_time * 0.0625)"
      eye_strain: "max(0, eye_strain - outdoor_time * 0.042)"
      plague_risk: "max(5, plague_risk - outdoor_time * 0.0042)"

  # 11. 烛光工作积累眼部疲劳（20:00-22:00）
  # 2小时：120步 × 2 × 0.125 = 30 eye_strain 积累
  # 牛顿确有因棱镜实验损伤视力的历史记录
  candle_eye_strain:
    description: "烛光下工作加重眼部疲劳（牛顿曾用针刺眼眶研究光学）"
    condition: candle_study > 0
    priority: 8
    dynamics:
      eye_strain: "min(100, eye_strain + candle_study * 0.125)"

  # 12. 眼部疲劳惩罚（>60时激活）
  # eye_strain=80：(80-60) × 0.00011 × 1440 = 3.2 health/天
  eye_strain_penalty:
    description: "眼部疲劳超过60分时损害健康和洞见效率"
    condition: eye_strain >= 60
    priority: 7
    dynamics:
      health: "max(0, health - (eye_strain - 60) * 0.00011)"
      insight: "max(0, insight - (eye_strain - 60) * 0.000028)"

  # 13. 鼠疫背景性健康威胁（持续，优先级低）
  # plague_risk=15：15 × 0.0001 × 1440 = 2.16 health/天
  # 与历史记录吻合：伍尔斯索普比剑桥安全，但1665年大瘟疫背景下不为零
  plague_pressure:
    description: "1665年大瘟疫背景威胁；plague_risk随时间缓慢降低"
    condition: true
    priority: 4
    dynamics:
      health: "max(0, health - plague_risk * plague_susceptibility * 0.0001)"
      plague_risk: "max(5, plague_risk - 0.001)"

  # 14. 营养不良削弱健康（nutrition < 30 时激活）
  # nutrition=20：(30-20) × 0.000116 × 1440 = 1.67 health/天
  # 对应"忘记进食"的历史描述
  malnutrition_penalty:
    description: "长期营养不足（<30分）加速健康损耗（忘记进食的代价）"
    condition: nutrition < 30
    priority: 5
    dynamics:
      health: "max(0, health - (30 - nutrition) * 0.000116)"

  # 15. 脱水影响（hydration < 25 时激活）
  # 鼠疫时期生水不安全，脱水风险被忽视时代价较大
  dehydration_penalty:
    description: "脱水（<25分）影响认知效率和健康"
    condition: hydration < 25
    priority: 5
    dynamics:
      health: "max(0, health - 0.005)"
      fatigue: "min(100, fatigue + 0.003)"

  # 16. 过度疲劳崩溃（fatigue >= 85 时激活）
  # -0.006/min × 1440 = -8.64 health/天（危险！）
  exhaustion_collapse:
    description: "严重过劳（fatigue>85）导致健康快速崩溃（过劳的非线性代价）"
    condition: fatigue >= 85
    priority: 11
    dynamics:
      health: "max(0, health - 0.006)"

  # 17. 健康影响认知效率（循环反馈，health < 40 时激活）
  # health=30：(40-30) × 0.0003 × 1440 = 4.32 insight/天损失
  health_cognitive_link:
    description: "健康严重下降时无法有效思考（认知-健康循环反馈）"
    condition: health < 40
    priority: 3
    dynamics:
      insight: "max(0, insight - (40 - health) * 0.0003)"

# ── 优化配置（opt模式启用；sim模式忽略此块）──────────────────────────────────
optimizer:
  method: multi_objective
  algorithm: nsga2
  population_size: 60
  generations: 80

  objectives:
  - variable: insight
    direction: maximize
    weight: 1.0
  - variable: health
    direction: maximize
    weight: 0.6
  - variable: fatigue
    direction: minimize
    weight: 0.4

  constraints:
  - expression: "health >= 50"
    description: "健康不能低于50（历史约束：牛顿需维持基本劳动能力）"
  - expression: "nutrition >= 20"
    description: "营养不能严重不足"
  - expression: "calories_today >= 1200"
    description: "至少摄入1200kcal（1665年成年男性最低生存线）"

  # 决策变量：opt模式下覆盖schedules中对应时段的值
  # default值与schedules基线一致
  variables_to_optimize:
  - name: morning_study_intensity
    default: 2.0            # 09:00-12:00 集中推导强度
    bounds: [0.0, 3.0]
    maps_to: "study_intensity @ [32400, 43200]"

  - name: afternoon_experiment_intensity
    default: 3.0            # 16:00-19:00 棱镜实验强度
    bounds: [0.0, 3.0]
    maps_to: "study_intensity @ [57600, 68400]"

  - name: evening_candle_intensity
    default: 2.0            # 20:00-22:00 烛光写作强度
    bounds: [0.0, 4.0]
    maps_to: "candle_study @ 72000"

  - name: breakfast_bread_rate
    default: 2.0            # 120g / 60min = 2 g/min
    bounds: [0.0, 5.0]      # 0-300g/早餐
    maps_to: "bread_intake @ 25200"

  - name: lunch_pottage_rate
    default: 5.0            # 300g / 60min = 5 g/min
    bounds: [1.7, 8.3]      # 100g-500g/午餐
    maps_to: "pottage_intake @ 43200"

  - name: dinner_meat_rate
    default: 0.0            # 基线无肉（经济限制），opt可发现吃肉的收益
    bounds: [0.0, 2.0]      # 0-120g/晚餐
    maps_to: "meat_intake @ 68400"

  - name: outdoor_intensity
    default: 2.0            # 苹果园2小时等效强度（帕累托改进点）
    bounds: [0.0, 4.0]
    maps_to: "outdoor_time @ 50400"

  - name: sleep_start_hour
    default: 22.0           # 22:00就寝
    bounds: [20.0, 24.0]
    maps_to: "sleep_quality @ bedtime"

  budget:
    unit: "便士/天"
    daily_allowance: 8
    notes: "牛顿剑桥学者薪俸£13/年 = ~8.6便士/天（1665年鼠疫关闭期间三一学院照发）"
    costs:
      bread_per_100g: 1
      pottage_per_100g: 1
      ale_per_250ml: 1
      meat_per_100g: 3
      cheese_per_40g: 2
      apple_per_150g: 0   # 庄园自产

  analysis:
    pareto_description: >
      优化结果展示洞见积累与健康维持之间的权衡曲线。
      关键发现（已有历史印证）：
      1. 苹果园散步（outdoor_intensity=2）是帕累托改进点——
         疲劳恢复后insight效率提升，全天总洞见量优于持续高强度研究；
      2. 跳过早餐（breakfast_bread_rate=0）到午后nutrition<30时insight效率下降>30%；
      3. 晚餐加少量咸肉（dinner_meat_rate=2）在预算可行时提升次日早餐前健康储备；
      4. 最优睡眠时间约22:00-23:00，晚于此则次日初始fatigue偏高。
