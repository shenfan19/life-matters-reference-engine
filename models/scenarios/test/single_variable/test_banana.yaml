type: story
category: demo_story

metadata:
  name: simple_banana_story
  updated: 2026-04-23
  author: "Antigravity"
  description: "简化的香蕉摄入演示故事。主角摄入150g香蕉，验证其营养成分正确转移至胃部。"
  tags: [demo, simple, banana]

story:
  title: "简单吃个香蕉"
  premise: "验证基础加载和动态转换流程。"
  protagonist:
    name: "测试员"
    initial_status:
      gastric_carbohydrate: 0
      body_water: 42000

imports:
  - models/medical/dynamics/simple_nutrition
  - models/interventions/diet/banana

simulation:
  start_date: "2026-01-01"
  end_date: "2026-01-02"
  step: 1
  step_unit: minute
  output_variables:
    - gastric_carbohydrate
    - gastric_protein
    - gastric_fat
    - body_water
    - banana_intake
# 初始输入
variables:
  banana_intake:
    value: 150 # 摄入 150g 香蕉
