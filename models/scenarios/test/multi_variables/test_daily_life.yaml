metadata:
  name: daily_life
  updated: 2026-04-23
  author: TODO:AUTHOR
  description: "日常生活仿真：展示每日规律饮食与水分补充对能量和健康的影响。利用计划表实现批处理自动化。"
  tags: [lifestyle, daily, simulation]

variables:
  energy: { description: "能量水平", value: 50.0, unit: "分", type: state, bounds: [0, 100] }
  hydration: { description: "水分储备", value: 70.0, unit: "分", type: state, bounds: [0, 100] }
  meal_size: { description: "进食量", value: 0.0, unit: "kcal", type: input }
  water_sip: { description: "饮水量", value: 0.0, unit: "ml", type: input }
  activity_level: { description: "活动强度", value: 1.0, unit: "系数", type: parameter }

formulas:
  decay:
    description: "自然代谢与活动消耗"
    condition: true
    dynamics:
      energy: "energy - 0.2 * activity_level * step_size"
      hydration: "hydration - 0.3 * activity_level * step_size"
    priority: 5

  eating:
    description: "进食恢复能量"
    condition: meal_size > 0
    dynamics:
      energy: "energy + (meal_size / 100)"
    priority: 7

  drinking:
    description: "饮水恢复水分"
    condition: water_sip > 0
    dynamics:
      hydration: "hydration + (water_sip / 10)"
    priority: 7

schedules:
  meal_size:
    interpolation: step
    points:
      - { time: 25200, value: 300 }  # 07:00 Breakfast
      - { time: 28800, value: 0 }    # 08:00 Done
      - { time: 43200, value: 600 }  # 12:00 Lunch
      - { time: 46800, value: 0 }    # 13:00 Done
      - { time: 64800, value: 500 }  # 18:00 Dinner
      - { time: 68400, value: 0 }    # 19:00 Done
  water_sip:
    interpolation: linear
    points:
      - { time: 0, value: 0 }
      - { time: 36000, value: 100 }  # 10:00 Sip
      - { time: 39600, value: 0 }
      - { time: 54000, value: 150 }  # 15:00 Sip
      - { time: 57600, value: 0 }

simulation:
  start_date: "2026-01-01"
  end_date: "2026-01-02"
  step: 10
  step_unit: minute
  output_variables: [energy, hydration, meal_size]
