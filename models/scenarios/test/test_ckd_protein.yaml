metadata:
  name: test_ckd_protein
  updated: 2026-05-01
  author: LM Test
  description: >
    CKD 蛋白质-肌肉权衡 MC + Opt 测试场景（简化版）。
    三个耦合状态变量（GFR、肌肉质量、血尿素氮）+ 饮食蛋白质输入。
    MC 参数：alpha（蛋白质对 GFR 的损伤敏感性）和 mu_s（肌肉合成效率），
    个体差异±25%，多条曲线在第 10–20 周显著分叉。
    52 周仿真，日步长，展示 KDIGO 2020 指南已承认的临床空白：
    低蛋白保护肾功能但加速肌少症，低到一定程度后 GFR 仍无法阻止下降。
    Opt 目标：双目标 Pareto（最大化52周末肌肉质量 × 最大化GFR），
    决策变量为每日蛋白质分配方案（三餐分配比例及总量）。
  tags: [test, ckd, protein, muscle, GFR, mc, opt]
  references:
    - "KDIGO 2020 Clinical Practice Guideline §3.1.13 Grade 2C"
    - "Carrero JJ et al. (2013) Etiology of PEW in CKD. J Ren Nutr 23(2):77-90"
    - "Kalantar-Zadeh K et al. (2017) Dietary restrictions in dialysis patients. Semin Dial 30(2):159-168"
    - "Wang XH & Mitch WE (2014) Mechanisms of muscle wasting in CKD. Nat Rev Nephrol 10(9):504-516"
  step_size:
    value: 1
    unit: day

# ── 变量 ───────────────────────────────────────────────────────────────────────
variables:
  GFR:
    description: 肾小球滤过率，CKD 3期起始（KDIGO分期45–59 mL/min/1.73m²）
    value: 45.0
    unit: mL/min/1.73m²
    type: state
    bounds: [0, 120]

  muscle_mass:
    description: 骨骼肌质量（体重70kg成年男性正常值~30kg）
    value: 28.0
    unit: kg
    type: state
    bounds: [10, 50]

  BUN:
    description: 血尿素氮（正常上限 20 mg/dL；CKD患者目标 <20）
    value: 14.0
    unit: mg/dL
    type: state
    bounds: [0, 60]

  dietary_protein:
    description: 每日蛋白质摄入量（g/kg/day），KDIGO建议范围 0.6–1.0
    value: 0.8
    unit: g/kg/day
    type: input

  body_weight:
    description: 患者体重（固定，用于换算蛋白质绝对量）
    value: 70.0
    unit: kg
    type: parameter

  # ── MC 概率参数 ──────────────────────────────────────────────────────────────
  alpha:
    description: >
      蛋白质摄入超过安全阈值对 GFR 的损伤敏感性（Kalantar-Zadeh 2017）。
      MC 时各条曲线采样不同值，代表个体肾功能对蛋白质负荷的耐受差异。
    value: "normal(0.0012, 0.0003)"
    unit: 1/(day·g/kg/day)
    type: parameter
    bounds: [0.0003, 0.003]

  mu_s:
    description: >
      肌肉蛋白合成效率（每 g/kg/day 蛋白质每天生成 kg 肌肉）。
      MC 时代表个体合成代谢能力差异（Carrero 2013）。
    value: "normal(0.008, 0.002)"
    unit: kg/(day·g/kg/day)
    type: parameter
    bounds: [0.002, 0.018]

  beta0:
    description: 非蛋白质因素导致的 GFR 基础下降速率（CKD 3期平均值）
    value: 0.003
    unit: 1/day
    type: parameter
    bounds: [0.001, 0.008]

  mu_d:
    description: 肌肉基础降解速率（CKD 患者高于正常人，Carrero 2013）
    value: 0.002
    unit: 1/day
    type: parameter
    bounds: [0.001, 0.005]

  mu_u:
    description: >
      尿毒症驱动的肌肉分解增强系数（GFR 每下降1单位额外增加的分解率）。
      敏感性分析中最重要的参数（Wang & Mitch 2014）。
    value: "normal(0.0015, 0.0005)"
    unit: 1/(day·mL/min/1.73m²)
    type: parameter
    bounds: [0.0002, 0.004]

  sigma_urea:
    description: 蛋白质分解产生尿素的速率系数
    value: 0.028
    unit: mg/dL·day⁻¹·(g/day)⁻¹
    type: parameter

  GFR_initial:
    description: 初始 GFR（用于计算肾功能相对损失，固定为起始值）
    value: 45.0
    unit: mL/min/1.73m²
    type: parameter

# ── 动力学公式 ─────────────────────────────────────────────────────────────────
# step_size = 1 day，所有系数均为 per-day 速率
# 蛋白质安全阈值：KDIGO 下限 0.6 g/kg/day
formulas:
  gfr_decline:
    description: >
      GFR 下降：蛋白质超过安全阈值的损伤 + 非蛋白质基础下降。
      蛋白质低于 0.6 g/kg/day 时超载项为零（不继续保护，仅不再损伤）。
    condition: true
    priority: 6
    dynamics:
      GFR: GFR - (alpha * max(0, dietary_protein - 0.6) * GFR + beta0 * GFR) * step

  muscle_dynamics:
    description: >
      肌肉质量：合成（蛋白质 × 肾功能相对保留度）− 基础降解 − 尿毒症驱动分解。
      肾功能相对保留度 = min(1, GFR/GFR_initial)，反映 CKD 合成代谢抵抗。
    condition: true
    priority: 5
    dynamics:
      muscle_mass: >
        muscle_mass + (mu_s * dietary_protein * min(1.0, GFR / GFR_initial)
        - mu_d * muscle_mass
        - mu_u * max(0, GFR_initial - GFR) * muscle_mass) * step

  bun_dynamics:
    description: >
      血尿素氮：蛋白质分解产生 − GFR 清除。
      BUN 是约束变量：>20 mg/dL 代表蛋白质过量。
    condition: true
    priority: 4
    dynamics:
      BUN: BUN + (sigma_urea * dietary_protein * body_weight - 0.0015 * GFR * BUN) * step

# ── 优化设置 ──────────────────────────────────────────────────────────────────
# Opt：双目标 Pareto
# 模拟 KDIGO 2020 §3.1.13 指南空白：低蛋白 vs 保肌肉的权衡
optimizer:
  enabled: true
  method: "nsga2"

  objectives:
    - variable: muscle_mass
      metric: final               # 52 周末肌肉质量
      direction: maximize
      description: "最大化52周末骨骼肌质量（防肌少症）"
    - variable: GFR
      metric: final               # 52 周末 GFR
      direction: maximize
      description: "最大化52周末 GFR（减缓肾功能衰退）"

  constraints:
    - variable: BUN
      condition: "<= 20"
      type: hard
      description: "血尿素氮约束：BUN ≤ 20 mg/dL（蛋白质不过量）"
    - variable: GFR
      condition: ">= 30"
      type: hard
      description: "GFR 下限：不得进入 CKD 4 期（<30 mL/min/1.73m²）"
    - variable: dietary_protein
      condition: ">= 0.6"
      type: hard
      description: "KDIGO 建议最低蛋白摄入量 0.6 g/kg/day"

  regimen:
    variable: dietary_protein
    description: "优化每日蛋白质摄入量（g/kg/day），KDIGO 推荐范围内搜索"
    events:
      - time: "08:00"
        dose_bounds: [0.2, 0.4]
        label: "早餐蛋白质（g/kg/day 等效）"
      - time: "12:00"
        dose_bounds: [0.2, 0.4]
        label: "午餐蛋白质"
      - time: "18:00"
        dose_bounds: [0.2, 0.4]
        label: "晚餐蛋白质"

  mc:
    enabled: true
    sim_runs: 12
    description: >
      MC 采样 alpha（GFR 对蛋白质损伤敏感性）、mu_s（肌肉合成效率）、mu_u（尿毒症分解系数）。
      三参数同时变化，展示最优蛋白质方案在不同个体中的差异（敏感型 vs 耐受型肾功能）。

  algorithm:
    population_size: 80
    n_generations: 150
    seed: 42

# ── 仿真设置 ──────────────────────────────────────────────────────────────────
# 52 周 = 364 天，日步长，展示慢性进展与权衡
simulation:
  start_date: "2026-01-01"
  end_date:   "2026-12-31"        # 364 天
  output_variables:
    - GFR
    - muscle_mass
    - BUN
    - dietary_protein
  schedules:
    # 每日三餐，52 周全程。三餐脉冲相加 = 0.80 g/kg/day（日步长引擎累加）
    - variable: dietary_protein
      time: "08:00"
      value: 0.27
      days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
      date_range: "2026-01-01 ~ 2026-10-31"
      label: "早餐蛋白质"
    - variable: dietary_protein
      time: "12:00"
      value: 0.27
      days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
      date_range: "2026-01-01 ~ 2026-10-31"
      label: "午餐蛋白质"
    - variable: dietary_protein
      time: "18:00"
      value: 0.26
      days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
      date_range: "2026-01-01 ~ 2026-10-31"
      label: "晚餐蛋白质"
