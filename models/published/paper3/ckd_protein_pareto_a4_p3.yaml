metadata:
  name: a4_ckd_protein_pareto
  paper: Paper 3 (JBI)
  case_id: A4-P3
  updated: 2026-05-04
  author: Fan Shen
  description:
    brief: CKD 蛋白质-肌肉权衡深化版（A4-P3），用于比较 K×4、step-by-step 与静态指南方案的优化表现。
    need: 为 Paper 3 展示 LM 优化框架如何在同一 CKD 营养模型上比较不同搜索策略和决策表示。
    problem: 蛋白质摄入决策既影响 GFR、肌肉质量和 BUN，也受算法时间预算和 Pareto 前沿覆盖度影响；静态指南点可能遗漏重要折中。
    method: 继承 Paper 2 A4 的 CKD 蛋白质-肌肉动力学，扩展 NSGA-II 种群和代数，并预留 CKD 4 期分层对照。
    simulation: 默认沿用 52 周时间窗，输出 GFR、muscle_mass、BUN、dietary_protein；当前 schedules 仍待从 Paper 2 版本复制或由 imports 继承。
    optimization: NSGA-II 双目标最大化 muscle_mass 和 GFR，约束 BUN <= 20、GFR >= 30，种群 150、代数 300，用于生成更完整 Pareto 前沿。
    result: 预期 K×4 Pareto 前沿在覆盖度和 hypervolume 上优于 step-by-step，并能标出指南静态方案相对位置。
    conclusion: 期望结论是结构化 Regimen 搜索比静态指南点和逐步搜索更能揭示 CKD 蛋白质摄入的可行前沿。
    limitations: 当前文件仍是 Paper 3 对照实验配置草案，变量、公式继承和 step-by-step 对照尚需补全。
  tags: [paper3, ckd, protein, muscle, A4, pareto, comparison, K4]
  references:
    - "参见 paper2/a4_ckd_protein.yaml 完整引用"
    - "Deb K et al. (2002) NSGA-II. IEEE Trans Evol Comput 6(2):182-197"
  step_size:
    value: 1
    unit: day

imports:
  - published/paper2/ckd_protein_a4_p2

# ── 继承 paper2/a4_ckd_protein.yaml，仅修改优化配置 ──────────────────────────
