variables: {}   # TODO 从 paper2/a4_ckd_protein.yaml 继承
formulas: {}    # TODO 从 paper2/a4_ckd_protein.yaml 继承

optimizer:
  enabled: true
  method: "nsga2"
  objectives:
    - variable: muscle_mass
      metric: final
      direction: maximize
    - variable: GFR
      metric: final
      direction: maximize
  constraints:
    - variable: BUN
      condition: "<= 20"
      type: hard
    - variable: GFR
      condition: ">= 30"
      type: hard
  regimen:
    variable: dietary_protein
    events:
      - time: "08:00"
        dose_bounds: [0.2, 0.4]
      - time: "12:00"
        dose_bounds: [0.2, 0.4]
      - time: "18:00"
        dose_bounds: [0.2, 0.4]
  mc:
    enabled: true
    sim_runs: 30
  algorithm:
    population_size: 150       # 更大种群，获得更完整 Pareto 前沿
    n_generations: 300
    seed: 42
  results:
