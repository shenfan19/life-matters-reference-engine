metadata:
  name: b3_banister
  paper: Paper 1 (JOSS)
  case_id: B3
  updated: 2026-05-04
  author: Fan Shen
  description:
    brief: Banister 双室适应-疲劳模型（B3），用于 Paper 1 的数值验证和经典训练模型复现。
    need: 验证 LM 的日步长 Euler 积分能否稳定表达 fitness-fatigue 这类已知动力学模型。
    problem: 训练负荷同时带来适应和疲劳，两者时间常数不同；减量期的表现峰值依赖二者相对衰减速度。
    method: 三个状态变量 fitness、fatigue、performance 加一个训练负荷输入 training_load；fitness 慢衰减，fatigue 快衰减，performance = p0 + fitness - fatigue。
    simulation: 默认配置 V2 协议：10 周渐进训练、2 周减量、4 周维持，输出 fitness、fatigue、performance、training_load。
    optimization: 优化三阶段训练负荷分配——渐进期、减量期、维持期各阶段最优强度，在最大化末期表现的同时控制疲劳积累。
    result: 预期第 16 周末 performance 落在 520–560 AU 附近，并在减量开始后 5–10 天出现超量恢复峰值。
    conclusion: 期望结论是 LM 可复现 Banister/Morton 训练适应-疲劳曲线，可作为积分器和 schedule 机制的基准案例。
    limitations: 参数采用文献标准值和演示协议，未针对具体运动员个体校准。
  tags: [paper1, banister, B3, validation, fitness, fatigue]
  references:
    - "Morton RH, Fitz-Clarke JR, Banister EW (1990) Modeling human performance in running. J Appl Physiol 69(3):1171-1177"
    - "Banister EW, Calvert TW, Savage MV, Bach TM (1975) A systems model of training for athletic performance. Aust J Sports Med 7(3):57-61"
    - "Mujika I et al. (1996) Effects of training on performance in competitive swimming. Can J Appl Physiol 21(5):395-406"
  step_size:
    value: 1
    unit: day

# ── 变量 ───────────────────────────────────────────────────────────────────────
variables:
  fitness:
    description: 体能分量（运动适应积累，时间常数45天，Morton 1990）
    value: 0.0
    unit: AU
    type: state
    bounds: [0, 2000]

  fatigue:
    description: 疲劳分量（训练负荷累积，时间常数15天，Morton 1990）
    value: 0.0
    unit: AU
    type: state
    bounds: [0, 3000]

  performance:
    description: 综合表现 = 基础 + fitness - fatigue（Morton 1990 eq.3）
    value: 494.0
    unit: AU
    type: state
    bounds: [0, 1000]

  training_load:
    description: 当日训练负荷（任意单位，由 schedule 驱动）
    value: 0.0
    unit: AU
    type: input

  g:
    description: 体能增益系数（Morton 1990 Table 1，标准值 1.0）
    value: 1.0
    unit: dimensionless
    type: parameter
    bounds: [0.4, 2.0]

  h:
    description: 疲劳增益系数（Morton 1990 Table 1，标准值 2.0）
    value: 2.0
    unit: dimensionless
    type: parameter
    bounds: [0.8, 4.0]

  k1:
    description: 体能衰减速率 = 1/45 per day（Morton 1990）
    value: 0.02222
    unit: 1/day
    type: parameter
    bounds: [0.01, 0.05]

  k2:
    description: 疲劳衰减速率 = 1/15 per day（Morton 1990）
    value: 0.06667
    unit: 1/day
    type: parameter
    bounds: [0.03, 0.15]

  p0:
    description: 基础表现（无训练基准，Mujika 1996）
    value: 494.0
    unit: AU
    type: parameter

# ── 动力学公式 ─────────────────────────────────────────────────────────────────
formulas:
  fitness_dynamics:
    description: "体能 Euler 更新：dA/dt = g·w - k1·A"
    condition: true
    priority: 5
    dynamics:
      fitness: fitness + (g * training_load - k1 * fitness) * step

  fatigue_dynamics:
    description: "疲劳 Euler 更新：df/dt = h·w - k2·f"
    condition: true
    priority: 5
    dynamics:
      fatigue: fatigue + (h * training_load - k2 * fatigue) * step

  performance_update:
    description: "瞬时表现 = p0 + fitness - fatigue（Morton 1990 eq.3，静态计算无step）"
    condition: true
    priority: 3
    dynamics:
      performance: p0 + fitness - fatigue

# ── 仿真设置（V2 协议：Morton 1990 Figure 3 复现）──────────────────────────────
# 16 周 = 112 天：10周渐进(75 AU) + 2周减量(30 AU) + 4周维持(60 AU)
simulation:
  start_date: "2026-01-01"
  end_date:   "2026-04-22"
  output_variables:
    - fitness
    - fatigue
    - performance
    - training_load
  schedules:
    # 第 1–10 周（1月1日–3月11日）：渐进训练，平均 75 AU/day
    - variable: training_load
      time: "09:00"
      value: 75.0
      days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
      date_range: "2026-01-01 ~ 2026-03-11"
      label: "渐进训练期"

    # 第 11–12 周（3月12日–3月25日）：减量期 30 AU/day（Morton taper）
    - variable: training_load
      time: "09:00"
      value: 30.0
      days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
      date_range: "2026-03-12 ~ 2026-03-25"
      label: "减量期（taper）"

    # 第 13–16 周（3月26日–4月22日）：维持期 60 AU/day
    - variable: training_load
      time: "09:00"
      value: 60.0
      days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
      date_range: "2026-03-26 ~ 2026-04-22"
      label: "维持期"

# ── 验证目标 ──────────────────────────────────────────────────────────────────
# V2 通过标准：第 16 周末（4月22日）performance 在 520–560 AU 范围内
# V3 通过标准：减量开始后（3月12日起）5–10天内出现 performance 峰值

optimizer:
  enabled: true
  method: nsga2
  objectives:
    - variable: performance
      direction: maximize
      metric: final
      description: 最大化第16周末综合表现（AU）
    - variable: fatigue
      direction: minimize
      metric: final
      description: 最小化训练结束时疲劳积累（AU）
  constraints:
    - variable: fatigue
      condition: "<= 800"
      type: hard
      description: 疲劳上限 800 AU，防止过度训练
    - variable: performance
      condition: ">= 480"
      type: soft
      description: 表现不低于基础值 480 AU
  regimen:
    variable: training_load
    description: 优化三阶段训练负荷（渐进期07:00 / 减量期09:00 / 维持期11:00）
    events:
      - time: "07:00"
        dose_bounds: [40.0, 120.0]
        label: 渐进训练期负荷（第1-10周）
      - time: "09:00"
        dose_bounds: [10.0, 50.0]
        label: 减量期负荷（第11-12周）
      - time: "11:00"
        dose_bounds: [40.0, 100.0]
        label: 维持期负荷（第13-16周）
  algorithm:
    population_size: 50
    n_generations: 80
    seed: 42
