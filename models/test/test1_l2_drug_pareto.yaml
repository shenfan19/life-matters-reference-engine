
metadata:
  name: l2_drug_pareto
  title: "[TEST L2] 三剂时段 · 双目标 Pareto"
  description:
    brief: |
      - 【调试用 TEST L2】3 决策变量 · 双目标 Pareto · 预估完成 1–3分钟
      - ── 用途 ──────────────────────────────────────────────
      - 验证多变量优化 + Pareto 前沿可视化。
      - Pareto 前沿应呈现疗效与毒性的单调权衡曲线。
      - ── 场景 ──────────────────────────────────────────────
      - 每日三次给药（早/中/晚），优化各时段剂量分配。
        · 目标1：最大化 plasma_level 均值（疗效）
        · 目标2：最小化 liver_load 终值（毒性）
      三个时段吸收率不同：早晨最高（空腹），中午次之，晚上最低。
      ── 参数规模 ──────────────────────────────────────────
      pop=20, gen=20 → 400次评估 × 30步 ≈ 1–3分钟
      决策变量: 3（morning_dose, noon_dose, evening_dose: 0–30 mg each）
      MC: 未启用
    need: 作为开发期测试模型，用于验证仿真、调度、MC 或优化链路是否稳定。
    method: 包含 6 个变量和 2 个方程，围绕 plasma_level、liver_load、clearance_rate、morning_dose 构造最小可运行动力学。
    simulation: 默认仿真从 2025-01-01 到 2025-01-31，用于观察核心状态随时间变化。
    optimization: 包含优化配置，目标 2 个，决策输入 3 个，用于搜索可行的干预或参数组合。
    result: 预期用于发现回归错误，并确认 GUI 与后端输出保持一致。
  tags: [test, L2, multi-objective, pareto, 3-variable, pharmacokinetics]
  references:
    - "TEST L2: Three-dose schedule optimization for Pareto front test"
  step_size:
    value: 1
    unit: day

variables:
  plasma_level:
    description: 血浆药物浓度（mg/L），三次给药叠加
    value: 0.0
    unit: mg/L
    type: state
    bounds: [0.0, 150.0]

  liver_load:
    description: 肝脏累积代谢负荷（30天）
    value: 0.0
    unit: mg/L·day
    type: state
    bounds: [0.0, 2000.0]

  clearance_rate:
    description: 药物日清除率（固定），0.28 /day，半衰期 ≈ 2.5天
    value: 0.28
    unit: per_day
    type: parameter
    bounds: [0.1, 0.5]

  morning_dose:
    description: 早晨给药剂量（mg），吸收率 70%（空腹最佳）
    value: 10.0
    unit: mg
    type: input
    bounds: [0.0, 30.0]

  noon_dose:
    description: 中午给药剂量（mg），吸收率 55%（餐后）
    value: 5.0
    unit: mg
    type: input
    bounds: [0.0, 30.0]

  evening_dose:
    description: 晚上给药剂量（mg），吸收率 45%（代谢降低）
    value: 5.0
    unit: mg
    type: input
    bounds: [0.0, 30.0]

formulas:
  drug_kinetics:
    description: |
      三次给药日步长动力学。
      daily_absorbed = morning*0.70 + noon*0.55 + evening*0.45
      每日清除 plasma_level * clearance_rate。
    condition: true
    dynamics:
      plasma_level: "plasma_level + (morning_dose * 0.70 + noon_dose * 0.55 + evening_dose * 0.45 - plasma_level * clearance_rate) * step"
    priority: 10

  liver_accumulation:
    description: 肝脏日负荷（plasma_level 的 18%）
    condition: true
    dynamics:
      liver_load: "liver_load + plasma_level * 0.18 * step"
    priority: 5

simulation:
  start_date: "2025-01-01"
  end_date: "2025-01-31"
  schedules:
    - variable: morning_dose
      time: "08:00"
      value: 10.0
      label: "Morning dose"
    - variable: noon_dose
      time: "12:00"
      value: 5.0
      label: "Noon dose"
    - variable: evening_dose
      time: "20:00"
      value: 5.0
      label: "Evening dose"
  output_variables: [plasma_level, liver_load, morning_dose, noon_dose, evening_dose]

optimizer:
  method: nsga2

  objectives:
    - variable: plasma_level
      metric: mean
      direction: maximize

    - variable: liver_load
      metric: final
      direction: minimize

  constraints:
    - variable: liver_load
      condition: "<= 600"

  schedules:
    - variable: morning_dose
      time: "08:00"
      value: 10.0
      label: "Morning dose (mg)"
      optimize:
        value: [0.0, 30.0]

    - variable: noon_dose
      time: "12:00"
      value: 5.0
      label: "Noon dose (mg)"
      optimize:
        value: [0.0, 30.0]

    - variable: evening_dose
      time: "20:00"
      value: 5.0
      label: "Evening dose (mg)"
      optimize:
        value: [0.0, 30.0]

  algorithm:
    population_size: 20
    n_generations: 20
    seed: 42

