metadata:
  name: test_step_second
  description:
    brief: "[TEST] step_size=second; SECOND/MINUTE/HOUR constants; two timed bolus events."
    method: |
      One-compartment exponential decay, 1-second steps, 1-day simulation (86 400 steps).
      ke = ln(2) / (half_life_min * MINUTE) converts half-life in minutes to a per-second rate.
      Two bolus doses at 08:00 and 09:00. Exercises sub-hour schedule precision
      and the MINUTE / HOUR pre-defined time constants.
    limitations: Not physiologically calibrated; parameter values are chosen for numeric clarity.
  tags: [test, step_size, second, pharmacokinetics, time_constants]
  references: ["TEST: second-level step size and MINUTE/HOUR constant usage"]
  step_size:
    value: 1
    unit: second

variables:
  concentration:
    type: state
    value: 0.0
    unit: mg/L
    description: Plasma drug concentration; rises on bolus, decays exponentially.

  bolus_dose:
    type: input
    value: 0.0
    unit: mg
    description: Instantaneous bolus dose (pulse; no step multiplication in formula).

  volume_of_distribution:
    type: parameter
    value: 10.0
    unit: L
    description: Apparent volume of distribution; converts dose (mg) to concentration (mg/L).

  half_life_min:
    type: parameter
    value: 15.0
    unit: minute
    description: |
      Drug half-life in minutes (15 min = 900 s).
      Used as: ke = ln(2) / (half_life_min * MINUTE) where MINUTE = 60 s.

formulas:
  bolus_absorption:
    description: Pulse absorption — concentration rises by dose / Vd (no step multiplication).
    dynamics:
      concentration: "concentration + bolus_dose / volume_of_distribution"
    priority: 10

  elimination:
    description: |
      First-order elimination in seconds.
      ke = ln(2) / (half_life_min * MINUTE); MINUTE = 60 (seconds per minute).
      Multiplied by step (seconds) — standard for rate-based state update.
    dynamics:
      concentration: "max(0.0, concentration - concentration * (0.6931 / (half_life_min * MINUTE)) * step)"
    priority: 5

simulation:
  start_date: "2026-01-01"
  end_date:   "2026-01-01"
  schedules:
    - variable: bolus_dose
      time: "08:00"
      value: 100.0
      label: "Morning bolus 100 mg"
    - variable: bolus_dose
      time: "09:00"
      value: 50.0
      label: "Top-up bolus 50 mg"
  output_variables: [concentration, bolus_dose]
