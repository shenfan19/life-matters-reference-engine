metadata:
  name: test_glucose_meal
  updated: 2026-04-30
  author: LM Test
  description:
    brief: |
      血糖 MC + Opt 测试场景。三日三餐脉冲式摄入→胃缓冲→血糖波动。
      两个正态分布参数（insulin_sensitivity + absorption_efficiency）在 MC 多条曲线间产生可见分叉。
      Opt 目标：调整每餐碳水量，在满足每日总量≥150g 的前提下最小化餐后血糖峰值。
    need: 作为开发期测试模型，用于验证仿真、调度、MC 或优化链路是否稳定。
    method: 包含 5 个变量和 3 个方程，围绕 blood_glucose、stomach_carbs、carb_intake、insulin_sensitivity 构造最小可运行动力学。
    simulation: 默认仿真从 2026-01-01 到 2026-01-04，用于观察核心状态随时间变化。
    optimization: 包含优化配置，包含优化目标，用于搜索可行的干预或参数组合。
    result: 预期用于发现回归错误，并确认 GUI 与后端输出保持一致。
  tags: [test, glucose, mc, schedule, pulse, opt]
  step_size:
    value: 1
    unit: minute

# ── 变量 ───────────────────────────────────────────────────────────────────────
variables:
  blood_glucose:
    description: 血糖浓度
    value: 90.0
    unit: mg/dL
    type: state
    bounds: [40, 400]

  stomach_carbs:
    description: 胃内碳水缓冲（吸收前）
    value: 0.0
    unit: g
    type: state
    bounds: [0, 500]

  carb_intake:
    description: 一次进食摄入碳水总量（脉冲式，simulation.schedules pulse 模式驱动）
    value: 0.0
    unit: g
    type: input

  insulin_sensitivity:
    description: 胰岛素敏感性，MC 时各条曲线不同，影响餐后清除速率
    value: "normal(1.0, 0.25)"
    unit: 无量纲
    type: parameter
    bounds: [0.2, 2.5]

  absorption_efficiency:
    description: 胃肠吸收效率，MC 时各条曲线不同，影响餐后血糖峰值高度
    value: "normal(1.0, 0.2)"
    unit: 无量纲
    type: parameter
    bounds: [0.3, 2.0]

# ── 动力学公式 ─────────────────────────────────────────────────────────────────
# step_size 单位 = 10 分钟（本模型 step_unit: minute）
# carb_intake 是脉冲总量（g），不需乘以 step_size
# 吸收速率 2.0 g/min × step_size(min) = 20 g/step
formulas:
  meal_absorption:
    description: |
      carb_intake（脉冲总量）一次性加入胃缓冲；
      胃内碳水以 2 g/min 速率吸收，吸收量受 absorption_efficiency 调节（MC 可见）。
    condition: true
    priority: 5
    dynamics:
      stomach_carbs: max(0, stomach_carbs + carb_intake - 2.0 * step)
      blood_glucose: blood_glucose + min(stomach_carbs, 2.0 * step) * absorption_efficiency * 1.8

  glucose_clearance:
    description: 胰岛素驱动血糖向基线（90）回落，速率受 insulin_sensitivity 调节（MC 可见）
    condition: blood_glucose > 90
    priority: 4
    dynamics:
      blood_glucose: blood_glucose - (blood_glucose - 90) * insulin_sensitivity * 0.02 * step

  hepatic_output:
    description: 低血糖时肝糖原补充防护
    condition: blood_glucose < 85
    priority: 3
    dynamics:
      blood_glucose: blood_glucose + (85 - blood_glucose) * 0.05 * step

# ── 优化设置 ──────────────────────────────────────────────────────────────────
# Opt 目标：最小化三日平均餐后血糖峰值，决策变量为每餐碳水量
optimizer:
  enabled: true
  method: "l-bfgs-b"             # 单目标：l-bfgs-b | nelder-mead | nsga2

  objective:
    variable: blood_glucose
    metric: max                   # max | mean | final | time_above
    direction: minimize
    description: "最小化三日仿真期间的血糖峰值"

  constraints:
    - variable: blood_glucose
      condition: "<= 160"
      type: hard
      description: "餐后血糖上限 160 mg/dL（正常餐后范围）"

  regimen:
    variable: carb_intake
    description: "优化每餐碳水摄入量（g），时间固定，剂量可调"
    events:
      - time: "07:00"
        dose_bounds: [20, 80]
        label: "早餐碳水"
      - time: "12:00"
        dose_bounds: [30, 100]
        label: "午餐碳水"
      - time: "18:30"
        dose_bounds: [20, 80]
        label: "晚餐碳水"
    daily_total_min: 150          # g/day，每日最低碳水摄入约束

  mc:
    enabled: true
    sim_runs: 10
    description: "MC 采样 insulin_sensitivity 与 absorption_efficiency 的个体差异"

  algorithm:
    population_size: 40
    n_generations: 60
    seed: 42

# ── 仿真设置 ──────────────────────────────────────────────────────────────────
simulation:
  start_date: "2026-01-01"
  end_date: "2026-01-04"      # 3 天
  output_variables:
  - blood_glucose
  - stomach_carbs
  - carb_intake
  schedules:
    - variable: carb_intake
      time: "07:00"
      value: 50.0
      days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
      date_range: ["2026-01-01", "2026-01-03"]
      label: "早餐碳水"
    - variable: carb_intake
      time: "12:00"
      value: 80.0
      days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
      date_range: ["2026-01-01", "2026-01-03"]
      label: "午餐碳水"
    - variable: carb_intake
      time: "18:30"
      value: 60.0
      days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
      date_range: ["2026-01-01", "2026-01-03"]
      label: "晚餐碳水"
