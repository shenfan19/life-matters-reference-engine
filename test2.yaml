metadata:
  name: nutrition_intake
  version: 1.0.0
  author: LoaderEngine
  description: 合并模型来自 文件 test\test, patch\test_patch
  conflicts: []
  tags: []
imports: []
variables:
  exercise_intensity:
    description: 运动强度，0-无运动，1-轻度，2-中度，3-高强度
    value: 0.0
    type: input
    unit: 强度级别
    bounds:
    - 0.0
    - 3.0
  food_carbohydrate:
    description: 食物碳水化合物含量，包括糖类和淀粉
    value: 0
    type: input
    unit: 克
    bounds:
    - 0
    - 200
  food_fat:
    description: 食物脂肪含量
    value: 0
    type: input
    unit: 克
    bounds:
    - 0
    - 50
  food_protein:
    description: 蛋白质摄入量，通过饮食摄入
    value: 0
    type: input
    unit: 克
    bounds:
    - 0
    - 100
  physical_activity:
    description: 体力活动水平
    value: 0
    type: input
    unit: METs
    bounds:
    - 0
    - 300
  water_intake:
    description: 水分摄入量
    value: 0
    type: input
    unit: 毫升
    bounds:
    - 0
    - 1000
  stomach_carbohydrate:
    description: Placeholder for stomach_carbohydrate
    value: 0.0
    type: state
    unit: unknown
    bounds:
    - 0
    - 100
  stomach_fat:
    description: Placeholder for stomach_fat
    value: 0.0
    type: state
    unit: unknown
    bounds:
    - 0
    - 100
  stomach_protein:
    description: Placeholder for stomach_protein
    value: 0.0
    type: state
    unit: unknown
    bounds:
    - 0
    - 100
  body_water:
    description: Placeholder for body_water
    value: 0.0
    type: state
    unit: unknown
    bounds:
    - 0
    - 100
formulas:
  carbohydrate_ingestion:
    description: 碳水化合物摄入到胃
    condition: food_carbohydrate > 0
    priority: 1
    dynamics:
      food_carbohydrate: '0'
      stomach_carbohydrate: stomach_carbohydrate + food_carbohydrate
    formula: null
  fat_ingestion:
    description: 脂肪摄入到胃
    condition: food_fat > 0
    priority: 1
    dynamics:
      food_fat: '0'
      stomach_fat: stomach_fat + food_fat
    formula: null
  protein_ingestion:
    description: 蛋白质摄入到胃
    condition: food_protein > 0
    priority: 1
    dynamics:
      food_protein: '0'
      stomach_protein: stomach_protein + food_protein
    formula: null
  water_ingestion:
    description: 水分摄入
    condition: water_intake > 0
    priority: 1
    dynamics:
      body_water: body_water + water_intake
      water_intake: '0'
    formula: null
simulator: {}
optimizer: {}
